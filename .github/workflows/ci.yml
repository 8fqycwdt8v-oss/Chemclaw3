# CI gate: every check CLAUDE.md's "green before done" rule names. A red run blocks merge.
#
# Lives at the repository root because that is the only place GitHub Actions reads workflows from.
# The Python service had moved under `services/chemclaw/` in the Replit restructure, which stranded
# its workflow at `services/chemclaw/.github/workflows/ci.yml` where nothing executed it. For a
# while this file then ran a *subset* of that stranded workflow, and three live documents went on
# claiming the missing gates were enforced — `pyproject.toml` ("CI runs `make cov` as a gate") and
# two `[x]` entries in `docs/planning/BACKLOG.md`. D-117 moved every gate here and deleted the stranded copies, so
# what runs and what is claimed to run are the same thing again.
#
# D-146 then removed the `services/chemclaw/` wrapper itself — it was the last remnant of a Replit
# monorepo whose other half was already deleted, and one service does not need a `services/` tier.
# The service is the repository root now, so this workflow needs no `working-directory` at all.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # `deps-audit` scans the *lockfile* for known CVEs, so its coverage was a function of how often
  # somebody happened to push: an advisory published against an unchanged dependency stayed
  # invisible until the next commit. A blocking gate whose reach depends on commit frequency is
  # not a gate on the dependency closure, it is a gate on activity. Weekly, so a quiet week still
  # gets one audit of what is actually deployed.
  schedule:
    - cron: "0 6 * * 1"
  # Re-running the gate against a ref otherwise costs an empty commit, which this repository's own
  # rules forbid pushing.
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the *branch*, not on `github.ref`, and that is a cost fix rather than a style one. Both
# triggers above fire for a branch with an open pull request, and their refs differ
# (`refs/heads/x` versus `refs/pull/N/merge`), so every PR ran this whole gate twice — a full gate
# and a Postgres service container, duplicated, on every push to every PR branch. `head_ref` is the
# branch name on a `pull_request` event and empty otherwise, so this collapses both events onto one
# key and `cancel-in-progress` drops the loser. The branch-push trigger stays, because a push before
# the PR exists is exactly the case `deps-audit` was moved here to cover.
#
# **`main` is exempt from the cancellation, and that is a correctness fix rather than a cost one.**
# The group key for a push to the default branch is just `main`, so two merges landing inside one
# run's duration cancelled the earlier one — and nothing ever re-ran it. Measured over the 30 runs
# to 2026-08-26: three commits that are ancestors of `origin/main` today have **no completed run of
# this workflow at all** — `548266233b` (cancelled 9.4 min in), `9dfb02a5f6` and `3937fe568d`. The
# gate's whole claim is that what is on `main` passed it, and for those three it never ran. On a
# branch a cancelled run is a superseded answer; on `main` it is a missing one, so the merge queue
# of one pays for its own gate.
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  # Lint and type, alone, ahead of everything that needs a database. Split out of `check` because
  # they were 69s of a 12m06s step (measured: `make lint` 1s, `make type` 68s) and they were
  # reported *last* — a misformatted file or a bad annotation, the two cheapest and most common
  # failures there are, cost a full 14-minute job to hear about, behind a Postgres service
  # container and a migration neither of them touches. Here the same failure lands in about ninety
  # seconds.
  #
  # It does not gate `check`: they run in parallel, because making the slow job wait on the fast
  # one would add the fast one's duration to every green run to save nothing.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint + type
        run: make lint type

  check:
    runs-on: ubuntu-latest
    # A hung test must fail this job, not occupy a runner until GitHub's 6-hour ceiling (D-093:
    # tests/test_orchestrator.py's fan-out test used to do exactly that). `pytest-timeout`'s
    # per-test cap is the inner bound that names the offending test; this is the outer backstop.
    #
    # **45, and the number that justified 30 had gone stale by 3.6x.** This line used to carry
    # "the whole gate runs in 4m38s, so 30 is already 6x headroom". Re-measured 2026-08-26 over
    # the 14 successful runs in the last 30: **median 16.8 min, max 22.0 min** — 1.36x headroom on
    # the worst observed run, not 6x. That is close enough that ordinary variance starts cancelling
    # green runs, and a spurious cancel here costs a full re-run *and* reports no test name, which
    # is the exact failure this comment used to describe as fixed. The suite grew; the bound did
    # not follow it. 45 restores roughly 2x on the worst run actually seen.
    #
    # Raising it does lengthen a genuine hang's burn, and that cost is real but bounded — the inner
    # `pytest-timeout` cap (180s, `pyproject.toml`) is what actually catches a hung *test* and names
    # it. This bound only catches a hang that escapes the inner one, which since the `thread` method
    # landed in `tests/conftest.py` has not happened.
    timeout-minutes: 45
    # Real Postgres so the calculation-store and session-store integration tests run (not skip).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chemclaw
          POSTGRES_PASSWORD: chemclaw
          POSTGRES_DB: chemclaw
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U chemclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHEMCLAW_POSTGRES_DSN: postgresql://chemclaw:chemclaw@localhost:5432/chemclaw
    steps:
      # **Full history, because one test needs commits rather than files.**
      # `test_no_merged_migration_had_its_statements_changed` asks git which commit introduced each
      # migration and reads the file *as it was then*. On the action's depth-1 default that commit
      # is the graft, which is `HEAD`, so `git show <introduced>:file` returns the working tree's
      # own content and every migration compares equal to itself — the check reported no edit
      # across all 42 while a smuggled `ALTER TABLE` appended to a merged file would have passed.
      # It now skips honestly instead of passing, and this is what makes it actually run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      # `--locked`, so a `pyproject.toml` edit that was never locked fails here instead of being
      # silently re-resolved: CI would otherwise test a dependency set that exists nowhere else,
      # and `uv.lock` — which is what the image and every developer install use — would go stale
      # without any gate noticing.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Apply database migrations
        run: make db-migrate

      # `cov`, not `test`: the 80% floor is a regression gate, and it is measured over the shipped
      # package set (enforced by tests/test_packaging.py) so it measures what a deployment runs.
      #
      # Lint and type used to ride along on this line and now run in `static` above, in parallel.
      # They are still gates and still block a merge; what changed is that they no longer report
      # their answer eleven minutes after they knew it.
      - name: Test with the coverage floor
        run: make cov

      - name: Validate knowledge graph
        run: make kg-validate

      # The scientific quality gates, and they now gate: `--strict` exits non-zero on a science
      # regression. It could not before, because two shipped cases exist to *demonstrate* a gate
      # firing and the only way to keep them from failing the command was for the command never to
      # fail — so this step carried the name of a gate while being a report. `EvalCase.expect_pass`
      # separates a demonstration from a regression, which is what makes the name true.
      - name: Score the eval case-set (fails on a science regression)
        run: make eval-strict

      # `eval-strict` above fails on a *regression* — a case that stopped passing. This fails on a
      # **drift**: an aggregate that got quietly worse against `data/evals/baseline.json` without
      # any single case flipping. It existed for exactly that and no workflow ran it, so the
      # slower half of the science gate was a target somebody had to remember. It costs ~1s, and
      # it refuses to compare across case-set versions rather than reporting a delta between two
      # different quantities.
      - name: Score against the recorded baseline (fails on a worsening drift)
        run: make eval-baseline-check

      - name: Validate ELN exports
        run: make eln-validate

      - name: Validate skills
        run: make skill-validate

      # The connector seam's gates (D-109/D-112). Each catches a class of failure invisible to the
      # test suite because it is about the *wiring* between a declaration and the live surface: a
      # bundle whose declared job cannot be built, a template step naming a tool that does not
      # exist, prose promising the model a tool nobody serves.
      - name: Validate connectors
        run: make connector-validate

      # The same class of failure for the *other* seam that names its implementation as a string
      # (D-120). A data source's half is `module:callable`, resolved in whichever worker asks for
      # it first — so a typo surfaces at the first sync, in a worker, hours after the deploy.
      - name: Validate data sources
        run: make datasource-validate

      # The third seam that names its implementation as a string, and the one where a typo is
      # quietest: a result sink is only reached by a background drain, so a bad driver reference
      # surfaces as results silently not arriving — which looks exactly like a deployment with
      # nothing to publish (D-2026-08-25).
      - name: Validate result sinks
        run: make sink-validate

      - name: Validate step templates
        run: make template-validate

      - name: Validate the agent's prose contract
        run: make prose-validate

      # The supply-chain gate, and the reason it is *here* rather than only in `image.yml`: that
      # workflow triggers on `push: main` and `pull_request`, so a branch push — the thing a
      # developer does dozens of times before opening a PR — audited nothing. Neither did `make
      # ci`, the documented pre-push gate, which is what made CLAUDE.md's "a green `make` locally
      # means a green CI" false for the dependency closure specifically. Same target as
      # `image.yml` runs, so the two cannot disagree; the duplicate run costs ~15s against a
      # 4m38s job and is what makes the branch-push case covered at all.
      - name: Audit the dependency closure for known vulnerabilities
        run: make deps-audit

  # The deployment gate (DA-10/D-2). The Helm chart is the one artifact no test can exercise
  # offline, and a broken chart is only discovered at `helm install` — in production, on the worst
  # day. Rendering it against the Kubernetes schemas needs no cluster and no credentials. A separate
  # job so it runs in parallel with `check` rather than lengthening it.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv, because `make helm-validate` no longer runs only binaries: it unwraps the render to
      # feed `promtool` and that unwrapping is Python. This step used to be absent with a comment
      # saying so, whose real content was the trap — installing uv and never calling `uv sync`
      # leaves the action's cache path empty and its post-job save then fails the whole job, a green
      # validation reported as a red check. `uv sync --locked` below is what makes the cache real.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.13.0"

      - name: Install kubeconform
        # Checksummed, because a release asset is mutable in a way a git tag is not: the tag names
        # a commit, the asset is a file the release owner can replace. This binary then validates
        # the chart that describes the deployment, so "whatever that URL served today" is a
        # strange thing to trust when the same pipeline pins its Python closure with `--locked`
        # and audits it. The digest below was verified against the release's own `CHECKSUMS` file
        # rather than taken from one download of the tarball.
        env:
          KUBECONFORM_VERSION: v0.6.7
          KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Install promtool
        # The gate `kubeconform` cannot be: it validates that an alert's `expr` is a *string*, not
        # that the string is PromQL. A syntax error therefore passed CI, passed the API server, and
        # was rejected by Prometheus at rule-group load — taking the whole group with it, silently,
        # with the object still reading as `Valid` in the cluster. `promtool check rules` is the
        # only thing that parses it, and it now covers the rendered dashboards' queries too.
        #
        # Checksummed for the same reason as `kubeconform` above, and against the release's own
        # `sha256sums.txt` rather than against one download. `promtool` ships only inside the full
        # Prometheus tarball, which is why this pulls ~100 MB for one 40 MB binary; extracting the
        # single path keeps the runner's disk out of it.
        env:
          PROMETHEUS_VERSION: v3.1.0
          PROMETHEUS_SHA256: 9a9d1e115d1745826b13aec3f1409780b9fcf1d4206746cb4faee46ca5add70c
        run: |
          set -euo pipefail
          curl -sSLo /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION#v}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  /tmp/prometheus.tar.gz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION#v}.linux-amd64/promtool"
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool

      - name: Render + validate the Helm chart
        run: make helm-validate

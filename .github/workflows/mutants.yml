# Weekly mutation test of the invariant-bearing modules — the backstop `ci.yml` deliberately
# does not carry.
#
# **Which modules is `[tool.mutmut].source_paths` in `pyproject.toml`, and it is not restated
# here.** It was, and the restatement went stale in both directions at once: it said "seven" over a
# list of eleven, and it named `kg/pr_gate.py`, a module
# `D-2026-09-05-the-gate-follows-behaviour-not-knowledge` had already deleted along with the whole
# PR gate. A weekly job advertising coverage of a file that does not exist is the same defect class
# this repository records for its validator list and its Makefile target count.
# `tests/test_docstring_paths.py` is what keeps it honest now: its corpus was widened to cover
# `.github/` in the same commit, so a module named in a workflow comment must resolve on disk
# exactly as one named in a docstring must.
#
# `make mutants` is excluded from the `ci` target because it costs an order of magnitude more than
# the gate — and until this file it had **no schedule
# either**, so the only thing that had ever run it was a person, once
# (`D-2026-08-08-a-survivor-is-a-hypothesis`). That pass found real holes: `propose_note`'s
# `actor`/`session_id`/`correlation_id` stamps could each be deleted with the whole suite green,
# which also makes a proposal its own author is served a 404 for; and the reviewer-facing
# `with N supporting note(s)` count in the PR body was asserted by nothing. A control with that
# track record and no schedule is a control that ran once.
#
# Weekly on Monday, the cadence `dependabot.yml` and `ci.yml`'s own `deps-audit` schedule already
# use, at 02:00 so the two long jobs do not start together.
name: mutants

on:
  schedule:
    - cron: "0 2 * * 1"
  # The run is expensive and its result is a report, so it is never attached to a push. Manual
  # dispatch is how a branch that changes one of the declared source paths gets checked before
  # merge.
  workflow_dispatch:

# `issues: write` is the notification, and it is here rather than left to GitHub's default because
# of what the default actually is: a scheduled workflow's failure is emailed to whoever last
# touched the cron line, and shows up in the Actions tab nobody opens on a Monday. A weekly job
# whose failure nobody sees is the same defect as an unscheduled one — so the last step below files
# an issue in the repository, where the backlog is worked.
permissions:
  contents: read
  issues: write

jobs:
  mutants:
    runs-on: ubuntu-latest
    # **60 was below the run, and that is how a weekly job dies without saying so.** The 2026-08-27
    # measurement behind it was 825 mutants in 2m57s warm over seven source paths; the list is
    # eighteen now and the first run that ever completed took **87 minutes** (3,640 mutants at 0.70
    # mutations/second, 2026-09-22, 4-core sandbox, real Postgres, cold). A job-level
    # `timeout-minutes` *cancels* the job, every step below is guarded by `!cancelled()`, and the
    # notification fired on `failure()` alone — so the cap would have produced no stats, no
    # artifact, no gate and no issue. The notification step now also fires on cancellation, and the
    # cap is a bound on a hung mutant rather than a budget for the run.
    #
    # 240 is deliberately a large multiple of 87 and not a forecast: mutmut parallelises over
    # `os.cpu_count()`, and a shared runner's core count is not something this file can know.
    timeout-minutes: 240

    # **Real Postgres, and this is not copied from `ci.yml` for symmetry.** Several files in
    # `pytest_add_cli_args_test_selection` gate on `tests/pg.py::migrated_db_or_skip`; derive the
    # set rather than reading it here, because the list this paragraph used to give named two files
    # that do not exist (`test_note_proposals.py`, `test_pr_gate_read_window.py`) and one that does
    # not gate, and `tests/test_docstring_paths.py` cannot catch a bare filename with no directory
    # segment. Without a database those files skip and still report green, so every mutant in
    # `science/calc/store.py` and `agent/audit_store.py` would be scored SURVIVED for a reason that
    # has nothing to do with the mutation. That is worse than not running: it manufactures
    # survivors in exactly the two modules this job exists for.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chemclaw
          POSTGRES_PASSWORD: chemclaw
          POSTGRES_DB: chemclaw
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U chemclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHEMCLAW_POSTGRES_DSN: postgresql://chemclaw:chemclaw@localhost:5432/chemclaw

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Apply database migrations
        run: make db-migrate

      # `mutmut run` exits 0 whatever it finds — survivors included — so the policy below is this
      # workflow's, stated explicitly, not something inherited from the tool.
      - name: Mutate the invariant-bearing modules
        run: make mutants

      # Both halves of the report, and they run even when the step above failed: a run that died
      # part-way still has counts worth reading.
      - name: Collect the counts and the survivor list
        if: ${{ !cancelled() }}
        run: |
          make mutant-stats
          make mutant-results | tee mutants/survivors.txt
          {
            echo '### Mutation results'
            echo '```json'
            cat mutants/mutmut-cicd-stats.json
            echo '```'
            echo '<details><summary>Non-killed mutants</summary>'
            echo
            echo '```'
            cat mutants/survivors.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/survivors.txt
          retention-days: 90

      # **What this job does with a survivor: publishes it, and does not fail.**
      #
      # `D-2026-08-27-a-survivor-is-not-a-failing-build` is the decision and carries the numbers.
      # The short form: `D-2026-08-08-a-survivor-is-a-hypothesis` measured that a survivor from this
      # selection is a claim about the *selection* — 29 of that run's 39 survivors were killed by
      # two test files the selection did not name — so acting on one before re-running it against
      # the whole suite produces tests for behaviour already pinned. Running this checkout twice on
      # 2026-08-27 added a second leg: 171 survivors then 155, same commit, same configuration, so a
      # survivor is not even a stable observation. The state *then* was 34 `no_tests` and 2
      # timeouts both times, with seventeen of the survivors already adjudicated equivalent or
      # harmless; at fifteen source paths it is 446 and 68. A gate on any of those at zero would be red the day it merged, which is how a
      # weekly job stops being read.
      #
      # So the gates are the **kill rate against a recorded floor** and the **`no_tests` share
      # against a recorded ceiling**. A rate rather than a count, because a count breaks the first
      # time one of these modules legitimately grows: well-tested new code raises `killed` and
      # `total` together and leaves the rate alone. A rate is not enough on its own, though — a
      # mutant reached by no selected test is neither killed nor survived-under-test, so it
      # depresses the rate without saying why, and 27.7% of the population was in that state until
      # 2026-09-22. That is a hole in the *selection*, a different defect from a weak test, and it
      # gets its own number.
      #
      # **The floor is pinned to the population it was measured over**, in
      # `tests/test_mutation_workflow.py`. The paragraph above argues for a rate because a count
      # breaks when a module grows; a rate breaks when the *set* of modules grows, which is what
      # left a floor of 72.0 — measured over 825 mutants — standing over a population of 3,640
      # that scores 62.1%.
      #
      # `suspicious` and `segfault` fail at zero, and they are a different kind of thing — not a
      # result at all, but the harness going wrong, which leaves every number above them unexplained.
      #
      # **A rate needs a denominator somebody checked.** The gate divides `killed` by `total` and
      # cannot see *which* mutants are in `total`: mutmut's `walk_all_files` falls through to
      # `walk(path)` for a `source_paths` entry that is neither a file nor a directory, which
      # yields nothing — no warning, no error, and `_load_config` never stats the paths. So a
      # module moved without `pyproject.toml` following it is scored on one module fewer than it
      # declares, and the rate usually goes *up*, because the aggregate loses a below-average
      # module.
      # Measured 2026-08-27 over that run's per-module counts, when the list was seven: dropping
      # any one of them left a rate above the floor, and five of the seven left it *above the
      # baseline* — so no floor on the rate catches this, while a floor on the count would move
      # whenever a module legitimately grows. That measurement is over a population this config no
      # longer has and has not been repeated at fifteen paths; it is the reason the coverage check
      # exists and not evidence about today's numbers. What is checked is coverage: every declared
      # source path must have left results behind, named one by one.
      - name: Gate on the kill rate, on the coverage, and on the harness having worked
        if: ${{ !cancelled() }}
        env:
          # **A rate is only comparable while the population is, and this floor outlived two
          # changes to it.** 72.0 was measured 2026-08-27 over **825** mutants — 618 and 634
          # killed, 74.9% and 76.8%, a 1.9-point spread on identical code — and `source_paths` has
          # grown twice since. The population is now 3,640. Re-measured 2026-09-22 on the first
          # `make mutants` run that has ever completed here (every scheduled run before
          # `D-2026-09-22-a-mutation-backstop-that-cannot-start` died in the stats phase):
          # **2,260 killed of 3,640 — 62.1%** — with 866 survived, 446 reached by no selected
          # test, 68 timed out, and 0 suspicious or segfault. So 72.0 was not a standard this
          # config had fallen short of; it was a number about a different set of modules, and the
          # first completed run would have failed on it.
          #
          # **Re-measured 2026-09-23 on a wider population, and the floor did not move.** Three
          # refusal gates — `agent/plan_gate.py`, `agent/skill_backend.py`, `agent/loop_cap.py` —
          # joined `source_paths` with their own test files, taking the run from 3,640 mutants to
          # **4,057**: **2,555 killed — 63.0%** — with 986 survived, 473 reached by no selected
          # test (11.7%), 43 timed out, 0 suspicious or segfault, in **82m40s at 0.76
          # mutations/second**. Both rates improved (62.1% -> 63.0%, 12.3% -> 11.7%), and under
          # the rule stated below — five points under the observation — 63.0 gives 58.0, so 57.0
          # is kept as the more conservative of the two rather than ratcheted by one point on a
          # nine-tenths-of-a-point move. **The number being unchanged is a result here, not an
          # omission**: it was re-derived from the new run, and the pin in
          # `tests/test_mutation_workflow.py` is what made re-deriving it compulsory.
          #
          # The +417 mutants cost less than the run-to-run variance: wall clock went *down*, 87
          # minutes to 82m40s, on a larger population. That is noise rather than a speedup, and
          # it is the honest reading of the row's "measure the runtime before adding a module" —
          # at this size the addition is not the term that decides the run's length.
          #
          # **57.0 is 5.1 points below the 62.1% observation, and the margin is stated as the
          # absolute number it is.** An earlier draft of this comment said "one and a half of the recorded
          # spread, read proportionally (1.5 × 1.9 ≈ 2.9)" and then wrote 59.0, which is neither:
          # the proportional reading gives 59.7 and the absolute one 59.25. Two methods named,
          # a third number written. Restated: this rests on **one** observation of this
          # population, the variance of which has never been measured because until this week no
          # run here finished, and it will run on a shared runner whose core count this file
          # cannot know. So the margin is set wide deliberately and raised from the weekly
          # artifacts, which is the direction the 72.0 comment asked for and never got.
          #
          # The largest movable term is the **timeout** count: 68 of 3,640, worth 1.9 points of
          # the rate on its own, against 2 of 825 in 2026-08-27's run — and 43 of 4,057, **1.1
          # points**, on 2026-09-23's. So the term the margin was sized for has now been seen
          # three times and its spread is 0.2 to 1.9 points; five points still covers a tripling
          # of the smallest and twice the largest. **Not a tripling of the largest** — 3 x 1.9 is
          # 5.7, above both five and the 5.1-point margin this comment states — and the sentence
          # this replaces said it did, having dropped a "roughly" that was carrying the claim. What
          # five points does cover is the whole observed spread twice over. It is not a
          # *uniform*-speed
          # risk — mutmut's per-mutant wall limit is `(estimated_time_of_tests + timeout_constant)
          # × timeout_multiplier`, and `estimated_time_of_tests` is measured in the same run's own
          # clean-test phase, so a slower machine scales the budget with the test — but it is a
          # variance risk, and a shared runner has more of it than a sandbox. Five points covers
          # roughly a tripling of that term with nothing else moving.
          #
          # What moved the rate is worth recording beside the number. At the config this workflow
          # ran on before 2026-09-22 the same 3,640 mutants scored **1,612 killed — 44.3%** —
          # with 1,009 `no_tests`. Pairing the test selection with the modules it claims to cover
          # moved it to 62.1% and cut `no_tests` from 27.7% to 12.3%. Nothing about the code
          # changed; the backstop had simply not been asked to run the tests that cover it.
          MUTATION_SCORE_FLOOR: "57.0"
          # Measured on the same run: 446 of 3,640, **12.3%**, and 473 of 4,057 — **11.7%** — on
          # 2026-09-23's wider one, so the ceiling holds with more headroom than it was set with. A mutant nothing reaches is not a
          # survivor — it is a hole in the *selection*, and it is the number the widening above
          # was aimed at, so it is the one to hold. The ceiling is set with headroom rather than
          # at the observation for the reason the floor is: a gate that reds on ordinary movement
          # gets switched off. A new module joining `source_paths` without its tests joining the
          # selection is precisely what this catches, and it is the mistake that produced 27.7%.
          MUTATION_NO_TESTS_CEILING: "16.0"
        run: |
          python - <<'PY'
          import json, os, pathlib, sys, tomllib

          stats = json.loads(pathlib.Path("mutants/mutmut-cicd-stats.json").read_text())
          print(json.dumps(stats, indent=2))

          # mutmut writes `mutants/<source path>.meta` for every file it actually mutated, and
          # `export-cicd-stats` skips any path without one — which is exactly how a path that
          # stopped resolving leaves the aggregate silently smaller. Reading the declaration back
          # from `pyproject.toml` keeps the declared modules named in one place. No count is
          # written here: the one that was said seven, over a list that has grown twice since.
          config = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          declared = config["tool"]["mutmut"]["source_paths"]
          unmutated = [p for p in declared if not pathlib.Path("mutants", p + ".meta").exists()]
          if unmutated:
              sys.exit(
                  "these [tool.mutmut] source_paths left no results, so the kill rate below is "
                  f"over a smaller set of modules than it claims: {unmutated}"
              )

          # Every category this gate reads, by name, so a schema change is a sentence rather than a
          # `KeyError` traceback under an issue body that offers three other explanations. mutmut
          # 3.7's `save_cicd_stats` writes all of these; a future version that stops is a thing to
          # be told about.
          missing = [k for k in ("killed", "survived", "total", "no_tests", "timeout") if k not in stats]
          if missing:
              sys.exit(
                  f"mutants/mutmut-cicd-stats.json has no {missing}. mutmut's stats schema changed "
                  "under this gate; re-read `save_cicd_stats` before trusting any number above."
              )

          broken = {k: stats.get(k, 0) for k in ("suspicious", "segfault") if stats.get(k, 0)}
          if broken:
              sys.exit(f"the mutation harness itself reported {broken}; the counts above mean nothing")

          total = stats["total"]
          if not total:
              sys.exit("the run scored no mutants at all")

          # `total` is mutmut's sum over *every* status, including two it never exports:
          # `not_checked` and `caught_by_type_check`. So a run killed part-way through reports a
          # large invisible remainder, the kill rate collapses, and the floor below would diagnose
          # it as badly tested code. Anything unaccounted for is the harness, not the tests.
          accounted = sum(
              stats.get(k, 0)
              for k in ("killed", "survived", "no_tests", "timeout", "skipped", "suspicious", "segfault")
          )
          if accounted != total:
              sys.exit(
                  f"{total - accounted} of {total} mutants are in a category the stats file does "
                  "not name (mutmut counts `not_checked` and `caught_by_type_check` in `total` and "
                  "exports neither), so the run did not finish and the rate below is not a score."
              )

          score = 100.0 * stats["killed"] / total
          floor = float(os.environ["MUTATION_SCORE_FLOOR"])
          # `no_tests` is the second gate and it is on the *selection* rather than on the tests: a
          # mutant nothing exercises is neither killed nor survived-under-test, so it inflates
          # `total` and depresses the rate without saying why. Both are computed and printed before
          # either exits, because the canonical failure — a module joining `source_paths` without
          # its tests joining the selection — fails *both*, and exiting on the rate first would
          # report the uninformative one. Driven: the pre-widening run (1612/3640 killed, 1009
          # no_tests) is exactly that case.
          uncovered = 100.0 * stats["no_tests"] / total
          ceiling = float(os.environ["MUTATION_NO_TESTS_CEILING"])
          print(
              f"kill rate {score:.1f}% ({stats['killed']}/{total}); floor {floor:.1f}%. "
              f"no-test share {uncovered:.1f}% ({stats['no_tests']}/{total}); ceiling {ceiling:.1f}%. "
              f"{stats['survived']} survived, {stats['timeout']} timed out — published, not gated."
          )
          failures = []
          if uncovered > ceiling:
              failures.append(
                  f"{uncovered:.1f}% of mutants were reached by no selected test, above the "
                  f"recorded ceiling of {ceiling:.1f}%. That is a gap in "
                  "[tool.mutmut].pytest_add_cli_args_test_selection, not in the tests: a module "
                  "joined source_paths without the tests that cover it joining the selection."
              )
          if score < floor:
              failures.append(
                  f"kill rate {score:.1f}% is below the recorded floor of {floor:.1f}%"
              )
          if failures:
              sys.exit("\n".join(failures))
          PY

      # The half that makes the schedule worth having. Deduplicated on the label, so a failure that
      # persists for three weeks is one issue with the runs linked, not three issues nobody closes.
      #
      # **The label is created here rather than assumed**, and that is the whole reason this step
      # ever ran without filing anything: `mutation-testing` did not exist in the repository, `gh
      # issue create` resolves label names to node ids before it issues the mutation, so the step
      # died with `could not add label: 'mutation-testing' not found` — and the dedup read above it
      # could not warn, because `gh issue list --label` routes through search and answers empty
      # with exit 0 for a label that does not exist. `--force` rather than `|| true`: the create is
      # idempotent, so it is not a failure to swallow, and swallowing one is how this step would
      # go quiet again. Repository settings are not in this checkout, so the workflow carrying its
      # own label is the only form of this that a reviewer can see.
      #
      # **And it fires on cancellation as well as failure**, because a job-level `timeout-minutes`
      # *cancels* the job: every step above is guarded by `!cancelled()`, so a run that outlasts
      # the cap produces no stats, no artifact and no gate, and `failure()` alone is false — the
      # exact shape this step exists to prevent, one level up. The cap was 60 minutes against an
      # 87-minute run until 2026-09-22, so this was not hypothetical. The cost is that a human
      # cancelling a manual dispatch also files one; that is the cheap side of the trade, and the
      # body says which case it was.
      - name: File an issue when the run reports something
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ cancelled() && 'cancelled — the job hit its timeout or was stopped' || 'failed' }}
        run: |
          gh label create mutation-testing --force \
            --color ededed --description "the weekly mutants workflow reported something"
          existing=$(gh issue list --label mutation-testing --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Weekly mutation run reported again (\`$OUTCOME\`): $RUN_URL"
          else
            gh issue create \
              --title "Weekly mutation run needs attention" \
              --label mutation-testing \
              --body "The scheduled \`mutants\` workflow failed: the kill rate fell below the floor recorded in \`.github/workflows/mutants.yml\`, the \`no_tests\` share rose above its ceiling, the harness reported a \`suspicious\` or \`segfault\` mutant, the stats file lost a category this gate reads, or the run was **cancelled** — which is what a job-level timeout looks like, and which produces no stats and no artifact at all. This run: \`$OUTCOME\`. Counts and the full non-killed list are in the run's summary and its \`mutation-report\` artifact: $RUN_URL — see \`D-2026-08-27-a-survivor-is-not-a-failing-build\` for what each category means. A **survivor** alone does not fail this job: re-apply one to the real source and run the whole suite before treating it as a finding."
          fi

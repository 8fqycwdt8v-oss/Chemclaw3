# Image gate (plan F6-T4): the single multi-target image builds, and every component the
# entrypoint dispatches actually imports as a non-root UID.
#
# This ran nowhere before D-117. It lived at `services/chemclaw/.github/workflows/deploy.yml`,
# which GitHub Actions never reads, and its smoke step still named `mcp-molfp`/`mcp-rxnfp` —
# components `entrypoint.sh` would now reject with exit 64. It passed anyway, because the step ran
# `python -c import <module>` rather than the entrypoint, so it never exercised the dispatch it
# claimed to cover. The component/entrypoint agreement is now checked offline in both directions
# by `tests/test_deploy_chart.py`; what only an image can prove is that the closure installs and
# imports under an arbitrary high UID, which is what this does.
#
# Deliberately NOT on every branch push: the build resolves the whole locked dependency set and
# the full dependency closure, so it costs minutes. Pull requests and `main` are where it matters.
#
# The registry push and cluster rollout are not here. The stranded workflow carried them as a job
# whose entire body was `echo "docker push + helm upgrade ..."` — a stub, deleted rather than
# carried forward. Its trigger is recorded in docs/planning/DEFERRED.md: a real cluster and its credentials.
name: image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# `contents: read` and nothing else. This used to also request `actions: write`, which no step here
# has ever needed — there is no API call, no cache deletion, and `upload-artifact` authenticates to
# the artifact service with its own token rather than this scope. `git log -S` shows it arrived with
# the file's first commit and was never argued for; every other line in these workflows that grants
# something says why. Write access to Actions in the one workflow that builds the shipped artifact
# is the wrong thing to hold by accident.
permissions:
  contents: read

# `main` is exempt from the cancellation for the same reason as in `ci.yml`: on a branch a cancelled
# run is a superseded answer, on the default branch it is a missing one, and this is the only gate
# that proves the image builds and its components import as a non-root UID.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Audit the dependency closure for known vulnerabilities
        # The supply chain had no gate of any kind: no dependency scan, no SBOM, no image scan.
        # This is the cheapest of the three and the one that catches the most, because it runs
        # against the *lockfile* — the exact versions the image installs — rather than against
        # whatever a scanner infers from a built filesystem.
        #
        # Blocking, deliberately. A non-blocking scanner is a scanner nobody reads: the whole
        # failure mode being fixed here is a control that exists and reports to no one. A finding
        # that genuinely cannot be fixed is an explicit `--ignore-vuln` with a reason beside it,
        # which is a decision in the diff rather than a red badge everyone learns to skip.
        run: make deps-audit

      - name: Build the multi-target image (rootless)
        # `CHEMCLAW_REVISION` is what makes `deployment_revision` — the audit trail's "which
        # version produced this result" column (AG-14) — a real value rather than the constant
        # "unknown" it had been in every build (REV-17). The commit SHA, not the tag: a tag moves,
        # and an audit record has to name bytes.
        run: |
          docker build -f deploy/Containerfile \
            --build-arg "CHEMCLAW_REVISION=${GITHUB_SHA}" \
            -t chemclaw:ci .

      - name: The image knows which revision it was built from
        # The half that cannot be checked offline: that the ARG actually reaches the running
        # process's environment. `tests/test_deploy_chart.py` pins the wiring in the files; only a
        # built image can show the value arrived.
        run: |
          set -euo pipefail
          revision=$(docker run --rm --entrypoint sh chemclaw:ci -c 'printf %s "$CHEMCLAW_DEPLOYMENT_REVISION"')
          test "${revision}" = "${GITHUB_SHA}" || {
            echo "image reports revision '${revision}', expected '${GITHUB_SHA}'" >&2
            exit 1
          }

      - name: Smoke every dispatchable component as a non-root UID
        # Derived from the entrypoint's own cases so this cannot drift from what ships: the two
        # generic `connector-*` prefixes are expanded from the bundles actually present.
        run: |
          set -euo pipefail
          # Read the fixed cases out of the entrypoint rather than restating them. A hand-kept
          # copy is exactly how this step first failed: it listed `workers.hpc_worker`, which
          # D-118 deleted when the HPC job became a connector job, so CI asserted a component
          # that no longer exists. A second list can disagree with the script in either
          # direction; a grep of the script cannot.
          # **Comments are stripped first, because these greps cannot tell prose from a command.**
          # A comment in `entrypoint.sh` explaining that every `exec python -m chemclaw<...>` line
          # resolved to the wrong interpreter was read by the first grep as a component named
          # `chemclaw<...>`, and the smoke loop then ran `python -c "import chemclaw<...>"` and died
          # on a SyntaxError. Deriving the list from the script rather than restating it is still
          # right -- a second list drifts -- but the derivation has to read the script the way the
          # shell does. `sed` drops whole-line comments; a trailing comment cannot contain a command.
          commands="$(sed -E 's/^[[:space:]]*#.*$//' deploy/entrypoint.sh)"
          modules=()
          while read -r module; do modules+=("${module}"); done < <(
            printf '%s' "${commands}" \
              | grep -oE 'python -m [a-z_][a-z0-9_.]*' | cut -d' ' -f3
          )
          while read -r target; do modules+=("${target%%:*}"); done < <(
            printf '%s' "${commands}" \
              | grep -oE 'uvicorn [a-z_][a-z0-9_.]*:[a-zA-Z_]+' | cut -d' ' -f2
          )
          # The `connector-*` cases build their target from `${name}`, so they are quoted and the
          # greps above deliberately skip them; they expand from the bundles actually present.
          test "${#modules[@]}" -ge 2 || {
            echo "found ${#modules[@]} fixed component(s) in entrypoint.sh; the greps have drifted" >&2
            exit 1
          }
          for bundle in src/chemclaw/connectors/*/; do
            name="$(basename "${bundle}")"
            [ -f "${bundle}/server/app.py" ] && modules+=("chemclaw.connectors.${name}.server.app")
            [ -f "${bundle}/worker.py" ] && modules+=("chemclaw.connectors.${name}.worker")
          done
          for module in "${modules[@]}"; do
            echo "::group::import ${module}"
            docker run --rm --user 1001 --entrypoint python chemclaw:ci -c "import ${module}"
            echo "::endgroup::"
          done

          # **And once through the real ENTRYPOINT, because the loop above cannot see the defect
          # that matters.** `docker run --entrypoint python` is resolved by Docker from the image's
          # own `ENV PATH`, with no shell involved -- so it never observes what bash does to PATH on
          # startup. The UBI base sets `BASH_ENV=/opt/app-root/bin/activate`, which prepends the
          # base venv ahead of ours, and every `exec python -m chemclaw...` in `entrypoint.sh`
          # therefore resolved to an interpreter with no `chemclaw` installed. Four of the five
          # component kinds could not start, and this step was green throughout, because the only
          # other step that runs this ENTRYPOINT passes an *unknown* component and exits above
          # every `exec`.
          #
          # `background-worker` is the arm to drive: it is a `python -m` component (so it exercises
          # the lookup that broke) and it fails fast with no broker rather than serving. Its refusal
          # to reach the broker is success here -- what is being asserted is that the interpreter
          # resolved and `chemclaw` imported, so a `ModuleNotFoundError` is the failure.
          echo "::group::the entrypoint resolves an interpreter that has chemclaw"
          out=$(docker run --rm --user 1001 \
                  -e CHEMCLAW_COMPONENT=background-worker \
                  -e CHEMCLAW_TEMPORAL_ADDRESS=127.0.0.1:1 \
                  chemclaw:ci 2>&1 || true)
          printf '%s\n' "${out}"
          if printf '%s' "${out}" | grep -q "No module named 'chemclaw'"; then
            echo "the entrypoint ran an interpreter with no chemclaw: PATH is wrong in the image" >&2
            exit 1
          fi
          echo "::endgroup::"

      - name: Scan the built image for fixable HIGH/CRITICAL vulnerabilities
        # The third supply-chain gate, and the one that was described here in the present tense for
        # weeks while `trivy` appeared nowhere in this file
        # (`D-2026-09-14-the-phantom-packages-were-pips-vendored-manifest`).
        #
        # It reads the *built filesystem*, which is what `make deps-audit` structurally cannot: the
        # base image's OS packages and every Python environment the base ships beside the
        # application's own. Both classes of finding this has produced were in exactly that gap —
        # fixable HIGH/CRITICAL advisories in the UBI9 base's openssh/openssl/python3, and the two
        # entries in `.trivyignore.yaml`.
        #
        # **Why it was held back, and what the measurement actually found.** The scan reported
        # `setuptools` 70.3.0 and `msgpack` 1.1.2 while the build's own exhaustive `find / -xdev`
        # listed neither, and a gate whose last word contradicts the artifact it scanned makes every
        # future red build ambiguous. Re-run on 2026-09-14 against trivy 0.58.2: both findings
        # reproduce, and both resolve to one file — `pip/_vendor/vendor.txt` in the base image's
        # `/opt/app-root` environment. The `find` missed them because it searched for
        # `setuptools-[0-9]*`, a `dist-info`/wheel naming convention that a line in a text file does
        # not have. The scanner was right the whole time; `deploy/Containerfile`'s recorded
        # diagnosis ("cached copies of build dependencies") was not, and is corrected there.
        #
        # `--ignore-unfixed` on HIGH and CRITICAL is a deliberate narrowing: a gate that fires on
        # every LOW in a distro base is one an operator disables within a week, and a finding with
        # no released fix is not something a build can act on. A finding that genuinely cannot be
        # fixed is an entry in `.trivyignore.yaml` **with its reason and an expiry**, which is a
        # decision in the diff rather than a red badge everyone learns to skip.
        #
        # Blocking, and on pull requests too: the image is built locally on every PR, so this step
        # needs no registry. The SBOM below is `main`-only because it *describes* a kept image; this
        # one *refuses* a broken one, which is worth knowing before the merge rather than after.
        #
        # The asset name is **asked for, not constructed**, and that is the whole point of this
        # block. `contrib/install.sh` builds `trivy_<version>_Linux-64bit.tar.gz` from `uname`, and
        # measured on a GitHub runner that URL answers **404** for this pin — so the installer
        # resolved the tag, failed the download, and exited 1 with nothing printed, because
        # `http_download` returns 1 into `set -e` and its own diagnostics are at debug priority.
        # It had never once been green, on any run, and read as an install flake twice.
        #
        # Reading the release's own asset list removes the entire class: a naming scheme this
        # repository does not control cannot silently stop matching. If nothing matches, every
        # asset name the release carries is printed, so one run says what the next pin should be.
        env:
          TRIVY_VERSION: v0.58.2
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="https://api.github.com/repos/aquasecurity/trivy/releases/tags/${TRIVY_VERSION}"
          curl -sSfL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
               -H "Accept: application/vnd.github+json" -o /tmp/trivy-release.json "${release}"
          # One reader, two answers: the linux/amd64 archive and the checksums file beside it. The
          # match is on the parts that identify the build rather than on a full name, since the
          # separator and the casing are exactly what moved.
          python3 - <<'PY' > /tmp/trivy-assets
          import json, re, sys

          release = json.load(open("/tmp/trivy-release.json"))
          assets = {a["name"]: a["browser_download_url"] for a in release.get("assets", [])}

          def one(pattern: str, what: str) -> str:
              hits = [n for n in assets if re.fullmatch(pattern, n, re.IGNORECASE)]
              if len(hits) != 1:
                  print(f"no single {what} asset (matched {hits}) in {release['tag_name']}.", file=sys.stderr)
                  print("the release carries:", file=sys.stderr)
                  for name in sorted(assets):
                      print(f"  {name}", file=sys.stderr)
                  raise SystemExit(1)
              return assets[hits[0]]

          print(one(r"trivy_.+_(linux)[-_](64bit|amd64)\.tar\.gz", "linux/amd64 archive"))
          print(one(r"trivy_.+_checksums\.txt", "checksums"))
          PY
          read -r tarball_url < /tmp/trivy-assets
          checksums_url=$(sed -n 2p /tmp/trivy-assets)
          curl -sSfL -o /tmp/trivy.tar.gz "${tarball_url}"
          curl -sSfL -o /tmp/trivy-checksums.txt "${checksums_url}"
          # The archive is verified against the checksums the release publishes, which is what the
          # installer did and the only reason fetching a tarball is acceptable here at all. The
          # expected hash is looked up by the asset's own name and re-pointed at the file actually
          # on disk; rewriting the line's path in place is what made the first draft of this check
          # verify a filename that does not exist, which `sha256sum -c` reports as a WARNING beside
          # its non-zero exit rather than as a mismatch.
          asset=$(basename "${tarball_url}")
          expected=$(awk -v name="${asset}" '$2 == name { print $1 }' /tmp/trivy-checksums.txt)
          test -n "${expected}" || {
            echo "no checksum line for ${asset} in the release's checksums file." >&2
            exit 1
          }
          echo "${expected}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          install /tmp/trivy /usr/local/bin/trivy
          trivy --version
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --exit-code 1 \
            chemclaw:ci

      - name: Record what this build actually contains (SBOM + digest)
        # `main` only. The SBOM's stated job, two paragraphs down, is answering "what was in the
        # image that produced this audit record" — a question that can only be asked about an image
        # something ran. A pull-request build is thrown away when the job ends, so scanning it cost
        # ~1m34s of every PR run and left a 90-day artifact nothing could ever be traced back to.
        # The build, the revision check and both dispatch smokes still run on every PR, because
        # those catch a broken image; this one only describes a kept one.
        if: github.ref == 'refs/heads/main'
        # The other half of a floating base image. `deploy/Containerfile` defaults to a mutable
        # UBI9 tag so a developer build does not pull a base months behind on CVE fixes — which
        # means the bytes cannot be pinned *in advance*, so they have to be named *afterwards*.
        # Both artifacts are retained on the run, which is what makes "what was in the image that
        # produced this audit record" answerable at all.
        #
        # `syft` rather than a hand-rolled `pip list`: the image carries an OS package set (git,
        # rsync) that no Python-level inventory can see,
        # and those are exactly the components a Python-level scan would miss.
        env:
          SYFT_VERSION: v1.35.0
          SYFT_SHA256: 01d0d15aff461f1bc54d1716feb4824341918c4f37e1b6a5a0c0caee2251be67
        run: |
          set -euo pipefail
          digest=$(docker image inspect chemclaw:ci --format '{{ index .RepoDigests 0 }}' 2>/dev/null \
            || docker image inspect chemclaw:ci --format '{{ .Id }}')
          echo "image id/digest: ${digest}"
          echo "${digest}" > sbom-image-digest.txt
          # Pinned, and the pin is verified to resolve before it is used: `v1.9.2` does not exist
          # as a syft tag, and installing from a 404 failed this job with a bare `curl: (22)`
          # that named neither the tag nor the reason. `-f` alone turns a bad pin into an opaque
          # exit 22, so the check below says which tag is wrong.
          curl -sSfI "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            >/dev/null || { echo "syft pin ${SYFT_VERSION} does not resolve - fix SYFT_VERSION"; exit 1; }
          # Fetched to a file and checksummed before it is executed, rather than piped straight
          # into `sh`. A tag is not immutable — `anchore/syft` can move `v1.35.0` — and this script
          # runs as root on the runner that just built the shipped image. `curl | sh` also hides a
          # truncated download: a half-transferred script is a valid prefix that `sh` will happily
          # run. Update SYFT_SHA256 with SYFT_VERSION; a mismatch is meant to stop the build.
          curl -sSfL -o /tmp/syft-install.sh \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh"
          echo "${SYFT_SHA256}  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b /usr/local/bin
          # Both outputs from ONE scan, each written to a file. Two things were wrong with
          # `syft ... -o table | head -40`: it re-scanned the image (~3 minutes for a second copy
          # of the same answer), and `head` closes the pipe at line 40, so syft takes SIGPIPE and
          # `set -o pipefail` turns a *successful* SBOM into exit 141. The log preview reads from
          # the file, where nothing can close underneath it.
          syft chemclaw:ci -o spdx-json=sbom.spdx.json -o table=sbom-table.txt
          head -40 sbom-table.txt

      - name: Upload the SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chemclaw-sbom
          path: |
            sbom.spdx.json
            sbom-image-digest.txt
          retention-days: 90

      - name: An unknown component must fail loudly, not silently start something
        run: |
          set -euo pipefail
          status=0
          docker run --rm --user 1001 -e CHEMCLAW_COMPONENT=not-a-component chemclaw:ci || status=$?
          test "${status}" -eq 64 || {
            echo "expected exit 64 for an unknown component, got ${status}" >&2
            exit 1
          }

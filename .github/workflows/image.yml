# Image gate (plan F6-T4): the single multi-target image builds, and every component the
# entrypoint dispatches actually imports as a non-root UID.
#
# This ran nowhere before D-117. It lived at `services/chemclaw/.github/workflows/deploy.yml`,
# which GitHub Actions never reads, and its smoke step still named `mcp-molfp`/`mcp-rxnfp` —
# components `entrypoint.sh` would now reject with exit 64. It passed anyway, because the step ran
# `python -c import <module>` rather than the entrypoint, so it never exercised the dispatch it
# claimed to cover. The component/entrypoint agreement is now checked offline in both directions
# by `tests/test_deploy_chart.py`; what only an image can prove is that the closure installs and
# imports under an arbitrary high UID, which is what this does.
#
# Deliberately NOT on every branch push: the build fetches the xtb and crest release tarballs and
# the full dependency closure, so it costs minutes. Pull requests and `main` are where it matters.
#
# The registry push and cluster rollout are not here. The stranded workflow carried them as a job
# whose entire body was `echo "docker push + helm upgrade ..."` — a stub, deleted rather than
# carried forward. Its trigger is recorded in DEFERRED.md: a real cluster and its credentials.
name: image

on:
  push:
    branches: ["main"]
  pull_request:

defaults:
  run:
    working-directory: services/chemclaw

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the multi-target image (rootless)
        # `CHEMCLAW_REVISION` is what makes `deployment_revision` — the audit trail's "which
        # version produced this result" column (AG-14) — a real value rather than the constant
        # "unknown" it had been in every build (REV-17). The commit SHA, not the tag: a tag moves,
        # and an audit record has to name bytes.
        run: |
          docker build -f deploy/Containerfile \
            --build-arg "CHEMCLAW_REVISION=${GITHUB_SHA}" \
            -t chemclaw:ci .

      - name: The image knows which revision it was built from
        # The half that cannot be checked offline: that the ARG actually reaches the running
        # process's environment. `tests/test_deploy_chart.py` pins the wiring in the files; only a
        # built image can show the value arrived.
        run: |
          set -euo pipefail
          revision=$(docker run --rm --entrypoint sh chemclaw:ci -c 'printf %s "$CHEMCLAW_DEPLOYMENT_REVISION"')
          test "${revision}" = "${GITHUB_SHA}" || {
            echo "image reports revision '${revision}', expected '${GITHUB_SHA}'" >&2
            exit 1
          }

      - name: Smoke every dispatchable component as a non-root UID
        # Derived from the entrypoint's own cases so this cannot drift from what ships: the two
        # generic `connector-*` prefixes are expanded from the bundles actually present.
        run: |
          set -euo pipefail
          # Read the fixed cases out of the entrypoint rather than restating them. A hand-kept
          # copy is exactly how this step first failed: it listed `workers.hpc_worker`, which
          # D-118 deleted when the HPC job became a connector job, so CI asserted a component
          # that no longer exists. A second list can disagree with the script in either
          # direction; a grep of the script cannot.
          modules=()
          while read -r module; do modules+=("${module}"); done < <(
            grep -oE 'python -m [a-z_][a-z0-9_.]*' deploy/entrypoint.sh | cut -d' ' -f3
          )
          while read -r target; do modules+=("${target%%:*}"); done < <(
            grep -oE 'uvicorn [a-z_][a-z0-9_.]*:[a-zA-Z_]+' deploy/entrypoint.sh | cut -d' ' -f2
          )
          # The `connector-*` cases build their target from `${name}`, so they are quoted and the
          # greps above deliberately skip them; they expand from the bundles actually present.
          test "${#modules[@]}" -ge 2 || {
            echo "found ${#modules[@]} fixed component(s) in entrypoint.sh; the greps have drifted" >&2
            exit 1
          }
          for bundle in connectors/*/; do
            name="$(basename "${bundle}")"
            [ -f "${bundle}/server/app.py" ] && modules+=("connectors.${name}.server.app")
            [ -f "${bundle}/worker.py" ] && modules+=("connectors.${name}.worker")
          done
          for module in "${modules[@]}"; do
            echo "::group::import ${module}"
            docker run --rm --user 1001 --entrypoint python chemclaw:ci -c "import ${module}"
            echo "::endgroup::"
          done

      - name: An unknown component must fail loudly, not silently start something
        run: |
          set -euo pipefail
          status=0
          docker run --rm --user 1001 -e CHEMCLAW_COMPONENT=not-a-component chemclaw:ci || status=$?
          test "${status}" -eq 64 || {
            echo "expected exit 64 for an unknown component, got ${status}" >&2
            exit 1
          }

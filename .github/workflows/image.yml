# Image gate (plan F6-T4): the single multi-target image builds, and every component the
# entrypoint dispatches actually imports as a non-root UID.
#
# This ran nowhere before D-117. It lived at `services/chemclaw/.github/workflows/deploy.yml`,
# which GitHub Actions never reads, and its smoke step still named `mcp-molfp`/`mcp-rxnfp` —
# components `entrypoint.sh` would now reject with exit 64. It passed anyway, because the step ran
# `python -c import <module>` rather than the entrypoint, so it never exercised the dispatch it
# claimed to cover. The component/entrypoint agreement is now checked offline in both directions
# by `tests/test_deploy_chart.py`; what only an image can prove is that the closure installs and
# imports under an arbitrary high UID, which is what this does.
#
# Deliberately NOT on every branch push: the build resolves the whole locked dependency set and
# the full dependency closure, so it costs minutes. Pull requests and `main` are where it matters.
#
# The registry push and cluster rollout are not here. The stranded workflow carried them as a job
# whose entire body was `echo "docker push + helm upgrade ..."` — a stub, deleted rather than
# carried forward. Its trigger is recorded in docs/planning/DEFERRED.md: a real cluster and its credentials.
name: image

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# `contents: read` and nothing else. This used to also request `actions: write`, which no step here
# has ever needed — there is no API call, no cache deletion, and `upload-artifact` authenticates to
# the artifact service with its own token rather than this scope. `git log -S` shows it arrived with
# the file's first commit and was never argued for; every other line in these workflows that grants
# something says why. Write access to Actions in the one workflow that builds the shipped artifact
# is the wrong thing to hold by accident.
permissions:
  contents: read

# `main` is exempt from the cancellation for the same reason as in `ci.yml`: on a branch a cancelled
# run is a superseded answer, on the default branch it is a missing one, and this is the only gate
# that proves the image builds and its components import as a non-root UID.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Audit the dependency closure for known vulnerabilities
        # The supply chain had no gate of any kind: no dependency scan, no SBOM, no image scan.
        # This is the cheapest of the three and the one that catches the most, because it runs
        # against the *lockfile* — the exact versions the image installs — rather than against
        # whatever a scanner infers from a built filesystem.
        #
        # Blocking, deliberately. A non-blocking scanner is a scanner nobody reads: the whole
        # failure mode being fixed here is a control that exists and reports to no one. A finding
        # that genuinely cannot be fixed is an explicit `--ignore-vuln` with a reason beside it,
        # which is a decision in the diff rather than a red badge everyone learns to skip.
        run: make deps-audit

      - name: Build the multi-target image (rootless)
        # `CHEMCLAW_REVISION` is what makes `deployment_revision` — the audit trail's "which
        # version produced this result" column (AG-14) — a real value rather than the constant
        # "unknown" it had been in every build (REV-17). The commit SHA, not the tag: a tag moves,
        # and an audit record has to name bytes.
        run: |
          docker build -f deploy/Containerfile \
            --build-arg "CHEMCLAW_REVISION=${GITHUB_SHA}" \
            -t chemclaw:ci .

      - name: The image knows which revision it was built from
        # The half that cannot be checked offline: that the ARG actually reaches the running
        # process's environment. `tests/test_deploy_chart.py` pins the wiring in the files; only a
        # built image can show the value arrived.
        run: |
          set -euo pipefail
          revision=$(docker run --rm --entrypoint sh chemclaw:ci -c 'printf %s "$CHEMCLAW_DEPLOYMENT_REVISION"')
          test "${revision}" = "${GITHUB_SHA}" || {
            echo "image reports revision '${revision}', expected '${GITHUB_SHA}'" >&2
            exit 1
          }

      - name: Smoke every dispatchable component as a non-root UID
        # Derived from the entrypoint's own cases so this cannot drift from what ships: the two
        # generic `connector-*` prefixes are expanded from the bundles actually present.
        run: |
          set -euo pipefail
          # Read the fixed cases out of the entrypoint rather than restating them. A hand-kept
          # copy is exactly how this step first failed: it listed `workers.hpc_worker`, which
          # D-118 deleted when the HPC job became a connector job, so CI asserted a component
          # that no longer exists. A second list can disagree with the script in either
          # direction; a grep of the script cannot.
          modules=()
          while read -r module; do modules+=("${module}"); done < <(
            grep -oE 'python -m [a-z_][a-z0-9_.]*' deploy/entrypoint.sh | cut -d' ' -f3
          )
          while read -r target; do modules+=("${target%%:*}"); done < <(
            grep -oE 'uvicorn [a-z_][a-z0-9_.]*:[a-zA-Z_]+' deploy/entrypoint.sh | cut -d' ' -f2
          )
          # The `connector-*` cases build their target from `${name}`, so they are quoted and the
          # greps above deliberately skip them; they expand from the bundles actually present.
          test "${#modules[@]}" -ge 2 || {
            echo "found ${#modules[@]} fixed component(s) in entrypoint.sh; the greps have drifted" >&2
            exit 1
          }
          for bundle in src/chemclaw/connectors/*/; do
            name="$(basename "${bundle}")"
            [ -f "${bundle}/server/app.py" ] && modules+=("chemclaw.connectors.${name}.server.app")
            [ -f "${bundle}/worker.py" ] && modules+=("chemclaw.connectors.${name}.worker")
          done
          for module in "${modules[@]}"; do
            echo "::group::import ${module}"
            docker run --rm --user 1001 --entrypoint python chemclaw:ci -c "import ${module}"
            echo "::endgroup::"
          done

      - name: Record what this build actually contains (SBOM + digest)
        # `main` only. The SBOM's stated job, two paragraphs down, is answering "what was in the
        # image that produced this audit record" — a question that can only be asked about an image
        # something ran. A pull-request build is thrown away when the job ends, so scanning it cost
        # ~1m34s of every PR run and left a 90-day artifact nothing could ever be traced back to.
        # The build, the revision check and both dispatch smokes still run on every PR, because
        # those catch a broken image; this one only describes a kept one.
        if: github.ref == 'refs/heads/main'
        # The other half of a floating base image. `deploy/Containerfile` defaults to a mutable
        # UBI9 tag so a developer build does not pull a base months behind on CVE fixes — which
        # means the bytes cannot be pinned *in advance*, so they have to be named *afterwards*.
        # Both artifacts are retained on the run, which is what makes "what was in the image that
        # produced this audit record" answerable at all.
        #
        # `syft` rather than a hand-rolled `pip list`: the image carries an OS package set (git,
        # rsync) that no Python-level inventory can see,
        # and those are exactly the components a Python-level scan would miss.
        env:
          SYFT_VERSION: v1.35.0
          SYFT_SHA256: 01d0d15aff461f1bc54d1716feb4824341918c4f37e1b6a5a0c0caee2251be67
        run: |
          set -euo pipefail
          digest=$(docker image inspect chemclaw:ci --format '{{ index .RepoDigests 0 }}' 2>/dev/null \
            || docker image inspect chemclaw:ci --format '{{ .Id }}')
          echo "image id/digest: ${digest}"
          echo "${digest}" > sbom-image-digest.txt
          # Pinned, and the pin is verified to resolve before it is used: `v1.9.2` does not exist
          # as a syft tag, and installing from a 404 failed this job with a bare `curl: (22)`
          # that named neither the tag nor the reason. `-f` alone turns a bad pin into an opaque
          # exit 22, so the check below says which tag is wrong.
          curl -sSfI "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            >/dev/null || { echo "syft pin ${SYFT_VERSION} does not resolve - fix SYFT_VERSION"; exit 1; }
          # Fetched to a file and checksummed before it is executed, rather than piped straight
          # into `sh`. A tag is not immutable — `anchore/syft` can move `v1.35.0` — and this script
          # runs as root on the runner that just built the shipped image. `curl | sh` also hides a
          # truncated download: a half-transferred script is a valid prefix that `sh` will happily
          # run. Update SYFT_SHA256 with SYFT_VERSION; a mismatch is meant to stop the build.
          curl -sSfL -o /tmp/syft-install.sh \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh"
          echo "${SYFT_SHA256}  /tmp/syft-install.sh" | sha256sum -c -
          sh /tmp/syft-install.sh -b /usr/local/bin
          # Both outputs from ONE scan, each written to a file. Two things were wrong with
          # `syft ... -o table | head -40`: it re-scanned the image (~3 minutes for a second copy
          # of the same answer), and `head` closes the pipe at line 40, so syft takes SIGPIPE and
          # `set -o pipefail` turns a *successful* SBOM into exit 141. The log preview reads from
          # the file, where nothing can close underneath it.
          syft chemclaw:ci -o spdx-json=sbom.spdx.json -o table=sbom-table.txt
          head -40 sbom-table.txt

      - name: Upload the SBOM
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chemclaw-sbom
          path: |
            sbom.spdx.json
            sbom-image-digest.txt
          retention-days: 90

      - name: An unknown component must fail loudly, not silently start something
        run: |
          set -euo pipefail
          status=0
          docker run --rm --user 1001 -e CHEMCLAW_COMPONENT=not-a-component chemclaw:ci || status=$?
          test "${status}" -eq 64 || {
            echo "expected exit 64 for an unknown component, got ${status}" >&2
            exit 1
          }

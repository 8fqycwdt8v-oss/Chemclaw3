[project]
name = "chemclaw"
version = "0.0.0"
description = "AI agent for pharmaceutical/chemical process R&D: LangGraph + Temporal + Agent Skills + a Markdown knowledge graph."
requires-python = ">=3.11"
# Runtime deps are added per phase, only when a module actually imports them
# (no speculative dependencies — see docs/adr/0001-python-runtime.md and CLAUDE.md).
dependencies = [
    # cheminfo pulls mordredcommunity, which bofire's feature models import
    # unconditionally (bofire.data_models.features.feature -> mordred); without it a
    # clean install fails to import bofire at all. optimization brings the BoTorch strategies.
    "bofire[optimization,cheminfo]>=0.4.1",
    # The cap was `<0.7` until 0.7's protocol had been read, because the `removal="0.7.0"` markers
    # meant an unpinned upgrade walked into a release that announces it removes API — and what this
    # repo reaches for there is the skills backend, which is where role-gated skill *visibility* is
    # enforced. It has now been read, diff by diff, and three things in it touch this tree: the
    # protocol gained a `delete` **write** verb that `agent/skill_backend.py` had no refusal for,
    # `grep` gained keyword-only `max_count`/`context_lines` that upstream *introspects* an override
    # for, and `FilesystemBackend.virtual_mode` now defaults to the `True` this repo already passes
    # explicitly. All three are handled there; the cap moves up a major rather than off, because the
    # argument for capping a 0.x package whose protocol is a security surface did not change.
    # (It also drags `langchain-google-genai` in as a hard requirement: ~22 MB of Google client and
    # `langsmith` that nothing here imports. That closure is a known cost of this dependency,
    # recorded rather than discovered in an image scan; the chart pins `LANGSMITH_TRACING` off so
    # the tracer cannot be switched on by ambient env.)
    "deepagents>=0.7.5,<0.8",
    # The *client* half of Phoenix, and only the client half (AG-13). `evals/phoenix.py` publishes
    # archived probe transcripts as a dataset plus one experiment per run; the server is a
    # container an operator runs, which is the licence line
    # `D-2026-08-11-a-model-call-is-a-span-and-phoenix-is-a-deployment` drew and this keeps:
    # `arize-phoenix-client` is **Apache-2.0**, only the server image is Elastic-2.0, so nothing
    # ELv2 enters this tree. Its closure is almost entirely already here — `httpx`,
    # `openinference-*`, `opentelemetry-sdk` — so it is a small addition rather than a platform.
    "arize-phoenix-client>=3.1",
    # Imported directly — `evals/live_judge.py` and `cli/mock_llm.py` name the provider SDKs' own
    # response types — so they are declared rather than relied on through the `langchain-*` wrappers
    # that happen to pull them today.
    "anthropic>=0.40",
    "openai>=1.60",
    "drfp>=0.3.7",
    "fastapi>=0.139.2",
    # HTTP client for the Entra token/OBO exchanges, the LLM provider seam, and the Nextflow
    # launcher. Declared explicitly: four first-party modules import it directly, so it is a
    # direct dependency, not merely transitive (via fastapi/mcp).
    "httpx>=0.28",
    # Declared, not left transitive, for the reason stated above `httpx`: eight first-party modules
    # import it directly — including `agent/session_store.py`, which uses `message_to_dict` /
    # `messages_from_dict` for the *durable* `session_messages` column. Its floor would otherwise be
    # whichever transitive constraint happened to be tightest, so dropping an unrelated `langchain-*`
    # package could silently relax the pin on the library that owns a durably-retained serialization.
    "langchain-core>=1.5.3",
    "langchain>=1.0",
    "langchain-anthropic>=1.5.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.4.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    # Capped on the `deepagents` argument above, transposed: this repository reaches into `mcp` for
    # a *protocol* — `connectors/server.py` patches `FastMCP._tool_manager.call_tool` twice, and one
    # of those two stacked patches is the per-call caller re-binding, a security property — so a
    # release that widens or renames that surface lands on a gate written against the old one. The
    # deepagents cap has already paid for itself once that way
    # (`docs/decisions/D-2026-08-12-the-cap-was-right-and-what-it-was-holding-back.md`: 0.7 added a
    # `delete` verb the skills gate did not refuse), and `mcp` was the same shape with no ceiling
    # at all.
    #
    # **The boundary is the next major, not the next minor, and that is the same rule not a weaker
    # one.** `<0.8` is deepagents' *major* boundary — a 0.x minor is where that project promises
    # breakage — and `<2` is this one's, because `mcp` is post-1.0 and versions accordingly. Held
    # against additive drift inside 1.x by the two things that already exist rather than by a
    # number that would need bumping every month: `uv.lock` pins the exact resolved version (1.28.1
    # today), and the ratchets in `tests/test_connector_transport.py` and
    # `tests/test_connector_identity.py` fail if either patched behaviour stops applying.
    "mcp>=1.2.0,<2",
    "networkx>=3.6.1",
    "numpy>=2.0",
    # The OpenTelemetry SDK + OTLP exporter that `chemclaw.core.logging.configure_telemetry` needs.
    # Not speculative and not optional: the shipped Helm chart sets `CHEMCLAW_OTEL_ENABLED: "true"`
    # (`deploy/helm/chemclaw/values.yaml`), and without these the front door and every Temporal
    # worker raise at startup and CrashLoopBackOff. gRPC (4317) matches the endpoint the chart
    # configures and the port its NetworkPolicy already opens.
    #
    # These two lines used to explain themselves by what the agent framework did or did not
    # resolve, and both halves of that reading are now void: `configure_telemetry` builds the
    # `TracerProvider`, the `BatchSpanProcessor` and the OTLP span exporter itself (no framework
    # bootstrap left to load them), and `opentelemetry-api` — which arrived transitively through
    # that framework — is a hard requirement of `opentelemetry-sdk`, so it survived the removal.
    # Every `opentelemetry.*` import in `src/` is covered by these two distributions plus their own
    # closure.
    # LLM-level spans, from `core.logging._instrument_llm_calls`. Apache-2.0, and that is worth
    # stating: Arize Phoenix — the backend that reads these conventions natively — is Elastic
    # License 2.0, but none of it is vendored here. This package emits OpenInference spans over
    # plain OTLP, so the backend is a deployment choice and the only thing entering this tree is
    # the instrumentation.
    #
    # Not speculative: it closes the two gaps the framework removal left behind, both of which
    # `docs/guides/runbook.md` records as regressions — there is no span for a model call, and
    # `chemclaw_*_tokens_total` carries `profile` rather than model. Its own closure adds
    # `opentelemetry-instrumentation`, `openinference-instrumentation` and
    # `openinference-semantic-conventions`, none of which any first-party module imports directly.
    "openinference-instrumentation-langchain>=0.1.70",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=2.2",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.8",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-frontmatter>=1.3.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "rdkit>=2026.3.4",
    "scikit-learn>=1.9.0",
    # Promoted from transitive (scikit-learn/bofire) to declared when `calc.xtb_opt` and
    # `calc.xtb_thermo` began importing it directly: the L-BFGS-B optimizer over tblite's
    # analytic gradient, and the null-space projection that separates a molecule's
    # vibrations from its translations and rotations.
    "scipy>=1.11",
    "sse-starlette>=3.4.5",
    "tblite>=0.7.0",
    "temporalio[pydantic]>=1.30.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
# Dev toolchain. `uv sync` installs these; `make` targets drive them.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260518",
    "scipy-stubs>=1.17.1.5",
    "hypothesis>=6.100",
    "mutmut>=3.0",
]

[project.scripts]
# Terminal front door for testing the agent (see src/chemclaw/cli/chat.py). `uv run chemclaw --admin`.
chemclaw = "chemclaw.cli.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package, so there is no list to keep in sync and nothing to silently omit. Before D-148 this
# was eighteen top-level names, and `connectors/` (the entire capability surface) and `templates/`
# were both missing from here and from coverage, and `service`/`sources` from `make type` — all
# silently, until `tests/test_packaging.py` was written to check the lists against the filesystem
# (D-117). The `src/` layout is what removes the class of bug rather than detecting it.
packages = ["src/chemclaw"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pragmatic-but-strict: correctness, bugs, imports, comprehensions, pyupgrade,
# plus mandatory docstrings (D) — CLAUDE.md requires a docstring on every module/function.
select = ["E", "F", "W", "I", "B", "C4", "UP", "D"]
# D203/D213 conflict with D211/D212; pick the modern (no blank line, summary-first) style.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts `Depends(...)`/`Security(...)` in argument defaults; it is
# evaluated once at startup and is the framework's documented pattern, so it is not the B008 footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Tests document behavior in their names; module/function docstrings are not required there.
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
# Fail loudly on a half-configured type environment rather than silently skipping.
warn_unused_configs = true
warn_redundant_casts = true

# Third-party packages that ship no type stubs, or only partial ones (e.g. rdkit.Chem.AllChem
# attrs are dynamic, which produces false attr-defined errors). Skip analysing them so their
# names are treated as untyped rather than scattering per-call ignores across the codebase.
[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "bofire.*",
    "pandas",
    "sklearn.*",
    "frontmatter",
    "networkx.*",
    "drfp",
    "openpyxl",
    "linear_operator.*",
    # The Snowflake client is not a dependency of this repository: the warehouse driver module is
    # imported only where a binding names it, on a deployment that installed the client (see
    # `chemclaw/ingest/eln/warehouse/README.md`). Listed so `mypy --strict` checks that module's own
    # code rather than failing on an import it is designed not to have.
    "snowflake.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Per-test wall-clock cap. A stuck test once ran for the full 6h Actions job timeout with zero
# diagnostic output — "cancelled", no test name, no traceback, a day's runner budget on one commit.
# The job-level `timeout-minutes` in the root workflow is the outer backstop; this is the inner one
# that names the offending test. 180s leaves real headroom: the slowest real test (a BO campaign in
# test_reizman.py) takes ~37s, and the whole suite finishes in minutes.
#
# The `signal` default (not `thread`) is deliberate: it fails the ONE hung test and lets the session
# continue, rather than `os._exit()`-ing the whole process — which matters because collection order
# is alphabetical, so a hang early on must not stop everything after it from running.
timeout = 180

# Coverage is opt-in via `make cov` (not the default `make test`, which stays fast and
# dependency-light). Measures the shipped packages — the same list as the wheel, enforced by
# `tests/test_packaging.py` — so what is measured is exactly what a deployment runs. The
# offline-skipped Temporal/Postgres paths are exercised in CI, so the CI number is the real one
# and is >= the offline number (running more tests only covers more). The root workflow runs
# `make cov` as a gate; before D-117 it did not, because the only workflow that did had been
# stranded at `services/chemclaw/.github/` where GitHub Actions never reads.
[tool.coverage.run]
branch = true
source = ["chemclaw"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Regression floor. Ratchet upward as coverage climbs; never lower it to make a red build pass —
# add the missing test instead.
#
# **Re-measured 2026-08-04 against a live Postgres: 85.30 %**, over 3,205 passing tests with the 22
# Temporal test-server files still skipped (CI runs those, so CI is higher). The floor moves 80 →
# 84, which is the first time it has moved: 80 was set against a much smaller tree and had stopped
# being a floor.
#
# The gap between 84 and 85.30 is deliberate headroom, not slack to spend. It is roughly one
# refactor's worth, so a legitimate change does not have to move this line in the same commit —
# and it is small enough that a genuine regression still trips it.
fail_under = 84

# Mutation testing (`make mutants`). Coverage says which lines ran; this says whether anything
# would have noticed them being wrong — the only question that distinguishes a test suite from an
# execution trace. The July pass did five mutations by hand and three of them survived their own
# test file, which is why this is configured rather than remembered.
#
# **Scoped to the invariant-bearing modules, not the tree.** A full-repository run is thousands of
# mutants over an hours-long suite, and most of them land in code where a surviving mutant means
# nothing (a log message, a docstring-shaped constant). These seven are where a silently-wrong
# answer is expensive: the authorization gate, the PR-gate and the note schema behind it, the
# calculation cache's identity, the budget guard, the durable audit sink, and `runner_trace.py` —
# which shipped a real defect on 2026-08-04 and is therefore the best available test of whether
# its own tests are any good.
[tool.mutmut]
source_paths = [
    "src/chemclaw/agent/authz.py",
    "src/chemclaw/agent/audit_store.py",
    "src/chemclaw/api/budget.py",
    "src/chemclaw/api/runner_trace.py",
    "src/chemclaw/kg/note.py",
    "src/chemclaw/kg/pr_gate.py",
    "src/chemclaw/science/calc/store.py",
]
# `also_copy` is what the mutant run sees besides the sources: mutmut copies the mutated files into
# `mutants/` and runs pytest there, so anything the suite reads has to come along. That is close to
# the whole repository and the list is deliberately explicit rather than "everything": this
# project's tests read the *tree itself* as data — `test_repo_map.py` walks every directory against
# `ARCHITECTURE.md`, `test_decision_log.py` reads `docs/decisions/`, `test_helm_chart.py` renders
# `deploy/`, and the validators read `data/`, `knowledge/` and `skills/`. Started from the four
# corpora and grew to this by running it: the first attempt died on `test_helm_chart.py` before a
# single mutant was tested.
also_copy = [
    "ARCHITECTURE.md",
    "CLAUDE.md",
    "Makefile",
    "README.md",
    "SECURITY.md",
    ".env.example",
    ".github",
    "data",
    "src",
    "deploy",
    "docs",
    "examples",
    "infra",
    "knowledge",
    "skills",
    "tasks",
]
# The suite twice over is the honest budget here. A mutant that merely makes a test *slow* is not
# killed by it, and the default multiplier declares a timeout a kill.
timeout_multiplier = 4.0
# **Which tests a mutant is run against, and why it is not "all of them".**
#
# The first attempt ran the whole suite and never reached a mutant. This repository's tests read the
# *source tree itself* as data — `test_repo_map.py` walks every directory against `ARCHITECTURE.md`,
# `test_docstring_paths.py` resolves every backticked module pointer, `test_deploy_chart.py` renders
# the chart — and mutmut works by copying a partial tree into `mutants/` and running pytest there.
# Those tests fail on the copy for reasons that have nothing to do with any mutant, and none of them
# could kill one in these seven modules anyway: a mutated branch in `authz.py` is invisible to a
# test that reads Markdown.
#
# So the selection is the tests that can actually kill these mutants. That also makes the run
# tractable — the full suite is ~4 minutes, and a mutant that has to pay it is a mutant not tested —
# and it is the scope DA-7 asks about: the July pass found 3 of 5 hand-made mutants surviving their
# own test file while dying under the whole suite, so "does a narrow run mislead?" is the question,
# and this is the narrow run.
#
# **DA-7's answer, measured: yes, and by a lot.** The first real run of `kg/note.py`,
# `kg/pr_gate.py` and `agent/audit_store.py` reported 39 survivors, of which **29 were killed by
# two test files this list did not name** — `test_relations.py` (24, every typed-link and
# `outgoing_*` mutant) and `test_metrics_bridge.py` (5, the whole `chemclaw_notes_proposed_total`
# increment). Both are now listed. The lesson is that "the tests that can kill these mutants" is a
# claim about the call graph, not about filenames: `test_relations.py` never says `note.py`, it
# builds a graph, and the graph is what calls `split_link`. A selection assembled by matching
# module names to test names will keep understating the suite, so a survivor from this list is a
# *hypothesis* to re-run against the full suite, never a finding
# (D-2026-08-08-a-survivor-is-a-hypothesis).
pytest_add_cli_args_test_selection = [
    "tests/test_authz.py",
    "tests/test_tool_authz.py",
    "tests/test_audit.py",
    "tests/test_audit_store.py",
    "tests/test_budget.py",
    "tests/test_concurrency_claims.py",
    "tests/test_runner.py",
    "tests/test_disconnect_teardown.py",
    "tests/test_note.py",
    "tests/test_note_proposals.py",
    # Kills 24 of `note.py`'s mutants on its own — every typed-link (`split_link`) and `outgoing_*`
    # one, including the 12 the previous list reported as covered by no test at all.
    "tests/test_relations.py",
    # Kills the five `record_metric(... "chemclaw_notes_proposed_total")` mutants in `pr_gate.py`:
    # it is the declared-metrics contract test, not a `pr_gate` test, which is why it was missed.
    "tests/test_metrics_bridge.py",
    "tests/test_properties_core.py",
    "tests/test_pr_gate.py",
    "tests/test_pr_gate_read_window.py",
    "tests/test_store.py",
    "tests/test_postgres_store.py",
]

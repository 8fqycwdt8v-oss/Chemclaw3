[project]
name = "chemclaw"
version = "0.0.0"
description = "AI agent for pharmaceutical/chemical process R&D: MAF + Temporal + Agent Skills + a Markdown knowledge graph."
requires-python = ">=3.11"
# Runtime deps are added per phase, only when a module actually imports them
# (no speculative dependencies — see docs/adr/0001-python-runtime.md and CLAUDE.md).
dependencies = [
    "agent-framework-anthropic>=1.0.0b260709",
    "agent-framework-core>=1.11.0",
    "agent-framework-openai>=1.0.0b260709",
    # cheminfo pulls mordredcommunity, which bofire's feature models import
    # unconditionally (bofire.data_models.features.feature -> mordred); without it a
    # clean install fails to import bofire at all. optimization brings the BoTorch strategies.
    "bofire[optimization,cheminfo]>=0.4.1",
    "drfp>=0.3.7",
    "fastapi>=0.139.2",
    # HTTP client for the Entra token/OBO exchanges, the LLM provider seam, and the Nextflow
    # launcher. Declared explicitly: four first-party modules import it directly, so it is a
    # direct dependency, not merely transitive (via fastapi/mcp/agent-framework).
    "httpx>=0.28",
    "mcp>=1.2.0",
    "networkx>=3.6.1",
    "numpy>=2.0",
    # The OpenTelemetry SDK + OTLP exporter that `chemclaw.logging.configure_telemetry` needs.
    # Not speculative and not optional: the shipped Helm chart sets `CHEMCLAW_OTEL_ENABLED: "true"`
    # (`deploy/helm/chemclaw/values.yaml`), and without these the front door and every Temporal
    # worker raise at startup and CrashLoopBackOff. Only `opentelemetry-api` came in transitively
    # via agent-framework, which is the import that resolves — the SDK and the exporter are what
    # `configure_otel_providers` actually loads. gRPC (4317) matches the endpoint the chart
    # configures and the port its NetworkPolicy already opens.
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=2.2",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.8",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-frontmatter>=1.3.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
    "rdkit>=2026.3.4",
    "scikit-learn>=1.9.0",
    # Promoted from transitive (scikit-learn/bofire) to declared when `calc.xtb_opt` and
    # `calc.xtb_thermo` began importing it directly: the L-BFGS-B optimizer over tblite's
    # analytic gradient, and the null-space projection that separates a molecule's
    # vibrations from its translations and rotations.
    "scipy>=1.11",
    "sse-starlette>=3.4.5",
    "tblite>=0.7.0",
    "temporalio[pydantic]>=1.30.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
# Dev toolchain. `uv sync` installs these; `make` targets drive them.
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0.12.20260518",
    "scipy-stubs>=1.17.1.5",
]

[project.scripts]
# Terminal front door for testing the agent (see agents/cli.py). `uv run chemclaw --admin`.
chemclaw = "agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Every first-party top-level package, not just `chemclaw`: the console entry point is
# `agents.cli:main` and the feature code lives across these siblings, so a non-editable
# `pip install` of the wheel must ship all of them or the `chemclaw` command and its imports
# break (audit ARC-1).
#
# This list, `[tool.coverage.run] source` below, and `make type` are all derived from the same
# rule and enforced against the filesystem by `tests/test_packaging.py` — because keeping them
# "in sync" by comment did not work: `connectors/` (the entire capability surface) and
# `templates/` were both missing from here and from coverage, and `service`/`sources` from
# `make type`, all silently (D-117).
packages = [
    "agents",
    "bo",
    "calc",
    "chemclaw",
    "connectors",
    "eln",
    "evals",
    "kg",
    "mcp_servers",
    "memory",
    "report",
    "safety",
    "scripts",
    "service",
    "sources",
    "templates",
    "workers",
    "workflows",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pragmatic-but-strict: correctness, bugs, imports, comprehensions, pyupgrade,
# plus mandatory docstrings (D) — CLAUDE.md requires a docstring on every module/function.
select = ["E", "F", "W", "I", "B", "C4", "UP", "D"]
# D203/D213 conflict with D211/D212; pick the modern (no blank line, summary-first) style.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts `Depends(...)`/`Security(...)` in argument defaults; it is
# evaluated once at startup and is the framework's documented pattern, so it is not the B008 footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Tests document behavior in their names; module/function docstrings are not required there.
"tests/*" = ["D100", "D103"]

[tool.mypy]
python_version = "3.11"
strict = true
# Fail loudly on a half-configured type environment rather than silently skipping.
warn_unused_configs = true
warn_redundant_casts = true

# Third-party packages that ship no type stubs, or only partial ones (e.g. rdkit.Chem.AllChem
# attrs are dynamic, which produces false attr-defined errors). Skip analysing them so their
# names are treated as untyped rather than scattering per-call ignores across the codebase.
[[tool.mypy.overrides]]
module = [
    "rdkit.*",
    "bofire.*",
    "pandas",
    "sklearn.*",
    "frontmatter",
    "networkx.*",
    "drfp",
    "openpyxl",
]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Per-test wall-clock cap. A stuck test once ran for the full 6h Actions job timeout with zero
# diagnostic output — "cancelled", no test name, no traceback, a day's runner budget on one commit.
# The job-level `timeout-minutes` in the root workflow is the outer backstop; this is the inner one
# that names the offending test. 180s leaves real headroom: the slowest real test (a BO campaign in
# test_reizman.py) takes ~37s, and the whole suite finishes in minutes.
#
# The `signal` default (not `thread`) is deliberate: it fails the ONE hung test and lets the session
# continue, rather than `os._exit()`-ing the whole process — which matters because collection order
# is alphabetical, so a hang early on must not stop everything after it from running.
timeout = 180

# Coverage is opt-in via `make cov` (not the default `make test`, which stays fast and
# dependency-light). Measures the shipped packages — the same list as the wheel, enforced by
# `tests/test_packaging.py` — so what is measured is exactly what a deployment runs. The
# offline-skipped Temporal/Postgres paths are exercised in CI, so the CI number is the real one
# and is >= the offline number (running more tests only covers more). The root workflow runs
# `make cov` as a gate; before D-117 it did not, because the only workflow that did had been
# stranded at `services/chemclaw/.github/` where GitHub Actions never reads.
[tool.coverage.run]
branch = true
source = ["agents", "bo", "calc", "chemclaw", "connectors", "eln", "evals", "kg", "mcp_servers", "memory", "report", "safety", "scripts", "service", "sources", "templates", "workers", "workflows"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Regression floor, set safely below the measured offline baseline (86% with the Postgres/Temporal
# tests skipped; CI runs those and is higher still). Ratchet upward as coverage climbs; never lower
# it to make a red build pass — add the missing test instead.
fail_under = 80

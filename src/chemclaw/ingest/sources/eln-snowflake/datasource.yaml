# The corporate ELN, read from Snowflake. Discovered but NOT enabled — `CHEMCLAW_DATA_SOURCES`
# decides that, and a deployment enables this only once its binding names its own real tables.
#
# **This file is the schema.** `chemclaw.ingest.eln.warehouse` contains no table and no column
# name; everything specific to a site lives in the `binding:` block below. Attaching the real
# warehouse is editing this file — or, better, mounting a folder holding your own copy of it and
# putting that folder first in `CHEMCLAW_DATA_SOURCES_DIR`, so the deployment's schema is not a
# change to this repository at all.
#
# The values here describe a plausible ELN and are exercised as a worked example by
# `tests/test_warehouse_manifest.py`, which resolves every path in it against a fixture row. They
# are not anyone's real schema and are meant to be replaced wholesale.
name: eln-snowflake
description: >-
  The corporate ELN in Snowflake: reactions with their charge and analytics tables, ingested to the
  knowledge graph through the PR-gate, plus similarity search over the per-reaction embedding that
  stays in the warehouse.

ingest: chemclaw.ingest.eln.warehouse.adapter:WarehouseElnAdapter
retrieve: chemclaw.ingest.eln.warehouse.retriever:WarehouseVectorRetriever

config:
  binding:
    connection:
      driver: chemclaw.ingest.eln.warehouse.snowflake:SnowflakeWarehouse
      # Environment variable NAMES. No credential is ever written into a manifest; the value is
      # read at connect time, so a rotated key is picked up by the next connection. Unprefixed
      # because these are the warehouse client's credentials, not settings of this application.
      account_env: SNOWFLAKE_ACCOUNT
      user_env: SNOWFLAKE_USER
      private_key_env: SNOWFLAKE_PRIVATE_KEY
      warehouse: RND_WH
      database: ELN_PROD
      schema: REACTIONS
      role: CHEMCLAW_READER
      query_timeout_seconds: 60

    ingest:
      entry:
        relation: V_REACTION
        key: REACTION_ID
        created_at: CREATED_TS
        # Declared so an amended run is re-ingested and the PR-gate shows the diff. Without it,
        # every correction a chemist makes after the fact is invisible to this system forever.
        modified_at: LAST_MODIFIED_TS
        where: "STATUS = 'COMPLETED'"
        fetch_limit: 500

      # Each block is one child table. Adding the site's next one — a workup log, a spectroscopy
      # table — is adding four lines here and nothing else, anywhere.
      related:
        - name: charges
          relation: V_REACTION_CHARGE
          foreign_key: REACTION_ID
          order_by: CHARGE_SEQ
        - name: analytics
          relation: V_REACTION_PURITY
          foreign_key: REACTION_ID
          order_by: PEAK_SEQ

      reaction:
        reaction_id: {path: root.REACTION_ID}
        project: {path: root.PROJECT_CODE}
        hypothesis: {path: root.OBJECTIVE}
        procedure_text: {path: root.PROTOCOL_TEXT}
        performed_at: {path: root.EXPERIMENT_DATE, transform: [{iso_date: {}}]}
        temperature_c: {path: root.TEMP_C, transform: [{number: {}}]}
        # The site records minutes; this schema is hours. A unit mismatch is a scale factor, not
        # a code change.
        time_h: {path: root.DURATION_MIN, transform: [{number: {}}, {scale: {factor: 0.0166666667}}]}
        # Rounding upstream puts the occasional 100.4 into a percentage column that this schema
        # bounds at 100. Clamping is the binding author's explicit choice to keep the row.
        yield_percent: {path: root.YIELD_PCT, transform: [{number: {}}, {clamp: {min: 0, max: 100}}]}
        purity_percent: {path: root.ASSAY_PCT, transform: [{number: {}}, {clamp: {min: 0, max: 100}}]}
        outcome_class:
          path: root.RESULT_FLAG
          transform:
            - value_map:
                map: {OK: success, FAIL: failure, ABORT: inconclusive, NA: inconclusive}
                default: inconclusive
        failure_reason: {path: root.FAILURE_NOTE}

      components:
        - from: charges
          # Older rows carry the structure in a different column than newer ones; the fallback is
          # what keeps the older half of the history mappable.
          smiles: {path: SMILES_STRUCTURE, fallback: {path: CANONICAL_SMILES}}
          role:
            path: MATERIAL_TYPE
            transform:
              - value_map:
                  map:
                    SM: reactant
                    REAG: reagent
                    SOLV: solvent
                    CAT: catalyst
                    PROD: product
          amount_mmol: {path: AMOUNT_MMOL, transform: [{number: {}}]}
          # The site charges in grams; this schema keeps milligrams.
          mass_mg: {path: AMOUNT_G, transform: [{number: {}}, {scale: {factor: 1000}}]}
          attributes: [LOT_NUMBER, SUPPLIER, EQUIVALENTS]

      impurities:
        - from: analytics
          name: {path: PEAK_NAME}
          smiles: {path: PEAK_SMILES}
          area_percent: {path: AREA_PCT, transform: [{number: {}}]}

      # Everything else the reaction row carried, carried through as the site labelled it. This is
      # what makes a column added to the warehouse next quarter visible with no change here.
      attributes:
        include: ["*"]
        exclude: [PROTOCOL_TEXT, FAILURE_NOTE, STATUS]
        max_fields: 30

      # Names the source, so two ELNs with colliding entry ids stay distinguishable in the graph.
      provenance: "eln-snowflake:${root.REACTION_ID}:${root.OPERATOR}"

    vector:
      relation: V_REACTION_EMBEDDING
      key: REACTION_ID
      vector_column: REACTION_VECTOR
      content_columns: [REACTION_SMILES, PROTOCOL_TEXT, PROJECT_CODE]
      metric: cosine
      # The query is embedded here and bound as a parameter, so the CI embedding provider works
      # unchanged. Switch to `server` when the warehouse owns the model that built the column.
      embedding: local
      filter_columns: {tag: PROJECT_CODE, since: CREATED_TS, until: CREATED_TS}
      # A reaction that already became a reviewed, merged note must not also arrive as a raw row —
      # the duplicate would read as corroboration.
      suppress_ingested: true

# Ranked full-text entry point into the note tree (F10-A), off by default like `vector`.
# Beats the graph retriever's plain substring test, which cannot rank and matches incidental
# substrings. Reads the same derived note index.
name: lexical
# One corpus, one vote: `graph`, `lexical` and `vector` are three rankers over the same note
# tree, so they fuse between themselves before meeting any other source. See
# `retrieval.hybrid.reciprocal_rank_fusion` and the manifest field's own description.
corpus: knowledge-notes
description: >-
  Ranked full-text search over the knowledge graph (Postgres FTS). Term matching with relevance
  ordering; requires the note index to have been built.

retrieve: chemclaw.retrieval.retrievers:LexicalRetriever

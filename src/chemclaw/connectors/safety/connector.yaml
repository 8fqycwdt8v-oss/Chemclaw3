# The cited-reference-table bundle: structural hazard screening, DNA-reactive genotoxicity alerts,
# and ICH Q3C/Q3D impurity limits.
#
# **This bundle is a declaration, not a server — we do not run it.** The capability lives in
# `Chemclaw3-mcp` as `servers/safety/`; what stays here is this manifest and the `safety-screening`
# skill beside it, per `D-2026-08-15-capability-moves-judgment-and-declaration-stay`. The manifest
# stays because `data/profiles/safety.yaml`, the eval probes, the skill and the agent's own prose
# name these three tools *by string*, and `chemclaw_agent.available_tool_names` builds the set four
# validators check against by reading manifests out of `connectors_dirs` — delete this file and
# `make skill-validate`, `prose-validate` and `template-validate` fail on references to tools that
# exist (the D-117 defect). The skill stays because a skill is layer 3: judgment about what an
# alert means, which is this repository's business and not a server's.
#
# **Its three tools are no longer privileged, and that is the point of the move**
# (`D-2026-08-15-safety-is-a-tool-not-a-gate`). Safety used to hold machinery no other capability
# had — a `kg-validate` gate, an eval metric with a 1.0 floor, its own CI validator, four settings.
# All of it is gone. What survives is the capability and the invariant its docstrings carry: the
# system flags, it never certifies.
#
# **The tool list below now exists in two repositories** — here and in that server's own
# `connector.yaml` — and nothing structurally forces them to agree. The server's copy is
# authoritative, because it is what actually answers; this one is what this repository validates
# against. **`make connector-validate` is not what catches a drift here** — it answers by
# importing the bundle's own `server/` module in-process, and this bundle ships none, so it
# reports these names as `unverified_tool_surfaces` and checks nothing. The two checks that do
# reach the server are `make live-template-args` (every template step's *arguments* against the
# running connector) and `Chemclaw3-mcp`'s own `assert_manifest_matches`.
name: safety
description: >-
  Cited safety and impurity reference tables, three separate questions kept separate: structural
  hazard screening of molecules and whole reactions (energetic and reactive motifs, plus dangerous
  combinations), DNA-reactive genotoxicity structural alerts, and ICH Q3C/Q3D limit lookup. Every
  answer is advisory and carries its citation; none is a clearance or a classification.

endpoint:
  transport: http
  # `Chemclaw3-mcp`'s `servers/safety`, port 8859. A loopback dev default; a cluster address is set
  # per deployment via CHEMCLAW_CONNECTOR_URLS, and `connectors.safety.url` in the chart.
  url: http://127.0.0.1:8859/mcp
  health_url: http://127.0.0.1:8859/healthz
  request_timeout: 30
  auth:
    # **Bearer, because the server on the other side enforces one.** `Chemclaw3-mcp`'s
    # `connector_app` checks the credential on `/mcp` itself, so `mode: none` here would not mean
    # "no auth needed" — it would mean every call is refused. The variable is named rather than
    # carried, read per request, and it is the same name the server reads.
    mode: bearer
    token_env: CHEMCLAW_SAFETY_TOKEN
  tools:
    - screen_hazards
    - screen_genotoxic_alerts
    - ich_impurity_limit
  # Three table lookups. They must stay open under an unapproved plan for a reason beyond
  # convenience: a hazard screen, an alert list and a published limit are exactly the checks a
  # chemist wants *before* deciding whether to approve the work.
  read_only:
    - screen_hazards
    - screen_genotoxic_alerts
    - ich_impurity_limit

skills:
  - safety-screening

# The cited-reference-table bundle. Its own bundle rather than part of a broader chemistry
# connector because it is separately governed: every one of its three tables is a curated,
# literature- or guideline-cited artifact, the `safety-screening` skill (bundled here) is the
# judgment about what each answer means and does not mean, and an auditor asking "what did the
# system say and on whose authority" should find one deployable unit to point at.
name: safety
description: >-
  Cited safety and impurity reference tables, three separate questions kept separate: structural
  hazard screening of molecules and whole reactions (energetic and reactive motifs, plus dangerous
  combinations), DNA-reactive genotoxicity structural alerts, and ICH Q3C/Q3D limit lookup. Every
  answer is advisory and carries its citation; none is a clearance or a classification.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8813/mcp
  health_url: http://127.0.0.1:8813/healthz
  request_timeout: 30
  auth:
    mode: none
  tools:
    - screen_hazards
    - screen_genotoxic_alerts
    - ich_impurity_limit
  # Three table lookups. They must stay open under an unapproved plan for a reason beyond
  # convenience: a hazard screen, an alert list and a published limit are exactly the checks a
  # chemist wants *before* deciding whether to approve the work.
  read_only:
    - screen_hazards
    - screen_genotoxic_alerts
    - ich_impurity_limit

skills:
  - safety-screening

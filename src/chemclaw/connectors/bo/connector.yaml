# Bayesian optimization, in both flavours the seam supports — which is why this bundle is the
# reference one. `suggest_next_experiment` is an inline MCP tool (one ask, sub-second); the campaign
# is a durable job whose workflow and worker this bundle owns, reached by type name on its own queue.
# `bofire`/`botorch` are loaded only in those two processes, never in the chat service.
name: bo
description: >-
  Bayesian optimization for experiment design: a one-shot "what should I run next" suggestion from
  the runs you already have, and a durable multi-round campaign that proposes, evaluates against a
  registered objective, and recommends conditions for a human to run.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8816/mcp
  health_url: http://127.0.0.1:8816/healthz
  request_timeout: 120
  auth:
    mode: none
  tools:
    - suggest_next_experiment
    - resume_campaign
    - generate_screening_design
    - campaign_progress
    - predict_outcome
  # `suggest_next_experiment` and `predict_outcome` both **featurize** a problem whose categoricals
  # carry structures, and `featurize_problem` runs xTB per option and upserts the results into
  # `calculation_results`. That is "spends resources or writes data" by this field's own definition,
  # and by the precedent the gate was built on: `compute_xtb_energy` is a `calc` endpoint tool
  # classified state_changing for spending exactly this, and `agent/authz.py` names it as the live
  # repro a narrower set would have missed. `suggest_next_experiment` additionally writes
  # `bo_campaigns` and `bo_suggestions` via `record_suggestion`.
  #
  # Both were listed read_only until a review traced the call chain. The comment here used to say
  # `predict_outcome` "records nothing", which was true only of the campaign tables and false of
  # the calculation cache — and the partition fails *open*, so a wrong "read" ships an ungated
  # spend that looks exactly like a gated one.
  state_changing:
    - suggest_next_experiment
    - predict_outcome
  # These three touch nothing: `resume_campaign` reads the campaign record back, and
  # `generate_screening_design` and `campaign_progress` never featurize — the first enumerates
  # corners, the second is pure arithmetic over the runs it is handed and asks no surrogate at all.
  read_only:
    - resume_campaign
    - generate_screening_design
    - campaign_progress

jobs:
  - name: start_optimization_campaign
    workflow: BoCampaignWorkflow
    summary: Start a durable multi-round Bayesian-optimization campaign; return its job id.
    description: >-
      Use this when the optimization needs *many* rounds of propose→evaluate against a computable
      objective and must survive restarts. For a single "what should I run next?" answer over
      observations you already have, use `suggest_next_experiment` instead — it answers inline.
      The campaign proposes candidates, evaluates them through the named objective, and opens its
      recommendation as a PR-gated note for human review.
    # The decision space nests discriminated feature kinds, which no inline parameter list can
    # express without losing exactly the structure the model needs — so the existing validated model
    # is referenced instead of re-declared.
    params_model: chemclaw.science.bo.problem:CampaignSpec
    # Two launch rules, in one function because a manifest names one. The round ceiling: Temporal
    # event history is finite and a campaign re-sends its whole observation history each round, so
    # history grows quadratically and past the ceiling the server terminates the run mid-flight,
    # losing every already-paid evaluation. And single-objective: the objective registry maps a name
    # to one scalar-returning callable, so a trade-off belongs on the inline tool. Both checked at
    # launch because that is the only replay-safe place (see `JobSpec.precondition`).
    precondition: chemclaw.science.bo.problem:require_campaign_startable
    expensive: true
    publish_to_graph: true

skills:
  - experiment-design

# Bayesian optimization, in both flavours the seam supports — which is why this bundle is the
# reference one. `suggest_next_experiment` is an inline MCP tool (one ask, sub-second); the campaign
# is a durable job whose workflow and worker this bundle owns, reached by type name on its own queue.
# `bofire`/`botorch` are loaded only in those two processes, never in the chat service.
name: bo
description: >-
  Bayesian optimization for experiment design: a one-shot "what should I run next" suggestion from
  the runs you already have, and a durable multi-round campaign that proposes, evaluates against a
  registered objective, and recommends conditions for a human to run.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8816/mcp
  health_url: http://127.0.0.1:8816/healthz
  request_timeout: 120
  auth:
    mode: none
  tools:
    - suggest_next_experiment
    - generate_screening_design
  # Both propose experiments and return them; neither runs one or writes anything. The campaign
  # that *does* persist state is the declared job below, which is gated by being a job.
  read_only:
    - suggest_next_experiment
    - generate_screening_design

jobs:
  - name: start_optimization_campaign
    workflow: BoCampaignWorkflow
    summary: Start a durable multi-round Bayesian-optimization campaign; return its job id.
    description: >-
      Use this when the optimization needs *many* rounds of propose→evaluate against a computable
      objective and must survive restarts. For a single "what should I run next?" answer over
      observations you already have, use `suggest_next_experiment` instead — it answers inline.
      The campaign proposes candidates, evaluates them through the named objective, and opens its
      recommendation as a PR-gated note for human review.
    # The decision space nests discriminated feature kinds, which no inline parameter list can
    # express without losing exactly the structure the model needs — so the existing validated model
    # is referenced instead of re-declared.
    params_model: chemclaw.science.bo.problem:CampaignSpec
    # Temporal event history is finite and a campaign re-sends its whole observation history each
    # round, so history grows quadratically with rounds: past the ceiling the server terminates the
    # run mid-flight and every already-paid evaluation is lost. Checked at launch because that is the
    # only replay-safe place (see `JobSpec.precondition`).
    precondition: chemclaw.science.bo.problem:require_campaign_within_ceiling
    expensive: true
    publish_to_graph: true

skills:
  - experiment-design

# The molecule-fingerprint capability: ECFP4 similarity and substructure search.
#
# The agent's surface is read/compute only: mutation goes through a job or a core PR-gate tool
# (D-029). The index is written by `ingest/eln/ingest.py` calling `FingerprintStore.add()` in
# process, under `ElnSyncWorkflow` — not over MCP. The server used to serve an `index_molecule`
# tool "for the ingestion path", which nothing called and no manifest declared, and because a
# connector authenticates nothing it was a write into the fingerprint corpus for anything that
# could reach the pod. `connector-validate` now refuses a served tool this file does not declare.
name: molfp
description: >-
  Molecule fingerprints over the indexed corpus: ECFP4 Tanimoto similarity search and SMARTS/SMILES
  substructure matching. Judgment about what similarity counts as precedent lives in the
  reaction-search skill (shared with rxnfp, so it belongs to neither bundle), not here.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8811/mcp
  health_url: http://127.0.0.1:8811/healthz
  request_timeout: 30
  auth:
    # **Bearer, and the token is this bundle's own `/mcp` credential — not the one core presents to
    # anything downstream.** `connectors/server.py`'s `BearerAuthMiddleware` reads the mode from this
    # manifest and refuses every MCP request without it, so `mode: none` here meant exactly what it
    # said: any process that could reach the pod could call the fingerprint index.
    # A NetworkPolicy selects peers, not paths, and it was the only thing in the way.
    #
    # The variable is named rather than carried, and read per request on both sides, so a rotated
    # secret takes effect without a restart. `_MCP_TOKEN` rather than `_TOKEN` because the shorter
    # name is a different hop for two of these bundles: `CHEMCLAW_CALC_TOKEN` is already the
    # credential *core* presents to the remote calc server (`core/config/calculators.py`), and a
    # name that means two hops is a name someone will eventually point at the wrong one.
    mode: bearer
    token_env: CHEMCLAW_MOLFP_MCP_TOKEN
  tools:
    - similar_molecules
    - substructure_matches
  # Searches over the fingerprint index; writing it is not an MCP capability at all.
  read_only:
    - similar_molecules
    - substructure_matches
  # Every one of them is a search over the record, so a turn that answered from one of
  # these looked at what we know — which is what `turn_costs.retrieval_calls` reports.
  knowledge_read:
    - similar_molecules
    - substructure_matches

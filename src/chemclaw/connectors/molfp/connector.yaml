# The molecule-fingerprint capability: ECFP4 similarity and substructure search.
#
# The agent's surface is read/compute only: mutation goes through a job or a core PR-gate tool
# (D-029). The index is written by `ingest/eln/ingest.py` calling `FingerprintStore.add()` in
# process, under `ElnSyncWorkflow` — not over MCP. The server used to serve an `index_molecule`
# tool "for the ingestion path", which nothing called and no manifest declared, and because a
# connector authenticates nothing it was a write into the fingerprint corpus for anything that
# could reach the pod. `connector-validate` now refuses a served tool this file does not declare.
name: molfp
description: >-
  Molecule fingerprints over the indexed corpus: ECFP4 Tanimoto similarity search and SMARTS/SMILES
  substructure matching. Judgment about what similarity counts as precedent lives in the
  reaction-search skill (shared with rxnfp, so it belongs to neither bundle), not here.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8811/mcp
  health_url: http://127.0.0.1:8811/healthz
  request_timeout: 30
  auth:
    mode: none
  tools:
    - similar_molecules
    - substructure_matches
  # Searches over the fingerprint index; writing it is not an MCP capability at all.
  read_only:
    - similar_molecules
    - substructure_matches

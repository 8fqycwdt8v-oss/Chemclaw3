# The reaction-fingerprint capability: DRFP similarity search over past reactions.
#
# The index is written in process by the ELN sync, never over MCP (see the `molfp` twin for the
# full note on the `index_reaction` tool that was served and declared nowhere). The agent's
# surface is read/compute only (D-029).
name: rxnfp
description: >-
  Reaction search over the indexed corpus: DRFP similarity for "have we run a transformation like
  this", and the faceted precedent search for the questions similarity cannot answer — which
  ligands, bases and solvents were used for a named reaction, what conditions worked for similar
  products, which reactions make a product matching a SMARTS, and how they were worked up. What
  counts as a precedent, and how to read a frequency table, is the bundled skills' judgment.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8812/mcp
  health_url: http://127.0.0.1:8812/healthz
  request_timeout: 30
  auth:
    # **Bearer, and the token is this bundle's own `/mcp` credential — not the one core presents to
    # anything downstream.** `connectors/server.py`'s `BearerAuthMiddleware` reads the mode from this
    # manifest and refuses every MCP request without it, so `mode: none` here meant exactly what it
    # said: any process that could reach the pod could call the reaction fingerprint index.
    # A NetworkPolicy selects peers, not paths, and it was the only thing in the way.
    #
    # The variable is named rather than carried, and read per request on both sides, so a rotated
    # secret takes effect without a restart. `_MCP_TOKEN` rather than `_TOKEN` because the shorter
    # name is a different hop for two of these bundles: `CHEMCLAW_CALC_TOKEN` is already the
    # credential *core* presents to the remote calc server (`core/config/calculators.py`), and a
    # name that means two hops is a name someone will eventually point at the wrong one.
    mode: bearer
    token_env: CHEMCLAW_RXNFP_MCP_TOKEN
  tools:
    - similar_reactions
    - substrate_precedent
    - conditions_for_similar_product
    - reagent_frequency
    - reactions_making_substructure
    - workup_precedent
  # Searches over the reaction and label indexes. Both are written elsewhere — the fingerprint by
  # the ELN sync, the labels by the background drain — so nothing here mutates and
  # `state_changing` stays empty (D-029, D-167: a tool in neither list refuses to load).
  read_only:
    - similar_reactions
    - substrate_precedent
    - conditions_for_similar_product
    - reagent_frequency
    - reactions_making_substructure
    - workup_precedent

# The calculators. Its own bundle because the calculation store is its dependency, and because a
# property calculation and a chat turn have nothing in common operationally — this is the capability
# most worth scaling on its own.
#
# **It no longer computes anything.** `D-2026-08-16-the-physics-leaves-the-cache-stays` moved the
# engines to `Chemclaw3-mcp`'s `servers/calc` as individually-keyed primitives; what runs here is the
# D-011 cache in front of them, the composition of the two tools that were never shipped whole
# (`compute_thermochemistry`, `predict_logd`), and the calibration ledger. The tool names, arguments
# and return shapes below are unchanged by that, deliberately — profiles, eval probes and skills name
# them by string.
#
# That server's own manifest must **not** go on `CHEMCLAW_CONNECTORS_DIR`: its seventeen primitives
# are orchestrator-facing, and a partial port would win the `calc` name collision and take the read
# tools declared below and every durable job off the agent's surface with no error.
#
# `report_measurement` writes, but to the *calibration ledger*, which is this capability's own store —
# not the knowledge graph, whose only agent-reachable write path remains the PR-gate in core.
name: calc
description: >-
  Fast cached property calculators: xTB single-point energy, predicted pKa and solubility, plus the
  calibration ledger that scores those predictions against measured values. Sub-second and cached,
  so a repeat call is free; the searches and profiles that are not sub-second run as durable jobs
  below. Every method here is semiempirical (GFN2-xTB via tblite, CREST) — there is no DFT tier.

endpoint:
  transport: http
  # A loopback dev default; a cluster address is set per deployment via CHEMCLAW_CONNECTOR_URLS.
  url: http://127.0.0.1:8815/mcp
  health_url: http://127.0.0.1:8815/healthz
  # The turn's own ceiling (`service_turn_timeout_seconds`), not the 60 s the other bundles use.
  # The inline tools here compose remote primitives the backend is allowed 900 s for
  # (`calc_server_timeout_seconds`), and a 60 s bound cancelled a running relaxation mid-primitive
  # on every real substrate — the work was killed before `cached_compute` could store it, so the
  # identical retry recomputed from zero. Each completed primitive is cached as it lands, so a
  # long wait here is productive; anything past the turn deadline is cancelled by the turn anyway.
  request_timeout: 600
  auth:
    # **Bearer, and the token is this bundle's own `/mcp` credential — not the one core presents to
    # anything downstream.** `connectors/server.py`'s `BearerAuthMiddleware` reads the mode from this
    # manifest and refuses every MCP request without it, so `mode: none` here meant exactly what it
    # said: any process that could reach the pod could call an xTB geometry optimization.
    # A NetworkPolicy selects peers, not paths, and it was the only thing in the way.
    #
    # The variable is named rather than carried, and read per request on both sides, so a rotated
    # secret takes effect without a restart. `_MCP_TOKEN` rather than `_TOKEN` because the shorter
    # name is a different hop for two of these bundles: `CHEMCLAW_CALC_TOKEN` is already the
    # credential *core* presents to the remote calc server (`core/config/calculators.py`), and a
    # name that means two hops is a name someone will eventually point at the wrong one.
    mode: bearer
    token_env: CHEMCLAW_CALC_MCP_TOKEN
  tools:
    - compute_xtb_energy
    - compute_electronic_properties
    - predict_site_reactivity
    - compute_atomic_descriptors
    - compute_surface_potential
    - optimize_geometry
    - compute_thermochemistry
    - predict_pka
    - predict_solubility
    - predict_logd
    - predict_developability_profile
    - calculator_trust
    - calculator_outliers
    - find_calculations
    - list_artifacts
    - fetch_artifact
    - report_measurement
  # Every tool is classified, and the manifest refuses to load if one is not (D-167): the harness's
  # plan gate refuses the state-changing ones under an unapproved plan, and getting that wrong by
  # omission would fail open.
  #
  # Everything below causes a real semiempirical calculation to be run and stored in
  # `calculation_results` — on a miss, now across a wire — except `report_measurement`, which
  # appends to the calibration ledger. A cache *hit* changes nothing, but the classification is of
  # the tool rather than of the call: which one a request turns out to be is not knowable until it
  # has already been made.
  state_changing:
    - compute_xtb_energy
    - compute_electronic_properties
    - predict_site_reactivity
    - compute_atomic_descriptors
    - compute_surface_potential
    - optimize_geometry
    - compute_thermochemistry
    - predict_pka
    - predict_solubility
    - predict_logd
    - predict_developability_profile
    - report_measurement
  # Reads the calibration ledger the tools above write, so a chemist can ask how far to trust a
  # prediction before deciding whether to authorize the work that depends on it.
  read_only:
    - calculator_trust
    # The residual listing behind that aggregate (D-169). It reads the same ledger and, like the
    # aggregate, is what a chemist consults *before* authorizing work — refusing it under an
    # unapproved plan would gate the check rather than the thing being checked.
    - calculator_outliers
    # A search over the job record (D-163) — it answers "has this already been run", which is
    # exactly the lookup a chemist makes *before* deciding whether to authorize an expensive run.
    - find_calculations
    # Reaching a finished calculation's by-products (D-165). Both read what a run already
    # produced; neither starts one.
    - list_artifacts
    - fetch_artifact

skills:
  - calculation-selection

# The expensive half of this capability. Each is the *same* tool a chemist used to call inline —
# same name, same arguments — now started as a durable run the launcher waits a moment for. Cheap
# requests still answer inside the turn; only the ones that genuinely take minutes come back as a
# job id. That replaced a predicted-cost threshold evaluated in the agent's process, which is what
# had kept `tblite`, RDKit and SciPy in the chat service's image (D-114).
#
# Every job below shares one workflow: `XtbJobSpec` is already a closed union discriminated on
# `kind`, so each job references its own member as `params_model` and the workflow dispatches on it.
# One durable path, one typed and separately-documented tool per job — which is what the model
# needs, because
# "compare these solvents" and "scan this bond" are different questions even when the machinery
# underneath is identical.
jobs:
  - name: compute_reaction_energy
    workflow: CalcJobWorkflow
    # Gated: this is one of the jobs the block header calls "the expensive half", so it
    # must require a privileged role via authz.expensive_actions — it was omitted, leaving
    # it launchable by any authenticated user (security review A8-F6).
    expensive: true
    inline_wait_seconds: 20
    summary: Compute the energy, enthalpy and free energy of a balanced reaction (GFN2-xTB).
    description: >-
      The composite that answers "does this go?". Every species is optimized the same way, in the
      same solvent, and — at `standard` level — given its own frequency calculation, so the
      comparison is internally consistent. List each species once per stoichiometric equivalent
      (two waters is ["O", "O"]). The equation must balance in atoms and charge; an unbalanced one
      is rejected rather than returning a difference that includes the missing atoms. Radicals
      written with explicit radical electrons ([CH3], [OH]) work, so homolysis and bond dissociation
      energies do too. A negative ΔG means products are favoured *at equilibrium* — it says nothing
      about rate, since there are no transition states here. Quote the reported uncertainty: a
      semiempirical reaction free energy is for comparing related reactions, not for a number in a
      report.

      A ΔG additionally needs `symmetry_numbers`: every species' rotational symmetry number, keyed
      by its exact SMILES — 1 for a molecule with no rotational symmetry, 2 for H2/N2/O2/CO2/water,
      3 for ammonia, 6 for ethane, 12 for benzene. A species left out of it has its entropy
      computed at sigma=1, and the job then reports no ΔG at all — naming that species — rather
      than one too high by R·ln(sigma). ΔE and ΔH do not depend on it and stand either way. It
      does not cancel across the arrow (any hydrogenation consumes H2, sigma=2), so state it
      whenever a free energy is what the question needs.
    params_model: chemclaw.connectors.calc.specs:ReactionJobSpec
    # ALPB is an implicit model with a *fixed* parameter set, so a solvent it has never heard of
    # cannot be approximated — it can only fail, and before this it failed ~30 s into the durable
    # job with tblite's own "String value for epsilon was not found among database of solvents".
    # Checking at launch turns that into a message the chemist can act on in the same turn. Every
    # job below that takes a solvent declares the same rule; see the module for the measured set.
    precondition: chemclaw.science.calc.solvents:require_supported_solvents

  - name: compare_solvents
    workflow: CalcJobWorkflow
    # Gated: this is one of the jobs the block header calls "the expensive half", so it
    # must require a privileged role via authz.expensive_actions — it was omitted, leaving
    # it launchable by any authenticated user (security review A8-F6).
    expensive: true
    inline_wait_seconds: 20
    summary: Rank candidate solvents for one reaction by their computed effect on ΔG.
    description: >-
      Runs the same reaction in each solvent and reports them ranked, so the answer is a comparison
      rather than a set of absolute numbers that would each carry the method's full error. Use it to
      narrow a solvent screen before bench time. The differences between solvents are more
      trustworthy than any single value; say so when reporting.

      Ranking by ΔG needs `symmetry_numbers` — the same species appear in every solvent, so one
      map covers the whole screen: every species' rotational symmetry number keyed by its exact
      SMILES, 1 for no rotational symmetry, 2 for H2/N2/O2/CO2/water, 3 for ammonia, 6 for ethane,
      12 for benzene. Omit it and no reaction reports a ΔG, so the screen falls back to ranking by
      electronic energy — which ignores solvation entropy, the part a solvent screen is about.
    params_model: chemclaw.connectors.calc.specs:SolventScreenJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents

  - name: scan_coordinate
    workflow: CalcJobWorkflow
    # Gated: this is one of the jobs the block header calls "the expensive half", so it
    # must require a privileged role via authz.expensive_actions — it was omitted, leaving
    # it launchable by any authenticated user (security review A8-F6).
    expensive: true
    inline_wait_seconds: 20
    summary: Relaxed scan along one internal coordinate (bond, angle or dihedral).
    description: >-
      Drives one coordinate through the requested values, re-optimizing everything else at each
      point — a conformational profile or a rotational barrier, not a reaction path. Give two atom
      indices for a bond, three for an angle, four for a dihedral (0-based, as RDKit numbers them).
      Pass a `structure_id` to scan from a conformer a search already found: a barrier depends on
      which conformer it is measured in, so re-embedding is a different question.
      The barrier it reports is an upper bound on the *ground-state* profile and is not a transition
      state.
    params_model: chemclaw.connectors.calc.specs:ScanJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents

  - name: profile_rotation
    workflow: CalcJobWorkflow
    # Gated: this is one of the jobs the block header calls "the expensive half", so it
    # must require a privileged role via authz.expensive_actions — it was omitted, leaving
    # it launchable by any authenticated user (security review A8-F6).
    expensive: true
    inline_wait_seconds: 20
    summary: Rotational profile about one named bond — its rotamers, and the barriers between them.
    description: >-
      Answers "which rotamer is it in, and can the two be separated?". Drives one torsion through a
      full period, releases each well into a real rotamer with its own structure_id, resolves each
      maximum finely, and reports the barrier between each adjacent pair in both directions with the
      half-life it implies.

      **Take `torsion` from `chem`'s enumerate_torsions and pass the entry through unchanged; never
      work the atom indices out.** An index is not a name — the same pair names an amide C-N in one
      way of writing a compound and a ring bond in another — so a hand-assembled torsion answers
      about a different bond. Say back which one you chose, by its label, before spending anything;
      if the chemist's words match several, ask.

      `quick` ranks rotamers by electronic energy, `standard` by free energy (a Hessian each),
      `thorough` adds one at each pass for a ΔG‡. Quote the half-life as the **range** the result
      carries, never its middle: Eyring is exponential, so the uncertainty spans two atropisomer
      classes. Ring bonds are refused — that question is sample_conformers.
    params_model: chemclaw.connectors.calc.specs:RotationJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents

  - name: sample_conformers
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Search a molecule's conformers, tautomers, protomers or deprotomers (CREST).
    description: >-
      The question behind "which form is it actually in?" — a Boltzmann-weighted ensemble rather
      than one arbitrary geometry. Needs the optional CREST binary; without it the job reports that
      the search is unavailable rather than silently returning a single conformer. Effort trades
      wall-clock for coverage; a search is never cheap, so expect a job id.

      Each conformer comes back as a `structure_id` with its population, not as coordinates, and
      that id is what carries the search forward: take `lowest_structure_id` (or any member's) to
      optimize_geometry, compute_thermochemistry, compute_electronic_properties or scan_coordinate
      and the next calculation runs on the conformer this search chose. Handing the SMILES on
      instead re-embeds the molecule and throws the search away.
    params_model: chemclaw.connectors.calc.specs:EnsembleJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    # A CREST search is the one genuinely costly thing in this bundle — minutes of saturated
    # CPU, and unlike the xTB tasks its cost is not bounded by the input's size. So it carries
    # the role gate that used to sit on `run_xtb_task`, the expert escape hatch the typed jobs
    # below replaced: that gate existed for exactly this, an unbounded calculation, and dropping
    # it with the tool would have been a silent loosening. It did not in fact inherit anything —
    # `run_xtb_task`'s gate was `DEFAULT_WRITE_TOOL_GATES` membership, which went with the tool,
    # and `expensive: true` authorized nothing at all until `authz.expensive_actions` derived the
    # gate's set from these declarations.
    expensive: true

  - name: predict_pka_ensemble
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: pKa from sampled conformers and every protonation microstate (CREST + GFN2-xTB).
    description: >-
      A different calculation from `predict_pka`, not a more accurate one. CREST removes (or adds)
      every proton in turn and ranks the products, so the site is decided by energy rather than by
      a structural rule, and both macrostates are summed over their populated microstates. Minutes
      to hours; expect a job id.

      **Measured over the same 31 reference compounds it is level with `predict_pka` on error and
      ranks slightly worse**, for two metadynamics searches against a cached millisecond lookup.
      Choose it when the *site* is the question — a polyfunctional molecule, a proton no rule
      offers (imide, sulfonamide, C-H), or where the number of populated microstates is the
      finding. For a value, or to rank analogues, use `predict_pka`.

      Reports `site_smiles` and how many microstates lie within RT. Read `warnings` first: the
      aliphatic-amine limit is unchanged (it is the solvent model, not the enumeration) and this
      job warns where `predict_pka` refuses. Load `ionization-and-partitioning` before using it.
    params_model: chemclaw.connectors.calc.specs:MicrostatePkaJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    # Two CREST searches, so the same unbounded-cost gate the other sampling jobs carry.
    expensive: true

  - name: compute_interaction_energy
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Non-covalent interaction energy between two molecules (CREST NCI search + xTB).
    description: >-
      Answers "do these two associate, and how strongly?" — salt formation, co-crystals,
      host-guest binding, solvent-solute association. Searches complex geometries rather than
      assuming one, then reports the interaction energy of the best. Semiempirical and in continuum
      solvent, so treat it as a ranking between candidate partners, not an absolute binding energy.
    params_model: chemclaw.connectors.calc.specs:ComplexJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    # A CREST search is the one genuinely costly thing in this bundle — minutes of saturated
    # CPU, and unlike the xTB tasks its cost is not bounded by the input's size. So it carries
    # the role gate that used to sit on `run_xtb_task`, the expert escape hatch the typed jobs
    # below replaced: that gate existed for exactly this, an unbounded calculation, and dropping
    # it with the tool would have been a silent loosening. It did not in fact inherit anything —
    # `run_xtb_task`'s gate was `DEFAULT_WRITE_TOOL_GATES` membership, which went with the tool,
    # and `expensive: true` authorized nothing at all until `authz.expensive_actions` derived the
    # gate's set from these declarations.
    expensive: true

  # --- the multi-step protocols ---------------------------------------------------------------
  #
  # Each of these is a **fan-out**, which is why they are jobs and not templates: a template
  # has deliberately no loops, and the agent's own loop is iteration-capped, so "once per tautomer"
  # and "once per bond" fit neither. The loop lives in the job spec; a template sequences these.
  #
  # Each counts its cost before it starts (`science/calc/budget.py`) and refuses above
  # `calc_max_primitive_calls` with the count in the message. That refusal is a `ValueError`, which
  # `BAD_DATA_RETRY` treats as non-retryable, so an over-budget request fails in the first second
  # rather than three times over four hours.

  - name: refine_ensemble
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Re-weight a conformer ensemble by free energy instead of by electronic energy.
    description: >-
      The populations `sample_conformers` reports are Boltzmann weights over *electronic* energies,
      which assumes every conformer has the same zero-point, thermal and entropic contribution. For
      the molecules a conformer search is worth running on that is exactly wrong: a compact,
      hydrogen-bonded fold has both a low electronic energy and a stiff set of low modes, so it is
      over-populated by E alone. This optimizes and takes a Hessian for each of the lowest members
      and weights them by G.

      It is a different treatment, not a better one, and it costs one Hessian per member — minutes
      each on a drug-sized molecule. So it refines the top `top_n` only, and the result reports
      `refined_population_covered`: the share of the ensemble population those members carry. Below
      about 90% it warns, and you should say so when reporting — "free energies over 5 of 47
      conformers" is a different claim from "the ensemble", and the free energy is the one that
      looks more careful.

      Use it when a population is the answer (which tautomer, which rotamer, how much of the folded
      form) rather than when a geometry is. For a geometry, `sample_conformers` already gives you
      the lowest member's structure_id.
    params_model: chemclaw.connectors.calc.specs:RefinedEnsembleJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    expensive: true

  - name: compute_ensemble_property
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Boltzmann-average a property over a molecule's populated conformers.
    description: >-
      Lifts the caveat under every other number here. A dipole, a HOMO-LUMO gap, a partial-charge
      set or a Fukui ranking computed once describes **one** conformer — whichever geometry was
      embedded — and for a flexible molecule those quantities can differ more between two of its own
      populated shapes than between two different molecules. This computes the property at each
      member's own geometry and weights by population.

      **Read the spread, not only the mean.** The result carries the minimum and maximum as well.
      When the values scatter across the ensemble by more than the difference you are using the
      number to argue, the honest report is that the molecule does not have one value of this
      property at this temperature — reporting the mean alone turns that into a false precision
      that reads exactly like a measurement.

      `prop="fukui"` and `prop="charges"` are per-atom and come back per atom; the rest are single
      values. Needs the conformer search first, so expect a job id.
    params_model: chemclaw.connectors.calc.specs:EnsemblePropertyJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    expensive: true

  - name: rank_species
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Rank tautomers, protonation microstates or stereoisomers by free energy.
    description: >-
      One job for the three questions that are the same arithmetic over different species sets:
      which tautomer dominates, which protonation microstate is present, which diastereomer is
      favoured. Set `ranking` to say which you are asking — the number means something different in
      each, and a reader should not have to infer it from the SMILES.

      **Enumerate first; this does not.** Use `chem`'s enumerate_tautomers,
      enumerate_protonation_states or enumerate_stereoisomers to build the list. That split is not
      bookkeeping: a form that is not in `species` was not ranked, so a distribution over an
      incomplete enumeration is confident about the wrong universe. The result reports how many it
      was given.

      The tautomer case has the widest blast radius of anything in this bundle. A pKa, a Fukui
      ranking, a dipole and a reaction free energy all describe whichever tautomer was drawn; if
      that is the minor form, none of them is a number about the compound. A gap above ~3 kcal/mol
      is a real answer; a small gap is also an answer, and a more important one — both forms are
      present and any property that differs between them is not a single number.

      `level="quick"` ranks by electronic energy and says so in a warning; `standard` adds a Hessian
      per species for a free energy; `thorough` adds a conformer search per species and is the
      expensive case.
    params_model: chemclaw.connectors.calc.specs:SpeciesRankingJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    expensive: true

  - name: rank_species_across_solvents
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Rank the same tautomers, microstates or stereoisomers in several solvents at once.
    description: >-
      `rank_species` answers in one medium, so "which tautomer dominates in water against toluene"
      was a job per solvent and a comparison assembled by hand. This runs the ranking in each
      solvent plus the gas phase and reports how it moves — the shift, rather than absolute
      distributions each carrying the method's full error. It is what implicit solvation is best at:
      every medium ranks the same species, so the continuum model's systematic error largely
      cancels in the relative energies.

      **Lead with `dominance_changes`.** A ranking that reorders between media is a different claim
      from one that merely shifts: a pKa, a Fukui ranking and a dipole all describe whichever form
      was drawn, so a solvent that changes the major form changes what all of them are about. Read
      `largest_swing_kcal` against `uncertainty_kcal` — inside it, the media were not distinguished.
      In `responses`, read the energy swing rather than the population swing, which looks large near
      50% and small at the ends however far the energy moved.

      **Enumerate first; this does not** — use `chem`'s enumerate_tautomers,
      enumerate_protonation_states or enumerate_stereoisomers. A form not in `species` was not
      ranked in any medium. Cost is species x media, checked before the first calculation.
    params_model: chemclaw.connectors.calc.specs:SpeciesSolventScreenJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    expensive: true

  - name: survey_bond_strengths
    workflow: CalcJobWorkflow
    inline_wait_seconds: 20
    summary: Rank a molecule's bonds by how much energy it costs to break each one.
    description: >-
      Answers "which bond breaks first" — the question behind autoxidation liability,
      hydrogen-atom-transfer selectivity and a forced-degradation study design. Each bond is one
      balanced reaction, parent on the left and its two radical fragments on the right, so the
      arithmetic and the open-shell handling are the ones the reaction job already uses.

      **Enumerate first** with `chem`'s enumerate_bond_cleavages, which writes the fragments with
      explicit radical electrons ([CH3], [H]) — that is what makes the multiplicity derivable and
      the homolysis computable without a declared spin state. It skips ring bonds, because breaking
      one of those gives one fragment and its energy is a ring-opening rather than a dissociation.

      **The ordering is the answer; the magnitudes are not.** Semiempirical bond dissociation
      energies carry several kcal/mol of error — enough that a number should never be quoted as a
      BDE, and little enough that the ranking within one molecule is informative. Defaults to
      `level="quick"` for that reason: a Hessian per fragment per bond triples the cost for a
      magnitude the method does not deliver.
    params_model: chemclaw.connectors.calc.specs:BondSurveyJobSpec
    precondition: chemclaw.science.calc.solvents:require_supported_solvents
    expensive: true

  - symbol: Cd
    name: Cadmium
    element_class: "1"
    oral_pde_ug_per_day: 5
    parenteral_pde_ug_per_day: 2
    inhalation_pde_ug_per_day: 3
  - symbol: Pb
    name: Lead
    element_class: "1"
    oral_pde_ug_per_day: 5

# ICH Q3C residual-solvent classes and limits — a transcription, not a model.
#
# Data, not code, for the same reason `rules.yaml` is: a number a regulatory-affairs or
# process-safety reader can check against the source document in a pull request. The difference
# from `rules.yaml` is *who owns it*. A site extends the hazard rule table with its own knowledge;
# nobody has their own Q3C. These values are fixed by the published guideline, which is why the
# path to this file is not a configuration knob (see `science/safety/ich.py`).
#
# Provenance: transcribed from ICH Q3C(R9), "Impurities: Guideline for Residual Solvents",
# ICH Step 4 / minor revision, 2024 — Table 1 (Class 1), Table 2 (Class 2), Table 3 (Class 3).
#
# **The revision label is the one field nobody has checked against the source**, and it is on every
# row's citation, so if "R9 / 2024" is wrong the whole file cites the wrong document while every
# number in it is right. An adversarial review verified all 62 values and could not verify this;
# it is a backlog row rather than a silent assumption. Check it against the ICH site and correct
# `guideline:` below in a pull request — one line, and it does not touch a single figure.
# Concentration limits for Class 2 are the guideline's own Option 1 figures, computed from the PDE
# at a 10 g/day maximum daily dose (ppm = PDE in mg/day x 100); every row below satisfies that
# identity, which is the cheapest check a reviewer can run over the whole table.
#
# **Deliberately not transcribed**, and why. `tert`-butyl alcohol has a PDE assigned by Q3C(R8) that
# the transcriber could not verify against the source document. It is omitted rather than guessed:
# a lookup miss is honest and says "check the guideline", while a wrong PDE is exactly the failure
# this file exists to end. Add it in a pull request with the source page in the description.
#
# Water is not here because Q3C does not cover it — a miss is the correct answer for water.
#
# Adding a row: give the guideline's own spelling as `name`, add whatever a chemist actually types
# as `synonyms` (the lookup also resolves abbreviations and SMILES through `core/reagents.py`,
# so a synonym is only needed where that table's preferred name differs from the guideline's), and
# keep the ppm/PDE identity above intact.
#
# **An ambiguous abbreviation is not a synonym.** `EDC` (ethylene dichloride, but also the
# carbodiimide in the reagent table), `DMA` (dimethylacetamide, dimethylamine, dimethylaniline) and
# `TCE` (three different chlorinated solvents) are deliberately absent: a confidently wrong row
# arrives with a real citation attached, which is worse than the miss it replaces.

guideline: "ICH Q3C(R9), Impurities: Guideline for Residual Solvents, ICH Step 4 (2024)"

classes:
  "1":
    table: Table 1
    meaning: >-
      Class 1 — solvents to be avoided: known human carcinogens, strongly suspected human
      carcinogens, and environmental hazards. Use only where strongly justified by a
      risk-benefit assessment.
  "2":
    table: Table 2
    meaning: >-
      Class 2 — solvents to be limited: non-genotoxic animal carcinogens, or agents of other
      irreversible toxicity such as neurotoxicity or teratogenicity.
  "3":
    # Table 3 is a *list of names* with no numeric column. The two figures below are the
    # guideline's general Class 3 statement, and they are a floor ("50 mg or more per day"), not a
    # per-solvent assignment — so they are labelled as such on every row rather than being quoted
    # as though Q3C had assigned this solvent a PDE.
    table: Table 3 (the Class 3 solvent list; the figures are the general Class 3 statement)
    meaning: >-
      Class 3 — solvents with low toxic potential: no health-based exposure limit is needed, and
      50 mg/day or less (5000 ppm at a 10 g daily dose) is acceptable without justification.
    pde_basis: Class 3 general limit — Q3C assigns no solvent-specific PDE; 50 mg/day or more
      is acceptable without justification
    concentration_basis: Class 3 general limit at a 10 g daily dose — not a solvent-specific value

solvents:

# Hazard screening rule table (D-080).
#
# Data, not code: a process-safety chemist edits this file without touching Python. Each rule is a
# SMARTS pattern for a structural motif with a well-documented hazard, a severity, an explanation
# written for the person reading the flag, and a citation so the flag can be traced to a source.
#
# Scope, deliberately narrow: these are *structural alerts*, not a hazard assessment. Absence of a
# flag means "no rule in this table matched" — never "safe". Toxicity, exposure limits, regulatory
# classification, scale effects, and process conditions are all out of scope; they need an SDS and
# a human. Adding a rule: keep the SMARTS as specific as the motif allows (a broad pattern that
# flags half the corpus is worse than no rule — it teaches people to ignore flags), and add a test
# in tests/test_safety.py pinning one molecule that must match and one that must not.
#
# **One reference molecule is not enough when the rule's own words say "multiple", "poly",
# "adjacent" or "on one ring".** Those semantics are counts and relative positions, and a single
# pinned example fixes one arrangement of them: `polynitro-aromatic` shipped matching only
# 1,2-dinitroarenes, and both the unit test and the eval case pinned 1,2-dinitrobenzene, so TNT
# and picric acid screened clean under a green test suite. Such a rule needs a pinned molecule per
# arrangement it claims to cover.
#
# severity: high   — energetic / shock- or friction-sensitive motifs; do not scale without review
#           medium — reactive motifs with well-known incident histories; handle with named controls
#           low    — worth noticing in a procedure; routine controls usually suffice

structural:
  - id: organic-azide
    smarts: "[#6][N;X2]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Organic azide: energetic and potentially shock-sensitive, especially at low carbon-to-nitrogen
      ratio. Avoid isolating neat; screen for the (C+O)/N rule of six before scaling.
    citation: "Bräse et al., Angew. Chem. Int. Ed. 2005, 44, 5188 (organic azides)"

  - id: non-carbon-azide
    # The azide unit with nothing carbon on it. `organic-azide` and `acyl-azide` both open on
    # `[#6]`, so every azide that is not carbon-bound fell through both: the salt (RDKit sanitizes
    # NaN3 to two one-coordinate N- atoms, matching neither X2 pattern), hydrazoic acid, and the
    # silyl/phosphoryl azide transfer reagents. Written as "terminal N not bonded to carbon" rather
    # than as a list of counter-cations, so it fires on the motif however a source spells the
    # reagent. Cannot double-fire with the two carbon rules: on an organic azide the only
    # non-carbon terminal nitrogen is the far one, and reading inward from it the third atom is
    # X2, not X1-.
    smarts: "[N;!$([N][#6])]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Azide not bonded to carbon — an azide salt, hydrazoic acid, or a silyl/phosphoryl azide
      reagent. Acutely toxic and energetic. Never acidify (releases volatile, explosive HN3), keep
      away from copper, lead and silver plumbing and from dichloromethane, and do not evaporate to
      dryness. Azide waste needs its own stream.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., metal azides / hydrogen azide"

  - id: acyl-azide
    smarts: "[CX3](=[OX1])[N;X2]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Acyl azide: thermally labile (Curtius rearrangement releases N2) and more sensitive than a
      simple alkyl azide. Generate and consume in situ; do not concentrate or store.
    citation: "Bräse et al., Angew. Chem. Int. Ed. 2005, 44, 5188"

  - id: diazo
    smarts: "[#6;!$(C=O)]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Diazo compound: energetic, light- and shock-sensitive, and typically toxic. Handle in solution
      behind a shield; never distil to dryness.
    citation: "Green et al., Org. Process Res. Dev. 2020, 24, 67 (diazo handling)"

  - id: diazonium
    smarts: "[#6][N;X2+]#[N;X1]"
    severity: high
    explanation: >-
      Diazonium salt: explosive when dry, particularly with non-coordinating counterions. Keep in
      cold solution and use directly; do not isolate the solid.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., diazonium salts"

  - id: peroxide
    # `[OX1-]` as well as `[OX2]`: an inorganic peroxide salt writes its oxygens as
    # one-coordinate anions (Na2O2 is `[O-][O-].[Na+].[Na+]`), so the two-coordinate-only
    # pattern screened sodium peroxide clean — a strong solid oxidiser, silent.
    smarts: "[OX2,OX1-][OX2,OX1-]"
    severity: high
    explanation: >-
      Peroxide linkage: energetic and prone to violent decomposition on heating, friction, or metal
      contamination. Test for peroxides before distillation and never evaporate to dryness.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., peroxides"

  - id: nitrate-ester
    smarts: "[#6][OX2][NX3+](=[OX1])[OX1-]"
    severity: high
    explanation: >-
      Nitrate ester: a classic energetic motif — shock- and heat-sensitive. Treat as explosive
      unless proven otherwise for the specific compound and scale.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., nitrate esters"

  - id: polynitro-aromatic
    # One nitro group on an aromatic carbon, *counted* (`min_matches`) rather than drawn. A
    # substructure boolean cannot express "two of these", so the previous pattern wrote the ring
    # out — `...c1ccccc1...` — which hangs the second nitro off the ring-closure atom and therefore
    # matched **ortho only**. TNT, picric acid, tetryl, 2,4-DNT and both the meta and para
    # dinitrobenzenes all screened clean; 1,2-dinitrobenzene, the single molecule the unit test and
    # the eval case pinned, matched. Enumerating the arrangements instead (ortho + meta + para)
    # would only push the same mistake onto the next ring size and every fused system.
    #
    # One behaviour change, stated rather than hidden: two nitro groups on *different* rings of a
    # biphenyl now flag, because the count is over the molecule rather than over one ring. That is
    # a conservative false positive in a hazard screen — a reviewer reads one extra advisory line,
    # instead of a nitration procedure reading clean — which is the correct direction of error.
    smarts: "[$([NX3](=[OX1])=[OX1]),$([NX3+](=[OX1])[OX1-])][c]"
    min_matches: 2
    severity: high
    explanation: >-
      Polynitroaromatic: two or more nitro groups on aromatic carbons is the archetypal explosive
      motif (oxygen balance approaching zero). Assess energetic hazard before any scale-up or
      heating.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., polynitroaryl compounds"

  - id: perchlorate
    # `~` (any bond): RDKit sanitizes perchlorate to the charge-separated [O-][Cl+3]([O-])([O-])O
    # form, so a double-bond pattern never matches a parsed molecule.
    smarts: "[Cl;X4](~[OX1,OX2H1])(~[OX1,OX2H1])(~[OX1,OX2H1])~[OX1,OX2H1]"
    severity: high
    explanation: >-
      Perchlorate: a strong oxidizer that forms explosive mixtures with organic matter, and whose
      organic salts can detonate. Keep rigorously separate from fuels and reducing agents.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., perchlorates"

  - id: hydrazine
    # H is required on *one* nitrogen, not both. Demanding it on both excluded every
    # N,N-disubstituted hydrazine — 1,1-dimethylhydrazine (UDMH) among them — which is the
    # opposite of the intended scope.
    #
    # Azo and diazo systems are excluded by *coordination*, not by an aryl guard: an azo nitrogen
    # is `NX2`, which `[NX3,NX4+]` cannot match. An earlier `!$(N[a])` here was documented as what
    # kept them out and measurably did not — azobenzene screened False with the guard and False
    # without it, for both the aryl and the alkyl case (azoxybenzene, DEAD, azo-tert-butane). Its
    # only measured effect was on hydrazines: it silenced 1,2-diphenylhydrazine (hydrazobenzene, a
    # routine nitrobenzene-reduction product and benzidine-rearrangement precursor) and
    # 1-methyl-1-phenylhydrazine, and it bit only when *both* nitrogens were aryl-bound, since
    # with one the match is found from the other direction. Removed; the class it named is covered.
    #
    # `NX4+` beside `NX3`: protonating a hydrazine is what a catalogue does to it, and the salt
    # is the ordinary bench form — hydrazine monohydrochloride and hydrazine sulfate carry an
    # `NX4+` nitrogen and so screened clean, the same shape of miss the anionic peroxide and the
    # anionic N-halamine were. An ammonium or amine salt has no N-N bond, and an acylated one is
    # still excluded as a hydrazide.
    #
    # Measured over 106 structures — the 61 distinct structures of the reagent identity table plus
    # 45 hand-picked hydrazine-adjacent and nitrogen-bearing bench reagents — exactly five
    # molecules change verdict across both rules, every one of them a hydrazine: hydrazobenzene
    # and 1-methyl-1-phenylhydrazine gain the structural rule (the aryl guard), and UDMH,
    # N-aminopiperidine, N-aminomorpholine and 1-methyl-1-phenylhydrazine gain the pair arm (the H
    # asymmetry). Nothing moves in the false-positive direction: no amine, ammonium, hydroxylamine,
    # urea, azo, hydrazone or acyl/carbamoyl hydrazide changes, and tetramethylhydrazine stays out
    # for want of N-H. The identity table alone cannot check any of this and must not be cited as
    # if it could — it contains no hydrazine in any form (its only N-N structures are two azides
    # and the triazole of TBTU/HATU), so *zero* of its structures change verdict under any of them.
    smarts: "[NX3,NX4+;!$(NC=O)][NX3,NX4+;H3,H2,H1;!$(NC=O)]"
    severity: medium
    explanation: >-
      Free hydrazine motif: toxic, a suspected carcinogen, and a strong reductant that forms
      energetic mixtures with oxidizers. Contained handling and dedicated waste stream.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., hydrazines"

  - id: n-halamine
    # `X2-` as well as `X3`: a sulfonamide-derived N-halamine salt carries an anionic,
    # two-coordinate nitrogen (chloramine-T), so the X3-only pattern missed the commonest
    # bench example of the class it is named for.
    smarts: "[#7;X3,X2-][F,Cl,Br,I]"
    severity: medium
    explanation: >-
      N-halogen bond: thermally unstable and a known initiator of runaway halogenations. Keep cold,
      exclude light and metals.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., N-haloamines"

# Pairwise incompatibilities checked across a *reaction's* components: each rule fires when at
# least one component matches `left` and a different component matches `right`.
incompatible_pairs:
  - id: oxidizer-with-reductant
    # The peroxide arm is `[OX2,OX1-][OX2,OX1-]`, the same widening the structural `peroxide`
    # rule carries and for the same molecule: an inorganic peroxide salt writes its oxygens as
    # one-coordinate anions, so the two-coordinate-only form left `Na2O2 + NaBH4` raising only
    # `peroxide` where `H2O2 + NaBH4` raised this rule as well. A rule and its structural twin
    # must be widened together — half a fix reads exactly like a clean screen.
    #
    # The hydrazine arm is the `hydrazine` structural rule's SMARTS *verbatim*, and must stay that
    # way — `tests/test_safety.py::test_the_hydrazine_pair_arm_is_its_structural_twin_verbatim`
    # pins the two strings equal. Carrying its own spelling is what produced this rule's last two
    # defects: it gained `NX4+` (hydrazine is weighed as its hydrochloride or sulfate, whose
    # protonated nitrogen is `NX4+`, so the neutral-only form let the catalogue form of the
    # reductant pass beside an oxidiser) while keeping H required on *both* nitrogens, which its
    # twin had already dropped by name for UDMH. So `CN(C)N + OO` — the archetypal hypergolic
    # pair, ignition on contact with no ignition source — raised `hydrazine` and `peroxide` and
    # stayed silent on the one rule named for the combination. Half a fix reads exactly like a
    # clean screen, twice now; equal strings is the only form of that invariant a test can hold.
    #
    # `left` keeps its own spelling deliberately: an oxidiser arm is a union over four structural
    # rules, not the twin of any one of them.
    left: "[$([Cl;X4](~[OX1,OX2H1])(~[OX1,OX2H1])(~[OX1,OX2H1])~[OX1,OX2H1]),$([Mn;X4](~[OX1,OX2H1])(~[OX1,OX2H1])(~[OX1,OX2H1])~[OX1,OX2H1]),$([OX2,OX1-][OX2,OX1-]),$([#6][OX2][NX3+](=[OX1])[OX1-])]"
    right: "[$([AlH4-]),$([BH4-]),$([H-]),$([NX3,NX4+;!$(NC=O)][NX3,NX4+;H3,H2,H1;!$(NC=O)])]"
    severity: high
    explanation: >-
      A strong oxidizer and a strong reducing agent appear in the same reaction. Combined directly
      these mixtures can ignite or detonate; verify the intended order of addition, dilution, and
      thermal control before running.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., oxidant/reductant mixtures"

  # Named-substance pairs contributed from the F11 gap-closure branch. Structural SMARTS rather
  # than names, so they fire however a source spells the reagent — the identity table
  # (`chemclaw.reagents`) resolves the name, and these match the resolved structure.
  - id: azide-with-dichloromethane
    # X1 on both terminal nitrogens: RDKit sanitizes the azide *anion* to two one-coordinate N-
    # atoms, so the X2 form (correct for an organic azide) silently never fires on a salt — the
    # exact failure this table's header warns about, found by testing against parsed molecules.
    left: "[N;X1-]=[N;X2+]=[N;X1-]"
    right: "[CH2](Cl)Cl"
    severity: high
    explanation: >-
      An azide salt together with dichloromethane forms di- and triazidomethane, which are
      explosive and shock-sensitive and have caused documented laboratory detonations. Substitute
      the solvent (MeCN, DMF or 2-MeTHF are the usual choices) rather than controlling for it.
    citation: "Peet & Weber, Chem. Eng. News 1988, 66(31), 2; Bretherick's, 8th ed., diazidomethane"

  - id: hydride-with-dipolar-aprotic
    left: "[H-]"
    right: "[$(CN(C)C=O),$(CS(C)=O)]"
    severity: high
    explanation: >-
      Sodium hydride in DMF or DMSO undergoes a well-documented autocatalytic exotherm above
      roughly 40 C. Use THF or 2-MeTHF, or hold below that temperature with active cooling and a
      thermal screen before scaling.
    citation: "Buckley et al., Org. Process Res. Dev. 2021, 25, 587 (NaH/DMF thermal runaway)"

  - id: peroxide-with-ketone
    left: "[OX2H][OX2H]"
    right: "[#6][CX3](=[OX1])[#6]"
    severity: high
    explanation: >-
      Hydrogen peroxide with a ketone forms cyclic acetone-peroxide species (TATP/TCAP), which are
      primary explosives. Choose a different oxidant or a non-ketone solvent; this is not a
      combination to control for.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., peroxide/ketone"

  - id: complex-hydride-with-chlorinated-solvent
    left: "[$([AlH4-]),$([BH4-])]"
    # Geminal *or* vicinal. The geminal-only pattern matched DCM and chloroform but not
    # 1,2-dichloroethane, an ordinary process solvent with the same incompatibility. Deliberately
    # not "any C-Cl": reducing a mono-chloroalkane with a complex hydride is a normal reaction,
    # and a rule that fires on it teaches a chemist to ignore the rule.
    right: "[$([CX4](Cl)Cl),$([CX4](Cl)[CX4]Cl)]"
    severity: medium
    explanation: >-
      Complex hydride reducing agents react exothermically, and on scale violently, with
      chlorinated solvents. Use an ethereal solvent (THF, 2-MeTHF, Et2O).
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., metal hydrides"

# Hazard screening rule table (D-080).
#
# Data, not code: a process-safety chemist edits this file without touching Python. Each rule is a
# SMARTS pattern for a structural motif with a well-documented hazard, a severity, an explanation
# written for the person reading the flag, and a citation so the flag can be traced to a source.
#
# Scope, deliberately narrow: these are *structural alerts*, not a hazard assessment. Absence of a
# flag means "no rule in this table matched" — never "safe". Toxicity, exposure limits, regulatory
# classification, scale effects, and process conditions are all out of scope; they need an SDS and
# a human. Adding a rule: keep the SMARTS as specific as the motif allows (a broad pattern that
# flags half the corpus is worse than no rule — it teaches people to ignore flags), and add a test
# in tests/test_safety.py pinning one molecule that must match and one that must not.
#
# severity: high   — energetic / shock- or friction-sensitive motifs; do not scale without review
#           medium — reactive motifs with well-known incident histories; handle with named controls
#           low    — worth noticing in a procedure; routine controls usually suffice

structural:
  - id: organic-azide
    smarts: "[#6][N;X2]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Organic azide: energetic and potentially shock-sensitive, especially at low carbon-to-nitrogen
      ratio. Avoid isolating neat; screen for the (C+O)/N rule of six before scaling.
    citation: "Bräse et al., Angew. Chem. Int. Ed. 2005, 44, 5188 (organic azides)"

  - id: acyl-azide
    smarts: "[CX3](=[OX1])[N;X2]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Acyl azide: thermally labile (Curtius rearrangement releases N2) and more sensitive than a
      simple alkyl azide. Generate and consume in situ; do not concentrate or store.
    citation: "Bräse et al., Angew. Chem. Int. Ed. 2005, 44, 5188"

  - id: diazo
    smarts: "[#6;!$(C=O)]=[N;X2+]=[N;X1-]"
    severity: high
    explanation: >-
      Diazo compound: energetic, light- and shock-sensitive, and typically toxic. Handle in solution
      behind a shield; never distil to dryness.
    citation: "Green et al., Org. Process Res. Dev. 2020, 24, 67 (diazo handling)"

  - id: diazonium
    smarts: "[#6][N;X2+]#[N;X1]"
    severity: high
    explanation: >-
      Diazonium salt: explosive when dry, particularly with non-coordinating counterions. Keep in
      cold solution and use directly; do not isolate the solid.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., diazonium salts"

  - id: peroxide
    smarts: "[OX2][OX2]"
    severity: high
    explanation: >-
      Peroxide linkage: energetic and prone to violent decomposition on heating, friction, or metal
      contamination. Test for peroxides before distillation and never evaporate to dryness.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., peroxides"

  - id: nitrate-ester
    smarts: "[#6][OX2][NX3+](=[OX1])[OX1-]"
    severity: high
    explanation: >-
      Nitrate ester: a classic energetic motif — shock- and heat-sensitive. Treat as explosive
      unless proven otherwise for the specific compound and scale.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., nitrate esters"

  - id: polynitro-aromatic
    smarts: "[$([NX3](=[OX1])=[OX1]),$([NX3+](=[OX1])[OX1-])]c1ccccc1[$([NX3](=[OX1])=[OX1]),$([NX3+](=[OX1])[OX1-])]"
    severity: high
    explanation: >-
      Polynitroaromatic: multiple nitro groups on one ring is the archetypal explosive motif
      (oxygen balance approaching zero). Assess energetic hazard before any scale-up or heating.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., polynitroaryl compounds"

  - id: perchlorate
    # `~` (any bond): RDKit sanitizes perchlorate to the charge-separated [O-][Cl+3]([O-])([O-])O
    # form, so a double-bond pattern never matches a parsed molecule.
    smarts: "[Cl;X4](~[OX1,OX2H1])(~[OX1,OX2H1])(~[OX1,OX2H1])~[OX1,OX2H1]"
    severity: high
    explanation: >-
      Perchlorate: a strong oxidizer that forms explosive mixtures with organic matter, and whose
      organic salts can detonate. Keep rigorously separate from fuels and reducing agents.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., perchlorates"

  - id: hydrazine
    smarts: "[NX3;H2,H1;!$(NC=O)][NX3;H2,H1;!$(NC=O)]"
    severity: medium
    explanation: >-
      Free hydrazine motif: toxic, a suspected carcinogen, and a strong reductant that forms
      energetic mixtures with oxidizers. Contained handling and dedicated waste stream.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., hydrazines"

  - id: n-halamine
    smarts: "[NX3][F,Cl,Br,I]"
    severity: medium
    explanation: >-
      N-halogen bond: thermally unstable and a known initiator of runaway halogenations. Keep cold,
      exclude light and metals.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., N-haloamines"

# Pairwise incompatibilities checked across a *reaction's* components: each rule fires when at
# least one component matches `left` and a different component matches `right`.
incompatible_pairs:
  - id: oxidizer-with-reductant
    left: "[$([Cl;X4](~[OX1,OX2H1])(~[OX1,OX2H1])(~[OX1,OX2H1])~[OX1,OX2H1]),$([Mn;X4](~[OX1,OX2H1])(~[OX1,OX2H1])(~[OX1,OX2H1])~[OX1,OX2H1]),$([OX2][OX2]),$([#6][OX2][NX3+](=[OX1])[OX1-])]"
    right: "[$([AlH4-]),$([BH4-]),$([H-]),$([NX3;H2,H1;!$(NC=O)][NX3;H2,H1;!$(NC=O)])]"
    severity: high
    explanation: >-
      A strong oxidizer and a strong reducing agent appear in the same reaction. Combined directly
      these mixtures can ignite or detonate; verify the intended order of addition, dilution, and
      thermal control before running.
    citation: "Bretherick's Handbook of Reactive Chemical Hazards, 8th ed., oxidant/reductant mixtures"

# CI gate: lint + type + test on every push and PR. A red run blocks merge —
# this is the automated half of the CLAUDE.md "green before done" rule and the
# machine that enforces the PR-gate (plan step 2.7) on knowledge PRs later.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Real Postgres so the calculation-store integration tests run (not skip).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chemclaw
          POSTGRES_PASSWORD: chemclaw
          POSTGRES_DB: chemclaw
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U chemclaw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      CHEMCLAW_POSTGRES_DSN: postgresql://chemclaw:chemclaw@localhost:5432/chemclaw
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync

      - name: Apply database migrations
        run: make db-migrate

      - name: Lint + type + test (with coverage gate)
        run: make lint type cov

      - name: Validate knowledge graph
        run: make kg-validate

      # The scientific quality gates: metric case-set + ELN export validation.
      - name: Run eval case-set
        run: make eval

      - name: Validate ELN exports
        run: make eln-validate

      - name: Validate skills
        run: make skill-validate

      # The connector seam's own gates (D-109/D-113). Each catches a class of failure that is
      # invisible to the test suite because it is about the *wiring* between a declaration and the
      # live surface: a manifest naming a workflow or params model that cannot be built, a skill or
      # template step naming a tool nothing provides, an inline wait that outlives its turn. All are
      # read-only and take about a second.
      - name: Validate the connector bundles
        run: make connector-validate

      - name: Validate the step templates
        run: make template-validate

      - name: Validate the prose/tool contract
        run: make prose-validate

      # The deployment gate (DA-10/D-2): the Helm chart is the one artifact no test can exercise
      # offline, and a broken chart is only discovered at `helm install` — in production, on the
      # worst day. Rendering it and checking the result against the Kubernetes schemas is the
      # cheapest live-edge risk to buy down, and needs no cluster.
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Render + validate the Helm chart
        run: make helm-validate

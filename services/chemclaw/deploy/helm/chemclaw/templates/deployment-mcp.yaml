{{- /* The MCP capability servers. Each is stdio-launched by the agent process today (MCPStdioTool
       spawns a subprocess in the agent's own pod), so a standalone Deployment is only meaningful
       once a networked transport exists. Enabling one without that transport would run a stdio
       server with no stdin — an immediate exit and a crash loop (gap DEP-3), plus two idle pods
       the agent cannot reach. The guard is therefore BOTH the per-server flag and the transport,
       which is what this template always intended. */ -}}
{{- range $name, $cfg := .Values.mcp }}
{{- if and (kindIs "map" $cfg) $cfg.enabled (eq $.Values.mcp.transport "http") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" $ }}-mcp-{{ $name }}
  labels:
    {{- include "chemclaw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: mcp-{{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: mcp-{{ $name }}
  template:
    metadata:
      labels:
        {{- include "chemclaw.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: mcp-{{ $name }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      containers:
        - name: mcp-{{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "mcp-{{ $name }}"
            {{- include "chemclaw.env" $ | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources.mcp | nindent 12 }}
---
{{- end }}
{{- end }}

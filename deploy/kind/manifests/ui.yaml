# `Chemclaw3_ui`'s BFF (which also serves the built SPA), pointed at the chart's front-door Service.
#
# The auth mode is two things `up.sh` chooses together, so this file names neither as a literal
# that could disagree with the other: the image (`chemclaw/ui:kind-devauth` — built with
# ALLOW_DEV_AUTH — or `chemclaw/ui:kind` for oidc-mock) is substituted at apply time, and the
# environment (`AUTH_MODE` `dev` or `bff`, and in oidc-mock the tenant, client, scope and
# `NODE_EXTRA_CA_CERTS`) arrives through the `chemclaw-ui-auth` ConfigMap `up.sh` writes per mode.
#
# **Under `bff` the pod itself calls the identity provider** (discovery, keys, token endpoint), so
# it must resolve and trust the mock tenant: `hostAliases` maps the tenant host the browser also
# uses to the `mock-tenant` Service (manifests/mock.yaml, the same fixed address), and the cluster
# CA is mounted for `NODE_EXTRA_CA_CERTS`. Both are inert in devauth. The BFF keeps sessions in
# memory, so this Deployment stays at one replica; more than one needs router affinity.
#
# **The HTML sandbox is a second listener on a distinct origin** (`Chemclaw3_ui` README, "HTML
# sandbox"): `SANDBOX_PORT` serves `GET /sandbox/frame` and nothing else. The browser reaches it at
# `http://sandbox.localhost:15174` while the app is `http://127.0.0.1:15173` — a different hostname
# *and* port, so a different origin and a different site. `*.localhost` resolves to loopback in
# every current browser with no hosts-file entry; kind's port mapping cannot route by hostname, so
# the port differs too. `APP_ORIGIN` is exact: a chemist who opens the app as `localhost:15173`
# instead sees the artefact as escaped source with a notice naming both origins, because the shell
# takes content only from `APP_ORIGIN`. Scripts run by default (`HTML_SCRIPTS_DEFAULT`, unset here,
# is `on`); set it to `off` on this container to render pages without them.
#
# Reaches the front door because values-kind.yaml's `networkPolicy.ingressNamespaces` admits this
# namespace. `/readyz` asks the front door's own `/readyz`, so this pod is ready only when the
# backend is.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: chemclaw
  labels:
    app.kubernetes.io/name: ui
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30173
    - name: sandbox
      port: 8081
      targetPort: 8081
      nodePort: 30174
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: chemclaw
  labels:
    app.kubernetes.io/name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      # `tenant.localhost` → the `mock-tenant` Service's fixed ClusterIP (manifests/mock.yaml).
      hostAliases:
        - ip: 10.96.0.200
          hostnames: [tenant.localhost]
      securityContext:
        runAsNonRoot: true
        # The image's `node` user, by number, so `runAsNonRoot` can verify it.
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bff
          image: chemclaw/ui:kind-devauth
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "8080"
            - name: BIND_HOST
              value: 0.0.0.0
            - name: CHEMCLAW_API_URL
              value: http://chemclaw-service:8080
            - name: APP_VERSION
              value: kind
            - name: SANDBOX_PORT
              value: "8081"
            - name: SANDBOX_BIND_HOST
              value: 0.0.0.0
            - name: SANDBOX_ORIGIN
              value: http://sandbox.localhost:15174
            - name: APP_ORIGIN
              value: http://127.0.0.1:15173
          envFrom:
            - configMapRef:
                name: chemclaw-ui-auth
          ports:
            - name: http
              containerPort: 8080
            - name: sandbox
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: kind-ca
              mountPath: /etc/chemclaw-kind-ca
              readOnly: true
      volumes:
        # The cluster CA `up.sh` issues; read only when `NODE_EXTRA_CA_CERTS` names it (oidc-mock).
        - name: kind-ca
          secret:
            secretName: chemclaw-kind-ca
            optional: true

{{- if .Values.monitoring.enabled }}
{{- /* The other half of REV-2: collect the pods that have no Service.

       `servicemonitor.yaml` selects Services, and a worker has none — nothing routes to it, so
       there was nothing to select. That is exactly why the workers went uncollected: the
       observability story was built around routable traffic, and the processes doing the durable,
       expensive work take none. A PodMonitor targets pods directly, which is what this fleet needs.

       The `metrics` port is a *container* port with no Service behind it, declared purely so this
       monitor can name it rather than a number (`deployment-workers.yaml`,
       `deployment-connectors.yaml`). `chemclaw.core.worker_http` binds it inside each worker
       process, on the worker's own event loop — which is also what makes the probes on those same
       Deployments a real liveness signal instead of the comment they replaced.

       One selector for every worker in the release: `component` is `background-worker` or
       `connector-worker-<name>`, so matching on the release labels plus the port name collects
       core's worker and every bundle's, and a bundle enabled tomorrow is scraped without an edit
       here. Pods that *do* have a Service (the front door, connector servers) are collected by the
       ServiceMonitor and do not declare a `metrics` port, so the two never double-scrape. */ -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "chemclaw.name" . }}-workers
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    {{- with .Values.monitoring.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
  {{- /* Copy two of the pod's own labels onto every sample. Without them a series says which
         *pod* it came from and not which *role*, so "p95 across the connector servers" or "which
         component is down" needed a naming convention on the pod name to answer. `component` is
         the one label that distinguishes the four process roles this release runs, and `instance`
         is what separates two releases sharing a namespace. The operator sanitises the dots, so
         they arrive as `app_kubernetes_io_component` / `app_kubernetes_io_instance`. */}}
  podTargetLabels:
    - app.kubernetes.io/component
    - app.kubernetes.io/instance
  podMetricsEndpoints:
    - port: metrics
      path: {{ .Values.monitoring.path | quote }}
      interval: {{ .Values.monitoring.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
{{- if .Values.monitoring.temporalSdkMetrics.enabled }}
    {{- /* The Temporal SDK's own exporter, on its own port because it is a listener inside the SDK
           core rather than a route on `chemclaw.core.worker_http`. It is the only source of the
           queue-side numbers no first-party counter can produce — task-slot occupancy, poller
           counts, schedule-to-start latency — which is why `ChemclawWorkerNotPolling` is gated on
           the same switch: a worker that has stopped polling still answers `/healthz` and still
           serves the endpoint above, so nothing else in this release can see it.

           `path: /metrics` written out rather than reusing `monitoring.path`: that value is *this*
           application's route and the SDK's exporter does not read it. Two things that happen to
           agree are not one thing. */}}
    - port: temporal-metrics
      path: /metrics
      interval: {{ .Values.monitoring.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
{{- end }}
{{- end }}

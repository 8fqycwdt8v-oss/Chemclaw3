{{- if .Values.service.disruptionBudget.enabled }}
{{- /* Keep a front door alive through a *voluntary* disruption — a node drain, a cluster upgrade,
       a descheduler rebalance. Nothing did: `minReplicas: 2` bounds what the HPA runs, and bounds
       nothing about what a drain may evict at once, so both replicas could go together and the
       Route would have nowhere to send a conversation.

       `maxUnavailable: 1` rather than `minAvailable`, and the difference is not cosmetic once the
       HPA scales up: `minAvailable: 1` would permit five of six pods to be evicted simultaneously.
       What a front-door pod still holds that a sibling cannot take over is the turns it is running:
       their pumps live in that process (a sibling can follow or stop one through Postgres, but not
       continue it), and an evicted pod's turns are marked interrupted. Uploaded attachments, the
       harness todos and the session handle used to be on this list and are all durable now
       (`session_attachments`, the LangGraph checkpointer). So the number that matters is how many
       running turns one drain can end, and that is what `maxUnavailable` bounds. */ -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chemclaw.name" . }}-service
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  maxUnavailable: {{ .Values.service.disruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
{{- end }}
{{- /* The background worker. A PDB over one pod is a footgun: `minAvailable: 1` on a singleton
       makes it un-evictable and blocks every node drain, and `maxUnavailable: 1` permits exactly
       what no PDB permits. From two replicas up `minAvailable: 1` is the right statement: a drain
       may take all but one, so `background-jobs` keeps a poller through a node drain or a cluster
       upgrade of the nodes.

       Rendered only from two replicas, so a dev override to `replicas: 1` does not render the
       footgun. It does not cover a chart rollout: `deployment-workers.yaml` is `Recreate`, which
       replaces the pods without consulting a PDB. */ -}}
{{- if and .Values.workers.background.disruptionBudget.enabled (gt (int .Values.workers.background.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chemclaw.name" . }}-background-worker
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-worker
spec:
  minAvailable: {{ .Values.workers.background.disruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: background-worker
{{- end }}

{{- if .Values.service.disruptionBudget.enabled }}
{{- /* Keep a front door alive through a *voluntary* disruption — a node drain, a cluster upgrade,
       a descheduler rebalance. Nothing did: `minReplicas: 2` bounds what the HPA runs, and bounds
       nothing about what a drain may evict at once, so both replicas could go together and the
       Route would have nowhere to send a conversation.

       `maxUnavailable: 1` rather than `minAvailable`, and the difference is not cosmetic once the
       HPA scales up: `minAvailable: 1` would permit five of six pods to be evicted simultaneously.
       Every front-door pod still holds session state a sibling cannot see — now just the one thing
       (D-121): a conversation's uploaded attachments, which are in memory by design. The harness
       todos and the live session handle used to be on that list and are durable now, in the
       LangGraph checkpointer; the attachments were never framework state and did not move. So the
       number that matters is how many conversations one drain can end, and that is what
       `maxUnavailable` bounds.

       **Deliberately not the workers.** `workers.background.replicas: 1` is a hard singleton, and
       the reason is the one `values.yaml` gives rather than the D-069 checkout lock this comment
       used to name — that lock is a Postgres advisory lock across pods now, and what still pins the
       count is `NoteReindexWorkflow` retiring `note_index` rows against *this pod's* knowledge
       checkout (`D-2026-08-27-what-a-second-background-worker-would-race-on`). A PDB over a
       singleton is the classic footgun either way: `minAvailable: 1` makes it un-evictable and
       blocks every node drain in the cluster forever, while `maxUnavailable: 1` permits exactly
       what no PDB permits. Neither is worth rendering. The singleton itself is the real
       availability gap, and it stays an open backlog row rather than being papered over with a
       policy object that would make things worse. (The connector servers also run one replica, and
       *not* for that reason — an MCP server here is stateless; that is a capacity default, not an
       invariant, which is why the same sentence should not cover both.) */ -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chemclaw.name" . }}-service
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  maxUnavailable: {{ .Values.service.disruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "chemclaw.name" . }}-service
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "chemclaw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: service
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
{{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "chemclaw.name" . }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    # Pin a browser to one front-door pod (D-121). Not a performance preference — a correctness
    # one. The per-session turn guard is durable (`session_turns`), and since the conversation
    # layer moved to LangGraph the turn's own state is durable too — the plan and the message
    # history live in the Postgres checkpointer, not on a live in-process handle.
    #
    # **Affinity is still required, and the reason it survives is not the one that motivated it.**
    # The LangGraph rebuild expected to retire this: two of the three things named here were
    # framework state, and both are gone. What remains is the first one, which never had anything
    # to do with the framework — uploaded attachments are session-scoped and held **in memory by
    # design** (`chemclaw.agent.attachments`), with no table behind them anywhere in `infra/sql`.
    # A chemist who uploads a CSV and then asks about it must reach the pod that holds it; without
    # affinity that fails once per replica out of N, and it fails by the agent simply not seeing
    # the file.
    #
    # So the way to remove this is to give attachments a durable home, not to change engines.
    #
    # The haproxy router sets its balancing cookie by default, so this is written down explicitly
    # rather than left to a default that a cluster-wide change could flip silently. `leastconn`
    # rather than round-robin because turns are long-lived and wildly uneven in duration.
    haproxy.router.openshift.io/disable_cookies: "false"
    haproxy.router.openshift.io/balance: leastconn
    {{- /* Source-IP allowlist for the whole Route. Empty by default, and rendered only when set,
           because a chart cannot invent a deployment's corporate ranges.
           This is the one control that exists at this layer: a Route declares no `spec.path` and
           neither it nor a NetworkPolicy can filter by path, so `/metrics` is on the public host
           exactly like every other route the front door serves. `values.yaml` carries the argument
           for why that is acceptable by default and what this knob is for. */}}
    {{- with .Values.route.ipWhitelist }}
    haproxy.router.openshift.io/ip_whitelist: {{ join " " . | quote }}
    {{- end }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "chemclaw.name" . }}-service
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.tls.insecureEdgeTerminationPolicy }}
{{- end }}
{{- if .Values.service.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "chemclaw.name" . }}-service
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "chemclaw.name" . }}-service
  minReplicas: {{ .Values.service.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.service.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.service.autoscaling.occupancy.enabled }}
    {{- /* The saturation signal, first because it is the one that binds. A turn holds its permit
           for the whole 8.32 s it waits on the model and spends 0.581 s of CPU doing it, so the
           pod is full at 44% of the CPU target below and no CPU threshold can reach it — measured
           with the semaphore 100% full at 218 millicores, and again in the load lane as 33 of 48
           turns shed at 35.0% of one core.

           `AverageValue`, not `Utilization`: the quantity is "permits held per pod", and the HPA's
           own arithmetic (desired = ceil(replicas × current / target)) is then exactly the queue
           the admission semaphore is. The target is derived from the permit count the pods
           actually enforce rather than written out, so the two cannot drift; `max 1` because a
           target of 0 makes the HPA divide by zero and scale to its ceiling.

           This metric needs a custom-metrics API (prometheus-adapter, KEDA, or the cluster's own)
           publishing the series for these pods. There is nothing this chart can do to make that
           true, so what it does instead is fail *visibly*: an unfetchable metric shows as
           `FailedGetPodsMetric` on the HPA, and Kubernetes will still scale UP on the CPU metric
           beside it while refusing to scale DOWN on a partial reading. That is why the CPU metric
           stays rather than being replaced. */}}
    - type: Pods
      pods:
        metric:
          name: {{ .Values.service.autoscaling.occupancy.metricName }}
        target:
          type: AverageValue
          averageValue: {{ max 1 (div (mul (int (required "config.CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS must be set: the HPA's occupancy target is a fraction of the permit count the pods enforce" .Values.config.CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS)) (int .Values.service.autoscaling.occupancy.targetPercent)) 100) | quote }}
    {{- end }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.service.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

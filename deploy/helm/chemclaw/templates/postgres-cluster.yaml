{{- if .Values.postgres.cluster.enabled }}
{{- /* The release's Postgres as a CloudNativePG Cluster that archives WAL to an object store and
       takes scheduled base backups, so any instant inside the retention window is restorable
       (docs/guides/runbook.md § "Backup, restore and PITR"). Off by default: this chart does not
       otherwise own Postgres, and a site with its own operator or a managed service keeps that and
       holds it to the same contract (the runbook lists it).

       Needs, in the cluster: the CloudNativePG operator and the Barman Cloud plugin (which
       installs the ObjectStore CRD and needs cert-manager). Backups go through the plugin, because
       the operator's built-in object-store backup is deprecated upstream
       (D-2026-10-15-postgres-is-backed-up-by-wal-archiving-to-an-object-store).

       Refused until the operator states the two recovery targets: the chart cannot know how much
       loss or downtime the site accepts, and an unstated target is one nobody checks the backups
       against. RPO bounds how often WAL is shipped; RTO is checked, not enforced, by `make
       restore-drill`'s measured restore time. */ -}}
{{- $c := .Values.postgres.cluster }}
{{- $b := $c.backup }}
{{- $name := include "chemclaw.pgClusterName" . }}
{{- if not $c.imageName }}
{{- fail "postgres.cluster.imageName is not set: the operator's stock images carry no pgvector, and the migrations run `CREATE EXTENSION vector` (bit(2048) HNSW needs pgvector 0.7 or later). Name a PostgreSQL 16 image that has it." }}
{{- end }}
{{- if not (hasPrefix "s3://" ($b.destinationPath | default "")) }}
{{- fail "postgres.cluster.backup.destinationPath must be an s3:// URL (a bucket and prefix of an S3 or S3-compatible store). Another provider's ObjectStore is a site edit of this template." }}
{{- end }}
{{- if or (le (int $c.targets.rpoSeconds) 0) (le (int $c.targets.rtoSeconds) 0) }}
{{- fail "postgres.cluster.targets.rpoSeconds and rtoSeconds are not set. They are the recovery point and time this site accepts for a lost cluster; the chart ships no default because a default is a guarantee nobody agreed to. Set both, in seconds." }}
{{- end }}
{{- if lt (int $c.targets.rpoSeconds) (int $c.archiveTimeoutSeconds) }}
{{- fail (printf "postgres.cluster.targets.rpoSeconds (%v) is below archiveTimeoutSeconds (%v): WAL reaches the object store at most that often when the database is quiet, so a smaller target cannot be met. Raise the target or lower archiveTimeoutSeconds." $c.targets.rpoSeconds $c.archiveTimeoutSeconds) }}
{{- end }}
{{- if not (regexMatch "^[0-9]+[dwm]$" ($b.retentionPolicy | default "")) }}
{{- fail (printf "postgres.cluster.backup.retentionPolicy %q is not a Barman retention (a count and d, w or m: 30d, 4w, 3m)." $b.retentionPolicy) }}
{{- end }}
{{- if not (has ($b.encryption | default "") (list "" "AES256" "aws:kms")) }}
{{- fail (printf "postgres.cluster.backup.encryption %q must be empty, AES256 or aws:kms (server-side encryption of the archive and the base backups)." $b.encryption) }}
{{- end }}
{{- if lt (int $c.instances) 1 }}
{{- fail "postgres.cluster.instances must be at least 1." }}
{{- end }}
{{- if and $c.temporalDatabases.enabled (not $c.temporalDatabases.passwordSecret) }}
{{- fail "postgres.cluster.temporalDatabases.enabled is true but passwordSecret is empty: the Temporal role's login comes from a kubernetes.io/basic-auth Secret (username and password) the operator creates." }}
{{- end }}
{{- $params := dict "archive_timeout" (printf "%ds" (int $c.archiveTimeoutSeconds)) }}
{{- if gt (int .Values.postgres.maxConnections) 0 }}
{{- $_ := set $params "max_connections" (toString (add (int .Values.postgres.maxConnections) (int $c.connectionHeadroom))) }}
{{- end }}
{{- $params = merge (deepCopy ($c.parameters | default dict)) $params }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $name }}-backup
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  retentionPolicy: {{ $b.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ $b.destinationPath | quote }}
    {{- with $b.endpointURL }}
    endpointURL: {{ . | quote }}
    {{- end }}
    {{- if $b.endpointCA.name }}
    endpointCA:
      name: {{ $b.endpointCA.name | quote }}
      key: {{ $b.endpointCA.key | quote }}
    {{- end }}
    s3Credentials:
      {{- if $b.credentialsSecret }}
      accessKeyId:
        name: {{ $b.credentialsSecret | quote }}
        key: {{ $b.accessKeyIdKey | quote }}
      secretAccessKey:
        name: {{ $b.credentialsSecret | quote }}
        key: {{ $b.secretAccessKeyKey | quote }}
      {{- else }}
      inheritFromIAMRole: true
      {{- end }}
    wal:
      compression: {{ $b.walCompression | quote }}
      maxParallel: {{ int $b.walMaxParallel }}
      {{- with $b.encryption }}
      encryption: {{ . | quote }}
      {{- end }}
    data:
      compression: {{ $b.dataCompression | quote }}
      {{- with $b.encryption }}
      encryption: {{ . | quote }}
      {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    chemclaw/rpo-seconds: {{ int $c.targets.rpoSeconds | quote }}
    chemclaw/rto-seconds: {{ int $c.targets.rtoSeconds | quote }}
spec:
  description: "Postgres for release {{ .Release.Name }}: the application database{{ if $c.temporalDatabases.enabled }} and Temporal's{{ end }}"
  instances: {{ int $c.instances }}
  imageName: {{ $c.imageName | quote }}
  {{- with $c.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  postgresql:
    parameters:
      {{- range $key, $value := $params }}
      {{ $key }}: {{ toString $value | quote }}
      {{- end }}
  bootstrap:
    initdb:
      database: {{ $c.database | quote }}
      owner: {{ $c.owner | quote }}
      {{- with $c.credentialsSecret }}
      secret:
        name: {{ . | quote }}
      {{- end }}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  storage:
    size: {{ $c.storage.size | quote }}
    {{- with $c.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  walStorage:
    size: {{ $c.walStorage.size | quote }}
    {{- with $c.walStorage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $name }}-backup
        {{- with $c.archiveServerName }}
        serverName: {{ . | quote }}
        {{- end }}
  {{- with $b.serviceAccountAnnotations }}
  serviceAccountTemplate:
    metadata:
      annotations:
        {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- if $c.temporalDatabases.enabled }}
  managed:
    roles:
      - name: {{ $c.temporalDatabases.role | quote }}
        ensure: present
        login: true
        passwordSecret:
          name: {{ $c.temporalDatabases.passwordSecret | quote }}
  {{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $name }}-base
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  schedule: {{ $b.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  method: plugin
  target: {{ $b.target | quote }}
  cluster:
    name: {{ $name }}
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- if $c.temporalDatabases.enabled }}
{{- range $database := list "temporal" "temporal_visibility" }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $name }}-{{ $database | replace "_" "-" }}
  labels:
    {{- include "chemclaw.labels" $ | nindent 4 }}
spec:
  cluster:
    name: {{ $name }}
  name: {{ $database }}
  owner: {{ $c.temporalDatabases.role | quote }}
  ensure: present
  databaseReclaimPolicy: retain
{{- end }}
{{- end }}
{{- end }}

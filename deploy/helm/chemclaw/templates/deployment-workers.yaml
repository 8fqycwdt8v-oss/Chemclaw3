{{- /* Core's Temporal worker: `background-jobs` (light — sync, re-index, reports, and the */ -}}
{{- /* connector-job wrapper). It serves `/healthz`, `/readyz` and `/metrics` on the `metrics` */ -}}
{{- /* port; this used to say "no probe HTTP port — liveness is the Temporal poll itself", */ -}}
{{- /* which asserted a guarantee nothing checked (see `chemclaw.workerProbes`). */ -}}
{{- /* Core's only worker. Every expensive workflow belongs to a connector bundle, whose own */ -}}
{{- /* worker is rendered by deployment-connectors.yaml (D-118). */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" . }}-background-worker
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-worker
spec:
  replicas: {{ .Values.workers.background.replicas }}
  {{- /* The other half of that `replicas: 1`, because one replica is one process only at steady
         state. Kubernetes' default `RollingUpdate` is `maxSurge: 25%`/`maxUnavailable: 25%`, which
         for a single replica rounds to `maxSurge: 1, maxUnavailable: 0` — the new pod is started
         and becomes Ready *before* the old one is told to stop, and the old one then gets its whole
         `terminationGracePeriodSeconds` (150) to finish. Two background workers poll
         `background-jobs` for that window, which is precisely the race
         `D-2026-08-27-what-a-second-background-worker-would-race-on` pins the count to prevent:
         `NoteReindexWorkflow` retires `note_index` rows for notes missing from *this pod's*
         knowledge checkout, the two pods hold two differently-aged clones of the corpus, and a
         merge-webhook reindex landing on the older one deletes the freshly merged notes' rows while
         logging that it retired notes that exist.

         `Recreate` rather than `maxSurge: 0`: a singleton worker has no availability to protect —
         Temporal redelivers an activity whose worker went away — so the honest statement is that
         the old process is gone before the new one starts. The connector workers below keep the
         default on purpose; nothing on their queues is host-local, so an overlap is only capacity. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: background-worker
  template:
    metadata:
      annotations:
        {{- include "chemclaw.configChecksum" . | nindent 8 }}
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: background-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      {{- include "chemclaw.workerGracePeriod" . | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      containers:
        - name: background-worker
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "background-worker"
            {{- include "chemclaw.otelResourceEnv" (dict "component" "background-worker") | nindent 12 }}
            {{- include "chemclaw.workerMetricsEnv" . | nindent 12 }}
            {{- include "chemclaw.env" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          {{- include "chemclaw.workerProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" . | nindent 12 }}
            {{- include "chemclaw.knowledgeMounts" . | nindent 12 }}
            {{- include "chemclaw.documentShareMount" . | nindent 12 }}
        {{- include "chemclaw.knowledgeSidecar" . | nindent 8 }}
      {{- /* The clone before the publish — see `deployment-service.yaml`. */}}
      initContainers:
        {{- include "chemclaw.noteRepoInit" . | nindent 8 }}
        {{- include "chemclaw.knowledgeInit" . | nindent 8 }}
      volumes:
        {{- include "chemclaw.volumes" . | nindent 8 }}
        {{- include "chemclaw.noteRepoVolume" . | nindent 8 }}
        {{- include "chemclaw.documentShareVolume" . | nindent 8 }}

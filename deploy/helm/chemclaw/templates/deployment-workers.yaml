{{- /* Core's Temporal worker: `background-jobs` (light — sync, re-index, reports, and the */ -}}
{{- /* connector-job wrapper). It serves `/healthz`, `/readyz` and `/metrics` on the `metrics` */ -}}
{{- /* port; this used to say "no probe HTTP port — liveness is the Temporal poll itself", */ -}}
{{- /* which asserted a guarantee nothing checked (see `chemclaw.workerProbes`). */ -}}
{{- /* Core's only worker. Every expensive workflow belongs to a connector bundle, whose own */ -}}
{{- /* worker is rendered by deployment-connectors.yaml (D-118). */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" . }}-background-worker
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-worker
spec:
  replicas: {{ .Values.workers.background.replicas }}
  {{- /* `Recreate`: with no overlap, every unfinished run on `background-jobs` is resumed by exactly
         one code version, the new one. So the new image must *replay* the histories the old one
         wrote, which is a property of `src/chemclaw/durable/`, not of this file, checked against
         committed histories by `tests/test_workflow_replay.py`
         (`D-2026-09-09-a-replay-control-needs-an-archived-history-not-a-patch`).

         This is independent of `replicas`. Two replicas make a node drain or a crash survivable
         (`poddisruptionbudget.yaml`); they do not make a rollout rolling. A `RollingUpdate` would
         let an old and a new worker poll one queue, so a history started by the new code could be
         replayed by the old; Temporal's worker versioning would allow that and is declined in that
         ADR because pinning an in-flight run to its build id keeps the old worker up until the
         run drains, and a `TemplateWorkflow` run lives up to `template_run_timeout_seconds`.

         The connector workers below keep the default on purpose; nothing on their queues is
         host-local, so an overlap is only capacity. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: background-worker
  template:
    metadata:
      annotations:
        {{- include "chemclaw.configChecksum" . | nindent 8 }}
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: background-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- /* Two replicas on one node are one failure domain: see `chemclaw.spreadAcrossNodes`. */}}
      {{- include "chemclaw.spreadAcrossNodes" (dict "Release" .Release "component" "background-worker") | nindent 6 }}
      {{- /* No service links: see deployment-service.yaml. */}}
      enableServiceLinks: false
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      {{- include "chemclaw.workerGracePeriod" . | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      containers:
        - name: background-worker
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "background-worker"
            {{- include "chemclaw.otelResourceEnv" (dict "component" "background-worker") | nindent 12 }}
            {{- include "chemclaw.workerMetricsEnv" . | nindent 12 }}
            {{- /* This pod's own parse allowance, where the fleet-wide one is derived from the
                   *front door* — 1Gi and two parse slots against this pod's 4Gi and eight, which
                   is 178.9 MiB a parse may spend there against 332.7 here. Same shape and same
                   argument as `maxConcurrentActivities` in `deployment-connectors.yaml`: an
                   explicit `env` entry beats the same key arriving through `envFrom`, which is how
                   a *stated* fleet-wide value would reach every other component. The shipped
                   `config` states none, so elsewhere the code default applies. `values.yaml`
                   carries what this buys and what it still refuses. */}}
            {{- with .Values.workers.background.documentParseMemoryBytes }}
            - name: CHEMCLAW_DOCUMENT_PARSE_MEMORY_BYTES
              {{- /* `int64` and not `| quote`, because Helm parses a nine-digit values entry as a
                     **float** and `quote` then renders it in scientific notation. Driven:
                     `335544320` reached the container as `"3.3554432e+08"`, and
                     `CHEMCLAW_DOCUMENT_PARSE_MEMORY_BYTES=3.3554432e+08` is a pydantic
                     `int_parsing` error — so every background worker would have crash-looped on
                     start. The chart test did not see it because it reads `values.yaml` through
                     `yaml.safe_load`, where the same entry is an `int`; the render is the only place
                     the defect exists. `test_no_rendered_setting_reaches_a_pod_in_scientific_
                     notation` is the guard over that class.

                     `int64` rather than `printf "%.0f"`, which was the first fix: a byte count is an
                     integer, and `float64` cannot hold one past 2^53 — `9007199254740993` renders as
                     `...992`. `int64` is exact for every value this key can legitimately take.

                     The `fail` is for what `int64` does with the rest: it answers **0** for a
                     non-numeric string, and `320Mi` is the spelling an operator reaches for here
                     because it is the one `resources` takes two screens down. A budget of 0 makes
                     `isolate._bound_allocations` set the ceiling to the resident set, so *every*
                     document on this pod is refused — counted as `skipped_unreadable`, quieter than
                     a crash-loop and harder to find. This key takes a plain byte count or nothing.
                     */}}
              {{- /* Normalised by *kind* before it is checked, because the two entry paths differ:
                     a values file gives a `float64` (whose `toString` is the exponent form this
                     whole comment is about) and `--set` gives an `int64` or a string (whose
                     `toString` is the exact digits). `%.0f` is exact for every byte count a pod can
                     hold; the string arm is exact for anything at all. */}}
              {{- $digits := "" }}
              {{- if kindIs "float64" . }}
              {{- if eq (floor .) . }}{{ $digits = printf "%.0f" . }}{{ end }}
              {{- else }}
              {{- $digits = toString . }}
              {{- end }}
              {{- if not (regexMatch "^[1-9][0-9]*$" $digits) }}
              {{- fail (printf "workers.background.documentParseMemoryBytes must be a positive whole byte count, got %v. `320Mi` and other resource suffixes are not accepted here — they become 0, and a budget of 0 makes this pod refuse every document rather than fall back. Remove the key to use the fleet-wide value" .) }}
              {{- end }}
              value: {{ $digits | quote }}
            {{- end }}
            {{- include "chemclaw.env" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          {{- include "chemclaw.workerProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" . | nindent 12 }}
            {{- include "chemclaw.trustedCAMount" . | nindent 12 }}
            {{- include "chemclaw.knowledgeMounts" . | nindent 12 }}
            {{- include "chemclaw.extraConnectorMounts" . | nindent 12 }}
            {{- include "chemclaw.extraSinkMounts" . | nindent 12 }}
            {{- include "chemclaw.documentShareMount" . | nindent 12 }}
        {{- include "chemclaw.knowledgeSidecar" . | nindent 8 }}
      {{- /* The clone before the publish — see `deployment-service.yaml`. */}}
      initContainers:
        {{- include "chemclaw.noteRepoInit" . | nindent 8 }}
        {{- include "chemclaw.knowledgeInit" . | nindent 8 }}
      volumes:
        {{- include "chemclaw.volumes" . | nindent 8 }}
        {{- include "chemclaw.noteRepoVolume" . | nindent 8 }}
        {{- include "chemclaw.documentShareVolume" . | nindent 8 }}

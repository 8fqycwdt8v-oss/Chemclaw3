{{- /* Core's Temporal worker: `background-jobs` (light — sync, re-index, reports, and the */ -}}
{{- /* connector-job wrapper). It serves `/healthz`, `/readyz` and `/metrics` on the `metrics` */ -}}
{{- /* port; this used to say "no probe HTTP port — liveness is the Temporal poll itself", */ -}}
{{- /* which asserted a guarantee nothing checked (see `chemclaw.workerProbes`). */ -}}
{{- /* Core's only worker. Every expensive workflow belongs to a connector bundle, whose own */ -}}
{{- /* worker is rendered by deployment-connectors.yaml (D-118). */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" . }}-background-worker
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: background-worker
spec:
  replicas: {{ .Values.workers.background.replicas }}
  {{- /* The other half of that `replicas: 1`, because one replica is one process only at steady
         state. Kubernetes' default `RollingUpdate` is `maxSurge: 25%`/`maxUnavailable: 25%`, which
         for a single replica rounds to `maxSurge: 1, maxUnavailable: 0` — the new pod is started
         and becomes Ready *before* the old one is told to stop, and the old one then gets its whole
         `terminationGracePeriodSeconds` (150) to finish. Two background workers poll
         `background-jobs` for that window, which is the race
         `D-2026-08-27-what-a-second-background-worker-would-race-on` pinned the count to prevent:
         the two pods hold two differently-aged clones of the corpus. **Both halves of that are now
         closed** — a prune is bounded by the corpus revision the row was built from
         (`D-2026-09-14-a-prune-needs-the-corpus-two-pods-disagree-about`), so the older pod no
         longer deletes the freshly merged notes' rows, and a note's fingerprint is a hash of its
         bytes rather than the mtime its own checkout wrote
         (`D-2026-09-16-a-fingerprint-that-names-a-checkout-is-not-a-fingerprint-of-a-note`), so two
         pods holding one commit no longer re-embed each other's work.

         **So the corpus argument no longer reaches this knob, and `Recreate` stays for the reason
         below rather than for that one.** Written out because the two were stated together for
         long enough to read as one: an overlap during a rollout is now a capacity question for
         the reindex, and a correctness question only for replay. `values.yaml` says what is left
         before `replicas` itself moves.

         `Recreate` rather than `maxSurge: 0`: a singleton worker has no availability to protect —
         Temporal redelivers an activity whose worker went away — so the honest statement is that
         the old process is gone before the new one starts.

         **What that guarantees, and what it therefore costs.** With no overlap, every unfinished
         run on `background-jobs` is resumed by exactly one code version: the new one. So the new
         image must be able to *replay* the histories the old one wrote, and that is a property of
         `src/chemclaw/durable/`, not of this file — checked against committed histories by
         `tests/test_workflow_replay.py`
         (`D-2026-09-09-a-replay-control-needs-an-archived-history-not-a-patch`). Measured there
         rather than argued here, because prose in a chart template cannot fail.

         Temporal's worker versioning is the alternative that would let the two generations
         disagree, and it is declined in that ADR for this deployment's own reason: pinning an
         in-flight run to the build id that started it requires the old worker to stay up until it
         drains — a `TemplateWorkflow` run lives up to `template_run_timeout_seconds`, 12.6 h at
         the shipped default — which is a second background worker for half a day, the exact thing
         the paragraph above pins `replicas: 1` to prevent.

         The connector workers below keep the default on purpose; nothing on their queues is
         host-local, so an overlap is only capacity — and no bundle workflow has an archived
         history yet either, which is why the control above is scoped to core's queue. */}}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: background-worker
  template:
    metadata:
      annotations:
        {{- include "chemclaw.configChecksum" . | nindent 8 }}
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: background-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      {{- include "chemclaw.workerGracePeriod" . | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      containers:
        - name: background-worker
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "background-worker"
            {{- include "chemclaw.otelResourceEnv" (dict "component" "background-worker") | nindent 12 }}
            {{- include "chemclaw.workerMetricsEnv" . | nindent 12 }}
            {{- include "chemclaw.env" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          {{- include "chemclaw.workerProbes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" . | nindent 12 }}
            {{- include "chemclaw.knowledgeMounts" . | nindent 12 }}
            {{- include "chemclaw.extraConnectorMounts" . | nindent 12 }}
            {{- include "chemclaw.documentShareMount" . | nindent 12 }}
        {{- include "chemclaw.knowledgeSidecar" . | nindent 8 }}
      {{- /* The clone before the publish — see `deployment-service.yaml`. */}}
      initContainers:
        {{- include "chemclaw.noteRepoInit" . | nindent 8 }}
        {{- include "chemclaw.knowledgeInit" . | nindent 8 }}
      volumes:
        {{- include "chemclaw.volumes" . | nindent 8 }}
        {{- include "chemclaw.noteRepoVolume" . | nindent 8 }}
        {{- include "chemclaw.documentShareVolume" . | nindent 8 }}

{{- if and .Values.monitoring.enabled .Values.monitoring.alerts.enabled }}
{{- /* The alerts the metrics were designed for.

       REV-2 closed "nothing scrapes `/metrics`" by adding a ServiceMonitor, and its own comment
       makes the argument that an endpoint which answers while nothing collects it is how
       observability fails quietly. The same argument applies one level up: every metric this
       system declares was collected and **no rule fired on any of them**. There was no
       PrometheusRule anywhere in the repo, no SLO, and no Alertmanager route.

       How many metrics that was is deliberately not written here. The number this sentence used to
       carry said thirty-seven while the registry declared sixty-six, and the count that replaced it
       would have gone stale on the next commit that declared one — the same failure `CLAUDE.md`
       records for the Makefile's target count and `tests/conftest.py`'s skip count. The registry is
       the only honest source: `len(declared_metric_names())`, and
       `tests/test_deploy_chart.py::test_every_counter_that_can_fail_silently_has_an_alert` is what
       makes the *coverage* of it checkable rather than believed.

       The other two absences that sentence named are closed beside this file, not in it.
       `templates/alertmanagerconfig.yaml` is the route — values-gated, because a receiver is a
       deployment fact — and it is inert until a cluster admin turns on user-workload
       AlertmanagerConfig, exactly as this object is inert until they turn on user-workload
       monitoring at all. `docs/guides/runbook.md` § "When an alert fires" is the SLO's practical
       half and the target of every `runbook_url` below.

       The tell is `agent/audit.py`, which logs `audit_sink_failure` at ERROR with a stable marker
       and increments a counter, with a comment saying in as many words that a lost audit
       record "must be ALERTABLE, not a generic warning". Nothing alerted. Same for the turn-claim
       lease lapsing (two turns on one session), the rollback watermark (which fired 32 times in a
       126-second load test and leads to bricked sessions), and a note publish failing (knowledge
       lost, silently, since the publish is best-effort by design).

       Every rule below alerts on a *rate*, not a total, so a counter that moved once during a
       deploy does not page anyone forever. Severities: `critical` = a durable record or a correctness
       invariant is being lost right now; `warning` = degraded, look at it today.

       **`for:` cannot express "sustained" over an `increase(...) > 0`, and two rules here used to
       claim it did.** `increase(c[10m]) > 0` keeps returning a sample for the whole ten minutes
       after a *single* increment, so any `for:` shorter than the range window is satisfied by one
       blip: the alert is not suppressed, only late. Where a rule means "more than the odd blip",
       the count is the threshold and `for:` is `0m`. The three `increase(...) > 0` + `for: 0m`
       alerts are correct as written — their intent *is* the first increment. */ -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "chemclaw.name" . }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    {{- with .Values.monitoring.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: chemclaw.records
      rules:
        {{- /* Losing an audit row is not a degradation, it is a hole in the record of who ran
               what — and for a tool call that changed nothing durable, the trail is the only
               place it is recorded at all. `durable/retention.py` refuses to prune this table
               for the same reason. */}}
        - alert: ChemclawAuditTrailIncomplete
          expr: increase(chemclaw_audit_sink_failures_total[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawaudittrailincomplete
            summary: Audit records are not being persisted
            description: >-
              The audit sink failed to record at least one tool call in the last 10 minutes, so the
              trail is incomplete. Tool calls keep succeeding, which is why this is invisible
              without an alert. Check the `audit_sink_failure` log marker for the affected trail.

        {{- /* The three counters D-2026-08-08-a-degraded-check-must-not-clear-the-gate added. All
               three share one shape: a working-as-designed fallback that produced no signal, so
               the failing state and the healthy state were byte-identical on every dashboard.
               Declaring a counter and not alerting on it would have reproduced exactly that. */}}
        - alert: ChemclawVerifierDegraded
          expr: increase(chemclaw_verifier_degraded_total[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawverifierdegraded
            summary: Answers are being scored by the citation gate, not the judge
            description: >-
              The LLM judge is unreachable, so answers are scored for citation *resolvability*
              rather than *faithfulness* — the weaker of the two checks. Every affected turn is
              routed to human review, so this is also a review-queue load signal. Check the
              `verifier_degraded` log marker and the "verifier" model route.
        - alert: ChemclawUsageUnreadable
          expr: increase(chemclaw_usage_unreadable_total[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawusageunreadable
            summary: Token usage is unparseable, so the cost guard is not binding
            description: >-
              The model provider reported usage this build cannot read, so affected turns meter
              zero tokens: the budget guard admits them regardless of spend and every cost
              dashboard reads low. Critical because the failure mode is an unbounded bill that
              looks like an idle deployment. Usually an upstream rename of the usage keys.
        - alert: ChemclawDurableUnreachable
          expr: >-
            increase(chemclaw_durable_unreachable_total[10m])
            > {{ .Values.monitoring.alerts.durableUnreachableWarning }}
          for: 0m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawdurableunreachable
            summary: Temporal is not answering its health probe
            description: >-
              Chemists are being told durable jobs are unavailable. The threshold is what suppresses
              a single broker blip — that is reported on the turn's own stream and needs no page —
              while a sustained rate is an outage nothing else surfaces server-side. It is a count
              and not a `for:` because `increase(...) > 0` keeps returning a sample for the whole
              range window after one increment, so a `for:` under 10m would have paged on the blip
              anyway, five minutes late.

        {{- /* The PR-gate publish is best-effort by design (a dead git remote must not fail a
               finished calculation), so this counter is the only signal that knowledge is being
               dropped. Nothing else distinguishes it from an idle system. */}}
        - alert: ChemclawKnowledgeNotesLost
          expr: increase(chemclaw_notes_publish_failures_total[15m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawknowledgenoteslost
            summary: Knowledge notes are failing to reach the PR-gate
            description: >-
              A note could not be opened on a branch and the failure was swallowed so the job could
              complete. The knowledge is lost. Usual causes are a dead git remote, an expired push
              credential, or two processes sharing one `note_repo_dir` (the submit lock).

    - name: chemclaw.correctness
      rules:
        {{- /* The turn lease is what makes "one turn per session" true across pods (D-121). If
               refreshes fail the lease ages out mid-turn and a second turn can be admitted, which
               interleaves two conversations into one history. */}}
        - alert: ChemclawTurnLeaseFailing
          expr: increase(chemclaw_turn_claim_refresh_failures_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawturnleasefailing
            summary: The cross-process turn guard is lapsing
            description: >-
              A turn's lease could not be refreshed, so it may expire while the turn is still
              running and admit a second turn on the same session.


    - name: chemclaw.availability
      rules:
        - alert: ChemclawTurnsFailing
          expr: >-
            sum(rate(chemclaw_turns_failed_total[10m]))
            / clamp_min(sum(rate(chemclaw_turns_started_total[10m])), 0.001) > 0.1
          for: 10m
          labels:
            severity: critical
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawturnsfailing
            summary: More than 10% of turns are ending in an error
            description: Every failure reaches a chemist as an opaque internal-error message.

        {{- /* The other direction from the shed alert below, and the one nothing could see. The
               admission cap is per-process, so the fleet's real demand on the shared LLM endpoint
               is the sum across pods. `Settings` refuses a configuration whose *declared* product
               exceeds the ceiling — but that check runs on the shape the chart rendered, and it
               never re-runs: a `kubectl scale`, an HPA edited in the cluster, or a stuck rollout
               leaving old and new replicas up together all push the live sum past the ceiling with
               every pod's own config still perfectly valid. Comparing the two gauges is the only
               way to see it. Self-disabling: the ceiling gauge is 0 when undeclared. */}}
        - alert: ChemclawFleetAboveItsTurnCeiling
          expr: >-
            max(chemclaw_fleet_turn_ceiling) > 0
            and sum(chemclaw_turn_capacity) > max(chemclaw_fleet_turn_ceiling)
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawfleetaboveitsturnceiling
            summary: The front-door fleet can admit more concurrent turns than it is allowed to
            description: >-
              More front-door pods are running than the declared fleet ceiling accounts for, so the
              shared LLM endpoint can be offered more concurrent turns than its throughput budget
              permits. Usual causes are a manual scale, an HPA `maxReplicas` edited in the cluster,
              or a rollout that left both generations up. Either scale back or raise
              `CHEMCLAW_SERVICE_FLEET_MAX_CONCURRENT_TURNS` with a number the endpoint can serve.

        - alert: ChemclawTurnsShed
          expr: sum(rate(chemclaw_turns_shed_total[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawturnsshed
            summary: Turns are being rejected for lack of admission capacity
            description: >-
              The admission guard is shedding load (503). Either the deployment is undersized or
              `service_max_concurrent_turns` is set below what the LLM endpoint can serve.

        {{- /* A degraded turn still answers, from whatever tools came up — which is the right
               behaviour and exactly why it needs an alert: the transcript of a degraded answer is
               indistinguishable from a good one. */}}
        - alert: ChemclawConnectorsUnhealthy
          expr: max(chemclaw_connectors_unhealthy) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawconnectorsunhealthy
            summary: One or more connectors are unreachable
            description: >-
              Turns are being answered without these capabilities and nothing in the answer says
              so.

        {{- /* The request-path sibling of ChemclawDurableUnreachable, and separate from it on
               purpose (D-2026-08-08-a-rollback-that-is-not-a-schema-step): that alert reads a
               per-turn Temporal probe, this one reads per-request shedding for *any* unavailable
               subsystem — pgvector's `DocumentIndexError` among them. Summing them made one rate
               out of two populations with two denominators. `for: 0m` because, unlike a probe that
               only degrades a turn's stream, every increment here is a request already refused. */}}
        - alert: ChemclawSubsystemUnavailable
          expr: increase(chemclaw_subsystem_unavailable_total[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawsubsystemunavailable
            summary: Requests are being shed because a subsystem is unavailable
            description: >-
              Callers are getting 503s because a dependency the route needed did not answer — the
              durable broker or the document index. The `shedding` log line on the same pod names
              the method, the path and the subsystem.

        {{- /* The one identity failure that is silent on both sides. Past ~150 group memberships
               Entra sends `_claim_names` instead of `groups`, so the users with the MOST access
               arrive with no group-derived entitlement at all — a gated document share simply
               returns nothing, and the only other trace is a WARNING on a pod's stdout. There is
               no fix at request time (resolving the overage needs a Graph call, which D-089 does
               not permit); the remedy is to assign the group to an app role instead, which arrives
               as a normal `roles` value. Warning rather than critical: nothing is broken, someone
               is quietly under-entitled. */}}
        - alert: ChemclawGroupClaimOverage
          expr: increase(chemclaw_group_claim_overage_total[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawgroupclaimoverage
            summary: A token arrived with more groups than it could carry
            description: >-
              A user's Entra token replaced `groups` with `_claim_names`, so none of their
              group-derived entitlements could be read and any group-gated corpus will answer
              emptily for them. The `overage` log line on the same pod names the user. Assign the
              group to an app role so it arrives in the `roles` claim instead.

        - alert: ChemclawDatabaseUnavailable
          expr: increase(chemclaw_db_unavailable_total[5m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawdatabaseunavailable
            summary: Postgres is unreachable from the front door
            description: >-
              Sessions, the audit trail and the calculation cache all live there; a turn that
              cannot reach it fails or silently degrades to log-only auditing.

        {{- /* D-119 introduced `requests_waiting` as *the* reading that distinguishes "the pool is
               too small" from "the database is down" — the pair that presented as connect timeouts
               against an idle server — and nothing has ever consumed it. Alerting on it is the
               whole reason it exists. Deliberately `max()` across pods and not a rate: one
               saturated process is one process whose requests are queueing, and averaging that
               away across a healthy fleet is how a per-pod saturation stays invisible. */}}
        - alert: ChemclawPgPoolSaturated
          expr: max(chemclaw_pg_pool_requests_waiting) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawpgpoolsaturated
            summary: Callers are queueing for a Postgres connection
            description: >-
              A process has more concurrent database work than `CHEMCLAW_PG_POOL_MAX_SIZE` allows,
              so callers wait and then fail as `ConnectionError` after
              `CHEMCLAW_PG_POOL_TIMEOUT_SECONDS`. Raise the pool (and `postgres.maxConnections`
              with it — `Settings` refuses a pair that stops agreeing) or lower the concurrency
              feeding it: `CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS` on the front door,
              `CHEMCLAW_WORKER_MAX_CONCURRENT_ACTIVITIES` on a worker.

        {{- /* The other direction, and the one no single pod can see: `Settings` refuses a
               configuration whose declared product exceeds the ceiling, but it validates the shape
               the chart rendered and never re-runs. A `kubectl scale`, an in-cluster HPA edit, or a
               stuck rollout leaving both generations up all push the live sum past what the server
               will serve, with every pod's own config still perfectly valid — the same blind spot
               `ChemclawFleetAboveItsTurnCeiling` covers for turns. Self-disabling: the ceiling
               gauge is 0 when undeclared. */}}
        - alert: ChemclawFleetAboveItsConnectionCeiling
          expr: >-
            max(chemclaw_pg_fleet_max_connections) > 0
            and sum(chemclaw_pg_pool_max_size) > max(chemclaw_pg_fleet_max_connections)
          for: 10m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawfleetaboveitsconnectionceiling
            summary: The fleet can open more Postgres connections than it is allowed to
            description: >-
              More pooled processes are running than `postgres.maxConnections` accounts for, so the
              database can be asked for more connections than it will serve — which surfaces as
              connect failures against a server that is not busy. Either scale back or raise
              `postgres.maxConnections` with a number from the server's own `max_connections`.

    - name: chemclaw.cost
      rules:
        - alert: ChemclawTokenBurnHigh
          expr: sum(rate(chemclaw_tokens_total[30m])) * 3600 > {{ .Values.monitoring.alerts.tokensPerHourWarning }}
          for: 30m
          labels:
            severity: warning
          annotations:
            runbook_url: {{ .Values.monitoring.alerts.runbookBaseUrl }}#chemclawtokenburnhigh
            summary: Token consumption is above the configured hourly expectation
            description: >-
              The per-process budget guard bounds one runaway process; it says nothing about the
              fleet. This is the fleet-wide signal.
{{- end }}

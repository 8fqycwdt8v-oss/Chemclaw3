{{- /* Schema migrations as a pre-deploy Helm hook (F6-T4, D-034): they run to completion before */ -}}
{{- /* the app rolls out, so no app container ever races the DDL. `make db-migrate` == this command. */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chemclaw.name" . }}-migrate
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrateJob.backoffLimit }}
  {{- /* A `pre-upgrade` hook with no deadline is a release that can hang forever. Helm waits for
         the hook, so a Job that keeps retrying leaves the release `pending-upgrade` — a state that
         blocks the next `helm upgrade` and that an operator has to know to clear (see the runbook).
         With a deadline the Job fails, Helm reports it, and the recovery is the documented one.

         Written as a value rather than derived from the migrator's own lock budgets, unlike the
         drain grace periods in the Deployments. The honest reason is that there is nothing sound to
         derive it from: this bounds the Job *including* every `backoffLimit` retry, and the term it
         would need — how long this deployment's slowest `CREATE INDEX` takes on its own data — is
         not a number this chart can know. So it is a stated default an operator raises for a large
         database, not a formula pretending to compute one. */}}
  activeDeadlineSeconds: {{ .Values.migrateJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          {{- /* Migrate, then reconcile the runtime role's privileges — in that order, in this
                 Job, because the grants name tables the migrations create and a grant applied
                 before its table exists fails. One container rather than a second hook Job so the
                 ordering is the shell's `&&` rather than a hook weight two files apart, and so a
                 failed migration cannot be followed by a grant run at all.

                 `db-grants` is separate from `db-migrate` in the Makefile and re-run on *every*
                 release, unlike the migrations, which are applied once per file and tracked: a
                 grant is a reconciliation against a schema that keeps growing and a role that may
                 be created at any time (D-2026-08-05-append-only-by-grant-not-by-contract). */}}
          command:
            - sh
            - -c
            - python -m chemclaw.core.migrate && python -m chemclaw.agent.message_migration
              && python -m chemclaw.core.grants
          env:
            {{- include "chemclaw.env" . | nindent 12 }}
            {{- include "chemclaw.migrationEnv" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.connector | nindent 12 }}

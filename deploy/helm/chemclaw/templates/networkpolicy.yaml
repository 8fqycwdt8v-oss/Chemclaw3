{{- if .Values.networkPolicy.enabled }}
{{- /* Egress. DNS is always allowed so the names below resolve; everything else is the
       destination list plus the port list.

       **`to: []` means "anywhere", not "nothing".** That is what this rule shipped as, so TCP/443
       to any host on the internet was permitted from every pod — while `tests/test_no_egress.py`
       enforced "this system takes no external sources" (D-089) by scanning *source code* for host
       literals. That scan is a good guard against a developer adding a third-party API and no
       guard at all against a compromised dependency, an injected tool argument, or anything else
       that reaches the network at runtime. The layer that could enforce the decision did not.

       `egressDestinations` is how an operator states where these pods may actually talk. It is
       empty by default because the addresses are deployment-specific and this chart must not
       invent someone's Postgres CIDR.

       **A named knob and a comment were not enough, and that is what this `fail` is.** Empty
       rendered `to: []` — every destination on the allowed ports — while the object in the
       cluster read as "egress is restricted", and the only thing saying otherwise was a comment
       in a file nobody re-reads after the first install. So the choice is now unavoidable rather
       than merely documented: exactly one of `egressDestinations` (where these pods may talk) or
       `allowAnyDestination: true` (the deliberate, greppable statement that they may talk
       anywhere on those ports) must be set, and a release that states neither — or both — does
       not render.

       It fails at `helm install`, which is the loudest place available and the only one an
       operator cannot skip. The cost is that `helm template` on the shipped defaults needs one
       `--set`; the Makefile's two renders, the runbook and `deploy/README.md` all pass it, and
       that visible flag in an operator's own values file is the whole point. */ -}}
{{- /* `empty` on both sides, so the test reads as "these two say the same thing", which is
       exactly the contradiction: neither stated (silent allow-all) or both stated (a destination
       list that the flag beside it makes meaningless). */ -}}
{{- if eq (empty .Values.networkPolicy.egressDestinations) (empty .Values.networkPolicy.allowAnyDestination) }}
{{- fail "networkPolicy: set exactly one of `egressDestinations` (a list of NetworkPolicyPeer objects saying where these pods may talk) or `allowAnyDestination: true` (any destination on egressPorts, which is not a safe end state but is now a stated one). Neither is set, or both are." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chemclaw.name" . }}-egress
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- /* DNS to the cluster, separated from the rule below so narrowing the destinations can
           never accidentally take name resolution with it — a policy that blocks DNS fails in a
           way that looks like every dependency being down at once. */}}
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- /* `[]` here means *anywhere*, which is only reachable via `allowAnyDestination: true`:
               the guard above refuses the render otherwise. */}}
        {{- if .Values.networkPolicy.egressDestinations }}
        {{- toYaml .Values.networkPolicy.egressDestinations | nindent 8 }}
        {{- else }}
        []
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.postgres }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.temporal }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.https }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.llm }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.otel }}
        {{- /* The connector Services. Read from `connectorPort` rather than a second egressPorts
               entry, so the port the front door is allowed to dial is the port the connector
               containers actually listen on — one value, no drift. */}}
        - protocol: TCP
          port: {{ .Values.connectorPort }}
        {{- /* The `chem`/`safety`/`calc` sibling servers this release dials but does not run —
               plain HTTP on their own ports, not `egressPorts.https`. Without these, an operator
               who follows `values.yaml`'s own instruction to add the host to
               `egressDestinations` still has every packet dropped, because a NetworkPolicy egress
               rule restricts by port independently of the destination list. */}}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.chem }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.safety }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.calc }}
        {{- /* And the reaction labeller, which the `reaction-labels` Schedule dials from the
               background worker whenever a data source provides reactions. Same rule, same trap:
               a port entry that is never emitted here permits nothing. */}}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egressPorts.rxnlabel }}
---
{{- /* The front door's own ingress, which did not exist. `policyTypes` listed only `Egress`, so any
       pod in any namespace could open a connection to `chemclaw-service:8080`. This is the rule
       that bounds that.

       **What it does not do is contain `/metrics`.** This rule shipped asserting that it did, and
       `api/app.py` justified serving `/metrics` unauthenticated on the same grounds. Both were
       wrong in the same way: a NetworkPolicy selects *peers*, not paths, and one of the peers it
       must allow is the router — which fronts a Route that declares no `spec.path` and therefore
       publishes every path the front door serves, `/metrics` among them, on the external host. A
       rule that has to permit the router cannot also hide a route behind it.

       What bounds the exposition is D-152's declared-label allowlist (counts, capacity and an
       operator-chosen `profile` — never a session id, an actor, or turn content), enforced in
       `tests/test_metrics.py` where it can be. The residual exposure is operational
       reconnaissance, and `route.ipWhitelist` is the control for a deployment that will not take
       it. This comment names that split rather than claiming a containment this object cannot
       provide — the failure being repaired is not the missing rule, it is three places asserting a
       compensating control and none of them holding.

       Ingress is allowed from the router (so the Route works), from the monitoring namespace (so
       the ServiceMonitor can scrape), and from Chemclaw's own pods. Both namespace selectors are
       values, because the labels differ between OpenShift and vanilla Kubernetes — and because
       getting them wrong locks the front door, this rule has its own toggle. Without one, an
       operator whose router carries different labels would have to disable `networkPolicy`
       wholesale and lose the egress rule with it, which is the opposite of what they need. */ -}}
{{- if .Values.networkPolicy.serviceIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chemclaw.name" . }}-service-ingress
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chemclaw.selectorLabels" . | nindent 14 }}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
---
{{- end }}
{{- /* Connectors accept traffic only from Chemclaw's own pods. This is the boundary that makes the
       advisory X-Chemclaw-* identity headers safe: they are not authorization, so a connector must
       not be reachable by anything that could forge them. Authorization itself stays in core
       (`agents.tool_authz`) — this policy is the second lock, not the first. */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chemclaw.name" . }}-connector-ingress
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $name, $cfg := .Values.connectors }}
          {{- if $cfg.enabled }}
          - connector-{{ $name }}
          {{- end }}
          {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chemclaw.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.connectorPort }}
    {{- /* And the scraper, since a connector serves `/metrics` on that same port
           (D-2026-08-01-every-process-carries-its-own-witness). Worth stating what this costs: the
           port also carries `/mcp`, so this grant is not "metrics only" and cannot be made so
           without a second listener in the process — which `make connectors`, running every bundle
           in one process, could not bind. It is accepted because the sentence above is already the
           right one: this policy is "the second lock, not the first". A connector authorizes
           nothing itself; core's `agent/tool_authz` does, and the `X-Chemclaw-*` headers are
           advisory by construction. The monitoring stack is a cluster component, and the list is a
           value an operator narrows or empties. */}}
    {{- range .Values.networkPolicy.monitoringNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.connectorPort }}
    {{- end }}
---
{{- /* The worker pods' probe port. New with the port itself: workers had no listener at all, so
       they were selected by no Ingress policy and — because NetworkPolicy only restricts pods some
       Ingress rule selects — accepted everything by default. Opening 9000 without this would have
       made that default reachable rather than merely theoretical.

       Narrow in a way the connector rule above cannot be: this port serves `/healthz`, `/readyz`
       and `/metrics` and nothing else, so granting the monitoring namespace grants exactly the
       scrape. Chemclaw's own pods are allowed for the same reason they are everywhere else — the
       kubelet's probes come from the node, not from a pod, and are never matched by a
       NetworkPolicy peer at all. */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chemclaw.name" . }}-worker-ingress
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - background-worker
          {{- range $name, $cfg := .Values.connectors }}
          {{- if and $cfg.enabled $cfg.worker }}
          - connector-worker-{{ $name }}
          {{- end }}
          {{- end }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chemclaw.selectorLabels" . | nindent 14 }}
        {{- range .Values.networkPolicy.monitoringNamespaces }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.workerMetricsPort }}
{{- end }}

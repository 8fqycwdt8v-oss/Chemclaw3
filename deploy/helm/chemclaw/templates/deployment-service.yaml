apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" . }}-service
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  {{- if not .Values.service.autoscaling.enabled }}
  replicas: {{ .Values.service.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
  template:
    metadata:
      annotations:
        {{- include "chemclaw.configChecksum" . | nindent 8 }}
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      {{- include "chemclaw.spreadAcrossNodes" (dict "Release" .Release "component" "service") | nindent 6 }}
      {{- /* A turn runs up to `CHEMCLAW_SERVICE_TURN_TIMEOUT_SECONDS`, and the default grace period
             is 30 s — so every rolling update, node drain and scale-down SIGKILLed whatever turns
             were in flight, at a point where the conversation state that made them resumable lives
             in the pod's memory (D-121). Derived from the turn budget plus the router drain rather
             than written as a number, so raising one raises the other; `tests/test_deploy_chart.py`
             pins both the derivation and that the ConfigMap key it reads exists.

             `required`, because `int nil` is `0`: without it an absent key rendered
             `terminationGracePeriodSeconds: 15` — a plausible-looking number, and the SIGKILL this
             comment says was fixed. */}}
      terminationGracePeriodSeconds: {{ add (int (required "config.CHEMCLAW_SERVICE_TURN_TIMEOUT_SECONDS must be set: the front door terminationGracePeriodSeconds is derived from it" .Values.config.CHEMCLAW_SERVICE_TURN_TIMEOUT_SECONDS)) (int .Values.service.drainSeconds) }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      containers:
        - name: service
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "service"
            {{- include "chemclaw.otelResourceEnv" (dict "component" "service") | nindent 12 }}
            {{- include "chemclaw.env" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          ports:
            - containerPort: {{ .Values.service.port }}
          {{- /* The same gap the connector servers had, one process bigger: this one imports
                 langchain, deepagents and RDKit and runs a connector sweep before uvicorn accepts
                 anything. `initialDelaySeconds: 10` with the default `failureThreshold: 3` and a
                 20 s period put the first liveness restart at ~70 s, which a cold or throttled node
                 spends inside the import. A `startupProbe` removes the guess: liveness and
                 readiness are suspended until the process answers once, and the two periods below
                 stay tuned for a running process. */}}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            periodSeconds: {{ .Values.probes.service.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.service.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.service.startup.timeoutSeconds }}
          {{- /* `/readyz` sweeps the connectors and then asks Postgres, so it is the one probe in
                 this chart whose *own* work has a budget — and Kubernetes' unstated default is
                 `timeoutSeconds: 1`, which a blackholed broker exceeds on the queue leg alone.
                 The numbers and the arithmetic behind them are in `values.yaml`. */}}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.probes.service.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.service.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.service.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: {{ .Values.probes.service.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.service.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.service.liveness.failureThreshold }}
          {{- /* Kubernetes removes the Endpoint and sends SIGTERM concurrently, so a pod that shut
                 down promptly would refuse requests the router was still sending it. The sleep is
                 the whole hook: it does not drain anything itself, it buys the router time to stop
                 choosing this pod, and uvicorn's own SIGTERM handling finishes the turns already
                 in flight. `exec sleep` rather than `httpGet` because there is no endpoint whose
                 meaning is "wait". */}}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ .Values.service.drainSeconds | quote }}]
          resources:
            {{- toYaml .Values.resources.service | nindent 12 }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" . | nindent 12 }}
            {{- include "chemclaw.knowledgeMounts" . | nindent 12 }}
        {{- include "chemclaw.knowledgeSidecar" . | nindent 8 }}
      {{- /* The clone before the publish: `git clone` refuses a non-empty destination and the
             published tree lives inside the clone (`chemclaw.knowledgePublishPath`). Init
             containers run in declaration order, so this order is the dependency. */}}
      initContainers:
        {{- include "chemclaw.noteRepoInit" . | nindent 8 }}
        {{- include "chemclaw.knowledgeInit" . | nindent 8 }}
      volumes:
        {{- include "chemclaw.volumes" . | nindent 8 }}
        {{- include "chemclaw.noteRepoVolume" . | nindent 8 }}

{{- /* The retention posture must be stated, exactly as the egress posture must
       (D-2026-08-26-a-knob-that-renders-nothing-is-not-a-knob): every window in `Settings`
       defaults to disabled, so a chart that rendered without asking shipped tables that grow for
       the deployment's lifetime under a comment naming retention as the bound. Evaluated here at
       the top of the file so *any* render refuses, not only one that reaches a particular
       document. */ -}}
{{- /* And the escape hatch must be a real boolean before the emptiness test below sees it.

       `networkpolicy.yaml`'s twin has carried this guard since it shipped and calls `--set-string`
       "the single most likely way to get this wrong"; this half never grew one. Go templates treat
       every non-empty string as truthy and `empty` agrees, so `unboundedGrowthAccepted: "false"` —
       an operator writing down what they do *not* want, or `--set-string` — satisfied the gate
       while reading as off, and the release ran with every durable table growing forever behind a
       values file that says it must not. That is this gate's own failure mode reached through its
       own escape hatch, which is exactly the shape the egress guard already refuses.

       Before the emptiness check rather than beside it: `empty` is what misreads the string, so the
       type has to be settled first or the condition below decides on a value it cannot see. */ -}}
{{- if kindIs "string" .Values.retention.unboundedGrowthAccepted }}
{{- fail (printf "retention.unboundedGrowthAccepted must be a boolean, not the string %q — a quoted boolean is truthy in Helm and would satisfy the retention posture gate while reading as off, leaving every durable table growing forever. Set it as `unboundedGrowthAccepted: true`/`false` (no quotes), and do not pass it via --set-string." .Values.retention.unboundedGrowthAccepted) }}
{{- end }}
{{- if eq (empty .Values.retention.windows) (empty .Values.retention.unboundedGrowthAccepted) }}
{{- fail "retention: set exactly one of `retention.windows` (the CHEMCLAW_RETENTION_* day windows this release keeps history for) or `retention.unboundedGrowthAccepted: true` (the durable tables grow forever, which is not a safe end state but is now a stated one). Neither is set, or both are." }}
{{- end }}
{{- /* And a stated window must name a setting something reads.

       `retention.windows` is a free-form map rendered straight into the ConfigMap, so a misspelled
       key *satisfied* the gate above: the release states a posture, `helm install` succeeds, the
       ConfigMap says `CHEMCLAW_RETENTION_ENABLED: "true"` — and pydantic-settings ignores an
       unknown prefixed environment variable, so every window stays at its disabled default. The
       sweep then runs on schedule and prunes nothing while every signal reports retention on,
       which is the failure the posture gate exists to prevent, reached through its own escape
       hatch. `CHEMCLAW_RETENTION_AUDIT_DAYS` was the instance: it is not a setting, and it had
       been the worked example in this repository's own test since the gate shipped.

       The names are the `retention_*` fields of `core/config/memory.py`, upper-cased under the
       `CHEMCLAW_` prefix, minus `_ENABLED` which is derived below.
       `tests/test_deploy_chart.py::test_a_retention_window_naming_no_setting_refuses_to_render`
       renders this chart against that field set, both ways, so the list cannot fall behind the
       settings it mirrors. */ -}}
{{- $retentionSettings := list "CHEMCLAW_RETENTION_CHECKPOINTS_DAYS" "CHEMCLAW_RETENTION_DELETE_BATCH_ROWS" "CHEMCLAW_RETENTION_MAX_SESSIONS_PER_PASS" "CHEMCLAW_RETENTION_RESULT_PUBLICATIONS_DAYS" "CHEMCLAW_RETENTION_SCHEDULE_MINUTES" "CHEMCLAW_RETENTION_SESSION_EVENTS_DAYS" "CHEMCLAW_RETENTION_SESSION_MESSAGES_DAYS" "CHEMCLAW_RETENTION_TIMEOUT_SECONDS" "CHEMCLAW_RETENTION_TOOL_RESULTS_DAYS" -}}
{{- range $key, $value := .Values.retention.windows }}
{{- if eq $key "CHEMCLAW_RETENTION_ENABLED" }}
{{- fail "retention.windows: CHEMCLAW_RETENTION_ENABLED is derived from this block rather than written into it — stating a window is what turns retention on. Written by hand it renders the key twice, and every parser silently keeps the last. Remove it." }}
{{- end }}
{{- if not (has $key $retentionSettings) }}
{{- fail (printf "retention.windows: %q is not a retention setting, so it would render into the ConfigMap and be read by nothing — a release that states a retention posture and prunes nothing. Use one of: %s" $key (join ", " $retentionSettings)) }}
{{- end }}
{{- end }}
{{- /* And which Temporal this release owns, by the same rule and for a sharper reason: the value
       that has to be stated here is not a posture but a *discriminator*, and it shipped as the
       constant `"chemclaw"` inside `config`.

       `CHEMCLAW_TEMPORAL_ADDRESS` names one broker for the whole cluster. Inside it the namespace
       is the only boundary: the background queue is the constant `background-jobs`,
       `durable/schedules.py`'s `OWNED_SCHEDULE_IDS` is a set of bare constants, and `_prune`
       deletes every one of them this release did not plan — it cannot tell a peer's Schedule from
       a leftover of its own. Measured against a live broker, a second release's `helm upgrade`
       rewrote the first's `eln-sync` to a different workflow type at a different interval and
       deleted its `eval-drift` outright. `values.yaml`'s `temporal:` block carries the whole
       measurement.

       So there is no default: a default is precisely what two releases would share. */ -}}
{{- if not .Values.temporal.namespace }}
{{- fail (printf "temporal.namespace is not set, and this chart ships no default for it. `CHEMCLAW_TEMPORAL_ADDRESS` names one broker for the whole cluster, and inside it the Temporal namespace is the only thing separating two ChemClaw releases: the background task queue is a constant, every Schedule id is a constant, and a second release's `helm upgrade` rewrites this one's Schedules and deletes the ones it does not itself plan. Give this release a namespace of its own — %q is unique by construction here — and register it on the broker. (A shared Postgres is the same hazard and this does not cover it: two releases need their own database too.)" .Release.Namespace) }}
{{- end }}
{{- if hasKey .Values.config "CHEMCLAW_TEMPORAL_NAMESPACE" }}
{{- fail "config.CHEMCLAW_TEMPORAL_NAMESPACE is derived from `temporal.namespace` rather than written into this block — written by hand it renders the key twice, every parser keeps the last, and the gate above would be checking a value nothing reads. Remove it and set `temporal.namespace`." }}
{{- end }}
{{- /* And the growth the windows above do not bound.

       `artifact_blobs` is swept by a *different* job (`ArtifactEvictionWorkflow`), on a different
       schedule, under two settings that are not `CHEMCLAW_RETENTION_*` and both default to 0 = off.
       None of the nine windows reaches it. So a release that carefully stated a retention posture
       still had an unbounded artifact store and was never asked — the gate above satisfied, the
       operator's belief that growth is bounded wrong, and nothing anywhere saying which half was
       covered.

       Asked only on the `windows` arm, which is what keeps this from being a third `--set` at every
       render site. `unboundedGrowthAccepted: true` already says the durable tables grow forever;
       that statement is true of this table too and nothing more needs stating. It is the *other*
       arm — the release that says "I bound my growth" — whose statement was incomplete.

       Two bounds and no cadence: `CHEMCLAW_ARTIFACT_EVICTION_SCHEDULE_MINUTES` is how often the
       sweep runs rather than whether anything is bounded, so it goes in `config:` like any other
       setting. Listing it here would let a release state a posture with a key that bounds
       nothing, which is the defect the `$retentionSettings` allow-list above exists to stop. */ -}}
{{- $artifactSettings := list "CHEMCLAW_ARTIFACT_EVICT_IDLE_DAYS" "CHEMCLAW_ARTIFACT_STORE_MAX_BYTES" -}}
{{- /* And the escape hatch must be a real boolean, for the reason `networkpolicy.yaml` states at
       length: Go templates treat every non-empty string as truthy and `empty` agrees, so
       `artifactGrowthAccepted: "false"` — or `--set-string`, the single most likely way to get
       this wrong — would satisfy the gate below while reading as off, and the artifact store would
       grow unbounded behind a values file that says it must not. */ -}}
{{- if kindIs "string" .Values.retention.artifactGrowthAccepted }}
{{- fail (printf "retention.artifactGrowthAccepted must be a boolean, not the string %q — a quoted boolean is truthy in Helm and would satisfy this gate while reading as off, leaving the artifact store unbounded. Set it as `artifactGrowthAccepted: true`/`false` (no quotes), and do not pass it via --set-string." .Values.retention.artifactGrowthAccepted) }}
{{- end }}
{{- if .Values.retention.windows }}
{{- if eq (empty .Values.retention.artifactStore) (empty .Values.retention.artifactGrowthAccepted) }}
{{- fail "retention: this release states retention windows, which bound nine tables and not `artifact_blobs` — that store is swept by its own job under CHEMCLAW_ARTIFACT_STORE_MAX_BYTES / CHEMCLAW_ARTIFACT_EVICT_IDLE_DAYS, both of which default to 0 (off). Set exactly one of `retention.artifactStore` (either or both of those two keys) or `retention.artifactGrowthAccepted: true` (calculation by-products accumulate without bound, which is now a stated posture). Neither is set, or both are." }}
{{- end }}
{{- end }}
{{- range $key, $value := .Values.retention.artifactStore }}
{{- if not (has $key $artifactSettings) }}
{{- fail (printf "retention.artifactStore: %q is not an artifact-eviction bound, so it would render into the ConfigMap and be read by nothing — a release that states an artifact posture and evicts nothing. Use one of: %s (the sweep's cadence is CHEMCLAW_ARTIFACT_EVICTION_SCHEDULE_MINUTES and belongs in `config`, because it is not a bound)." $key (join ", " $artifactSettings)) }}
{{- end }}
{{- end }}
{{- /* **This file renders the configuration twice, and the duplication is the fix.**

       All of it used to be a single `pre-install,pre-upgrade` hook. Helm does not record hook
       resources in the release manifest, so they are not what `helm rollback` restores and not what
       `helm uninstall` removes — and `helm rollback` runs only `pre-rollback`/`post-rollback` hooks,
       which this chart declares none of. Measured against a real API server: a rollback reverted
       every Deployment (including its `checksum/config` annotation, so every pod restarted) while
       the ConfigMap those pods read still held the *new* release's values, and Helm printed
       "Rollback was a success!". The sharpest instance is a connector: rolling back a release that
       set `connectors.bo.enabled=false` restored `chemclaw-connector-bo`'s Deployment and Service
       while `CHEMCLAW_CONNECTORS_ENABLED` still omitted `bo` — the pods run and the capability
       stays dark.

       So the objects the *pods* read are ordinary tracked resources now, and the pre-install
       migrate Job — which Helm runs before any ordinary resource exists — gets its own hook-scoped
       copies. Two objects cannot share a name across that boundary (Helm refuses to adopt a hook
       into the manifest), so a rename is necessary. **It is not sufficient, and this comment
       shipped saying it was** ("the rename is the load-bearing part rather than the annotation"):
       renaming the *hook* copies leaves the tracked ones claiming the two names every live release
       already holds, and both directions across that boundary then break. Measured against a real
       API server (k3s v1.29.9), on a release installed from the previous chart:

         * `helm upgrade` fails at prepare time, before a hook runs — the live objects were created
           by `execHook`, which does a plain `Create` with no metadata visitor, so they carry no
           `meta.helm.sh/release-name`/`-namespace` and Helm refuses to import them. `--dry-run`
           refuses identically, which is what keeps this from being silent: `openshift.sh` defaults
           to `DRY_RUN=true`, so nothing is half-applied. The one-time adoption an operator runs is
           in `deploy/README.md` § "Upgrading a release installed before this chart" and in
           `docs/guides/runbook.md`; `openshift.sh` performs it for the release path.
         * `helm rollback` to a pre-change revision *deletes* both objects — they are in the current
           manifest and not in that one — while restoring Deployments that name `chemclaw-config` in
           a non-optional `envFrom` and run as ServiceAccount `chemclaw`. Helm prints "Rollback was
           a success!" and every pod is then unstartable. That is why the two carry
           `chemclaw.rollbackKeepPolicy` below.

       The hook copies are rendered from the same values in the same release, so they cannot
       disagree with the tracked ones; on an *upgrade* they are also the more correct source, since
       at `pre-upgrade` the tracked ConfigMap still holds the previous release's values. They carry
       `hook-succeeded` so they are gone once the migration is done, and the `post-install`/
       `post-upgrade` Jobs read the tracked objects instead — by then the manifest is applied, and
       `chemclaw-convert` runs as the runtime role against the release that is now live.

       The `data:` body is a `define` for the ordinary reason: two copies of it would be two
       configurations that only have to agree. `chemclaw.configChecksum` hashes this whole file, so
       every key still reaches the pod annotation that forces the rollout. */ -}}
{{- define "chemclaw.configData" -}}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- /* Derived from `retention.windows` rather than hand-written in `config`, so stating a
         window and forgetting the enable switch cannot happen — the switch exists only as a
         consequence of a stated window. */}}
  {{- if .Values.retention.windows }}
  CHEMCLAW_RETENTION_ENABLED: "true"
  {{- range $key, $value := .Values.retention.windows }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- /* The artifact-eviction bounds, from `retention.artifactStore` rather than `config`, so the
         posture the gate at the top of this file checked is the posture that reaches the pod.
         There is no derived enable switch to go with them, unlike retention's: `planned_schedules`
         creates the eviction Schedule when either bound is non-zero, so a stated bound *is* the
         switch and a second one could only disagree with it. */}}
  {{- range $key, $value := .Values.retention.artifactStore }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- /* Derived from the knowledge volume layout rather than hand-written in `config`, so the
         path the note writer writes to can never drift from the volume it is mounted on
         (gap DEP-2). Together with `CHEMCLAW_KNOWLEDGE_DIR` above it is also what every *reader*
         resolves — `Settings.knowledge_path` is the two joined — which is why the knowledge-sync
         containers take their publish target from the same pair (`chemclaw.knowledgePublishPath`)
         instead of a `publishPath` value of their own. */}}
  CHEMCLAW_NOTE_REPO_DIR: {{ .Values.knowledge.noteRepoPath | quote }}
  {{- /* Derived from `temporal.namespace` rather than hand-written in `config`, for the reason the
         two above are and one more: this is the only string separating two releases on one broker,
         so the value the gate at the top of this file refused to leave unstated has to be the same
         value the pods read. Written in both places it renders twice and the parser keeps the
         last — which is why writing it in `config` is refused rather than merged. */}}
  CHEMCLAW_TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  {{- /* Derived from `.Values.connectors` rather than hand-written in `config`, for the same reason
         the note-repo dir is: the address the front door dials must be the Service that the same
         value block created. Only the enabled connectors appear, so a disabled bundle is simply
         unreachable rather than pointing at a Service with no pods. */}}
  CHEMCLAW_CONNECTOR_URLS: {{ include "chemclaw.connectorUrls" . | quote }}
  {{- /* And which of them the agent loads at all, from the same block for the same reason — see
         `chemclaw.connectorsEnabled`. Without it, `enabled: false` took a bundle's pods away and
         left its tools advertised, so the switch this file documents did half of what it says. */}}
  CHEMCLAW_CONNECTORS_ENABLED: {{ include "chemclaw.connectorsEnabled" . | quote }}
  {{- /* And *where* the bundles those two names are discovered from live, when this release mounts
         any the image does not ship (`extraConnectors` in `values.yaml`).

         Conditional on the list rather than always written, because setting it at all replaces the
         code's own default outright — `connectors_dir` is a plain pathsep list, not an extension
         point — so an unconditional value would be a second statement of the image's layout on
         every release, including the ones that mount nothing. The mounted directory comes first:
         earlier directories win a name collision, which is the precedence `registry._bundle_dirs`
         documents and the fleet's `manifests/` relies on for `chem` and `safety`. */}}
  {{- if .Values.extraConnectors.bundles }}
  CHEMCLAW_CONNECTORS_DIR: {{ printf "%s:%s" .Values.extraConnectors.mountPath .Values.extraConnectors.shippedPath | quote }}
  {{- end }}
  {{- /* Derived from the autoscaling block rather than hand-written in `config`, and for the
         sharpest version of the same reason: the admission cap is per-process, so the load the
         shared LLM endpoint really sees is `this × uvicorn workers × the cap`. Written by hand it
         would be a second copy of `maxReplicas` that goes stale the first time someone scales the
         front door — which is exactly the silent multiplication
         `CHEMCLAW_SERVICE_FLEET_MAX_CONCURRENT_TURNS` exists to catch. Derived, it is the same
         number the HPA obeys. When the HPA is off, the fixed replica count is that number. */}}
  CHEMCLAW_SERVICE_FLEET_REPLICAS: {{ include "chemclaw.frontDoorProcesses" . | quote }}
  {{- /* The same two counts at a rolling update's peak, which is what `Settings` checks
         `postgres.maxConnections` against: an upgrade runs both generations, so it is when the
         fleet holds the most connections it ever holds. Both, always together — the connection
         sum charges one narrow `/readyz` pool per front-door pod, so peak pools against a steady
         replica count would under-declare that term. */}}
  CHEMCLAW_SERVICE_FLEET_REPLICAS_AT_ROLLOUT_PEAK: {{ include "chemclaw.frontDoorProcessesAtRolloutPeak" . | quote }}
  CHEMCLAW_PG_FLEET_POOLS_AT_ROLLOUT_PEAK: {{ include "chemclaw.fleetPoolsAtRolloutPeak" . | quote }}
  {{- /* The connection budget's inputs, derived for the same reason as the line above: a
         hand-written count is a second copy of the topology. `chemclaw.fleetPools` counts POOLS
         rather than pods — a front-door process holds three (the stores', `/readyz`'s own
         statement-timeout key, and the checkpointer's) and every other role holds one. Counting
         pods declared 136 against a measured floor of 208.

         What the database sees is NOT `pg_pool_max_size × pools`: `/readyz`'s pool asks for one
         connection, so `Settings.fleet_connections_per_server` charges one per front-door replica
         and the full width for the rest, which is why CHEMCLAW_SERVICE_FLEET_REPLICAS above is a
         second input to this budget and not only to the turn ceiling. Multiplying declared 208 for
         a fleet that opens 166 — and refused a legal `maxReplicas: 9`.

         The session store's ceiling is not derived and is not derivable: whether these pods open
         one pool each or two is decided by a Secret value, so only the *count* can be corrected
         in-process. */}}
  CHEMCLAW_PG_FLEET_POOLS: {{ include "chemclaw.fleetPools" . | quote }}
  CHEMCLAW_PG_FLEET_MAX_CONNECTIONS: {{ .Values.postgres.maxConnections | quote }}
  CHEMCLAW_PG_SESSION_FLEET_MAX_CONNECTIONS: {{ .Values.postgres.sessionStoreMaxConnections | quote }}
  {{- /* The third budget of the same shape, and the same reason it is derived: the calculation
         backend is one shared pod, `worker_max_concurrent_activities` bounds one worker *process*,
         and so what `servers/calc` is offered is that cap times however many `calc` worker pods
         run. Hand-written it would be a second copy of `connectors.calc.workerReplicas` that goes
         stale the first time someone scales that worker — which is the silent multiplication
         `CHEMCLAW_CALC_BACKEND_MAX_CONCURRENT_REQUESTS` exists to catch. `0` when this release
         runs no calc worker, because then it dispatches no durable calculation at all. */}}
  CHEMCLAW_CALC_FLEET_WORKER_PROCESSES: {{ include "chemclaw.calcWorkerProcesses" . | quote }}
{{- end -}}
{{- /* The one thing that makes the hook→tracked move survivable in the *backward* direction.

       `helm rollback` restores a revision's manifest, and anything in the current manifest that is
       absent from that one is deleted. A revision installed by the previous chart has no ConfigMap
       and no ServiceAccount in its manifest at all — they were hooks — so rolling back across that
       boundary deletes the configuration and the identity that the very Deployments it is
       restoring cannot start without, and reports success. Measured on k3s v1.29.9: after
       `helm rollback <rel> 1`, `configmaps "chemclaw-config" not found` and
       `serviceaccounts "chemclaw" not found`, with `chemclaw-service` still carrying
       `envFrom: [{configMapRef: {name: chemclaw-config}}]` and `serviceAccountName: chemclaw`.

       `helm.sh/resource-policy: keep` is read off the *live* object at deletion time, so rendering
       it here is what protects a rollback taken later. Measured on the same cluster: with it, the
       same rollback leaves both objects standing and the pods start.

       **What it costs, stated because it is a real behavioural change.** `helm uninstall` now
       leaves these two behind — which is what the previous chart did, and half of what moving them
       into the manifest bought. Everything else the move bought is untouched: `keep` skips
       *deletion* only, so a rollback inside this chart's own lineage still restores the previous
       revision's `data:` (measured: `CHEMCLAW_LLM_MODEL` went `gpt-oss` → `changed-model` →
       `gpt-oss` across upgrade and rollback). A total outage from the operation whose purpose is
       to end one is the larger harm, and this is the only mechanism a chart has against it —
       `helm rollback` runs no hook this chart could declare.

       Removable, with a stated trigger: when no release's retained history reaches a revision
       installed before this chart (`helm history <rel>`), the boundary is behind that deployment
       and this annotation is a line to delete. */ -}}
{{- define "chemclaw.rollbackKeepPolicy" -}}
"helm.sh/resource-policy": keep
{{- end -}}
{{- /* The configuration the running pods read: an ordinary resource, so the release owns it. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chemclaw.configMapName" . }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    {{- include "chemclaw.rollbackKeepPolicy" . | nindent 4 }}
data:
{{- include "chemclaw.configData" . }}
---
{{- /* The same configuration for the pre-install/pre-upgrade migrate Job, under a name of its own.
       Weight -10 is below the Job's -5, because hook weights are the only ordering there is. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chemclaw.hookConfigMapName" . }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
{{- include "chemclaw.configData" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    {{- include "chemclaw.rollbackKeepPolicy" . | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- /* No component calls the Kubernetes API, so the projected API token is not mounted into any pod
       using this account. Explicit `false` rather than an omission: the cluster default is to mount
       it, so leaving this out is the insecure posture. */}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
---
{{- /* And the identity the pre-install Job runs as, for the same reason its ConfigMap needs one: on
       a fresh install the account above does not exist yet, and a Job pod naming an absent
       ServiceAccount is never admitted — it would sit unscheduled until `activeDeadlineSeconds`.
       Same annotations and the same refusal of the API token: this is the runtime account's twin
       for the seconds a release takes, not a wider one. It carries no `resource-policy` — a hook
       Helm never tracked is not a hook a rollback can delete.

       The `with` guard is not decoration: `.Values.serviceAccount.annotations` is one placeholder
       this chart ships as inert scaffolding and documents as "removed the day nobody wants that"
       (`deploy/README.md`), and an environment values file that writes `serviceAccount:
       annotations:` coalesces it to nil — which a bare `toYaml` emits as a lone `null` under a
       populated `annotations:` mapping, failing the render of the *whole chart*, not one object.
       The tracked twin above gained this guard and this copy shipped without it. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chemclaw.hookServiceAccountName" . }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- if .Values.secrets.create }}
---
{{- /* The one object here that stays a hook, deliberately. Every value in it is the literal
       `CHANGE-ME`, so there is nothing for a rollback to restore and nothing for an uninstall to
       leak; it exists only so a dev install has slots to fill, and `secrets.create` defaults to
       false because a real deployment fills them from an ExternalSecret/SealedSecret the chart
       never renders. Tracked instead, it would be created *after* the pre-install migrate Job that
       mounts these keys non-optionally, so a fresh `helm install --set secrets.create=true` would
       wedge that Job in `CreateContainerConfigError` until its deadline — trading a rollback defect
       nobody can observe here for an install defect anyone would. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # Placeholder only — real values arrive via ExternalSecret/SealedSecret in a real cluster (F6-T6).
  {{- range $configKey, $secretEnv := .Values.secrets.keys }}
  {{ $secretEnv }}: "CHANGE-ME"
  {{- end }}
{{- end }}

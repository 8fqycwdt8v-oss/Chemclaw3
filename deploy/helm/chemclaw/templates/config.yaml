{{- /* The ConfigMap, ServiceAccount and Secret are also pre-install/pre-upgrade hooks with a */ -}}
{{- /* weight (-10) BELOW the migrate Job (-5): on a fresh install, hooks run before ordinary */ -}}
{{- /* resources, so without this the migrate hook would start before its ConfigMap/SA exist */ -}}
{{- /* (review finding). `before-hook-creation` refreshes them each run; they persist for the app. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chemclaw.name" . }}-config
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- /* The retention posture must be stated, exactly as the egress posture must
       (D-2026-08-26-a-knob-that-renders-nothing-is-not-a-knob): every window in `Settings`
       defaults to disabled, so a chart that rendered without asking shipped tables that grow for
       the deployment's lifetime under a comment naming retention as the bound. */ -}}
{{- if eq (empty .Values.retention.windows) (empty .Values.retention.unboundedGrowthAccepted) }}
{{- fail "retention: set exactly one of `retention.windows` (the CHEMCLAW_RETENTION_* day windows this release keeps history for) or `retention.unboundedGrowthAccepted: true` (the durable tables grow forever, which is not a safe end state but is now a stated one). Neither is set, or both are." }}
{{- end }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- /* Derived from `retention.windows` rather than hand-written in `config`, so stating a
         window and forgetting the enable switch cannot happen — the switch exists only as a
         consequence of a stated window. */}}
  {{- if .Values.retention.windows }}
  CHEMCLAW_RETENTION_ENABLED: "true"
  {{- range $key, $value := .Values.retention.windows }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- /* Derived from the knowledge volume layout rather than hand-written in `config`, so the
         path the PR-gate submitter writes to can never drift from the volume it is mounted on
         (gap DEP-2). Together with `CHEMCLAW_KNOWLEDGE_DIR` above it is also what every *reader*
         resolves — `Settings.knowledge_path` is the two joined — which is why the knowledge-sync
         containers take their publish target from the same pair (`chemclaw.knowledgePublishPath`)
         instead of a `publishPath` value of their own. */}}
  CHEMCLAW_NOTE_REPO_DIR: {{ .Values.knowledge.noteRepoPath | quote }}
  {{- /* Derived from `.Values.connectors` rather than hand-written in `config`, for the same reason
         the note-repo dir is: the address the front door dials must be the Service that the same
         value block created. Only the enabled connectors appear, so a disabled bundle is simply
         unreachable rather than pointing at a Service with no pods. */}}
  CHEMCLAW_CONNECTOR_URLS: {{ include "chemclaw.connectorUrls" . | quote }}
  {{- /* And which of them the agent loads at all, from the same block for the same reason — see
         `chemclaw.connectorsEnabled`. Without it, `enabled: false` took a bundle's pods away and
         left its tools advertised, so the switch this file documents did half of what it says. */}}
  CHEMCLAW_CONNECTORS_ENABLED: {{ include "chemclaw.connectorsEnabled" . | quote }}
  {{- /* Derived from the autoscaling block rather than hand-written in `config`, and for the
         sharpest version of the same reason: the admission cap is per-process, so the load the
         shared LLM endpoint really sees is `this × uvicorn workers × the cap`. Written by hand it
         would be a second copy of `maxReplicas` that goes stale the first time someone scales the
         front door — which is exactly the silent multiplication
         `CHEMCLAW_SERVICE_FLEET_MAX_CONCURRENT_TURNS` exists to catch. Derived, it is the same
         number the HPA obeys. When the HPA is off, the fixed replica count is that number. */}}
  CHEMCLAW_SERVICE_FLEET_REPLICAS: {{ if .Values.service.autoscaling.enabled }}{{ .Values.service.autoscaling.maxReplicas | quote }}{{ else }}{{ .Values.service.replicas | quote }}{{ end }}
  {{- /* The connection budget's two inputs, derived for the same reason as the line above: a pool
         is opened per process, so what the database sees is `pg_pool_max_size × processes`, and a
         hand-written process count is a second copy of the topology. `chemclaw.pooledProcesses`
         counts the pods this chart renders that call `chemclaw.core.db.pooling`. */}}
  CHEMCLAW_PG_FLEET_POOLED_PROCESSES: {{ include "chemclaw.pooledProcesses" . | quote }}
  CHEMCLAW_PG_FLEET_MAX_CONNECTIONS: {{ .Values.postgres.maxConnections | quote }}
  {{- /* The third budget of the same shape, and the same reason it is derived: the calculation
         backend is one shared pod, `worker_max_concurrent_activities` bounds one worker *process*,
         and so what `servers/calc` is offered is that cap times however many `calc` worker pods
         run. Hand-written it would be a second copy of `connectors.calc.workerReplicas` that goes
         stale the first time someone scales that worker — which is the silent multiplication
         `CHEMCLAW_CALC_BACKEND_MAX_CONCURRENT_REQUESTS` exists to catch. `0` when this release
         runs no calc worker, because then it dispatches no durable calculation at all. */}}
  CHEMCLAW_CALC_FLEET_WORKER_PROCESSES: {{ include "chemclaw.calcWorkerProcesses" . | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # Placeholder only — real values arrive via ExternalSecret/SealedSecret in a real cluster (F6-T6).
  {{- range $configKey, $secretEnv := .Values.secrets.keys }}
  {{ $secretEnv }}: "CHANGE-ME"
  {{- end }}
{{- end }}

{{- /* Apply the Temporal Schedules as a POST-install/upgrade hook (gap DEP-5).

       Every periodic job in the system — ELN sync, the three memory-synthesis jobs, the note
       reindex, eval drift, retention, audit-chain verification — is worker-registered but only
       runs when a Temporal Schedule fires it. `chemclaw/cli/schedules.py` creates those Schedules and
       nothing in the chart ran it, so a correctly-installed deployment ingested nothing and
       synthesised nothing, silently.

       POST (not pre) and weight 5: the Schedules point at workflows that must already be
       registered on a running worker, so this waits for the rollout. `apply_schedules` is
       idempotent and prunes what is no longer planned, so re-running on every upgrade is the
       intended usage — it reconciles rather than accumulates. */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chemclaw.name" . }}-schedules
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.schedulesJob.backoffLimit }}
  {{- /* Helm waits for this hook too, so the argument `migrate-job.yaml` makes at length applies
         here unchanged: a Job with no deadline is a release that can hang forever. `backoffLimit`
         above bounds *failures*, and the failure mode this Job actually has is a hang — temporalio
         sets no default RPC timeout, so a frontend that completes the handshake and then stalls on
         `list_schedules` never returns. See `values.yaml` for the number and why it is that. */}}
  activeDeadlineSeconds: {{ .Values.schedulesJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schedules
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: schedules
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          command: ["python", "-m", "chemclaw.cli.schedules"]
          env:
            {{- include "chemclaw.env" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.connector | nindent 12 }}
          {{- /* Conditional key, not just a conditional body: `volumeMounts:` with nothing under it
                 renders `null`. This hook is also where an absent `chemclaw-temporal-tls` Secret
                 used to surface — as `FileNotFoundError: /etc/temporal/tls/tls.crt` from a Job whose
                 message named neither Temporal nor a Secret. */}}
          {{- if .Values.secrets.temporalTls.enabled }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "chemclaw.volumes" . | nindent 8 }}

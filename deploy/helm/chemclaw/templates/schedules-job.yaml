{{- /* Apply the Temporal Schedules as a POST-install/upgrade hook (gap DEP-5).

       Every periodic job in the system — ELN sync, the three memory-synthesis jobs, the note
       reindex, eval drift, retention, audit-chain verification — is worker-registered but only
       runs when a Temporal Schedule fires it. `chemclaw/cli/schedules.py` creates those Schedules and
       nothing in the chart ran it, so a correctly-installed deployment ingested nothing and
       synthesised nothing, silently.

       POST (not pre) and weight 5: the Schedules point at workflows that must already be
       registered on a running worker, so this waits for the rollout. `apply_schedules` is
       idempotent and prunes what is no longer planned, so re-running on every upgrade is the
       intended usage — it reconciles rather than accumulates. */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "chemclaw.name" . }}-schedules
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "chemclaw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: schedules
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" . | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: schedules
          image: "{{ include "chemclaw.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" . | nindent 12 }}
          command: ["python", "-m", "chemclaw.cli.schedules"]
          env:
            {{- include "chemclaw.env" . | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.connector | nindent 12 }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" . | nindent 12 }}
      volumes:
        {{- include "chemclaw.volumes" . | nindent 8 }}

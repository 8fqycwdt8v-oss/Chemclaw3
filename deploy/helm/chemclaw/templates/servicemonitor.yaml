{{- if .Values.monitoring.enabled }}
{{- /* Something has to actually collect `/metrics` (REV-2). The route has existed since DEP-4 and
       nothing under `deploy/` scraped it — no ServiceMonitor, no PodMonitor, no annotation — so
       every counter, gauge and histogram in the system was exposed and uncollected in production.
       That is the quiet way an observability story fails: the code is written, the endpoint
       answers, and no dashboard or alert has ever had a data point.

       A ServiceMonitor rather than scrape annotations because the target is OpenShift, whose
       user-workload monitoring stack is the Prometheus Operator; annotations are the older
       convention its default configuration does not read. `additionalLabels` is what lets an
       operator match this to their Prometheus's `serviceMonitorSelector`, which is release-specific
       and cannot be guessed here.

       **Every Service in the release, not only the front door.** This used to pin
       `component: service` on the reasoning that the connector pods import
       `chemclaw.core.metrics_bridge`, "whose whole contract is that recording a metric outside the
       front door is a no-op". That was wrong: the bridge imports a stdlib-only module, so the
       import succeeds everywhere and a connector's counters were landing in a live registry with
       nothing reading it. `connectors/server.py` now serves `/metrics`, and dropping the component
       from the selector is what collects it — every Service this chart renders (the front door and
       one per connector that serves MCP tools) names its port `http` and serves the same path, so
       one endpoint definition covers all of them and a new connector is scraped the day it is
       enabled rather than the day someone remembers this file.

       Worker pods have no Service at all, by design — nothing routes to them. They are collected
       by `podmonitor.yaml`, so the two selectors partition the fleet rather than overlapping. */ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "chemclaw.name" . }}
  labels:
    {{- include "chemclaw.labels" . | nindent 4 }}
    {{- with .Values.monitoring.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" . | nindent 6 }}
  endpoints:
    {{- /* By port *name*, not number: every Service names it `http`, and a name survives a port
           change that a hardcoded number would silently miss. */}}
    - port: http
      path: {{ .Values.monitoring.path | quote }}
      interval: {{ .Values.monitoring.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
{{- end }}

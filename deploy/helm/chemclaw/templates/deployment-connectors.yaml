{{- /* The pods one enabled connector bundle gets: an app Deployment + Service when it serves
       MCP tools (`server`), a Temporal worker Deployment when it owns durable jobs (`worker`), or
       both. The `results` bundle has only the second half — it declares no `endpoint:`, so
       rendering an app pod for it would crash-loop on a `server/app.py` that does not exist.

       This is what the connector seam buys operationally: a capability scales, fails and carries its
       dependencies independently of the chat service. The image is the same single artifact — the
       entrypoint dispatches on CHEMCLAW_COMPONENT=connector-<name> to that bundle's FastAPI app — so
       enabling a connector adds pods, never a second thing to build and scan.

       The front door reaches them through CHEMCLAW_CONNECTOR_URLS, which the chart *computes* from
       this same enabled set (see `chemclaw.connectorUrls` in _helpers.tpl). An operator flips
       `enabled: true` in one place and the address map follows; there is no second list to keep in
       sync, which is the class of drift the old `mcp.transport` guard existed to catch.

       **`url` means somebody else runs the server, so the app half is not rendered.** A bundle
       whose MCP endpoint is hosted outside this release — a vendor's model behind its own FastAPI
       server, a platform team's shared predictor — still declares an `endpoint:` in its manifest
       and therefore still sets `server: true`, because that flag mirrors the manifest and nothing
       else. What it must not get is a Deployment running `uvicorn connectors.<name>.server.app:app`
       from *our* image against a module that does not exist, plus a Service selecting pods that
       will never appear. The worker block below is deliberately not conditioned on `url`: a
       bundle's durable jobs run on our own Temporal queue whoever hosts its tools. */ -}}
{{- range $name, $cfg := .Values.connectors }}
{{- if $cfg.enabled }}
{{- if and $cfg.server (not $cfg.url) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" $ }}-connector-{{ $name }}
  labels:
    {{- include "chemclaw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: connector-{{ $name }}
spec:
  {{- /* `serverReplicas` when the bundle sizes its two halves separately, else the shared
         `replicas`. One knob drove both Deployments until 2026-08-26, so scaling `calc`'s MCP
         server to 4 also scaled its Temporal worker to 4 — two differently-shaped processes (one
         request-serving, one queue-polling) tied to one number, and each counted separately
         against the connection ceiling.

         `default` treats `0` as unset, so `serverReplicas: 0` falls back to `replicas` rather than
         scaling this half to zero. That is the right reading here: turning a capability off is
         `enabled: false`, which takes its tools off the agent's surface too — a bundle scaled to
         zero pods while still advertised is the failure the enable list was just fixed for. */}}
  replicas: {{ $cfg.serverReplicas | default $cfg.replicas | required (printf "connectors.%s: server pods need serverReplicas or replicas" $name) }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: connector-{{ $name }}
  template:
    metadata:
      annotations:
        {{- include "chemclaw.configChecksum" $ | nindent 8 }}
      labels:
        {{- include "chemclaw.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: connector-{{ $name }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" $ | nindent 6 }}
      {{- /* The default 30 s would SIGKILL through the `preStop` sleep below plus whatever request
             is in flight, which is the same mistake `chemclaw.workerGracePeriod` exists to prevent
             on the other kind of pod. **And it used to be stated rather than derived**, on the
             argument that "a connector's longest in-process wait is an HTTP call to a sibling
             server under *its* timeout, not a number this chart holds" — which is the right
             description of the wait and the wrong conclusion about the number, because this chart
             is what sets that timeout (`config.CHEMCLAW_CALC_*_TIMEOUT_SECONDS`). The stated 120 s
             sat against a 900 s and a 3600 s client bound. See `chemclaw.connectorGracePeriod`. */}}
      {{- include "chemclaw.connectorGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: connector-{{ $name }}
          image: "{{ include "chemclaw.image" $ }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" $ | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $.Values.connectorPort }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "connector-{{ $name }}"
            {{- include "chemclaw.otelResourceEnv" (dict "component" (printf "connector-%s" $name)) | nindent 12 }}
            - name: CHEMCLAW_SERVICE_PORT
              value: {{ $.Values.connectorPort | quote }}
            {{- include "chemclaw.env" $ | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" $ | nindent 12 }}
          {{- /* The probe the core startup/readiness sweep also uses, so "healthy" means the same
                 thing to Kubernetes and to `/readyz` — one definition, no second health notion.

                 **All three thresholds used to be absent, and that was a latent outage rather than
                 an untidiness.** With no `initialDelaySeconds`/`periodSeconds`/`failureThreshold`,
                 Kubernetes' defaults apply: liveness begins at t=0 with a 10 s period, a 1 s
                 timeout and three failures allowed, so the kubelet SIGKILLs the container about
                 thirty seconds after it starts. `calc` and `molfp` import RDKit and open a Postgres
                 pool during FastAPI lifespan, and uvicorn accepts connections only *after* lifespan
                 completes — so on a throttled node this is a crash loop with nothing wrong
                 anywhere in it, and each restart pays the same import again. The workers were never
                 exposed to it because `chemclaw.workerProbes` states its numbers and argues for
                 them; this block is the same discipline applied to the pods that were missing it.

                 The `startupProbe` is what makes the other two safe: neither runs at all until the
                 process answers once, so their periods can be tuned for a *running* process instead
                 of being stretched to cover a cold start.

                 Readiness and liveness are now separate decisions rather than one probe written
                 twice. Readiness removes an unhealthy connector from its Service endpoints, which
                 is the right response for an MCP server: the front door's sweep marks it
                 unreachable and answers degraded (`chemclaw_connectors_unhealthy`), instead of a
                 restart discarding every in-flight tool call. Liveness is deliberately the slower
                 and more forgiving of the two — a tool call here can legitimately hold the loop. */}}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ $.Values.probes.connector.startup.periodSeconds }}
            failureThreshold: {{ $.Values.probes.connector.startup.failureThreshold }}
            timeoutSeconds: {{ $.Values.probes.connector.startup.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ $.Values.probes.connector.readiness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.connector.readiness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.connector.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ $.Values.probes.connector.liveness.periodSeconds }}
            timeoutSeconds: {{ $.Values.probes.connector.liveness.timeoutSeconds }}
            failureThreshold: {{ $.Values.probes.connector.liveness.failureThreshold }}
          {{- /* The connector half of D-121's drain, which only the front door had. A connector pod
                 is the one holding an in-flight MCP tool call *and* an endpoint the front door is
                 still routing to: Kubernetes removes the Endpoint and sends SIGTERM concurrently,
                 so without this sleep a rolling update refuses calls the caller is still making.
                 The sleep drains nothing itself — it buys the endpoint controller time to stop
                 choosing this pod, and uvicorn's own SIGTERM handling finishes what is in flight. */}}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ $.Values.connectorDrainSeconds | quote }}]
          resources:
            {{- toYaml $.Values.resources.connector | nindent 12 }}
---
{{- end }}
{{- if $cfg.worker }}
{{- /* A bundle that owns durable work also runs its own Temporal worker, polling the queue its
       manifest declares. This is the half that keeps a capability's heavy dependencies out of both
       the chat service and core's worker — and so the process running the expensive science, which
       is the last one that should be unobservable. It serves the same `metrics` port as core's
       worker (`chemclaw.workerProbes`), replacing the claim that stood here that liveness was the
       Temporal poll itself. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chemclaw.name" $ }}-connector-worker-{{ $name }}
  labels:
    {{- include "chemclaw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: connector-worker-{{ $name }}
spec:
  {{- /* The other half of the same split — and the one that could render *empty*. The worker
         block is deliberately not conditioned on `url`, while `replicas` was only ever required
         of a bundle without one, so an externally hosted bundle that owns durable work rendered no
         `replicas` at all: Kubernetes defaulted it to 1 and `chemclaw.pooledProcesses` counted it
         as `nil | int` = 0. `required` is what turns that silence into a refused render. */}}
  replicas: {{ $cfg.workerReplicas | default $cfg.replicas | required (printf "connectors.%s: worker pods need workerReplicas or replicas" $name) }}
  selector:
    matchLabels:
      {{- include "chemclaw.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: connector-worker-{{ $name }}
  template:
    metadata:
      annotations:
        {{- include "chemclaw.configChecksum" $ | nindent 8 }}
      labels:
        {{- include "chemclaw.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: connector-worker-{{ $name }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      {{- include "chemclaw.imagePullSecrets" $ | nindent 6 }}
      {{- include "chemclaw.workerGracePeriod" $ | nindent 6 }}
      securityContext:
        {{- include "chemclaw.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: connector-worker-{{ $name }}
          image: "{{ include "chemclaw.image" $ }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- include "chemclaw.containerSecurityContext" $ | nindent 12 }}
          env:
            - name: CHEMCLAW_COMPONENT
              value: "connector-worker-{{ $name }}"
            {{- include "chemclaw.otelResourceEnv" (dict "component" (printf "connector-worker-%s" $name)) | nindent 12 }}
            {{- /* The bundle's own activity ceiling when it declares one, else the shared default.
                   Same argument as `resources` below and it belongs to the same shape of bundle:
                   a worker whose activities are long *waits* rather than database work (`calc`
                   holds one slot for a whole CREST search) is bounded by memory, not by the
                   connection pool, so the number that protects the pool would throttle it for no
                   reason. An explicit `env` entry beats the same key arriving through `envFrom`,
                   which is how the ConfigMap's fleet-wide value reaches every other worker. */}}
            {{- if $cfg.maxConcurrentActivities }}
            - name: CHEMCLAW_WORKER_MAX_CONCURRENT_ACTIVITIES
              value: {{ $cfg.maxConcurrentActivities | quote }}
            {{- end }}
            {{- include "chemclaw.workerMetricsEnv" $ | nindent 12 }}
            {{- include "chemclaw.env" $ | nindent 12 }}
          envFrom:
            {{- include "chemclaw.envFrom" $ | nindent 12 }}
          {{- include "chemclaw.workerProbes" $ | nindent 10 }}
          resources:
            {{- /* The bundle's own sizing when it declares one, else the shared worker budget.
                   A capability whose worker is shaped differently from the rest (a bundle that
                   holds a slot per in-flight search) says so in its own entry rather than
                   adding a key to the global `resources:` block. */}}
            {{- toYaml (default $.Values.resources.worker $cfg.resources) | nindent 12 }}
          {{- /* The mTLS mount is this container's only one, so the key itself is conditional:
                 `volumeMounts:` with an empty body renders `null`, which is a different manifest
                 from one without the key. */}}
          {{- if $.Values.secrets.temporalTls.enabled }}
          volumeMounts:
            {{- include "chemclaw.tlsMount" $ | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "chemclaw.volumes" $ | nindent 8 }}
---
{{- end }}
{{- if and $cfg.server (not $cfg.url) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chemclaw.name" $ }}-connector-{{ $name }}
  labels:
    {{- include "chemclaw.labels" $ | nindent 4 }}
    app.kubernetes.io/component: connector-{{ $name }}
spec:
  selector:
    {{- include "chemclaw.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: connector-{{ $name }}
  ports:
    - name: http
      port: {{ $.Values.connectorPort }}
      targetPort: http
---
{{- end }}
{{- end }}
{{- end }}

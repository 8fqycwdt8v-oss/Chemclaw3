# Chemclaw Helm values (plan F6). Every endpoint / CA / queue / model name is one value here that
# becomes one CHEMCLAW_-prefixed env var on the pods — the single pydantic Settings is the only
# config source in-cluster (no second config system). Secrets are referenced, never inlined.

image:
  repository: image-registry.openshift-image-registry.svc:5000/chemclaw/chemclaw
  tag: "0.1.0"
  # Set this for any release and the tag above is ignored. A tag is a *pointer*: `helm rollback` to
  # a release naming `0.1.0` fetches whatever `0.1.0` means now, which is the one thing a rollback
  # must not do — and this system stamps a build revision onto every audit record (AG-14), so
  # "which bytes produced this result" stops being answerable the moment a tag is re-pushed. The
  # tag remains the default only so `helm install .` works in dev without a registry round trip;
  # `docs/guides/runbook.md` §(xiv) is how to get the digest for a release.
  digest: ""
  pullPolicy: IfNotPresent
  # Credentials for a private registry. There was no field at all before, so an operator whose
  # registry needs authentication had nothing to set and no signal that the chart assumed an open
  # one. A list of `{name: <secret>}`, passed through verbatim.
  pullSecrets: []

# The front-door OIDC Route (F6-T2). host empty = let OpenShift assign one.
route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  # Source CIDRs allowed to use this Route. Empty = anyone who can reach the router.
  #
  # This is the only control at this layer that is real. A Route declares no `spec.path`, and neither
  # a Route nor a NetworkPolicy can filter by path — so every path the front door serves is on the
  # external host, `/metrics` included, and no rule in this chart changes that. Three places used to
  # assert otherwise ("`/metrics` is unauthenticated because the NetworkPolicy keeps it inside the
  # cluster"); a NetworkPolicy bounds which *peers* may open a connection to the port, which the
  # router is one of, and says nothing about what they then ask for.
  #
  # What actually bounds the exposure is D-152's declared-label allowlist: the exposition carries
  # counts, capacity and an operator-chosen `profile` label, never a session id, an actor or turn
  # content — enforced by `test_metrics_carry_no_identifiers_or_turn_content`, not by this chart.
  # What is left is operational reconnaissance (fleet size, in-flight turns, budget refusals), and
  # for a deployment that will not accept that, this list is the answer: set it to the corporate
  # ranges and the whole Route — API and `/metrics` alike — stops answering the open internet.
  #
  # Space-separated CIDRs in the rendered annotation, which is what the HAProxy router parses.
  ipWhitelist: []

service:
  port: 8080
  replicas: 2
  # How long the Route's router is given to stop sending new requests to a pod that is going away,
  # before the pod is told to stop. Kubernetes removes the Endpoint and sends SIGTERM *concurrently*,
  # so without a `preStop` sleep a pod stops accepting while the router is still routing to it, and
  # a chemist mid-conversation gets a connection error. Seconds, and the only job of the sleep.
  drainSeconds: 15
  # How many front-door pods one voluntary disruption (node drain, cluster upgrade, descheduler)
  # may take at once. `maxUnavailable` rather than `minAvailable` because the HPA scales this
  # Deployment: `minAvailable: 1` would permit five of six pods to go together, and each pod holds
  # session state no sibling can see (D-121), so what needs bounding is how many conversations one
  # drain can end. Its own toggle because a PDB an operator cannot switch off can wedge a cluster
  # upgrade, and that must not require disabling something else to fix.
  disruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Horizontal autoscaling for the stateless front door only (workers scale by queue, not HPA).
  # NOTE (gap DEP-4): CPU is a poor proxy here — a pod blocked on the model uses almost no CPU
  # while being completely full. The service now exposes `chemclaw_turns_in_flight` and
  # `chemclaw_turn_capacity` at /metrics; scale on their ratio via a Prometheus-adapter external
  # metric once one is available in the cluster. CPU stays the fallback until then.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Core's own Temporal worker. Only one left: `hpc` went with the QM/DFT job into the `qm`
# connector bundle below, which is sized for HPC work on its own queue (D-118).
workers:
  background:
    # Keep at 1. Light work (sync / re-index / reports), but this worker also submits PR-gate
    # notes, and that checkout lock is host-local (D-069) — a second replica can corrupt a
    # concurrent submitter's checkout. Raising this needs the distributed lock in docs/planning/BACKLOG.md first.
    replicas: 1

# The knowledge graph is a Git-backed Markdown tree that every reader resolves as a plain local
# directory, so a pod only sees a merged note once something writes it to that pod's filesystem
# (gap DEP-1). `sync` is that something: an init container fills the tree before the pod serves
# traffic, and a sidecar refreshes it on `intervalSeconds` so merges land without a redeploy.
# Leave `repoUrl` empty to run against whatever corpus the image shipped (dev / read-only) — the
# sync then copies `/app/knowledge` into the published tree rather than leaving it empty.
knowledge:
  sync:
    enabled: true
    repoUrl: ""
    # Refresh cadence for the sidecar. Also the worst-case staleness of a merged note.
    intervalSeconds: 300
    # Where the sidecar keeps its shallow read replica. Distinct from the published tree so a failed
    # fetch can never leave the directory the app reads in a half-written state; the publish copies
    # from here into the tree below.
    checkoutPath: /app/knowledge-repo
  # The PR-gate submitter's writable clone (gap DEP-2) — and, at its `CHEMCLAW_KNOWLEDGE_DIR`
  # subdirectory, the tree the application reads. There is no separate `publishPath` value, and that
  # is the fix rather than an omission: `Settings.knowledge_path` is `note_repo_dir / knowledge_dir`
  # and nothing else, so a second declared path could only ever agree with it by hand — and did not,
  # publishing to `/app/knowledge` while every reader looked here. `chemclaw.knowledgePublishPath`
  # derives the publish target from this value and that ConfigMap key, so they cannot drift.
  noteRepoPath: /var/lib/chemclaw/note-repo

# Connector bundles (`connectors/<name>/`), each its own Deployment + Service serving that
# capability's MCP tools over HTTP, its own Temporal worker, or both. One entry per bundle in the
# repo; `enabled` decides whether it gets pods, and `server`/`worker` say which halves it has —
# they must match the bundle's own `connector.yaml` (an `endpoint:` and a `jobs:` block
# respectively), which `tests/test_deploy_chart.py` checks in both directions.
#
# The front door's CHEMCLAW_CONNECTOR_URLS is *computed* from this same block
# (`chemclaw.connectorUrls`), so the addresses it dials and the Services that exist cannot disagree.
#
# Enabling a connector here is only half the switch: CHEMCLAW_CONNECTORS_ENABLED in `config` below
# decides which bundles the agent loads at all. Leave it empty (the default) to load every bundle the
# image ships, which is what matches "enable the pods and it works".
connectors:
  molfp:
    enabled: true
    server: true
    replicas: 1
  rxnfp:
    enabled: true
    server: true
    replicas: 1
  safety:
    enabled: true
    server: true
    replicas: 1
  chem:
    enabled: true
    server: true
    replicas: 1
  calc:
    enabled: true
    server: true
    replicas: 1
    # The expensive calculations (reaction energies, solvent screens, scans, CREST searches) run
    # as durable jobs on this bundle's own queue, so it gets a worker Deployment too. Sizing it
    # separately from core's `hpc` worker is the point: this is the only pod that needs the
    # `xtb`/`crest` binaries and the CPU to saturate with them.
    worker: true
  bo:
    enabled: true
    server: true
    replicas: 1
    # This bundle owns durable work, so it also gets a Temporal worker Deployment polling the queue
    # its manifest declares. Bundles without a `jobs:` entry leave this unset and get only the app.
    worker: true
  qm:
    enabled: true
    # The first jobs-only bundle: it declares no `endpoint:`, so `server: false` and it gets no app
    # pod and no Service — there is no sub-second QM tool to serve. `replicas` therefore sizes the
    # worker fleet, at the two core's `hpc` worker used to run.
    server: false
    replicas: 2
    worker: true
    # HPC-sized, and "heavy" here means *long-lived*, not CPU-hungry: the DFT run is on the
    # cluster, while this pod holds one activity slot per in-flight job with an open Nextflow poll
    # for up to `hpc_run_timeout_seconds` (24h). So it needs memory headroom for many concurrent
    # waits and little CPU — the opposite shape from `resources.worker`, which is why it overrides
    # it here rather than sharing it.
    resources:
      requests: { cpu: "250m", memory: "1Gi" }
      limits: { cpu: "1", memory: "4Gi" }

# The port every connector container listens on (its own Service maps it 1:1). One value rather than
# per-connector: they are separate Services, so there is no port to deconflict, and a single number
# keeps the computed URL map and the probes trivially consistent.
connectorPort: 8080

# The port every *worker* container serves `/healthz`, `/readyz` and `/metrics` on
# (`chemclaw.core.worker_http`). A worker has no Service — nothing routes to it — so this is a bare
# container port, named `metrics` for the PodMonitor and the probes to reference. One value across
# core's worker and every bundle's for the same reason `connectorPort` is one: separate pods, no
# port to deconflict, and one number keeps the monitor and the probes consistent by construction.
workerMetricsPort: 9000

# The pre-install/pre-upgrade migration hook (D-034).
migrateJob:
  # Four attempts. A migration failure is usually a lock it could not get within
  # CHEMCLAW_PG_MIGRATION_LOCK_TIMEOUT_SECONDS — transient by nature, and retrying is the intended
  # response. A schema error is deterministic and simply fails four times instead of one.
  backoffLimit: 3
  # A ceiling on the whole Job, retries included. Without one, Helm waits on the hook indefinitely
  # and the release sits in `pending-upgrade`, which blocks the next upgrade and needs a recovery an
  # operator has to already know (`docs/guides/runbook.md` §(xi) documents it). 15 minutes covers a
  # migration run plus its retries on a database of the size this chart is written for; raise it
  # before a release that adds an index to a large table.
  activeDeadlineSeconds: 900

resources:
  service:
    # Raised from 1 CPU. The front door does real CPU work off its event loop now (RDKit, cache-key
    # hashing and token validation run in worker threads), and CHEMCLAW_SERVICE_UVICORN_WORKERS can
    # add processes on top — both are pointless against a 1-CPU limit, which was the ceiling a load
    # test hit. The request stays modest so scheduling density is unchanged; only the burst headroom
    # grows.
    requests: { cpu: "500m", memory: "512Mi" }
    limits: { cpu: "2", memory: "1Gi" }
  # The default for every worker Deployment, core's and a bundle's. A bundle that needs different
  # sizing overrides it with its own `resources:` under `connectors.<name>` rather than growing a
  # key here, which is what keeps a capability's operational shape inside its own entry.
  worker:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }
  # Also used by the knowledge-sync init/sidecar containers: both are small, single-purpose
  # processes, and giving them one shared budget is why this key is not named per-component.
  connector:
    # The limit is 2 CPUs rather than 500m because the `chem` and `calc` connectors are where the
    # synchronous RDKit work lives (depiction, embedding, descriptors) and it now runs in worker
    # threads — which buys nothing under a half-CPU limit. The request is unchanged: the
    # knowledge-sync containers that share this key are still tiny, and a limit they never
    # approach costs nothing.
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "2", memory: "512Mi" }

# Non-secret config → ConfigMap → CHEMCLAW_* env. Keys mirror chemclaw/config.Settings exactly.
config:
  CHEMCLAW_LLM_PROVIDER: "openai_compatible"
  CHEMCLAW_LLM_BASE_URL: "http://internal-llm.llm.svc:8000/v1"
  CHEMCLAW_LLM_MODEL: "gpt-oss"
  CHEMCLAW_HARNESS_ENABLED: "true"
  CHEMCLAW_HARNESS_AUTONOMY: "plan_only"
  CHEMCLAW_SESSION_STORE: "postgres"
  # Stated rather than left to the code default, because the chart *derives* the publish target from
  # it: the knowledge-sync containers write to `knowledge.noteRepoPath` + this, which is exactly how
  # `Settings.knowledge_path` resolves. Left implicit, the chart would have to name the notes
  # subdirectory a second time, and a second name is what published the graph where nothing read it.
  CHEMCLAW_KNOWLEDGE_DIR: "knowledge"
  CHEMCLAW_TEMPORAL_ADDRESS: "chemclaw-temporal-frontend.temporal.svc:7233"
  CHEMCLAW_TEMPORAL_NAMESPACE: "chemclaw"
  CHEMCLAW_HPC_LAUNCH_INTERFACE: "nextflow"
  CHEMCLAW_HPC_API_BASE_URL: "https://tower.internal/api"
  CHEMCLAW_HPC_PIPELINE_NAME: "chemclaw-qm"
  CHEMCLAW_HPC_PIPELINE_VERSION: "1.0.0"
  CHEMCLAW_HPC_ARTIFACT_STORE_URL: "https://artifacts.internal/chemclaw"
  CHEMCLAW_HPC_BRIDGE_IDENTITY: "chemclaw-hpc"
  # Entra identity is mandatory system-wide (the one exception is the generic LLM credential).
  CHEMCLAW_ENTRA_REQUIRED: "true"
  CHEMCLAW_ENTRA_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  CHEMCLAW_ENTRA_AUDIENCE: "api://chemclaw"
  CHEMCLAW_ENTRA_WORKLOAD_FEDERATION_ENABLED: "true"
  CHEMCLAW_ENTRA_WORKLOAD_CLIENT_ID: "00000000-0000-0000-0000-000000000000"
  CHEMCLAW_ENTRA_TOKEN_ENDPOINT: "https://login.microsoftonline.com/TENANT/oauth2/v2.0/token"
  # ⚠ EMPTY ON PURPOSE, AND EMPTY MEANS CLOSED. Until an operator sets this to their own Entra app
  # role(s), **every job a connector manifest declares `expensive: true` is refused for everyone**:
  # `compute_dft_energy`, `compute_interaction_energy`, `sample_conformers` and
  # `start_optimization_campaign`. The trigger gate fails closed on an empty role set rather than
  # open (`agent/authz.authorize_trigger`), which is the safe direction and a silent one — the pod
  # boots, the probes pass, reads work, and a chemist asking for a DFT run is told they lack a
  # privileged role. Set it to a comma list of the Entra app roles your chemists actually hold
  # (`"my-org-dft-users,my-org-platform-admins"` in shape, not in content) and the jobs open.
  #
  # **The key is written out, rather than left to the code default, exactly so the emptiness is
  # visible.** An absent key shows up in nothing — not `helm show values`, not the rendered
  # ConfigMap, not an operator's values diff. A present, empty one shows up in all three.
  #
  # **And it is empty rather than a placeholder role name, deliberately.** A plausible-looking name
  # here would be worse than nothing: it is a *config that looks configured*, so it survives review
  # and reaches a cluster, where it grants nothing and the refusal ("the account holds none of the
  # roles this tool requires") points the operator at Entra group membership instead of at this
  # file. The other placeholders in this block get away with it because their shape is inert — a
  # zero GUID fails a token exchange loudly. A role name has no such shape: every string is a valid
  # role, and the wrong one fails silently *by design*, because "you do not hold this role" is the
  # gate working correctly. Naming a role would also be this chart asserting an organizational fact
  # it cannot know.
  CHEMCLAW_ENTRA_PRIVILEGED_ROLES: ""
  CHEMCLAW_OTEL_ENABLED: "true"
  CHEMCLAW_OTEL_ENDPOINT: "http://otel-collector.observability.svc:4317"
  # The runaway-cost guard, on in production (REV-16). Off is the *code* default because a CLI or
  # a test must not 429, but a deployment serving real users has no reason to be unguarded: a turn
  # is iteration-capped and the number of turns is not, so a client or an automated push-back loop
  # can accumulate unbounded LLM spend. The caps below are the shipped defaults — generous for a
  # real chemist, finite against a loop — and the load run that validated this system ran with
  # budgets on, so "on" is the configuration that was actually measured.
  CHEMCLAW_BUDGET_ENABLED: "true"
  # Verify the tamper-evident audit chain on a Schedule rather than when someone remembers to run
  # `make audit-verify` (REV-16). Its own docstring says it "only earns a Schedule where a durable
  # audit sink is actually configured" — this chart sets `SESSION_STORE: postgres`, which is
  # exactly what makes `default_audit_sink()` durable, so the precondition holds here and nowhere
  # else. A chain nobody checks detects tampering only after someone thinks to look, which in a
  # GxP setting is the one failure mode the chain exists to remove.
  CHEMCLAW_AUDIT_VERIFY_ENABLED: "true"
  # On in production, off in code, for the same reason `BUDGET_ENABLED` is (REV-16): a CLI, a test
  # and a single-user dev run have no reason to be throttled, and a deployment serving real users
  # over a shared endpoint has no reason not to be. The turn guards above bound what reaches the
  # LLM; this bounds everything else — `/proposals`, `/jobs`, `/schedules`, `/sessions` — which was
  # entirely unmetered, so a loop with no LLM call in it cost nothing to run.
  # 120/min sustained with a burst of 30: far above a chemist clicking through a UI, far below what
  # a script can do. Per process, so `service.autoscaling.maxReplicas` multiplies the real ceiling —
  # the same caveat the admission cap carries, and the reason a fleet-wide limit belongs at the
  # ingress rather than here.
  CHEMCLAW_SERVICE_RATE_LIMIT_PER_MINUTE: "120"
  CHEMCLAW_SERVICE_RATE_LIMIT_BURST: "30"
  # What the shared LLM endpoint may be asked to serve by this whole deployment, at once.
  #
  # The admission cap is per-process and stays that way (SCALE-1: a fleet-wide counter would cost a
  # durable write and a heartbeat per turn to bound a resource). The consequence is that the number
  # that matters is `service.autoscaling.maxReplicas × uvicorn workers ×
  # CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS`, and until now nothing stated it: raising the per-process
  # cap from 8 to 16 to "use the box better" doubled fleet demand on a shared endpoint, silently.
  #
  # 48 is exactly what the shipped values produce (6 × 1 × 8) — deliberately, so this ships as a
  # *statement* of the current shape rather than as slack. Raise it only with a number from the
  # endpoint's throughput budget; anything that exceeds it fails `Settings` validation at startup,
  # in every pod, naming both sides. The runtime half is `chemclaw_fleet_turn_ceiling` against
  # `sum(chemclaw_turn_capacity)`, which also catches a Deployment scaled by hand.
  CHEMCLAW_SERVICE_FLEET_MAX_CONCURRENT_TURNS: "48"
  # JSON logs in-cluster. Every line already carries correlation_id / actor / session_id from the
  # context filter; JSON is what lets a log stack index them instead of regexing a `%`-string.
  CHEMCLAW_LOG_JSON: "true"
  # Stated here rather than left to the code default, because the chart *derives* the front door's
  # `terminationGracePeriodSeconds` from it: a turn is bounded by this, so a drain that outlasts it
  # cannot cut one short. Left implicit, an operator raising the turn budget would silently start
  # having turns SIGKILLed at the old grace period. `tests/test_deploy_chart.py` pins that this key
  # exists for exactly that reason.
  CHEMCLAW_SERVICE_TURN_TIMEOUT_SECONDS: "600"
  # The worker half of the same rule (`durable/serve.py`): an in-flight activity gets this long to
  # finish after SIGTERM, and the worker Deployments' grace period is derived from it.
  CHEMCLAW_WORKER_GRACEFUL_SHUTDOWN_SECONDS: "120"

# Secret refs (F6-T6). Everything not listed here is workload-identity federation — no client
# secret at rest — so each entry below is an architecture decision (D-047) with its own argument,
# written beside it. `tests/test_helm_chart.py` pins the exact set, so a seventh cannot arrive
# unnoticed. This comment used to say "the THREE documented plain secrets" and went stale twice
# without anyone noticing, which is why the count now lives in the test rather than in prose.
# Populate via an ExternalSecret/SealedSecret; the chart only names them.
secrets:
  # Name of a pre-existing Secret with these keys, or let the chart template a placeholder.
  create: false
  name: "chemclaw-secrets"
  keys:
    llmApiKey: "CHEMCLAW_LLM_API_KEY"
    hpcApiToken: "CHEMCLAW_HPC_API_TOKEN"
    postgresDsn: "CHEMCLAW_POSTGRES_DSN"
    # Push credential for the knowledge repo (gap DEP-2). Without it the PR-gate cannot open a
    # branch for any agent-authored note, so every knowledge write fails at push in-cluster.
    knowledgeRepoToken: "CHEMCLAW_KNOWLEDGE_REPO_TOKEN"
    # The shared secret the git host signs its post-merge webhook with. Without it
    # `/events/knowledge-merged` can still force a reindex but may not close a proposal as merged
    # (D-2026-07-31-a-proposal-is-a-record-not-a-branch), so every reviewed note would stay in the
    # queue forever — a review surface that only ever grows is one nobody works.
    noteWebhookSecret: "CHEMCLAW_NOTE_WEBHOOK_SECRET"
    # The HMAC key the audit-chain high-water anchors are sealed with. A secret and not a config
    # value for the reason that makes the anchor evidence at all: an actor who can delete audit
    # rows can also insert a lower anchor, so the seal is only worth anything if its key lives
    # somewhere a database compromise does not reach
    # (D-2026-08-01-a-restore-is-a-truncation-nobody-can-see). Absent, the chain still catches
    # modification, reordering, interior deletion and prefix truncation — and a point-in-time
    # restore stays what it was: an undetectable trailing deletion of the compliance trail.
    auditAnchorSecret: "CHEMCLAW_AUDIT_ANCHOR_SECRET"
  # Temporal mTLS is mounted as files; the env points at the mount paths. Unlike the keys above,
  # this Secret is *not* optional when it is switched on — see the toggle.
  temporalTls:
    # Whether this deployment's Temporal frontend speaks mTLS. On by default, because the one this
    # chart describes does (self-hosted in-cluster, D-049).
    #
    # It is a toggle because it had to be one of two things and was neither. `chemclaw.env` exported
    # the three PEM paths unconditionally, and `core/temporal_client._tls_config()` short-circuits
    # only when all three settings are empty — so every pod read three files from a Secret the chart
    # names and never creates, mounted `optional: true`. A deployment without that Secret got
    # `FileNotFoundError: /etc/temporal/tls/tls.crt`: the post-install Schedules hook failed naming
    # neither Temporal nor a Secret, the workers crash-looped, and the front door passed both probes
    # because `/readyz` never touches Temporal. No value could turn the env off, so the plaintext
    # path `connect_options()` documents was unreachable from the chart.
    #
    # `true`  — the env, the volume and a **required** mount. A missing Secret now fails at pod
    #           creation with `secret "chemclaw-temporal-tls" not found` on the pod, before any
    #           process starts, which is a message that names what to create.
    # `false` — none of the three. The client connects plaintext, which is the correct shape for a
    #           dev cluster or a Temporal frontend fronted by a service mesh.
    enabled: true
    # Populate this Secret with exactly three keys: `tls.crt` (client certificate), `tls.key` (its
    # private key) and `ca.crt` (the CA that signs the Temporal frontend). A `kubernetes.io/tls`
    # Secret supplies the first two under those names; `ca.crt` is added alongside. Documented in
    # `deploy/README.md` — the chart only names it, like every other secret here.
    secretName: "chemclaw-temporal-tls"
    mountPath: "/etc/temporal/tls"

# Workload Identity Federation: the ServiceAccount is annotated so the pod's projected SA token can
# be exchanged for an Entra token (F4-T2). No client secret is stored.
serviceAccount:
  name: "chemclaw"
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"

# NetworkPolicy egress allow-list (F6-T2): the app talks only to these, nothing else leaves the pod.
# Includes the internal LLM (8000) and OTLP collector (4317) — both plain HTTP on non-443 ports, so
# they must be listed explicitly or the agent cannot reach its model / ship traces.
# Metrics collection (REV-2). The `/metrics` route has existed since DEP-4 and nothing scraped it,
# so every counter in the system was exposed and uncollected — an observability story that fails
# quietly, because the endpoint answers and no dashboard has ever had a data point.
#
# A ServiceMonitor targets OpenShift's user-workload monitoring (the Prometheus Operator). Set
# `additionalLabels` to whatever the cluster's Prometheus uses in its `serviceMonitorSelector` —
# it is release-specific, commonly `release: <prometheus-release>`, and cannot be guessed here.
# Disable if the cluster collects by some other mechanism.
monitoring:
  enabled: true
  path: /metrics
  interval: 30s
  # Below `interval`, so a slow scrape is dropped rather than overlapping the next one.
  scrapeTimeout: 10s
  additionalLabels: {}
  # Collected-and-un-alerted is the same failure REV-2 fixed one level down: the ServiceMonitor
  # made the metrics visible, and until now not one of them fired anything. `agent/audit.py`
  # explicitly logs a stable `audit_sink_failure` marker so it can be alerted on; nothing was.
  alerts:
    enabled: true
    # Fleet-wide hourly token ceiling before warning. The per-process budget guard bounds one
    # runaway process (the "$400 in twenty minutes" failure) and says nothing about the fleet, so
    # this is the only signal that covers a slow burn across pods. Deliberately generous —
    # tune it to the deployment's real baseline rather than treating the default as meaningful.
    tokensPerHourWarning: 2000000

# Pod/container security context. The chart asserted none of this, so a namespace labelled
# `pod-security.kubernetes.io/enforce=restricted` — the default posture for a regulated OpenShift
# cluster — rejected every pod spec here. The image has always run as a non-root UID, which is a
# different statement from the pod *declaring* it must; PSA reads the declaration.
#
# The restricted profile itself is not configurable (it is asserted unconditionally in
# `_helpers.tpl`, because a chart that lets you turn off `allowPrivilegeEscalation: false` is
# offering a footgun, not a knob). Only the one setting that is *not* part of that profile, and
# that genuinely cannot be defaulted on, lives here.
securityContext:
  # Off because the calculation workers shell out to xtb/crest, which need writable scratch; with
  # no scratch volume provisioned this trades an admission failure for a runtime failure. Turn it
  # on once the deployment mounts an emptyDir over the process's temp directory.
  readOnlyRootFilesystem: false

networkPolicy:
  enabled: true
  egressPorts:
    postgres: 5432
    temporal: 7233
    https: 443
    llm: 8000
    otel: 4317
  # WHERE those ports may be dialled. Empty renders `to: []`, which in a NetworkPolicy means
  # **any destination** — so with this unset, TCP/443 from every pod to the whole internet is
  # permitted. That is the shipped default only because the addresses are deployment-specific and
  # a chart cannot invent your Postgres CIDR; it is not a safe end state.
  #
  # `tests/test_no_egress.py` enforces "this system takes no external sources" (D-089) by scanning
  # source code for third-party host literals. That catches a developer adding a data source and
  # catches nothing at runtime — set this to make the network agree with the decision.
  #
  # Entries are NetworkPolicyPeer objects, passed through verbatim:
  #   - ipBlock: {cidr: 10.0.1.0/24}                     # the database subnet
  #   - namespaceSelector: {matchLabels: {name: temporal}}
  #   - namespaceSelector: {matchLabels: {name: llm-serving}}
  egressDestinations: []
  # Namespaces allowed to reach the front door, beyond Chemclaw's own pods. The router needs it for
  # the Route to work and the monitoring stack needs it to scrape `/metrics`. This rule bounds which
  # *peers* may open a connection to the port — it does not, and cannot, bound paths, so it is not
  # what makes an unauthenticated `/metrics` acceptable (D-152's label allowlist is; see
  # `route.ipWhitelist`). It used to say it was. Labels
  # differ by distribution: OpenShift labels its router namespace
  # `network.openshift.io/policy-group: ingress` and its user-workload monitoring namespace
  # `kubernetes.io/metadata.name: openshift-user-workload-monitoring`.
  serviceIngress:
    # Its own toggle, not `networkPolicy.enabled`: if these labels are wrong the front door is
    # unreachable, and the fix must not be "turn off network policy" — that would drop the egress
    # rule too, which is the one you least want to lose.
    enabled: true
  ingressNamespaces:
    - network.openshift.io/policy-group: ingress
    - kubernetes.io/metadata.name: openshift-user-workload-monitoring
  # The monitoring stack alone — a subset of the list above, and separate because it is granted
  # somewhere the router must never reach: the connector pods (whose whole ingress rule exists to
  # keep everything but Chemclaw out) and the worker pods' probe port. The front door needs the
  # router *and* the scraper; nothing else needs the router.
  monitoringNamespaces:
    - kubernetes.io/metadata.name: openshift-user-workload-monitoring

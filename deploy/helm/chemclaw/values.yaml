# Chemclaw Helm values (plan F6). Every endpoint / CA / queue / model name is one value here that
# becomes one CHEMCLAW_-prefixed env var on the pods — the single pydantic Settings is the only
# config source in-cluster (no second config system). Secrets are referenced, never inlined.

image:
  repository: image-registry.openshift-image-registry.svc:5000/chemclaw/chemclaw
  tag: "0.1.0"
  # Set this for any release and the tag above is ignored. A tag is a *pointer*: `helm rollback` to
  # a release naming `0.1.0` fetches whatever `0.1.0` means now, which is the one thing a rollback
  # must not do — and this system stamps a build revision onto every audit record (AG-14), so
  # "which bytes produced this result" stops being answerable the moment a tag is re-pushed. The
  # tag remains the default only so `helm install .` works in dev without a registry round trip;
  # `docs/guides/runbook.md` §(xiv) is how to get the digest for a release.
  digest: ""
  pullPolicy: IfNotPresent
  # Credentials for a private registry. There was no field at all before, so an operator whose
  # registry needs authentication had nothing to set and no signal that the chart assumed an open
  # one. A list of `{name: <secret>}`, passed through verbatim.
  pullSecrets: []

# The front-door OIDC Route (F6-T2). host empty = let OpenShift assign one.
route:
  enabled: true
  host: ""
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  # Source CIDRs allowed to use this Route. Empty = anyone who can reach the router.
  #
  # This is the only control at this layer that is real. A Route declares no `spec.path`, and neither
  # a Route nor a NetworkPolicy can filter by path — so every path the front door serves is on the
  # external host, `/metrics` included, and no rule in this chart changes that. Three places used to
  # assert otherwise ("`/metrics` is unauthenticated because the NetworkPolicy keeps it inside the
  # cluster"); a NetworkPolicy bounds which *peers* may open a connection to the port, which the
  # router is one of, and says nothing about what they then ask for.
  #
  # What actually bounds the exposure is D-152's declared-label allowlist: the exposition carries
  # counts, capacity and an operator-chosen `profile` label, never a session id, an actor or turn
  # content — enforced by `test_metrics_carry_no_identifiers_or_turn_content`, not by this chart.
  # What is left is operational reconnaissance (fleet size, in-flight turns, budget refusals), and
  # for a deployment that will not accept that, this list is the answer: set it to the corporate
  # ranges and the whole Route — API and `/metrics` alike — stops answering the open internet.
  #
  # Space-separated CIDRs in the rendered annotation, which is what the HAProxy router parses.
  ipWhitelist: []

service:
  port: 8080
  replicas: 2
  # How long the Route's router is given to stop sending new requests to a pod that is going away,
  # before the pod is told to stop. Kubernetes removes the Endpoint and sends SIGTERM *concurrently*,
  # so without a `preStop` sleep a pod stops accepting while the router is still routing to it, and
  # a chemist mid-conversation gets a connection error. Seconds, and the only job of the sleep.
  drainSeconds: 15
  # How many front-door pods one voluntary disruption (node drain, cluster upgrade, descheduler)
  # may take at once. `maxUnavailable` rather than `minAvailable` because the HPA scales this
  # Deployment: `minAvailable: 1` would permit five of six pods to go together, and each pod holds
  # session state no sibling can see (D-121), so what needs bounding is how many conversations one
  # drain can end. Its own toggle because a PDB an operator cannot switch off can wedge a cluster
  # upgrade, and that must not require disabling something else to fix.
  disruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Horizontal autoscaling for the stateless front door only (workers scale by queue, not HPA).
  #
  # **CPU cannot see this service saturate, and that is measured rather than suspected.** A turn is
  # 8.32 s of wall clock and 0.581 s of CPU — 7% machinery, 93% waiting on the model — so occupancy
  # runs about 14× CPU and no CPU threshold tracks it. Driven with the admission semaphore *100%
  # full* (every permit held, plus 150 idle SSE streams) the pod drew **218 millicores, 44% of the
  # 350 mC target**: completely full and comfortably under the scale-up threshold. The fleet
  # therefore sat at `minReplicas` while shedding, which is what the load lane saw directly — at
  # offered concurrency 32, **33 of 48 turns shed with CPU at 35.0% of one core**. This was gap
  # DEP-4, named here for a year with `chemclaw_turns_in_flight` and `chemclaw_turn_capacity`
  # already exported and nothing reading them.
  #
  # So the HPA scales on **permits held**, which is the quantity that actually runs out, and keeps
  # CPU beside it. Both metrics on one HPA is deliberate: the autoscaler takes the *highest*
  # recommendation, so CPU still catches a genuine compute burst, and — the half that matters if
  # the custom-metrics API is missing — a metric it cannot fetch never blocks a scale *up* driven by
  # one it can, it only holds off scale-down. That is the fallback, and it is the reason `occupancy`
  # is not simply a replacement.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    # **This requires something in the cluster that this chart does not install**, and saying so is
    # the point: a `Pods` metric is served by the custom-metrics API, which means prometheus-adapter
    # (or KEDA, or OpenShift's own adapter) configured to expose `chemclaw_turns_in_flight` for the
    # front door's pods. Without one the HPA reports `FailedGetPodsMetric` and falls back to CPU as
    # described above — degraded, visible in `kubectl describe hpa`, and not silent. `enabled:
    # false` renders a CPU-only HPA exactly as before, for a cluster that has no adapter and does
    # not want the event.
    occupancy:
      enabled: true
      # The series name as the adapter must publish it. A value rather than a literal in the
      # template because an adapter is free to rename what it exposes, and the series this app
      # emits is the one thing this chart cannot change.
      metricName: chemclaw_turns_in_flight
      # The target, as a percentage of one pod's admission cap
      # (`CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS` under `config`). A percentage rather than an
      # absolute count so the two cannot drift: the template multiplies them out, so raising the
      # permit count raises the scale-up point with it instead of leaving a stale quantity behind.
      # The rendered target is the *floor* of the product — Helm's `div` truncates — so what this
      # leaves free is `permits - (permits * targetPercent / 100 | floor)`, which the chart's own
      # test derives with the same `//` rather than restating here. The size to aim for is one
      # turn's worth of scheduling and image-cached start (~8.3 s of wall clock), which is what a
      # new pod costs before it can take its first turn.
      targetPercent: 60

# Core's own Temporal worker. Only one: every expensive workflow belongs to a connector bundle
# below, each sized for its own work on its own queue (D-118).
# Core's read-only MCP face — this system reachable as a tool by another agent
# (`CHEMCLAW_COMPONENT=mcp-face`, D-2026-08-29-a-digest-nobody-receives-is-not-delivered).
#
# **Off by default**, and that is the posture rather than a convenience: a deployment that does not
# want to be reachable renders no pod, which is stronger than a pod nobody has a token for. Turning
# it on means also setting `secrets.optionalKeys.mcpFaceToken`'s variable — the middleware fails
# closed on an unset one, so a face without it answers 401 rather than serving the knowledge graph
# anonymously.
#
# It serves reads only: the advertised set is derived from `agent.authz.READ_ONLY_TOOLS` minus the
# ones `WITHHELD` names, so nothing here can launch a job, propose a note or settle a wait — and
# nothing here answers a question about this deployment's *people* rather than its chemistry, which
# is the second predicate and the one that was originally wrong.
mcpFace:
  enabled: false
  replicas: 1
  route:
    # Publishing the face outside the cluster, opt-in and separate from `route.enabled`. That knob
    # governs the chat front door, where a person authenticates through Entra; this one exposes a
    # surface whose entire authorization is "holds one bearer token". They are different decisions
    # and a deployment states them separately.
    enabled: false
  # Namespaces whose pods may reach the face, as label selectors — deliberately *not* shared with
  # `networkPolicy.ingressNamespaces`, which names the router namespace that may reach the chat
  # front door. Empty means this release's own pods only.
  #
  # Until this existed no ingress policy selected the face at all, and a pod no ingress policy
  # selects is unrestricted for ingress: every pod in the cluster could reach it, including the
  # deliberately unauthenticated `/healthz` and `/metrics`.
  ingressNamespaces: []

workers:
  background:
    # Keep at 1 — but no longer for the checkout lock. That reason is closed: submissions to one
    # remote are serialized across pods by a Postgres advisory lock
    # (`kg/git_submitter.py::_cluster_lock`), and the host-local `flock` now only guards this pod's
    # own worktree sweep.
    #
    # The reason that is still live is `NoteReindexWorkflow`
    # (`D-2026-08-27-what-a-second-background-worker-would-race-on`): the reindex retires
    # `note_index` rows for every note missing from *this pod's* knowledge checkout, and that
    # checkout is an emptyDir refreshed by the pod's own sidecar every
    # `knowledge.sync.intervalSeconds`. Two pods are two views of the corpus, so a freshly merged
    # note is indexed by one and retired by the other, alternating, while each run logs that it
    # retired a note that exists. Nothing else on this queue needs the pin: the periodic jobs are
    # Temporal Schedules under `SKIP` (server-enforced, so worker count is irrelevant to them), the
    # ELN cursor has exactly one writer, retention re-checks every predicate inside its own DELETE,
    # and the result outbox claims rows with `FOR UPDATE SKIP LOCKED`.
    replicas: 1

# A classical SMB/CIFS file share, mounted read-only on the background worker so its documents can
# be crawled into the search index (D-2026-08-06-a-share-is-mounted-not-called). Mounted, never
# called: the code sees a POSIX path, so there is no SMB client, no credential in the application,
# and no new network egress (D-089). Provide the PersistentVolumeClaim yourself — a CIFS PV whose
# mount credential is a Secret the CSI driver reads, which is why no key appears under `secrets`
# below.
#
# Only the background worker gets the mount: it is the only component that reads the share. The
# front door answers from the index and would gain nothing but an attack surface.
#
# `mountPath` must equal the `mount:` in that source's datasource.yaml binding, and the source
# must be named in `config.CHEMCLAW_DATA_SOURCES` — a mount with no enabled source is crawled by
# nothing, and an enabled source with no mount fails loudly at the first crawl.
documentShare:
  enabled: false
  claimName: "chemclaw-sharedrive"
  mountPath: "/mnt/sharedrive"

# The knowledge graph is a Git-backed Markdown tree that every reader resolves as a plain local
# directory, so a pod only sees a merged note once something writes it to that pod's filesystem
# (gap DEP-1). `sync` is that something: an init container fills the tree before the pod serves
# traffic, and a sidecar refreshes it on `intervalSeconds` so merges land without a redeploy.
# Leave `repoUrl` empty to run against whatever corpus the image shipped (dev / read-only) — the
# sync then copies `/app/knowledge` into the published tree rather than leaving it empty.
knowledge:
  sync:
    enabled: true
    repoUrl: ""
    # Refresh cadence for the sidecar. Also the worst-case staleness of a merged note.
    intervalSeconds: 300
    # Where the sidecar keeps its shallow read replica. Distinct from the published tree so a failed
    # fetch can never leave the directory the app reads in a half-written state; the publish copies
    # from here into the tree below.
    checkoutPath: /app/knowledge-repo
  # The PR-gate submitter's writable clone (gap DEP-2) — and, at its `CHEMCLAW_KNOWLEDGE_DIR`
  # subdirectory, the tree the application reads. There is no separate `publishPath` value, and that
  # is the fix rather than an omission: `Settings.knowledge_path` is `note_repo_dir / knowledge_dir`
  # and nothing else, so a second declared path could only ever agree with it by hand — and did not,
  # publishing to `/app/knowledge` while every reader looked here. `chemclaw.knowledgePublishPath`
  # derives the publish target from this value and that ConfigMap key, so they cannot drift.
  noteRepoPath: /var/lib/chemclaw/note-repo

# Connector bundles (`connectors/<name>/`), each its own Deployment + Service serving that
# capability's MCP tools over HTTP, its own Temporal worker, or both. One entry per bundle in the
# repo; `enabled` decides whether it gets pods, and `server`/`worker` say which halves it has —
# they must match the bundle's own `connector.yaml` (an `endpoint:` and a `jobs:` block
# respectively), which `tests/test_deploy_chart.py` checks in both directions.
#
# **`replicas` sizes both halves; `serverReplicas`/`workerReplicas` size one.** A bundle with both
# halves runs two differently-shaped processes — one serving requests, one polling a queue — and
# one knob drove both until 2026-08-26, so scaling `calc`'s MCP server to 4 also scaled its
# Temporal worker to 4 and spent four extra connections from `postgres.maxConnections` doing it.
# The shared value stays because for every bundle shipped here the two halves *are* the same size;
# what changed is that they no longer have to be. Whichever pair a bundle uses, each rendered half
# must resolve to a number — `required` in `deployment-connectors.yaml` refuses the render
# otherwise, which is what closes the hole a `url:` bundle owning durable work used to fall into
# (no `replicas` was ever required of one, so its worker rendered an empty count and contributed
# zero to the declared connection budget while Kubernetes ran it at 1).
#
# The front door's CHEMCLAW_CONNECTOR_URLS is *computed* from this same block
# (`chemclaw.connectorUrls`), so the addresses it dials and the Services that exist cannot disagree.
#
# `enabled` is the whole switch: CHEMCLAW_CONNECTORS_ENABLED — which bundles the agent loads at all
# — is *derived* from this block (`chemclaw.connectorsEnabled`), so a bundle turned off here loses
# its pods and its tools together. It used to be only half: this file said that key lived "in
# `config` below", it was in none of the entries there, and an empty value means "every bundle the
# image ships" — so `enabled: false` removed the pods and left the tool advertised, and a chemist
# calling it was told "running" until the 25 h job ceiling.
#
# **`url:` — a connector this release does not run.** Setting it says the bundle's MCP server is
# hosted somewhere else (a platform team's model server, a vendor's FastAPI/MCP endpoint) and gives
# its address. That bundle then gets no app Deployment and no Service, and the front door dials the
# address given here instead of an in-cluster one — because *hosting is a deployment fact, not a
# capability fact*: the same bundle can be a local process in dev and somebody else's endpoint in
# production, and neither belongs in the manifest that says what the capability *is* (D-118/D-120).
# `server:` still mirrors the manifest's `endpoint:` and is unrelated to who runs it; `worker:` is
# unaffected, since durable jobs run on our own Temporal queue whoever serves the tools.
#
# Two things an operator must do themselves for such a connector, because the chart cannot:
#   * add its host to `networkPolicy.egressDestinations` below (empty by default) AND confirm
#     `networkPolicy.egressPorts` already names the port it actually answers on. This used to claim
#     the egress rule "already permits `egressPorts.https`" — wrong for every bundle documented
#     here: `chem`/`safety`/`calc` are plain HTTP on 8858/8859/8860, not 443, and a NetworkPolicy
#     egress rule restricts by port independently of the `to:` peer list, so a destination with no
#     matching port in `egressPorts` still drops the connection;
#   * give it a credential. A bundle reached across the network with `auth: mode: none` in its
#     manifest is refused at load — see `chemclaw/connectors/manifest.py`.
#
# **`chem` was the first bundle to set it**, and `safety` is the second: the capability is
# `Chemclaw3-mcp`'s, this release declares it and dials it. Every other bundle below is still ours,
# served from this release's own image.
connectors:
  molfp:
    enabled: true
    server: true
    replicas: 1
  rxnfp:
    enabled: true
    server: true
    replicas: 1
  safety:
    enabled: true
    # Same shape as `chem` below, for the same reason and with the same two operator obligations:
    # the capability is `Chemclaw3-mcp`'s `servers/safety`, so no Deployment and no Service render,
    # the host needs a `networkPolicy.egressDestinations` entry, and `CHEMCLAW_SAFETY_TOKEN` has to
    # be provided or every call is refused.
    server: true
    url: http://chemclaw3-mcp-safety:8859/mcp
  chem:
    enabled: true
    # **`server: true` *and* a `url:`** — the shape D-2026-08-09 built for a connector this release
    # does not run. The two fields answer different questions and the pairing is not obvious:
    # `server:` mirrors whether the *manifest* declares an `endpoint:`, which `chem`'s still does,
    # while `url:` is what says somebody else hosts it. The templates read
    # `if and $cfg.server (not $cfg.url)`, so the url is what suppresses the Deployment and the
    # Service; and `chemclaw.connectorUrls` visits only `enabled && server` entries, so
    # `server: false` would make the address below **ignored** and leave the front door dialling
    # the manifest's loopback default. `test_a_connector_url_is_only_declared_beside_a_server`
    # exists for exactly that mistake, and caught it here.
    #
    # The capability moved to `Chemclaw3-mcp`; the manifest stayed, because four validators resolve
    # tool names through it (`connectors/chem/connector.yaml` says why).
    #
    # Two things an operator must still do, per the note above: add this host to
    # `networkPolicy.egressDestinations`, and provide `CHEMCLAW_CHEM_TOKEN` — the server enforces a
    # bearer on `/mcp` itself, so a missing credential is a refused call rather than an open one.
    server: true
    url: http://chemclaw3-mcp-chem:8858/mcp
  rxnpredict:
    # Reaction and condition prediction by ensemble (`Chemclaw3-mcp`'s `servers/rxnpredict`, port
    # 8857). The same shape as `chem` and `safety` above, for the same reason and with the same two
    # operator obligations: no Deployment and no Service render, the host needs a
    # `networkPolicy.egressDestinations` entry *and* `networkPolicy.egressPorts.rxnpredict`, and
    # `CHEMCLAW_RXNPREDICT_TOKEN` has to be provided or every call is refused.
    #
    # **On, because the six tools are read-only predictors and the capability was unreachable
    # without this line.** Enablement is not a claim that the server is up: with no address
    # reachable the connector fails its health probe and its tools degrade, which is the same
    # posture every other externally-hosted bundle here already has.
    enabled: true
    server: true
    url: http://chemclaw3-mcp-rxnpredict:8857/mcp
  calc:
    enabled: true
    server: true
    replicas: 1
    # The expensive calculations (reaction energies, solvent screens, scans, CREST searches) run
    # as durable jobs on this bundle's own queue, so it gets a worker Deployment too.
    #
    # **This pod no longer runs any physics, and the sizing note that used to sit here said it
    # did.** `D-2026-08-16-the-physics-leaves-the-cache-stays` moved the engines to
    # `Chemclaw3-mcp`'s `servers/calc`; what runs here is the D-011 cache in front of them, the
    # composition of `compute_thermochemistry` and `predict_logd`, and the calibration ledger. It
    # is I/O-bound on that wire, not CPU-bound on `xtb`.
    #
    # Unlike `chem` and `safety`, the remote server is **not** reached through a connector `url:` —
    # that field addresses a bundle's own MCP endpoint, which this bundle does serve. The address
    # of the calculation server is `CHEMCLAW_CALC_SERVER_URL` in `config` below, and the two
    # operator obligations are the same as those bundles': add its host to
    # `networkPolicy.egressDestinations`, and provide `CHEMCLAW_CALC_TOKEN` if that server enforces
    # a bearer.
    worker: true
  bo:
    enabled: true
    server: true
    replicas: 1
    # This bundle owns durable work, so it also gets a Temporal worker Deployment polling the queue
    # its manifest declares. Bundles without a `jobs:` entry leave this unset and get only the app.
    worker: true
  results:
    # Republishing computed results to an external results store (D-2026-08-25). A jobs-only
    # bundle, so `server: false` and no app pod or Service renders.
    #
    # **Enabled here, and still inert unless a sink is configured.** This bundle only *re-queues*
    # what the automatic path publishes; with `CHEMCLAW_RESULT_SINKS` empty — the default — the
    # enqueue is a no-op and the job reports zero. Turning publishing on is that variable plus a
    # `sink.yaml`, never this flag.
    #
    # One replica: a corpus walk is a rare operator action, and two pods walking the same two
    # tables would duplicate the read for no benefit — the outbox's identity index makes the
    # *writes* idempotent, but the scan is still paid twice.
    enabled: true
    server: false
    replicas: 1
    worker: true

# The port every connector container listens on (its own Service maps it 1:1). One value rather than
# per-connector: they are separate Services, so there is no port to deconflict, and a single number
# keeps the computed URL map and the probes trivially consistent.
connectorPort: 8080

# How long a process is allowed to take to come up, and how patiently it is then watched.
#
# **This block exists because the numbers were absent, not because they were wrong.** A connector
# server declared `readinessProbe` and `livenessProbe` with no thresholds at all, so Kubernetes'
# own defaults applied: liveness starts at t=0 with `periodSeconds: 10`, `timeoutSeconds: 1` and
# `failureThreshold: 3`, which SIGKILLs the container about thirty seconds after start. The `calc`
# and `molfp` bundles import RDKit and open a Postgres pool during FastAPI lifespan, and uvicorn
# accepts connections only *after* lifespan completes — so on a throttled node that is a crash loop
# with no bad state anywhere in it, and every restart pays the same import again. The workers were
# never exposed to this, because `chemclaw.workerProbes` states its thresholds and argues for them.
#
# A `startupProbe` is the right shape rather than a large `initialDelaySeconds`: it takes liveness
# and readiness out of play entirely until the process answers once, and then hands over to periods
# tuned for a *running* process. `failureThreshold x periodSeconds` is the whole cold-start budget.
probes:
  connector:
    # 30 x 10 s = five minutes to import RDKit, open the pool and finish lifespan. Generous on
    # purpose: the cost of being wrong high is a slow first rollout, and the cost of being wrong low
    # is the permanent crash loop described above.
    startup:
      periodSeconds: 10
      failureThreshold: 30
      timeoutSeconds: 5
    # Readiness is what removes an unhealthy connector from its Service endpoints, which is the
    # response an MCP server actually wants: the front door's own sweep marks it unreachable and
    # answers degraded, rather than a restart throwing away every in-flight tool call.
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    # Liveness is deliberately slower and more forgiving than readiness — three minutes of a wedged
    # process before a restart. A tool call here can legitimately hold the loop (a `calc` primitive
    # is minutes), so a false restart mid-call costs more than a slow true one. Same argument, same
    # direction, as `chemclaw.workerProbes`' `failureThreshold: 6`.
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 9
  service:
    # 30 x 10 s, the same budget and for the same reason: the front door imports
    # langchain/deepagents/RDKit and runs a connector sweep during startup, and with no startup
    # probe its first liveness restart landed at ~70 s — inside that budget on a cold or throttled
    # node. Readiness and liveness here already state their own periods and keep them.
    startup:
      periodSeconds: 10
      failureThreshold: 30
      timeoutSeconds: 5
    # **`/readyz` does work, so its probe needs a timeout that says how much.** It sweeps every
    # enabled connector and then asks Postgres — bounded by `connector_health_timeout_seconds`
    # (2 s) and `service_readiness_db_timeout_seconds` (2 s) respectively, which is 4 s of budget
    # against Kubernetes' **default `timeoutSeconds: 1`**. That default is what this block exists
    # to replace: a jobs-only bundle routes to a `DescribeTaskQueue` RPC, so a blackholed broker
    # took ~2 s and `failureThreshold: 3` then removed a perfectly serving front door from its
    # Service after ~30 s of somebody else's outage. The connector sweep never gates readiness by
    # design (`api/routes/ops.py`); this is the latency it introduces one layer down.
    #
    # **There is no `timeoutSeconds` here, and its absence is the fix.** It used to be the literal
    # `5` — 4 s of stated work plus a margin — and a literal is exactly what the two budgets above
    # cannot stay in step with: an operator who raised `CHEMCLAW_CONNECTOR_HEALTH_TIMEOUT_SECONDS`
    # to 5 via `.Values.config` rendered an unchanged `timeoutSeconds: 5` and got a kubelet that
    # gives up before the route it is calling has to answer. The guard that was supposed to catch
    # that read the *test runner's* `Settings` rather than the rendered chart, so it stayed green
    # for any value an operator could set. `deployment-service.yaml` now derives the number from
    # those two keys with `required`, the same shape as `terminationGracePeriodSeconds`.
    #
    # What is configurable here is the part that is genuinely a judgement call: how much margin the
    # request itself gets on top of the work it is waiting for. 1 s over the shipped 4 renders the
    # same 5 this block used to state.
    readiness:
      periodSeconds: 10
      marginSeconds: 1
      failureThreshold: 3
    # Liveness asks `/healthz`, which does no work at all — so its budget is about a wedged event
    # loop rather than about a dependency, and it stays the slower of the two: readiness drains a
    # struggling pod from the Route, and only a pod that has stopped answering anything is worth
    # restarting.
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  worker:
    # The same 30 x 10 s budget, and it is the same measurement: core's worker and every bundle's
    # worker run the *same image* and import the same tree — `chemclaw.durable.serve` pulls the
    # activities, which pull RDKit, the agent stack and the connector registry — before
    # `chemclaw.core.worker_http` binds a port. Only the front door and the connector servers were
    # given a head start for it.
    #
    # **What that cost is arithmetic, not a guess.** `chemclaw.workerProbes` states
    # `initialDelaySeconds: 10`, `periodSeconds: 20` and `failureThreshold: 6`, so the sixth
    # consecutive liveness failure lands at 10 + 5 x 20 = 110 s and the kubelet SIGKILLs a process
    # that is still importing. Every restart then pays the same imports again, which is the crash
    # loop with nothing wrong in it that `probes.connector` was written for — one pod kind later.
    #
    # A `startupProbe` is again the right shape rather than a bigger `initialDelaySeconds`:
    # liveness and readiness do not run at all until the process answers once, so the two numbers
    # below stay tuned for a *running* worker instead of being stretched to cover a cold start.
    startup:
      periodSeconds: 10
      failureThreshold: 30
      timeoutSeconds: 5

# How long a connector pod is given to finish what it is holding when it is told to stop, and how
# long its Service is given to stop routing to it first. The front door has had both since D-121 and
# the workers have a derived grace period; connector pods had neither, so a rolling update SIGKILLed
# an in-flight MCP tool call at the 30 s default while the front door was still dialling the
# endpoint. The sleep is the same shape as `service.drainSeconds` and for the same reason:
# Kubernetes removes the Endpoint and sends SIGTERM concurrently, so a pod that stopped promptly
# would refuse calls the front door was still making.
connectorDrainSeconds: 10
#
# **The grace period itself is no longer a number here**, because the number that was here was
# wrong and could not be seen to be. It said 120 s and argued that the heavy science "is not in
# process — it is `Chemclaw3-mcp`'s `servers/calc`, dialled over HTTP", which is true and is the
# reason the bound is *large*: the in-process wait is that HTTP call, and this repository's client
# is allowed `CHEMCLAW_CALC_SERVER_TIMEOUT_SECONDS` (900 s) for a composed primitive and
# `CHEMCLAW_CALC_ATOMIC_TIMEOUT_SECONDS` (3600 s) for the two tools pinned to the `xtb` binary. A
# 120 s grace period SIGKILLed a synchronous `optimize_geometry` or `compute_atomic_descriptors`
# at 120 s into a call the rest of the system was prepared to wait an order of magnitude longer
# for — and the cache write that would have made the retry free happens *after* the call returns,
# so the retry recomputed from zero.
#
# `chemclaw.connectorGracePeriod` derives it from those two ConfigMap keys plus the drain above, so
# the pod's ceiling and the client's bound cannot disagree; `tests/test_deploy_chart.py` pins both
# the derivation and the relation against `Settings`' own defaults. A grace period is a *ceiling*,
# not a wait — an idle connector pod still exits in `connectorDrainSeconds` — so covering the worst
# case costs a rolling update nothing and buys the one call that needs it.
#
# `CHEMCLAW_CALC_SAMPLING_TIMEOUT_SECONDS` (14400 s) is deliberately **not** in that maximum: the
# two CREST searches it bounds are reachable only from `connectors/calc/activities.py`, which runs
# on a Temporal *worker* pod under `chemclaw.workerGracePeriod` and Temporal's own retry, never
# from a connector server's synchronous tool surface.

# The port every *worker* container serves `/healthz`, `/readyz` and `/metrics` on
# (`chemclaw.core.worker_http`). A worker has no Service — nothing routes to it — so this is a bare
# container port, named `metrics` for the PodMonitor and the probes to reference. One value across
# core's worker and every bundle's for the same reason `connectorPort` is one: separate pods, no
# port to deconflict, and one number keeps the monitor and the probes consistent by construction.
workerMetricsPort: 9000

# The database this release talks to. The chart does not deploy Postgres (see the ownership row in
# `docs/planning/BACKLOG.md`); what it declares here is what it is allowed to *ask* of one.
postgres:
  # What the server will serve this deployment, in connections — the right-hand side of a bound
  # `core/config/store.py` stated in prose for a year and nothing computed
  # (D-2026-08-05-the-connection-budget-is-a-fleet-number). Every pool opens up to
  # CHEMCLAW_PG_POOL_MAX_SIZE, so the number the database sees is that times
  # `chemclaw.fleetPools`, and until this existed the shipped chart's product was ~272
  # against the `max_connections=100` D-119 measured against.
  #
  # **A pod is not a pool, and this number was computed as though it were.** The helper counted
  # pods until 2026-09-05, while a front-door process holds the stores' pool, the `/readyz`
  # probe's (a distinct `(dsn, options)` key, and that isolation is load-bearing) and the LangGraph
  # checkpointer's — so the declared ceiling covered roughly two thirds of what the fleet opens.
  # How many that is per front door is measured by `tests/test_fleet_pools.py` and multiplied by
  # `chemclaw.fleetPools`, never written here. This value rose with the arithmetic, and the rise is
  # the honest requirement becoming visible rather than a new one: the release always opened what
  # it opens.
  #
  # **How many pools that is, is not written here.** The sentence that was said "17
  # pooled processes × the 8 below", which was 136 exactly — and by the time it was read the
  # `serverReplicas`/`workerReplicas` split had moved the render to 14, so the arithmetic in the
  # comment produced a number the chart no longer renders and the equality it claimed was false.
  # `chemclaw.fleetPools` derives the count from the topology and
  # `CHEMCLAW_PG_FLEET_POOLS` carries it into every pod, which is where the number lives;
  # `tests/test_deploy_chart.py::test_the_shipped_connection_ceiling_matches_the_fleet_the_chart_renders`
  # refuses a chart whose product exceeds this ceiling and prints both sides when it does.
  #
  # This is a ceiling with headroom above the shipped topology, not slack nobody meant: enabling one
  # more connector or raising a replica count must not require re-provisioning the database in the
  # same change. Anything that *exceeds* it fails `Settings` validation at startup, in every pod,
  # naming both sides; the runtime half is `chemclaw_pg_fleet_max_connections` against
  # `sum(chemclaw_pg_pool_max_size)`, which also catches a Deployment scaled by hand — and which
  # was the *only* honest half while this one counted pods, since that gauge has summed a process's
  # pools since D-2026-08-05. A chart whose startup check and whose alert disagree is a chart that
  # passes deploy and pages afterwards.
  #
  # **A process is not a pool, and this ceiling was short by three times where it mattered.** A pool
  # is keyed on `(loop, dsn, options)`, so a *front-door* process holds three: the stores' pool, the
  # `/readyz` probe's own (`api/routes/ops.py` passes its own statement timeout, which is a
  # different `options` string and therefore a different key), and the LangGraph checkpointer's.
  # Every other pooled process — a worker, a connector server, the MCP face — holds one. Measured
  # against a live server via `pg_stat_activity` and the `chemclaw_pg_pool_max_size` gauge, and
  # pinned by `tests/test_fleet_pools.py`. The declared 136 was met by an arithmetic that counted
  # one pool per process; the fleet opened roughly 208. The *runtime* alert was honest the whole
  # time, because that gauge sums every pool the process holds — only the startup check, the one
  # that fires before the pods are up, was not.
  #
  # **This is a provisioning requirement, not a preference.** A stock Postgres ships
  # `max_connections=100` and will refuse this release at full scale. Either provision the instance
  # for this number plus whatever else shares it, or lower CHEMCLAW_PG_POOL_MAX_SIZE below until the
  # product fits what you have — the startup check tells you which, in every pod, with both
  # numbers in the message. What it will not do any more is let the fleet find out under load,
  # which is how D-119's connect timeouts presented: an idle database and a service that could not
  # reach it.
  #
  # Set to 0 to declare no ceiling, which makes both the startup check and the alert inert.
  maxConnections: 256

# The pre-install/pre-upgrade migration hook (D-034).
migrateJob:
  # Four attempts. A migration failure is usually a lock it could not get within
  # CHEMCLAW_PG_MIGRATION_LOCK_TIMEOUT_SECONDS — transient by nature, and retrying is the intended
  # response. A schema error is deterministic and simply fails four times instead of one.
  backoffLimit: 3
  # A ceiling on the whole Job, retries included. Without one, Helm waits on the hook indefinitely
  # and the release sits in `pending-upgrade`, which blocks the next upgrade and needs a recovery an
  # operator has to already know (`docs/guides/runbook.md` §(xi) documents it). 15 minutes covers a
  # migration run plus its retries on a database of the size this chart is written for; raise it
  # before a release that adds an index to a large table.
  activeDeadlineSeconds: 900

# The stored-message conversion Job (`post-upgrade`, the second document in `migrate-job.yaml`).
# Its own block rather than `migrateJob`'s, because the two bound different work: that deadline
# covers DDL and the locks it waits on, this one covers a *row count*
# (D-2026-08-27-a-conversion-that-cannot-be-rolled-back-is-not-a-pre-upgrade-step).
convertJob:
  # The pass is resumable — it selects only rows still stamped `maf` — so a retry continues rather
  # than repeating, which is exactly the shape retrying helps.
  backoffLimit: 3
  # 30 minutes. Only one release in a deployment's life pays this: the upgrade that carries it
  # across the M6 conversion. Every later release finds nothing stamped `maf` and exits in seconds.
  # Raise it before that upgrade if the table is large; a Job that hits the deadline fails the
  # release without touching the pods, and the rows it did convert stay readable.
  activeDeadlineSeconds: 1800

# The Temporal Schedules hook (`post-install,post-upgrade`, `schedules-job.yaml`). Its own block for
# the same reason `convertJob` has one: the three hooks bound different work, and this one bounds a
# handful of gRPC calls rather than DDL or a row count.
schedulesJob:
  # `apply_schedules` reconciles rather than accumulates, so a retry re-runs the whole (idempotent)
  # reconciliation. Three attempts covers a frontend that is still coming up behind the rollout this
  # hook waits for.
  backoffLimit: 3
  # Five minutes, and the reason it must exist at all is a *hang* rather than a failure —
  # `backoffLimit` bounds only the latter. `chemclaw.cli.schedules` connects to Temporal and then
  # calls `list_schedules`/`create_schedule`, and temporalio's `DEFAULT_RPC_TIMEOUT` is `None`: a
  # frontend that completes the gRPC handshake and then stalls leaves this pod running forever and
  # the release pinned in `pending-upgrade`, blocking every later `helm upgrade`. (A refused or
  # blackholed frontend does terminate — measured at ~35 s — which is why this went unnoticed.)
  # The work itself is a few RPCs against a Temporal that the rollout has already proven reachable,
  # so five minutes is generous for the work and short next to the recovery it avoids.
  activeDeadlineSeconds: 300

resources:
  service:
    # Raised from 1 CPU. The front door does real CPU work off its event loop now (RDKit, cache-key
    # hashing and token validation run in worker threads), which is pointless against a 1-CPU limit
    # — the ceiling a load test hit. Adding processes is not the lever: CHEMCLAW_SERVICE_UVICORN_WORKERS
    # is refused above 1 (five per-process guarantees break across processes), so more front-door
    # CPU means more replicas. The request stays modest so scheduling density is unchanged; only the
    # burst headroom grows.
    #
    # **The request is 1 CPU because the admission cap is 12.** A turn spends 0.581 s of CPU over
    # 8.32 s of wall clock, so twelve permits held continuously is ~0.84 cores of steady demand —
    # which a 500m request does not guarantee the moment the node is contended, and the symptom of
    # not guaranteeing it is latency on every turn rather than a failure anyone can point at. The
    # limit already allowed the burst; what was missing was the reservation. This raises what each
    # front-door pod reserves, and at `maxReplicas: 6` that is 6 CPUs reserved rather than 3.
    requests: { cpu: "1", memory: "512Mi" }
    limits: { cpu: "2", memory: "1Gi" }
  # The default for every worker Deployment, core's and a bundle's. A bundle that needs different
  # sizing overrides it with its own `resources:` under `connectors.<name>` rather than growing a
  # key here, which is what keeps a capability's operational shape inside its own entry.
  worker:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "4Gi" }
  # Also used by the knowledge-sync init/sidecar containers: both are small, single-purpose
  # processes, and giving them one shared budget is why this key is not named per-component.
  connector:
    # The limit is 2 CPUs rather than 500m because the `chem` and `calc` connectors are where the
    # synchronous RDKit work lives (depiction, embedding, descriptors) and it now runs in worker
    # threads — which buys nothing under a half-CPU limit. The request is unchanged: the
    # knowledge-sync containers that share this key are still tiny, and a limit they never
    # approach costs nothing.
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "2", memory: "512Mi" }

# Non-secret config → ConfigMap → CHEMCLAW_* env. Keys mirror chemclaw/config.Settings exactly.
config:
  # The one model destination. **Stated rather than left to the code default**, for the reason
  # `CHEMCLAW_CALC_SERVER_URL` below is: the default is the local dev mock on loopback, and a pod
  # that inherited it would refuse to boot (`api/middleware._refuse_unconfigured_llm_gateway`).
  # There is no `CHEMCLAW_LLM_PROVIDER` — this address is the whole knob
  # (`D-2026-09-04-a-gateway-is-the-only-provider`).
  CHEMCLAW_LLM_BASE_URL: "http://internal-llm.llm.svc:8000/v1"
  CHEMCLAW_LLM_MODEL: "gpt-oss"
  # The window of the model on the line above, so the context policy's *second* bound is real.
  # `llm_context_window_tokens` defaults to 0 in code — "undeclared", the honest default for an
  # endpoint this repository cannot interrogate — and 0 means the configured budget is the only
  # thing standing between a turn and a request the gateway rejects outright, which loses the whole
  # turn rather than a conversation group. `D-2026-09-04-a-budget-that-excludes-the-prefix-is-not-a-
  # budget` was written about a request that did not fit a 128k model, and a review on 2026-09-05
  # found the shipped budget permitting one again with this key set nowhere in this chart. It is
  # set here now: `effective_trigger` takes the smaller of `agent_context_token_budget` and
  # `window - llm_max_tokens`, so a budget raised past what this endpoint holds is clamped instead
  # of being sent and refused.
  #
  # 131072 is `gpt-oss`'s published window, so this key and `CHEMCLAW_LLM_MODEL` move together —
  # a release that repoints the model has to restate the window, and a release that routes tasks
  # across models with different windows declares the **smallest** (`core/config/llm.py`).
  CHEMCLAW_LLM_CONTEXT_WINDOW_TOKENS: "131072"
  CHEMCLAW_HARNESS_ENABLED: "true"
  CHEMCLAW_HARNESS_AUTONOMY: "plan_only"
  # The LLM-as-judge over every answer's citation faithfulness is a **deployment opt-in**, off by
  # default here as in code, and switching it on is two facts, not one flag:
  #   1. Startup then runs `require_verifier_capability()` — one structured-output probe against
  #      the routed `"verifier"` model — and **refuses to serve** if that endpoint rejects or
  #      ignores `response_format` (json_schema). On `openai_compatible` that support is the whole
  #      feature: without it the judge degrades to the offline citation gate on every turn while
  #      looking enabled, which is the silent posture the probe exists to end.
  #   2. Near `CHEMCLAW_VERIFIER_CONFIDENCE_THRESHOLD` the verdict is re-rolled and the median
  #      decides, within `CHEMCLAW_VERIFIER_REVIEW_BAND` (default 0.2 — measured, not chosen:
  #      D-2026-08-27-a-verdict-at-the-margin-is-a-coin-toss); the band costs extra judge calls
  #      only on answers that land inside it, counted by chemclaw_verifier_band_rerolls_total.
  # Uncomment to opt in; the model it runs on comes from CHEMCLAW_MODEL_ROUTES' "verifier" entry.
  # CHEMCLAW_VERIFIER_ENABLED: "true"
  # CHEMCLAW_VERIFIER_CONFIDENCE_THRESHOLD: "0.7"
  CHEMCLAW_SESSION_STORE: "postgres"
  # Stated rather than left to the code default (16), because the code default was chosen for one
  # pool and this chart runs a fleet of them — how many is `chemclaw.fleetPools`, derived
  # from the topology rather than counted here, because the count written here said seventeen while
  # the chart rendered fourteen. 8 used to be stated as "matching the front door's admission cap",
  # and that equality is gone twice over: the cap is 12 now, and a front-door process holds *three*
  # pools rather than one, so a connection here costs three times what that sentence assumed. The
  # argument that survives is the one that was doing the work anyway — **a turn does not hold a
  # connection across the model call**, only across a statement, so the pool never needed to be as
  # wide as the cap; measured in the load lane, the pool peaked at 20 of 48 with zero waiters
  # through 100 concurrent users. `chemclaw_pg_pool_requests_waiting` (alerted as
  # `ChemclawPgPoolSaturated`) is what says otherwise, and is the only reason to raise this.
  # `postgres.maxConnections` above is this times the pool count the topology implies, and
  # `Settings` refuses the pair if they stop agreeing.
  CHEMCLAW_PG_POOL_MAX_SIZE: "8"
  # Matched to the pool above, because a worker admitting more activities than it can borrow
  # connections converts a shortage into retry churn rather than backpressure
  # (D-2026-08-05-a-worker-may-not-outrun-its-pool). Stated here rather than left implicit for the
  # same reason the pool is: the two numbers only mean anything together, and a reader changing one
  # has to see the other. A bundle whose activities are long waits overrides it in its own entry.
  CHEMCLAW_WORKER_MAX_CONCURRENT_ACTIVITIES: "8"
  # Stated rather than left to the code default, because the chart *derives* the publish target from
  # it: the knowledge-sync containers write to `knowledge.noteRepoPath` + this, which is exactly how
  # `Settings.knowledge_path` resolves. Left implicit, the chart would have to name the notes
  # subdirectory a second time, and a second name is what published the graph where nothing read it.
  CHEMCLAW_KNOWLEDGE_DIR: "knowledge"
  CHEMCLAW_TEMPORAL_ADDRESS: "chemclaw-temporal-frontend.temporal.svc:7233"
  CHEMCLAW_TEMPORAL_NAMESPACE: "chemclaw"
  # Where the calc physics server lives (`Chemclaw3-mcp`'s `servers/calc`,
  # D-2026-08-16-the-physics-leaves-the-cache-stays). `calc_server_url` is a `CalculatorSettings`
  # field `connectors/calc/remote.py::calc_session` dials directly for EVERY calculation — every
  # SMILES-in tool and every durable calc job — so it belongs in this ConfigMap rather than in the
  # `connectors:` block above: `chemclaw.connectorUrls` only ever computes an address for a bundle
  # this release runs or names with `url:`, and this is neither — `calc`'s own connector pods below
  # keep the D-011 cache and the orchestration, and this is the address *they*, and every durable
  # job's activity, reach out to for the arithmetic itself. Left unset, the code default
  # (`http://127.0.0.1:8860/mcp`) stands in-cluster and every calculation dials a port nothing
  # listens on — silently, because the pod's own `/healthz` never touches it and the probes stay
  # green. Named `chemclaw3-mcp-calc` for the same reason `connectors.chem.url` /
  # `connectors.safety.url` name their siblings: whatever Service the sibling repo's chart gives
  # its `calc` server in this namespace — and stating it here is also what puts a host on the wire
  # every one of those calls crosses, which the NetworkPolicy's egress destinations then have to
  # name.
  #
  # **One occurrence, and that is the point.** This key was declared twice in this block, top and
  # bottom, and a YAML mapping with a duplicate key is not an error to any parser here: Helm and
  # `yaml.safe_load` both silently keep the last. So an operator who edited the *other* one — the
  # one that sat directly under its own explanation of why the key exists — rendered a ConfigMap
  # that still named this address, and hit exactly the failure that explanation described.
  # `tests/test_helm_chart.py::test_no_values_key_is_declared_twice` is what keeps it at one.
  CHEMCLAW_CALC_SERVER_URL: "http://chemclaw3-mcp-calc:8860/mcp"
  # How long this repository's calc client may wait on that server, stated here rather than left to
  # the code default for one reason: **the chart derives a connector pod's shutdown ceiling from
  # them** (`chemclaw.connectorGracePeriod`). A pod grace period shorter than the call it is holding
  # is a SIGKILL through a running calculation, and that is exactly what a hand-written 120 s did
  # against these two numbers. Stating them makes the pod and the chart read one value each instead
  # of a chart number that has to remember what `CalculatorSettings` chose.
  #
  # 900 s is the composed-primitive bound (`optimize_geometry`, `compute_thermochemistry`,
  # `predict_logd`, …); 3600 s is the bound for the two tools pinned to the `xtb` binary
  # (`compute_atomic_descriptors`, `compute_surface_potential`), matched to that binary's own
  # `xtb_cli_timeout_seconds` on the serving side so the *server* is what bounds the wait rather
  # than a shorter client guess that abandons work still being computed.
  CHEMCLAW_CALC_SERVER_TIMEOUT_SECONDS: "900"
  CHEMCLAW_CALC_ATOMIC_TIMEOUT_SECONDS: "3600"
  # The two periodic passes whose *absence* is the only signal that they have stopped, stated here
  # for the same reason the calc timeouts above are: `prometheusrule.yaml` derives
  # `ChemclawOutboxBacklogUnreported` and `ChemclawIngestLagUnreported` from them, and an alert
  # window that has to remember what `Settings` chose is one that stops agreeing with it silently.
  # Both are the code defaults; a deployment that changes a cadence moves its alert with it.
  CHEMCLAW_RESULT_PUBLISH_SCHEDULE_MINUTES: "15"
  CHEMCLAW_ELN_SYNC_SCHEDULE_MINUTES: "60"
  # What that server will serve concurrently — the right-hand side of a bound nothing computed
  # (D-2026-08-27-a-per-worker-cap-is-not-a-backend-ceiling). Every calc worker process may run
  # CHEMCLAW_WORKER_MAX_CONCURRENT_ACTIVITIES activities at once and each holds one session to that
  # single pod, so what it is offered is that cap times `connectors.calc.workerReplicas` — and
  # scaling that worker, an ordinary operational lever, multiplied CPU-bound load on it invisibly.
  # Anything exceeding this fails `Settings` validation at startup, in every pod, naming both sides.
  #
  # **Shipped as 0 — undeclared, and therefore inert — deliberately.** The other two budgets ship a
  # real number because both describe something this release provisions (its own replicas, the
  # database it is given). This one describes the admission semaphore of a pod in *another* release
  # (`Chemclaw3-mcp` `servers/calc`), whose CPU allocation this chart cannot see; a number invented
  # here would be a guess wearing the shape of a statement. Set it to that server's own ceiling.
  # The runtime half needs no declaration to be useful: `sum(chemclaw_calc_requests_in_flight)` is
  # the live load, and it also counts the calc *server* pods' dispatches, which no product can.
  CHEMCLAW_CALC_BACKEND_MAX_CONCURRENT_REQUESTS: "0"
  # Where the reaction labeller answers (`Chemclaw3-mcp`'s `rxnlabel`, port 8865). The same
  # argument as `CHEMCLAW_CALC_SERVER_URL` above and reached the same way — the code default is a
  # loopback address chosen for a dev process, and `durable/schedules.py` creates the
  # `reaction-labels` Schedule for any data source that `provides` reactions with no separate
  # enable flag by design. So a site that attaches its reaction corpus (the shipped, supported
  # path) had its hourly drain dial `127.0.0.1:8865` — the background worker's own pod — and every
  # faceted precedent question answered from an empty label index with no error anywhere. That is
  # D-131 on the one client the connector seam never covered, because this manifest is deliberately
  # off `CHEMCLAW_CONNECTORS_DIR` (it is an internal primitive, not a tool the agent chooses).
  #
  # Inert until a corpus is attached: with no reactions-providing source, no Schedule exists and
  # nothing dials this. Named `chemclaw3-mcp-rxnlabel` for the reason `chemclaw3-mcp-calc` is —
  # whatever Service the sibling repo's chart gives that server in this namespace. Its bearer is
  # `secrets.optionalKeys.rxnlabelToken`, and its port is `networkPolicy.egressPorts.rxnlabel`;
  # both are needed, because an egress rule restricts by port independently of `to:`.
  CHEMCLAW_RXNLABEL_SERVER_URL: "http://chemclaw3-mcp-rxnlabel:8865/mcp"
  # Entra identity is mandatory system-wide (the one exception is the generic LLM credential).
  CHEMCLAW_ENTRA_REQUIRED: "true"
  CHEMCLAW_ENTRA_TENANT_ID: "00000000-0000-0000-0000-000000000000"
  CHEMCLAW_ENTRA_AUDIENCE: "api://chemclaw"
  # ⚠ EMPTY ON PURPOSE, AND EMPTY MEANS CLOSED. Until an operator sets this to their own Entra app
  # role(s), **every job a connector manifest declares `expensive: true` is refused for everyone**:
  # `sample_conformers`, `compute_interaction_energy`, `refine_ensemble` and the rest of `calc`'s
  # expensive set, plus `start_optimization_campaign`. The trigger gate fails closed on an empty
  # role set rather than open (`agent/authz.authorize_trigger`), which is the safe direction and a
  # silent one — the pod boots, the probes pass, reads work, and a chemist asking for a conformer
  # search is told they lack a privileged role. Set it to a comma list of the Entra app roles your
  # chemists actually hold (`"my-org-calc-users,my-org-platform-admins"` in shape, not in content)
  # and the jobs open.
  #
  # **The key is written out, rather than left to the code default, exactly so the emptiness is
  # visible.** An absent key shows up in nothing — not `helm show values`, not the rendered
  # ConfigMap, not an operator's values diff. A present, empty one shows up in all three.
  #
  # **And it is empty rather than a placeholder role name, deliberately.** A plausible-looking name
  # here would be worse than nothing: it is a *config that looks configured*, so it survives review
  # and reaches a cluster, where it grants nothing and the refusal ("the account holds none of the
  # roles this tool requires") points the operator at Entra group membership instead of at this
  # file. The other placeholders in this block get away with it because their shape is inert — a
  # zero GUID fails a token exchange loudly. A role name has no such shape: every string is a valid
  # role, and the wrong one fails silently *by design*, because "you do not hold this role" is the
  # gate working correctly. Naming a role would also be this chart asserting an organizational fact
  # it cannot know.
  CHEMCLAW_ENTRA_PRIVILEGED_ROLES: ""
  CHEMCLAW_OTEL_ENABLED: "true"
  CHEMCLAW_OTEL_ENDPOINT: "http://otel-collector.observability.svc:4317"
  # A span per model call, with its token counts, model name and provider — the two things this
  # deployment could not ask after the agent framework left with `gen_ai.client.token.usage`. On
  # here because the collector two lines up already exists and the spans have nowhere else to be;
  # off in code, where there is no collector to send them to.
  #
  # Content stays off: `CHEMCLAW_OTEL_INCLUDE_SENSITIVE_DATA` is unset, so every OpenInference hide
  # flag is set and a span carries identifiers and counts. Measured — suppression costs none of the
  # counts, so this is not a trade the chart is making on an operator's behalf.
  #
  # Point the collector at Arize Phoenix to read these natively; nothing here requires it, and the
  # instrumentation in the image is Apache-2.0 where Phoenix's server is Elastic License 2.0.
  CHEMCLAW_OTEL_LLM_SPANS: "true"
  # Stated rather than inherited, because it is the *paired* decision to the line above and the
  # code default alone leaves it invisible here: a reader of this file would see model-call spans
  # switched on and have to know somewhere else that they carry no content. False sets every
  # OpenInference hide flag, so a span carries identifiers and counts.
  #
  # This cannot un-set a value a deployment carries in its own overrides — and one may, because
  # the flag governed nothing for a phase and was kept precisely because a values file might still
  # hold it. That case is why `configure_telemetry` warns, naming the endpoint the content would
  # go to. What this line does is make the shipped policy explicit and keep the two settings
  # readable together, so a future edit to one is made beside the other.
  CHEMCLAW_OTEL_INCLUDE_SENSITIVE_DATA: "false"
  # The runaway-cost guard, on in production (REV-16). Off is the *code* default because a CLI or
  # a test must not 429, but a deployment serving real users has no reason to be unguarded: a turn
  # is iteration-capped and the number of turns is not, so a client or an automated push-back loop
  # can accumulate unbounded LLM spend. The caps below are the shipped defaults — generous for a
  # real chemist, finite against a loop — and the load run that validated this system ran with
  # budgets on, so "on" is the configuration that was actually measured.
  CHEMCLAW_BUDGET_ENABLED: "true"
  # The *within-turn* half of the same guard, and it ships **off** where the one above ships on.
  # `BUDGET_ENABLED` meters whole turns — `check()` before one, `record()` after it — so the case
  # neither half sees is a single turn spending without a bound while it runs
  # (`agent/spend_cap.py`). This is that ceiling, in billed tokens across every model call of a
  # turn, the subagent's included.
  #
  # 0 (no cap) is deliberate rather than an omission, and it is the one guard in this block that
  # ships inert. The others refuse a *request*; this one **ends a turn that is already running**,
  # so a number set too low loses work a chemist has waited for, and no number this chart could
  # ship would be right for a corpus it has never seen. Size it from this deployment's own
  # `turn_costs.total_tokens` rows — the p99 of a turn that answered, with headroom — and set it
  # then. `chemclaw_turn_spend_caps_total` is what says whether the number you chose is biting.
  #
  # Turning it on is not what makes the deployment guarded: `harness_max_loop_iterations` still
  # bounds the loop, and that cap is on in every configuration.
  CHEMCLAW_AGENT_MAX_TURN_BILLED_TOKENS: "0"
  # On in production, off in code, for the same reason `BUDGET_ENABLED` is (REV-16): a CLI, a test
  # and a single-user dev run have no reason to be throttled, and a deployment serving real users
  # over a shared endpoint has no reason not to be. The turn guards above bound what reaches the
  # LLM; this bounds everything else — `/proposals`, `/jobs`, `/schedules`, `/sessions` — which was
  # entirely unmetered, so a loop with no LLM call in it cost nothing to run.
  # 120/min sustained with a burst of 30: far above a chemist clicking through a UI, far below what
  # a script can do. Per process, so `service.autoscaling.maxReplicas` multiplies the real ceiling —
  # the same caveat the admission cap carries, and the reason a fleet-wide limit belongs at the
  # ingress rather than here.
  CHEMCLAW_SERVICE_RATE_LIMIT_PER_MINUTE: "120"
  CHEMCLAW_SERVICE_RATE_LIMIT_BURST: "30"
  # The admission cap, per front-door process. Stated here rather than left to the code default for
  # a reason the code default cannot serve: the HPA's occupancy target is a *fraction of this*
  # (`service.autoscaling.occupancy.targetPercent`), so the number the autoscaler scales against and
  # the number the pods enforce have to be the same number, read from one place. It is also the
  # multiplicand in the fleet ceiling below.
  #
  # 12 is what the machinery measures — a turn is 8.32 s wall / 0.581 s CPU, so one core carries
  # ~14 permits before CPU binds — and it is why `resources.service.requests.cpu` is 1 rather than
  # 500m: twelve permits are ~0.84 cores of steady demand, which a half-core request does not
  # guarantee under node contention.
  CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS: "12"
  # What the shared LLM endpoint may be asked to serve by this whole deployment, at once.
  #
  # The admission cap is per-process and stays that way (SCALE-1: a fleet-wide counter would cost a
  # durable write and a heartbeat per turn to bound a resource). The consequence is that the number
  # that matters is `service.autoscaling.maxReplicas × uvicorn workers ×
  # CHEMCLAW_SERVICE_MAX_CONCURRENT_TURNS`, and until now nothing stated it: raising the per-process
  # cap from 8 to 16 to "use the box better" doubled fleet demand on a shared endpoint, silently.
  #
  # It ships as exactly what the shipped values produce — deliberately, so this is a *statement* of
  # the current shape rather than slack, and so any edit to a replica ceiling or the cap above has
  # to come back here. Raise it only with a number from the endpoint's throughput budget; anything
  # that exceeds it fails `Settings` validation at startup, in every pod, naming both sides. The
  # runtime half is `chemclaw_fleet_turn_ceiling` against `sum(chemclaw_turn_capacity)`, which also
  # catches a Deployment scaled by hand.
  #
  # **What that number now buys, in chemists.** Concurrent turns in flight = users × turns/hour ×
  # 8.3 s / 3600, so 200 people at a turn a minute is 27.7 in flight and 200 people at a turn every
  # 30 s is 55.3. The old ceiling was 48 *and unreachable*, because the CPU-only HPA never left
  # `minReplicas: 2` = 16. Both halves had to move for either to matter.
  CHEMCLAW_SERVICE_FLEET_MAX_CONCURRENT_TURNS: "72"
  # JSON logs in-cluster. Every line already carries correlation_id / actor / session_id from the
  # context filter; JSON is what lets a log stack index them instead of regexing a `%`-string.
  CHEMCLAW_LOG_JSON: "true"
  # Stated here rather than left to the code default, because the chart *derives* the front door's
  # `terminationGracePeriodSeconds` from it: a turn is bounded by this, so a drain that outlasts it
  # cannot cut one short. Left implicit, an operator raising the turn budget would silently start
  # having turns SIGKILLed at the old grace period. `tests/test_deploy_chart.py` pins that this key
  # exists for exactly that reason.
  CHEMCLAW_SERVICE_TURN_TIMEOUT_SECONDS: "600"
  # The worker half of the same rule (`durable/serve.py`): an in-flight activity gets this long to
  # finish after SIGTERM, and the worker Deployments' grace period is derived from it.
  CHEMCLAW_WORKER_GRACEFUL_SHUTDOWN_SECONDS: "120"
  # The two budgets `/readyz` spends, stated here for the same reason as the turn timeout above:
  # the front door's `readinessProbe.timeoutSeconds` is *derived* from them
  # (`deployment-service.yaml`). Left implicit, an operator who raised either one — the honest
  # response to a slow connector fleet — kept a probe timeout sized for the old number, and the
  # kubelet then took a front door that was answering correctly out of its Service. The derivation
  # is what makes the two numbers one number; `tests/test_deploy_chart.py` renders the chart and
  # checks that they still agree, rather than reading the test process's own `Settings`.
  CHEMCLAW_CONNECTOR_HEALTH_TIMEOUT_SECONDS: "2"
  CHEMCLAW_SERVICE_READINESS_DB_TIMEOUT_SECONDS: "2"

# Secret refs (F6-T6). This list is the whole of what is at rest: nothing else here is a
# credential, and no component mints an outbound Entra token of its own (the workload-federation
# and OBO exchanges were deleted, having never acquired a caller). So each entry below is an
# architecture decision (D-047) with its own argument, written beside it. `tests/test_helm_chart.py` pins the exact set, so a seventh cannot arrive
# unnoticed. This comment used to say "the THREE documented plain secrets" and went stale twice
# without anyone noticing, which is why the count now lives in the test rather than in prose.
# Populate via an ExternalSecret/SealedSecret; the chart only names them.
secrets:
  # Name of a pre-existing Secret with these keys, or let the chart template a placeholder.
  create: false
  name: "chemclaw-secrets"
  keys:
    llmApiKey: "CHEMCLAW_LLM_API_KEY"
    postgresDsn: "CHEMCLAW_POSTGRES_DSN"
    # Push credential for the knowledge repo (gap DEP-2). Without it the PR-gate cannot open a
    # branch for any agent-authored note, so every knowledge write fails at push in-cluster.
    knowledgeRepoToken: "CHEMCLAW_KNOWLEDGE_REPO_TOKEN"
    # The shared secret the git host signs its post-merge webhook with. Without it
    # `/events/knowledge-merged` can still force a reindex but may not close a proposal as merged
    # (D-2026-07-31-a-proposal-is-a-record-not-a-branch), so every reviewed note would stay in the
    # queue forever — a review surface that only ever grows is one nobody works.
    noteWebhookSecret: "CHEMCLAW_NOTE_WEBHOOK_SECRET"
  # Secrets that are safe when unset, rendered with `optional: true` so naming a new one does not
  # take an existing release down on upgrade (see `chemclaw.env` in `_helpers.tpl`).
  optionalKeys:
    # The HMAC key `agent/framing.py` derives the retrieved-content envelope tag from. It gets a
    # Secret slot rather than a `config` entry because `config` renders into a ConfigMap, which the
    # OpenShift `view` role can read — a far wider grant than `get secrets`. Anyone who learns this
    # value can compute the tag, close the envelope from inside a document they can place in any
    # retrieval source, and have their text read as instructions instead of as data.
    #
    # Optional rather than required: the setting defaults to `""` and the app starts either way, so
    # a required key would only buy a mandatory Secret edit for every existing deployment.
    #
    # **Unset is not "predictable", which is what this comment used to say and is the weaker
    # failure.** `agent/framing.py::_envelope_nonce` falls back to `secrets.token_hex(8)` — a fresh
    # random value *per process*. So the tag is unguessable and also unshared: two replicas frame
    # with different tags, and a restart changes the tag under a durable session's stored history.
    # The agent instructions say only an envelope carrying exactly the current tag marks retrieved
    # content as data, so a thread replayed by another pod has its older retrieved material read as
    # ordinary prose — the injection marking switches itself off for precisely the oldest content it
    # exists to cover. Any deployment with `session_store="postgres"` or more than one replica
    # should set this; `docs/planning/BACKLOG.md` carries the open question of whether the
    # combination should be refused at startup.
    framingEnvelopeSecret: "CHEMCLAW_FRAMING_ENVELOPE_SECRET"
    # The bearer token the read-only MCP face requires on `/mcp`
    # (`CHEMCLAW_COMPONENT=mcp-face`, D-2026-08-29-a-digest-nobody-receives-is-not-delivered).
    # A Secret slot rather than a `config` entry for the reason above: `config` renders into a
    # ConfigMap the OpenShift `view` role can read, and anyone who learns this value can read
    # the whole knowledge graph through that surface.
    #
    # Optional because the face is a role a deployment opts into by running it at all — but
    # note the asymmetry that makes that safe: the middleware fails **closed** on an unset
    # variable, so a face deployed without this answers 401 rather than serving anonymously.
    mcpFaceToken: "CHEMCLAW_MCP_FACE_TOKEN"
    # The `chem`, `safety` and `calc` bearer tokens `connectors/identity.py::_EnvBearerAuth` reads
    # per request (`connectors/chem/connector.yaml` and `connectors/safety/connector.yaml`'s
    # `token_env`) and `connectors/calc/remote.py` reads via `settings.calc_server_token_env`. They
    # land here for the *upgrade* reason `framingEnvelopeSecret` does, not the capability one:
    # `chemclaw.env` renders `secrets.keys` as a **required** `secretKeyRef` included by every
    # Deployment in the chart, so a required entry would take the front door and every worker into
    # `CreateContainerConfigError` on `helm upgrade` — not just the pods that call these bundles.
    #
    # Unlike `framingEnvelopeSecret`, though, "optional" here says nothing about whether the
    # capability tolerates being unset. It does not: `_EnvBearerAuth` raises
    # `MissingConnectorCredential` on the very first call with no token present, and for `calc` that
    # is every SMILES-in tool and every durable calc job, not a degraded corner. `optional: true`
    # only protects the pods that never reach these bundles from a Secret edit they have nothing to
    # do with; the operator still has to set all three before `chem`, `safety` or `calc` works.
    chemToken: "CHEMCLAW_CHEM_TOKEN"
    safetyToken: "CHEMCLAW_SAFETY_TOKEN"
    calcToken: "CHEMCLAW_CALC_TOKEN"
    # The fourth of exactly that kind, and the paragraph above applies to it verbatim: the
    # `rxnpredict` bundle's manifest names this variable with `token_env`, `_EnvBearerAuth` reads it
    # per request, and unset means `MissingConnectorCredential` on the first prediction rather than
    # a degraded one.
    rxnpredictToken: "CHEMCLAW_RXNPREDICT_TOKEN"
    # The four bundles **we** host, each authenticating its own `/mcp` (D-2026-08-20). Until they
    # declared a credential the NetworkPolicy was the only thing between any pod in the namespace
    # and a tool that starts durable expensive work — and a NetworkPolicy selects peers, not paths.
    #
    # Both ends read the same variable: `connectors/server.py`'s `BearerAuthMiddleware` on the
    # serving pod, `connectors/identity.py`'s `_EnvBearerAuth` on core and the workers. Because
    # `chemclaw.env` mounts these onto every Deployment, one value per bundle covers both sides
    # with nothing to keep in step.
    #
    # `_MCP_TOKEN`, not `_TOKEN`: `CHEMCLAW_CALC_TOKEN` above is a *different hop* — the credential
    # core presents to the remote calc server — and two hops sharing a name is how one of them ends
    # up pointed at the wrong secret.
    #
    # `optional: true` for the upgrade reason the three above carry, and with the same caveat: it
    # says nothing about whether the capability tolerates being unset. It does not. Unset, the
    # serving pod refuses every MCP request and core raises `MissingConnectorCredential` on the
    # first call — which is the fail-closed direction, and still an operator's job to fill in.
    boMcpToken: "CHEMCLAW_BO_MCP_TOKEN"
    calcMcpToken: "CHEMCLAW_CALC_MCP_TOKEN"
    molfpMcpToken: "CHEMCLAW_MOLFP_MCP_TOKEN"
    rxnfpMcpToken: "CHEMCLAW_RXNFP_MCP_TOKEN"
    # The reaction labeller's bearer (`settings.rxnlabel_server_token_env`, read per request by
    # `ingest/labels/labeller.py`). Same shape as `calcToken` one hop away: a credential this
    # release *presents* to a server it does not run.
    rxnlabelToken: "CHEMCLAW_RXNLABEL_TOKEN"
    # **Four credentials that had no slot at all**, and therefore exactly one chart seam left:
    # `.Values.config`, which renders a ConfigMap the OpenShift `view` role can read and which
    # `helm get values` prints. Each has a live reader, and each is optional in the sense the four
    # above are — the release runs without it, and the feature it gates does not.
    #
    #   * `llmFallbackApiKey` — the failover endpoint's own credential
    #     (`agent/llm_provider.py`). `core/config/llm.py` describes the gap it closes as "total
    #     rather than degraded", and enabling it needs three keys: two ordinary config and this.
    #   * `vectorStoreApiKey` — Qdrant / Databricks Vector Search
    #     (`retrieval/vectors/{qdrant,databricks}.py`). Unused by the `pgvector` default.
    #   * `temporalApiKey` — the Temporal Cloud path (`core/temporal_client.py`), which was simply
    #     unreachable from this chart. Self-hosted Temporal uses the mTLS Secret instead.
    #   * `sessionStoreDsn` — a session store split off `postgres_dsn`
    #     (`agent/session_store.py`). It falls back to `CHEMCLAW_POSTGRES_DSN`, so a split store
    #     had no seam.
    llmFallbackApiKey: "CHEMCLAW_LLM_FALLBACK_API_KEY"
    vectorStoreApiKey: "CHEMCLAW_VECTOR_STORE_API_KEY"
    temporalApiKey: "CHEMCLAW_TEMPORAL_API_KEY"
    sessionStoreDsn: "CHEMCLAW_SESSION_STORE_DSN"
  # Secrets for the **migration hook Job only**, and the separation from `keys` above is the whole
  # point rather than tidiness: `chemclaw.env` mounts every key in that map onto every pod, so a
  # migration credential listed there would be present on the front door and every worker for the
  # life of the deployment — which is precisely the exposure this exists to remove
  # (D-2026-08-05-append-only-by-grant-not-by-contract).
  #
  # Leave the Secret key unset (or absent from the Secret) to run one principal, which is what
  # `make up`, CI and every dev database do: `postgres_migration_dsn` falls back to
  # `postgres_dsn` and nothing changes. Set it, create a `chemclaw_app` role, and the credential
  # that can issue DDL — or rewrite `audit_events` — exists only inside a Job that runs for the
  # seconds a release takes.
  migrationKeys:
    postgresMigrationDsn: "CHEMCLAW_POSTGRES_MIGRATION_DSN"
  # Temporal mTLS is mounted as files; the env points at the mount paths. Unlike the keys above,
  # this Secret is *not* optional when it is switched on — see the toggle.
  temporalTls:
    # Whether this deployment's Temporal frontend speaks mTLS. On by default, because the one this
    # chart describes does (self-hosted in-cluster, D-049).
    #
    # It is a toggle because it had to be one of two things and was neither. `chemclaw.env` exported
    # the three PEM paths unconditionally, and `core/temporal_client._tls_config()` short-circuits
    # only when all three settings are empty — so every pod read three files from a Secret the chart
    # names and never creates, mounted `optional: true`. A deployment without that Secret got
    # `FileNotFoundError: /etc/temporal/tls/tls.crt`: the post-install Schedules hook failed naming
    # neither Temporal nor a Secret, the workers crash-looped, and the front door passed both probes
    # because `/readyz` never touches Temporal. No value could turn the env off, so the plaintext
    # path `connect_options()` documents was unreachable from the chart.
    #
    # `true`  — the env, the volume and a **required** mount. A missing Secret now fails at pod
    #           creation with `secret "chemclaw-temporal-tls" not found` on the pod, before any
    #           process starts, which is a message that names what to create.
    # `false` — none of the three. The client connects plaintext, which is the correct shape for a
    #           dev cluster or a Temporal frontend fronted by a service mesh.
    enabled: true
    # Populate this Secret with exactly three keys: `tls.crt` (client certificate), `tls.key` (its
    # private key) and `ca.crt` (the CA that signs the Temporal frontend). A `kubernetes.io/tls`
    # Secret supplies the first two under those names; `ca.crt` is added alongside. Documented in
    # `deploy/README.md` — the chart only names it, like every other secret here.
    secretName: "chemclaw-temporal-tls"
    mountPath: "/etc/temporal/tls"

# Workload Identity Federation: the ServiceAccount is annotated so the pod's projected SA token can
# be exchanged for an Entra token (F4-T2). No client secret is stored.
serviceAccount:
  name: "chemclaw"
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
  # No component calls the Kubernetes API (there is no in-cluster client anywhere in `src/`), so the
  # projected API token every pod would otherwise mount is pure attack surface: a compromised pod
  # could present it to the API server with whatever this SA is granted. Off by default; a release
  # that genuinely needs the token (a future in-cluster reader) sets this true deliberately. Entra
  # workload identity uses a *federated* token from the annotation above, not this mount, so turning
  # it off does not touch identity.
  automountServiceAccountToken: false

# NetworkPolicy egress **port** allow-list (F6-T2). It bounds the ports, never the destinations —
# `egressDestinations` below is what bounds those, and the chart refuses to render until a release
# states one posture or the other. This line said "the app talks only to these, nothing else leaves
# the pod", which was the same claim `deploy/README.md` made and the object did not keep.
# Includes the internal LLM (8000) and OTLP collector (4317) — both plain HTTP on non-443 ports, so
# they must be listed explicitly or the agent cannot reach its model / ship traces.
# Metrics collection (REV-2). The `/metrics` route has existed since DEP-4 and nothing scraped it,
# so every counter in the system was exposed and uncollected — an observability story that fails
# quietly, because the endpoint answers and no dashboard has ever had a data point.
#
# A ServiceMonitor targets OpenShift's user-workload monitoring (the Prometheus Operator). Set
# `additionalLabels` to whatever the cluster's Prometheus uses in its `serviceMonitorSelector` —
# it is release-specific, commonly `release: <prometheus-release>`, and cannot be guessed here.
# Disable if the cluster collects by some other mechanism.
monitoring:
  enabled: true
  path: /metrics
  interval: 30s
  # Below `interval`, so a slow scrape is dropped rather than overlapping the next one.
  scrapeTimeout: 10s
  additionalLabels: {}
  # Collected-and-un-alerted is the same failure REV-2 fixed one level down: the ServiceMonitor
  # made the metrics visible, and until now not one of them fired anything. `agent/audit.py`
  # explicitly logs a stable `audit_sink_failure` marker so it can be alerted on; nothing was.
  alerts:
    enabled: true
    # Fleet-wide hourly token ceiling before warning. The per-process budget guard bounds one
    # runaway process (the "$400 in twenty minutes" failure) and says nothing about the fleet, so
    # this is the only signal that covers a slow burn across pods. Deliberately generous —
    # tune it to the deployment's real baseline rather than treating the default as meaningful.
    tokensPerHourWarning: 2000000
    # The alert whose intent is "sustained", not "it happened once". A `for:` cannot express that
    # over an `increase(...) > 0`: the expression keeps returning a sample for the whole range
    # window after a single increment, so a `for:` shorter than the window is satisfied by one blip
    # and only delays the page. The count is the threshold instead, and it is a value because how
    # many probe misses a deployment tolerates is a property of its network, not of the chart.
    # "More than five in the window"; tune to the deployment's real baseline rather than treating
    # the default as meaningful.
    durableUnreachableWarning: 5
    # The p95 turn latency, in seconds, that `ChemclawTurnLatencyHigh` treats as "slow enough that
    # a chemist has stopped waiting". `core/logging.py` argues the turn histogram exists *precisely*
    # because a trace "cannot answer 'what is p95 right now' for an alert" — and until now nothing
    # asked it. 120 s is well inside `CHEMCLAW_SERVICE_TURN_TIMEOUT_SECONDS` (600), so the alert
    # fires while turns are still completing rather than only once they start timing out; the
    # timeout counter is the *other* signal and has its own rule.
    turnLatencyP95Seconds: 120
    # The share of durable jobs that may end `failed` before the durable group pages. A ratio and
    # not a count, because one connector's jobs are minutes apart and another's are seconds apart —
    # a count would mean a different thing in each bundle the chart enables.
    jobFailureRatio: 0.2
    # **The traffic floor every ratio alert is gated on, and the reason it exists.**
    #
    # A ratio alone fires at 100% on a single event in an otherwise idle window: one failed turn at
    # 03:00 with no other traffic is `rate(failed) / rate(started) = 1`, which is over any threshold
    # anybody would set. `clamp_min(denominator, 0.001)` was in both expressions and does not fix
    # this — it is a division-by-zero guard, and it makes the problem *worse* by turning the empty
    # window into a large finite ratio rather than no sample. Measured with `promtool test rules`:
    # one failure and one start in ten minutes evaluated to 1 and the alert fired.
    #
    # So each ratio carries an absolute floor on its own denominator, in events per second, and the
    # window each is read over is what makes them comparable:
    #   turnsFloorPerSecond 0.01  = 6 turns in the rule's 10-minute window
    #   jobsFloorPerSecond  0.002 = ~3.6 durable jobs in the rule's 30-minute window
    # Both are per-second because that is what `rate()` returns; the counts above are what an
    # operator should tune against, and a deployment quieter than its floor is one whose ratio
    # cannot mean anything yet.
    turnsFloorPerSecond: 0.01
    jobsFloorPerSecond: 0.002
    # How long a result publication may sit undelivered before the outbox counts as stuck, in
    # seconds. Read off `chemclaw_outbox_oldest_pending_seconds`, the age gauge, and NOT off
    # queued-minus-published: dead-lettered rows never leave that difference, and its two counters
    # live in different processes, so restarting one makes it go negative
    # (`core/metrics.py`, `chemclaw_outbox_dead_lettered`). 30 minutes: long enough that a retry
    # backoff is not an alert, short enough that a wedged drain is caught inside a working day.
    outboxStuckSeconds: 1800
    # How far behind an ingest cursor may fall before it counts as wedged, in seconds. A source
    # whose fetch has wedged advances no cursor and logs `ingested=0`, which is exactly what a
    # genuinely quiet source also does — the lag gauge is the only thing that separates them. 24
    # hours, because the shipped sources are nightly.
    ingestLagSeconds: 86400
    # How old this pod's newest note may be before `ChemclawKnowledgeCorpusStale` fires, in
    # seconds. **0 renders no rule, and that is the shipped state**, because this is the one
    # threshold in this block the chart cannot derive: `chemclaw_knowledge_sync_age_seconds` reads
    # the age of the newest note on the volume — the publish is `rsync -a` off a `git reset --hard`
    # checkout, so an mtime is when a note's *content* reached this pod — and it therefore cannot
    # tell a sync wedged on an expired credential from a fortnight in which nobody wrote a note.
    # A default here would be this chart guessing how often somebody else's chemists publish, and
    # guessing high pages for the quiet weeks while guessing low never fires. Set it to a few times
    # your corpus's real merge interval; the gauge is on the "Knowledge corpus age on each pod"
    # panel in `dashboards/chemclaw-data.json` and reading that for a fortnight is how to pick the
    # number. The sync sidecar's own `staleness` liveness probe is the other half of this signal
    # and needs no threshold from here, because it reads when the refresh last *ran*.
    #
    # This number gates **both** arms of the rule. The gauge reports -1 for a tree holding no note
    # at all, and the alert fires on that too (`age > threshold or age < 0`) — a plain comparison
    # never could, since -1 is not greater than a positive number. Leaving it at 0 therefore also
    # opts out of the empty-volume alarm, which is deliberate: a deployment that does not use the
    # knowledge graph has an empty tree on purpose.
    knowledgeCorpusStaleSeconds: 0
    # **When a periodic producer's series is simply absent.** Four gauge families here
    # (`chemclaw_outbox_pending`, `chemclaw_outbox_oldest_pending_seconds`,
    # `chemclaw_outbox_dead_lettered`, `chemclaw_ingest_cursor_lag_seconds`) are written by a
    # scheduled pass and are empty on a fresh process until that pass runs. So "the drain is not
    # running at all" presents as *series absence*, and `ChemclawResultOutboxStuck` /
    # `ChemclawIngestCursorStalled` cannot fire on it — a rule needs the series to evaluate it.
    # Seeding the families at startup was considered and is worse: it would publish `pending=0` for
    # a queue that is actually deep.
    #
    # Both halves are stated in *passes* and multiplied by the producer's own cadence
    # (`CHEMCLAW_RESULT_PUBLISH_SCHEDULE_MINUTES`, `CHEMCLAW_ELN_SYNC_SCHEDULE_MINUTES` in `config`
    # below) rather than written as durations, because a site that raises a schedule to 30 minutes
    # would otherwise turn a fixed 1 h window into a false-positive generator.
    #
    # `silenceHoldPasses` is not decoration: `absent_over_time` is true from the moment a *fresh
    # install* starts, since the first pass has not run yet, so a `for: 0m` absence rule pages on
    # every install. Holding for two more cadences puts the page a clear two passes past the point
    # where a healthy first pass would have cleared it.
    silenceWindowPasses: 4
    silenceHoldPasses: 2
    # How much longer than a cold start `ChemclawTargetDown` waits before paging, in seconds.
    #
    # **This exists because that alert could fire on an ordinary rollout.** A PodMonitor's pod
    # discovery and a ServiceMonitor's endpoint discovery both make a pod a scrape *target* from
    # the moment it exists, not from the moment it is ready — so `up` is 0 for the whole of a cold
    # start, and every pod kind here is given `probes.*.startup.periodSeconds x failureThreshold`
    # to finish importing. `for: 5m` sat *inside* that budget, so a slow node during a deploy paged
    # `critical` for a process that was starting normally.
    #
    # The rule's `for:` is therefore derived from the largest startup budget in `probes:` plus this
    # margin, rather than stated — raising a startup budget without moving the alert is exactly the
    # drift that produced the pair.
    targetDownMarginSeconds: 60
    # Which scrape targets `ChemclawTargetDown` watches, as a PromQL matcher on the `job` label.
    # `.+` means "every target in this release's namespace", which is correct by construction: the
    # rule already pins `namespace`, this chart's ServiceMonitor and PodMonitor are what put those
    # targets there, and a namespace that holds only this release therefore needs no guess about
    # what `job` label the Prometheus Operator assigned. Narrow it if the namespace is shared —
    # the operator's default `job` is the Service name for a ServiceMonitor and
    # `<namespace>/<name>` for a PodMonitor, so `chemclaw.*` is the usual narrowing here.
    targetJobPattern: ".+"
    # Where an alert's `runbook_url` points. Every rule carries one, built as
    # `<runbookBaseUrl>#<anchor>` from the "When an alert fires" index in
    # `docs/guides/runbook.md` — so the operator woken at 03:00 gets the section rather than a
    # summary line. Repoint it at wherever your deployment publishes that file.
    runbookBaseUrl: https://github.com/8fqycwdt8v-oss/Chemclaw3/blob/main/docs/guides/runbook.md
  # Routing for the alerts above. **On OpenShift, a PrometheusRule in a user namespace fires into
  # nothing by default**: user-workload alerts are sent to the platform Alertmanager, whose routes a
  # cluster admin owns and which normally drops what it does not recognise. Two cluster-side
  # switches decide whether an `AlertmanagerConfig` in *this* namespace is read at all, and neither
  # is on out of the box — `docs/guides/runbook.md` § "Make the monitoring stack actually collect
  # this" has both ConfigMap edits. Without one of them this object is inert, exactly like a
  # ServiceMonitor with user-workload monitoring disabled.
  alertmanager:
    # Off by default because the chart cannot invent a receiver: a Slack webhook, a PagerDuty
    # routing key and an SMTP relay are all deployment facts. On with no `receivers`, the render
    # *fails* naming this block rather than shipping an AlertmanagerConfig that routes to nothing —
    # the same discipline as the egress and retention postures below.
    enabled: false
    # The `AlertmanagerConfig` API version to render. `v1beta1` is what OpenShift 4.12+ and
    # prometheus-operator 0.60+ serve; a cluster on an older operator has only
    # `monitoring.coreos.com/v1alpha1`, whose schema for this object is otherwise identical.
    apiVersion: monitoring.coreos.com/v1beta1
    # Receivers, passed through verbatim into `spec.receivers`. For example:
    #   receivers:
    #     - name: chemistry-oncall
    #       slackConfigs:
    #         - apiURL: {name: chemclaw-alertmanager, key: slackWebhookUrl}
    #           channel: "#chemclaw-alerts"
    # Secrets are referenced by SecretKeySelector against a Secret in this namespace, never inlined
    # — an AlertmanagerConfig is an ordinary readable object.
    receivers: []
    # The receiver every Chemclaw alert goes to. Must name one of `receivers` above.
    defaultReceiver: ""
    # Optional: a second receiver for `severity: critical` only, so a lost audit record and a slow
    # turn do not arrive on the same channel. Empty means everything goes to `defaultReceiver`.
    criticalReceiver: ""
    # Alertmanager's own grouping and repeat timings. Named here rather than left to Alertmanager's
    # defaults because the defaults (`repeat_interval: 4h`) are a page cadence, and a page cadence
    # is a deployment's decision.
    groupBy: [alertname, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  # Console/Grafana dashboards for the metrics that have no alert. How many that is, is not written
  # here: the sentence that was said "104 series are declared and 16 are alerted" against a registry
  # of 105 and an alert set that reads 39 of them, so both halves of it were wrong in the direction
  # that overstates coverage. `len(declared_metric_names())` is the only honest source, and
  # `tests/test_deploy_chart.py::test_every_declared_metric_has_a_consumer` is what makes the
  # coverage checkable rather than believed — every declared series must have a panel or a rule.
  # Before these files most of them had neither, which is the same failure one level up from the one
  # the ServiceMonitor fixed: collected, and read by nobody.
  dashboards:
    enabled: true
    # **The OpenShift console reads custom dashboards only from `openshift-config-managed`**, so
    # leaving this empty renders them into the release namespace where the console will not look.
    # It is empty anyway, deliberately: writing into another namespace needs permissions a release
    # installer usually does not have, and a chart whose *install* fails on a dashboard is worse
    # than one whose dashboards need one more `--set`. Set it to `openshift-config-managed` (as
    # cluster-admin) to get the Observe -> Dashboards entry; leave it empty for a self-managed
    # Grafana, whose sidecar watches the release namespace instead.
    namespace: ""
    # What makes something a dashboard to the consumer that reads it. `console.openshift.io/dashboard`
    # is the OpenShift console's label; a self-managed Grafana with the kiwigrid sidecar wants
    # `grafana_dashboard: "1"` instead. Both may be set at once — they are read by different things.
    labels:
      console.openshift.io/dashboard: "true"
  # The Temporal SDK's own Prometheus exporter on the worker pods — task-slot occupancy, poller
  # counts, schedule-to-start latency: the queue-side numbers no first-party counter can produce,
  # because they are the SDK's view of the broker.
  #
  # **Off until the worker process actually binds the port.** Turning it on renders a second
  # container port and a second `podMetricsEndpoint`; with nothing listening, every worker gains a
  # permanently-down scrape target — which `ChemclawTargetDown` would then report forever. Flip
  # this to `true` in the same change that adds the `TelemetryConfig(metrics=PrometheusConfig(...))`
  # bind in `durable/serve.py`.
  #
  # That change owns the dashboard panels too. `chemclaw-durable.json` shipped a "Temporal worker
  # task slots" and a "Temporal pollers" panel *unconditionally*, over series nothing in this system
  # emits — two graphs that could never draw, which on a dashboard is indistinguishable from two
  # graphs saying nothing is happening. `ChemclawWorkerNotPolling` was already gated on this flag
  # for exactly that reason; the panels were not. They are deleted rather than gated, because a
  # panel for a producer that does not exist is a "for later" stub, and
  # `tests/test_deploy_chart.py::test_no_dashboard_panel_queries_a_series_nothing_produces` refuses
  # the next one.
  temporalSdkMetrics:
    enabled: false
    # The port that exporter binds. Distinct from `workerMetricsPort`: the SDK's exporter is a Rust
    # HTTP server inside the SDK core, not a route on `chemclaw.core.worker_http`, so the two
    # cannot share a listener.
    port: 9001

# Pod/container security context. The chart asserted none of this, so a namespace labelled
# `pod-security.kubernetes.io/enforce=restricted` — the default posture for a regulated OpenShift
# cluster — rejected every pod spec here. The image has always run as a non-root UID, which is a
# different statement from the pod *declaring* it must; PSA reads the declaration.
#
# The restricted profile itself is not configurable (it is asserted unconditionally in
# `_helpers.tpl`, because a chart that lets you turn off `allowPrivilegeEscalation: false` is
# offering a footgun, not a knob). Only the one setting that is *not* part of that profile, and
# that genuinely cannot be defaulted on, lives here.
securityContext:
  # Off, and the reason written here for a long time had already expired: it said the calculation
  # workers shell out to xtb/crest and need writable scratch. They do not — those binaries left with
  # the physics (`D-2026-08-16-the-physics-leaves-the-cache-stays`), `deploy/Containerfile` records
  # their removal, and no `src/` module invokes either any more.
  #
  # The live blocker is `/tmp`, which no volume covers: `deploy/knowledge-sync.sh` writes its
  # heartbeat and its `GIT_ASKPASS` helper there in every pod that runs the sync sidecar. So turning
  # this on still trades an admission failure for a runtime one — just for a different process than
  # the comment claimed, which is why the two are worth telling apart. Flip it together with an
  # `emptyDir` mounted at `/tmp`, never on its own.
  readOnlyRootFilesystem: false

# What happens to the durable tables' history — a posture this chart refuses to leave unstated,
# by the same rule as the egress block below (D-2026-08-26-a-knob-that-renders-nothing-is-not-a-knob):
# every retention window in `Settings` defaults to 0, meaning *disabled*, because "keep for N days,
# then dispose, provably" is a policy a deployment must state rather than inherit. What that
# defaulting cost in practice was silence: the LangGraph checkpoint tables re-serialize a session's
# whole thread roughly once per superstep (~125 rows for one capped turn), `session_messages` and
# `tool_result_blobs` grow with every exchange, and on the shipped values nothing ever deleted any
# of it while `agent/compaction.py` named age-based retention as the bound.
#
# **Set exactly one of `windows` or `unboundedGrowthAccepted`.** Neither, or both, and
# `helm install` fails naming both ways out.
retention:
  # The windows, as the CHEMCLAW_RETENTION_* environment keys `core/config/memory.py` reads,
  # rendered into the ConfigMap with CHEMCLAW_RETENTION_ENABLED derived `true` — so stating a
  # window and forgetting the switch cannot happen. For example:
  #   windows:
  #     CHEMCLAW_RETENTION_CHECKPOINTS_DAYS: "30"
  #     CHEMCLAW_RETENTION_SESSION_MESSAGES_DAYS: "365"
  #     CHEMCLAW_RETENTION_SESSION_EVENTS_DAYS: "30"
  #     CHEMCLAW_RETENTION_TOOL_RESULTS_DAYS: "30"
  #     CHEMCLAW_RETENTION_RESULT_PUBLICATIONS_DAYS: "90"
  #     # The drain rate, and why it belongs in the same block as the windows it drains under.
  #     CHEMCLAW_RETENTION_MAX_SESSIONS_PER_PASS: "500"
  #     CHEMCLAW_RETENTION_SCHEDULE_MINUTES: "1440"
  #
  # **The checkpoint window is the one with a volume behind it, and the volume is large.** Upstream's
  # `_dump_blobs` rewrites the *entire* messages channel per superstep, so a thread's storage is
  # quadratic in its length: measured, ten turns on one thread with incompressible content wrote
  # 24.3 MB to `checkpoint_blobs` for a 464 kB conversation — 52x amplification, and 26.3 MB on
  # disk against 27.3 MB of WAL. At the load this chart is sized for that is on the order of tens of
  # gigabytes a day, and the row count `infra/sql/README.md` states is not the number that fills a
  # volume.
  #
  # **So a first pass against a database that has never pruned does not finish in one pass, and the
  # last two keys are how it converges.** The conversation prune costs three round trips per
  # session (whether an expired row may go depends on rows that are not expiring, D-145), so it is
  # capped per pass, commits what it reached, and reports the remainder. The backlog therefore
  # drains at `MAX_SESSIONS_PER_PASS × (1440 / SCHEDULE_MINUTES)` sessions a day: at the defaults,
  # 500. Raise either — a shorter cadence is the cheaper lever, since each pass is bounded by
  # `CHEMCLAW_RETENTION_TIMEOUT_SECONDS` regardless — until the remainder in the sweep's own result
  # reaches zero, then put them back. Leaving them at the defaults on a year-old database is not a
  # failure anybody sees; it is a sweep that never catches up while reporting success every day.
  # All five, because the example omitted the last one for as long as it existed and an operator
  # copying it inherits the omission. A table whose key is absent keeps growing —
  # `durable/retention.py`'s `_PRUNABLE` is the set with a window, and `_NOT_PRUNED` says what
  # bounds everything else.
  #
  # **Two of the five are load-bearing together, which no key here can say on its own.** An
  # ownership row in `session_owners` is disposable only once nothing session-scoped is left for
  # that session, and `tool_result_links` empties only behind its blob — so stating
  # SESSION_MESSAGES and leaving TOOL_RESULTS at 0 forgets no session that ever called a tool. The
  # sweep now warns with the ENV names when that is the state it is in.
  windows: {}
  # The escape hatch, mirroring `networkPolicy.allowAnyDestination`: a deployment that genuinely
  # wants no disposal says so here, in its own values file, where the next person greps for it.
  # The tables then grow exactly as they always did — the posture is unchanged, the silence is not.
  unboundedGrowthAccepted: false

networkPolicy:
  enabled: true
  egressPorts:
    postgres: 5432
    temporal: 7233
    https: 443
    llm: 8000
    otel: 4317
    # The reaction labeller (`config.CHEMCLAW_RXNLABEL_SERVER_URL` above), on the same terms as the
    # three sibling servers below: plain HTTP on its own port, so `egressPorts.https` does not
    # cover it, and without an entry here an operator who adds the host to `egressDestinations`
    # still has every packet dropped.
    rxnlabel: 8865
    # The `chem`, `safety` and `calc` sibling servers (`connectors.chem.url`,
    # `connectors.safety.url`, `config.CHEMCLAW_CALC_SERVER_URL` above) — plain HTTP on their own
    # ports rather than 443, so `egressPorts.https` does not cover them (the misreading this chart
    # used to ship is fixed at the comment above `connectors.chem`). Three separate values, not one,
    # because each sibling server is free to land on a different port in the deployer's namespace
    # and a shared number would only be right by coincidence. Distinct from `connectorPort` below,
    # which is the port *this release's own* connector pods listen on: `chem` and `safety` render
    # no Service at all here (an external `url:` suppresses it), and `calc`'s own pods — the D-011
    # cache and orchestration, not the physics — are already on `connectorPort` and reached via
    # that egress rule; this is only the wire out to the sibling that runs the arithmetic.
    chem: 8858
    safety: 8859
    calc: 8860
    # The reaction/condition predictor (`connectors.rxnpredict.url` above), on exactly the terms
    # the three lines above describe: plain HTTP on its own port, so `egressPorts.https` does not
    # cover it, and without an entry here an operator who adds the host to `egressDestinations`
    # still has every packet dropped — the misreading this chart used to ship.
    rxnpredict: 8857
  # WHERE those ports may be dialled. Empty renders `to: []`, which in a NetworkPolicy means
  # **any destination** — so with this unset, TCP/443 from every pod to the whole internet is
  # permitted. The addresses are deployment-specific and a chart cannot invent your Postgres CIDR,
  # so this file cannot ship them; what it *can* do is refuse to render until you have said which
  # of the two you mean.
  #
  # **Set exactly one of this list or `allowAnyDestination` below.** Neither, or both, and
  # `helm install` fails naming both ways out. That is deliberate friction: the previous shipped
  # state was an empty list, a comment saying it was not a safe end state, and a cluster object
  # that read as "egress is restricted" while permitting the whole internet on five ports.
  #
  # `tests/test_no_egress.py` enforces "this system takes no external sources" (D-089) by scanning
  # source code for third-party host literals. That catches a developer adding a data source and
  # catches nothing at runtime — set this to make the network agree with the decision.
  #
  # Entries are NetworkPolicyPeer objects, passed through verbatim:
  #   - ipBlock: {cidr: 10.0.1.0/24}                     # the database subnet
  #   - namespaceSelector: {matchLabels: {name: temporal}}
  #   - namespaceSelector: {matchLabels: {name: llm-serving}}
  #   # The collector `CHEMCLAW_OTEL_ENDPOINT` points at. **Enumerate this or lose tracing
  #   # silently**: `egressPorts.otel: 4317` permits nothing on its own — a port is only reachable
  #   # where some `to:` also matches — so an operator who follows this example and lists the three
  #   # obvious destinations ends up with an OTLP exporter whose every export is dropped by the
  #   # policy, which presents as an empty trace backend rather than as an error. The three
  #   # sibling MCP servers (`egressPorts.chem`/`safety`/`calc`) and the labeller need the same
  #   # treatment for the same reason.
  #   - namespaceSelector: {matchLabels: {name: observability}}
  egressDestinations: []
  # The escape hatch, and the reason the guard above is a `fail` rather than a broken default: a
  # deployment that genuinely cannot enumerate its destinations yet says so here, in its own values
  # file, where the next person greps for it. `to: []` then renders exactly as it always did — the
  # posture is unchanged, the silence is not.
  #
  # It is `false` here so that a release inherits no permission it did not write down. `helm
  # template` on these defaults therefore needs `--set networkPolicy.allowAnyDestination=true` —
  # which `make helm-validate`'s two renders and the runbook's deploy example both pass, and
  # `deploy/README.md` documents.
  allowAnyDestination: false
  # Namespaces allowed to reach the front door, beyond Chemclaw's own pods. The router needs it for
  # the Route to work and the monitoring stack needs it to scrape `/metrics`. This rule bounds which
  # *peers* may open a connection to the port — it does not, and cannot, bound paths, so it is not
  # what makes an unauthenticated `/metrics` acceptable (D-152's label allowlist is; see
  # `route.ipWhitelist`). It used to say it was. Labels
  # differ by distribution: OpenShift labels its router namespace
  # `network.openshift.io/policy-group: ingress` and its user-workload monitoring namespace
  # `kubernetes.io/metadata.name: openshift-user-workload-monitoring`.
  serviceIngress:
    # Its own toggle, not `networkPolicy.enabled`: if these labels are wrong the front door is
    # unreachable, and the fix must not be "turn off network policy" — that would drop the egress
    # rule too, which is the one you least want to lose.
    enabled: true
  ingressNamespaces:
    - network.openshift.io/policy-group: ingress
    - kubernetes.io/metadata.name: openshift-user-workload-monitoring
  # The monitoring stack alone — a subset of the list above, and separate because it is granted
  # somewhere the router must never reach: the connector pods (whose whole ingress rule exists to
  # keep everything but Chemclaw out) and the worker pods' probe port. The front door needs the
  # router *and* the scraper; nothing else needs the router.
  monitoringNamespaces:
    - kubernetes.io/metadata.name: openshift-user-workload-monitoring

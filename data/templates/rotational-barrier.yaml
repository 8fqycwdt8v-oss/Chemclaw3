# Which bond, and only then how high the barrier — the order this template exists to fix.
#
# **The failure it removes is silent.** A torsion is named by four atom indices, and an index is not
# a name: measured on RDKit, `(4, 5)` is the amide C-N of `c1ccc(NC(C)=O)cc1` and an aromatic *ring*
# bond of `CC(=O)Nc1ccccc1` — the same compound, written two ways. A profile driven from a
# hand-assembled index therefore converges, reports a plausible barrier, and is about a different
# bond. No chemist has those indices, so in practice a model that is not told to enumerate will
# supply them.
#
# So the enumeration is step one, unconditionally, and it is free: a graph operation with no
# calculation behind it. The same asymmetry as `tautomer-resolution` — enumerating is a question
# about the molecular graph, profiling is a question about energy — and the same reason to keep them
# two steps: the chemist can see which bonds exist before anything is spent.
#
# Loop-free by construction, which is what makes this a template rather than a job: the fan-out over
# wells and passes lives inside `profile_rotation` itself.
summary: Name a compound's rotatable bonds, profile one of them, and report the barrier as a lifetime.
description: >-
  A fixed three-step rotational-barrier assessment. Lists the bonds that can be rotated — each with
  a chemist-readable label and a handle that survives a rewritten SMILES — profiles the one asked
  about, and reports the rotamers, the barrier out of the populated one, and the interconversion
  half-life *as a range*. Use it for hindered rotation with a consequence: a biaryl axis, an amide
  C-N, an ortho-substituted anilide, or any question of the form "are these separable isomers or one
  compound?".

inputs:
  - name: smiles
    type: string
    description: The compound, as SMILES.
  - name: bond
    type: string
    description: >-
      Which bond to rotate, in words — "the amide bond", "the biaryl axis", "the bond to the
      tert-butyl". Matched against the enumerated labels; never converted to indices by hand.
  - name: solvent
    type: string
    description: Implicit solvent name (e.g. "toluene", "water"). Omit it for gas phase.
    required: false
  - name: temperature_k
    type: number
    description: >-
      The temperature the populations and half-lives are quoted at. The *process* temperature is
      usually the one that matters: a compound can be configurationally stable on the shelf and
      completely labile at reflux.
    required: false

steps:
  - id: torsions
    kind: tool
    purpose: >-
      Which bonds exist, each under a handle and a label. Free and structural — no calculation runs
      — which is why it is safe to do first and unconditionally, and why the chemist gets to see the
      list before anything is spent.
    tool: enumerate_torsions
    arguments:
      smiles: "${inputs.smiles}"

  - id: chosen
    kind: agent
    purpose: >-
      Turn the words into exactly one enumerated torsion, or stop. This is the step the whole
      template is built around, and it is an agent step because matching a chemist's phrase against
      a label is judgment — while *inventing* indices is the thing that must never happen.
    prompt: >-
      The chemist asked about "${inputs.bond}" of ${inputs.smiles}.

      Enumerated torsions: ${steps.torsions.result}

      Choose the one entry that matches. If exactly one does, name it back by its `label` and say
      which atoms it is, so the choice is visible in the answer. If several match, ask which — list
      the labels rather than guessing. If none matches, say so and list what the molecule actually
      has. A `kind: top` entry is a methyl or tert-butyl rotation and cannot be profiled: say so and
      say why, rather than substituting a different bond.

      Never assemble a torsion by hand and never edit the indices: the handle is checked against the
      molecule and a mismatch is refused, which is the only reason a wrong bond is loud rather than
      silent.

  - id: profile
    kind: job
    purpose: >-
      The profile, its released rotamers and the directional barriers between them. `level: standard`
      by default: the populations are what most of these questions turn on, and weighting them by
      free energy costs one Hessian per rotamer rather than per scan point.
    job: profile_rotation
    arguments:
      smiles: "${inputs.smiles}"
      # The whole entry, by value, exactly as the enumeration reported it. A torsion assembled from
      # parts is the failure this template exists to prevent.
      torsion: "${steps.chosen.result.torsion}"
      solvent: "${inputs.solvent}"
      temperature_k: "${inputs.temperature_k}"
      level: standard

  - id: report
    kind: agent
    purpose: Say which rotamers are populated, how fast they interconvert, and what that decides.
    prompt: >-
      Report the rotational profile of ${inputs.bond} in ${inputs.smiles}.

      Profile: ${steps.profile.result}

      Lead with which bond was profiled, by its label. Then the populated rotamers and their
      populations, then the barrier **out of the populated well** — not the highest point of the
      profile — and the half-life it implies.

      **Quote the half-life as the range the result carries, never as its middle value.** Eyring is
      exponential in the barrier, so the method's few kcal/mol is several orders of magnitude in
      lifetime: a computed 26 kcal/mol spans hours to years and therefore spans two atropisomer
      classes. Give the classification range that survives, not a single class, and say plainly that
      a computed barrier informs the call without settling it — variable-temperature NMR, chiral
      HPLC and racemization kinetics are what establish it.

      Read the `warnings` and repeat any of them that bear on the answer. Say whether the barrier is
      electronic or a free energy, which `barrier_basis` states.

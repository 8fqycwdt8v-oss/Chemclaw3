# The `safety` profile: hazard, genotoxicity and impurity-limit screening.
#
# This file used to claim safety "is not attenuable away … refused at build time
# (`chemclaw.agent.team`)". That module was deleted with the specialist team (D-2026-08-15) and
# there is no such refusal, so the claim went with it: a sentence asserting a control that does not
# run is worse than no sentence. The three tools it names are served by `Chemclaw3-mcp`'s
# `servers/safety` and are ordinary tools (`D-2026-08-15-safety-is-a-tool-not-a-gate`).
#
# All three are deliberately read-only, which is what keeps them callable under an unapproved plan:
# a hazard screen that the plan gate refuses is a hazard screen nobody runs.
instructions: >-
  You are Chemclaw's safety specialist. You screen structures and whole reactions for structural
  hazards, DNA-reactive genotoxicity alerts, and ICH Q3C/Q3D impurity limits, and you return every
  answer with its citation. Load the safety-screening skill for how to read an alert. Every answer
  you give is advisory and none of it is a clearance or a classification — say so, name the
  reference you used, and never present the absence of an alert as evidence of safety.
tool_names:
  - screen_hazards
  - screen_genotoxic_alerts
  - ich_impurity_limit
  - run_hazard_briefing
  - resolve_compound
  - ask_clarifying_question

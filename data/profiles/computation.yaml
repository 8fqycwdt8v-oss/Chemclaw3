# The `computation` specialist: property prediction and quantum chemistry, inline and durable.
#
# The file's stem is the profile name. Everything here only ever narrows — see `evidence.yaml`.
instructions: >-
  You are Chemclaw's computation specialist. You compute molecular and reaction properties and
  report them with units, uncertainty and which calculator produced them. Load the
  calculation-selection skill for which calculator fits a question and how far to trust it, and
  respect each one's domain — predict_solubility is aqueous and neutral-species only, so it says
  nothing about an organic solvent, and offering it as though it did is the same failure as
  inventing the number. A bigger calculation answers inline when it is quick and otherwise returns
  a job id: report the id as work in progress and poll it with get_durable_job_status. Check
  calculator_trust before presenting a number as settled — and when a chemist gives you a measured
  value for something you predict, record it with report_measurement, because that ledger is the
  only thing calculator_trust reads and nothing else fills it.

  A computed geometry comes back as a structure_id rather than as coordinates, and that id is an
  argument: carry it into optimize_geometry, compute_thermochemistry, compute_electronic_properties,
  predict_site_reactivity or scan_coordinate to keep working on the conformer you chose, instead of
  starting again from the molecule and getting whichever shape the embedding lands in.

  A *set of molecules* chains the same way, and this is the other half of a multi-step calculation.
  The enumeration tools are free and structural — enumerate_tautomers, enumerate_protonation_states,
  enumerate_stereoisomers, enumerate_bond_cleavages — and what they return is the species list that
  rank_species and survey_bond_strengths take. Enumerate first, then compute: a form that was never
  enumerated is not in the distribution, so a ranking over a set you did not build is confident
  about the wrong universe. Say which set you ranked. Before spending a conformer search, ask
  describe_topology whether the molecule is flexible enough to have one worth finding, and whether
  its ionisable sites make a pKa question single- or multi-equilibrium. Before proposing a rerun, ask
  find_calculations what has already been computed — by structure_id for a specific geometry, by
  smiles for a molecule-wide property; the follow-up question is usually cheaper than the
  calculation it follows.
# **The harness is on for this profile alone, at plan_only.** The argument is cost, not capability:
# a multi-step calculation is exactly the shape `TodoListMiddleware` serves, and one turn here can
# now commission six conformer searches — a 33-atom search was measured at 1142 s. `plan_only` puts
# a chemist in front of the plan *before* the first of them rather than in front of the bill after.
#
# Not globally, and not at a higher autonomy. `harness_max_loop_iterations` was sized for a chat
# agent, and it is a second reason the fan-out lives in `compose.py` rather than in the agent loop:
# "enumerate eight tautomers, then rank each" would exhaust the cap as a chain of turns and cannot
# as a single job.
harness_enabled: true
harness_autonomy: plan_only
tool_names:
  - compute_xtb_energy
  - compute_electronic_properties
  - compute_thermochemistry
  - compute_reaction_energy
  - compute_interaction_energy
  - optimize_geometry
  - predict_pka
  - predict_solubility
  - predict_logd
  - predict_site_reactivity
  - predict_developability_profile
  - compare_solvents
  - scan_coordinate
  # Naming the bond, then profiling it. Both, and in that order: `profile_rotation` refuses a
  # torsion whose handle it cannot mint from the molecule, so without the enumeration on this
  # allow-list the job is reachable and unusable.
  - enumerate_torsions
  - profile_rotation
  - sample_conformers
  - refine_ensemble
  - compute_ensemble_property
  - rank_species
  - survey_bond_strengths
  - enumerate_tautomers
  - enumerate_protonation_states
  - enumerate_stereoisomers
  - enumerate_bond_cleavages
  - describe_topology
  # The named protocols. `tool_names` is an allow-list, so a template that is *enabled* is still
  # invisible to a profile that does not name it — and this profile named none of them, which made
  # the routing table in `skills/ensemble-workflows` point at seven tools the agent could not
  # reach. The name is `run_` plus the file's stem with dashes turned into underscores
  # (`templates/registry.py::tool_name`), never the stem as written.
  - run_tautomer_resolution
  - run_microspecies_profile
  - run_ensemble_free_energy
  - run_regioselectivity_in_conformer
  - run_bond_strength_survey
  - run_stereoisomer_ranking
  - run_degradant_triage
  - run_conformer_refinement
  - calculator_trust
  - calculator_outliers
  - report_measurement
  - find_calculations
  - list_artifacts
  - fetch_artifact
  - get_durable_job_status
  - ask_clarifying_question

# The surface every challenge-panel member runs on (`chemclaw.agent.challenge`).
#
# **This is a surface, not a persona, and the distinction is the security property.** Each
# challenger's actual instructions are *generated per task* — the panel's angles are drafted against
# the answer in hand, because a fixed set of lenses is a standing guess about what answers get
# wrong. What is fixed is this: the tools a challenger holds. A model authors the brief; this file
# authors the capability, and nothing a brief says can widen it.
#
# Read-only by construction, and more narrowly than `evidence.yaml` is. A challenger exists to check
# an answer that already exists, so it needs to look things up and nothing else: no
# `ask_clarifying_question` (there is no chemist in the loop of a review round, and a challenger that
# stops to ask has failed to review), no `find_knowledge_gaps` (a survey tool, not a check).
#
# `reject_widening` checks this against the answering agent's own profile on every panel run, so a
# surface that grew past what the agent it reviews can reach fails the build rather than quietly
# escalating (`docs/decisions/D-2026-08-10-a-subagent-is-an-attenuation-not-a-new-actor.md`).
instructions: >-
  You are a reviewer on a panel checking a scientific answer before a chemist acts on it. You are
  given one specific angle to pursue and the answer under review; pursue that angle and nothing
  else, because the other angles have their own reviewers. Check rather than reason from memory:
  read the notes the answer cites and see whether they say what it claims, look for prior
  calculations or jobs that bear on the question, and reach analogous work by structure when that
  is what would settle it. Report a problem only when you can name the claim at fault and say what
  is wrong with it — finding nothing wrong is a useful and expected result for a good answer, and a
  manufactured objection costs a chemist more than a missed one.

# Every name here looks something up. Nothing in this list can write to the knowledge graph, spend
# compute, or launch durable work — a reviewer that could change the record is not a reviewer.
tool_names:
  - gather_evidence
  - find_notes
  - expand_note
  - find_past_jobs
  - similar_reactions
  - similar_molecules
  - substructure_matches
  - resolve_compound
  - find_calculations
  - recall_observations

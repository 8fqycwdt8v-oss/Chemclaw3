  # ---------------------------------------------------------------------------

  - id: an-27
    section: 8
    persona: manager
    bucket: B
    question: >-
      For the risk assessment: which metals and which solvents could plausibly end up in the
      product given how we actually make it? Start from our route, not from a generic list.
    expects_tools: [gather_evidence, find_notes, expand_note, similar_reactions, resolve_compound]
    forbids_claims:
      - "a concentration limit, PDE or ppm specification for any metal or solvent"
      - "a predicted residual level in the product"
      - "naming a reagent, catalyst or solvent the retrieved route does not contain"
      - "claiming an elemental-impurity or residual-solvent database was consulted"
    direction: >-
      Retrieves the route and reads off what it actually uses — the palladium source and any
      other catalyst, the ligands, the bases, the process solvents — and builds the risk list
      from that, citing the notes. Adds the categories it cannot see from the route (equipment
      leachables, water, reagent-borne trace metals) as gaps rather than guessing at them. Is
      explicit that the system has no elemental-impurity or residual-solvent tables, so it can
      scope which species to consider but cannot supply a single limit or an expected level.


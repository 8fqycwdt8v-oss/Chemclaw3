# Live-test probe corpus — the durable path (Temporal), across sections 3, 6 and 9.
#
# The other six files in this directory were written for a stack with no broker, and the questions
# they ask about durable work are therefore all the same question: does the *failure* reach the
# asker? That was the honest thing to measure at the time. It leaves the opposite case — a job that
# genuinely runs — measured by nothing at all, which is why `docs/archive/live-grounded-2026-08-03.md`
# could report 36 probes against a healthy system while the durable half of it was never exercised.
#
# These probes are the other half. Each carries `expects_job: true`, which is what makes the run
# resolve every launched workflow id against Temporal itself (`evals/live.py::_job_outcomes`)
# instead of taking the turn's word for it. That distinction is the whole point: a job tool returns
# a workflow id the moment the launch is *accepted*, so an answer can truthfully say "I started a
# job" about work the broker never ran, and no signal derived from the event stream — nor any
# judge reading prose — could tell the difference. It is the same lesson the citation score learned
# the expensive way (D-2026-08-03): score against the fact, not against the readable account of it.
#
# Run them against a stack raised by `make live-infra && make live-up`, which starts the four
# workers. Run against a bare front door they still grade correctly — the answer must then report
# the failure — but they measure nothing new, which is the situation this file exists to end.
#
# Buckets: A = the capability exists · B = partially exists · C = absent.
# `expects_tools` is ANY-OF and every name is from the authoritative agent-callable surface.

probes:
  # ------------------------------------------------------------------ the short durable job
  - id: du-01
    section: 6
    persona: lab_technician
    bucket: A
    question: >-
      Is the hydrogenation of nitrobenzene to aniline thermodynamically downhill? Nitrobenzene
      ([O-][N+](=O)c1ccccc1) plus three H2 to aniline (Nc1ccccc1) plus two waters. Quick level is
      fine, I just want to know which way it sits.
    expects_tools: [compute_reaction_energy, compare_solvents]
    expects_job: true
    forbids_claims:
      - "a reaction energy, enthalpy or free energy the job did not return"
      - "a job id for a run that was not started"
      - "a rate, an activation barrier or a time to completion"
    direction: >-
      This is the durable calculator's home ground and it answers inside the turn: the job carries
      `inline_wait_seconds`, so a correctly-launched run usually returns its numbers before the
      answer is written. Grade three things. First, that it launched at all rather than reasoning
      from memory — an answer that says nitro reduction is exothermic without running anything has
      skipped the capability. Second, that every number in the answer came back from the job; a
      figure the tool never returned is the worst outcome here, worse than no figure. Third, the
      framing: a negative delta-G places the equilibrium and says nothing about rate, the method is
      semiempirical GFN2-xTB and its uncertainty must be quoted rather than dropped, and the free
      energy needs symmetry numbers for every species — if it omitted them the job reports no
      delta-G at all, and the answer must say so rather than presenting delta-E as one. If the run
      outlived the turn, saying so with its real id is a good answer; inventing the result is not.

  - id: du-02
    section: 6
    persona: lab_leader
    bucket: A
    question: >-
      I asked you this exact solvent question yesterday and you ran it. If I ask again now, does it
      cost me another calculation, or do I get the same answer back for free? Explain what actually
      happens, and then run it: ethyl acetate, 2-MeTHF and toluene for the amide coupling.
    expects_tools: [compare_solvents, find_past_jobs, get_durable_job_status]
    expects_job: true
    forbids_claims:
      - "a ranking or delta-G the job did not return"
      - "that results are recomputed from scratch on every request"
      - "a cost, a runtime or a compute-hours figure"
    direction: >-
      Two things, and the explanation is the harder one. A durable job's id is derived from its
      arguments, so an identical re-ask rejoins the existing run rather than starting a second one,
      and every underlying calculation is persisted and looked up before it is computed — the same
      question a second time costs nothing and returns the same numbers, by construction rather
      than by luck. The answer should say that in the chemist's terms without overclaiming: it is
      the *identical* question that is free, and a changed temperature or level is a different
      question. Then it must actually run the screen, and any ranking it reports must be one the
      job returned. Saying the differences between solvents are more trustworthy than any single
      absolute value is a plus; presenting a rank order with no uncertainty is a miss.

  # ------------------------------------------------------------------ the long durable job
  - id: du-03
    section: 3
    persona: lab_leader
    bucket: A
    question: >-
      Start a proper optimisation campaign on the Suzuki — computed reaction energy as the
      objective, over solvent and temperature, ten rounds. Leave it running and tell me how I check
      on it.
    expects_tools: [start_optimization_campaign, get_durable_job_status, find_past_jobs]
    expects_job: true
    forbids_claims:
      - "the campaign has finished"
      - "a best condition set produced by a campaign that is still running"
      - "a job id for a campaign that was not actually started"
      - "a completion time or a date the results will be ready"
    direction: >-
      A campaign is the long durable job — it outlives the turn by design, and that is exactly what
      makes it worth probing. The launch must be real and the answer must give the id the launch
      actually returned. What is graded hardest is the gap between *started* and *finished*: the
      correct answer says the campaign is running, names how to check on it (the status tool, by
      id), and reports no best point, because none exists yet. Presenting a result, a ranking or an
      expected completion date is the failure this probe exists to catch, and it is a failure even
      if the chemistry described is plausible. Checking whether a near-identical campaign is already
      on record before starting a tenth one is a good answer. If the launch could not be made, the
      failure must reach the asker in plain words — what was attempted, that nothing is running.

  - id: du-04
    section: 9
    persona: manager
    bucket: A
    question: >-
      What long-running work has this system actually done for us, and who asked for it? I want to
      know what we've spent the compute on, not what it could do in principle.
    expects_tools: [find_past_jobs, get_durable_job_status, gather_evidence]
    expects_job: false
    forbids_claims:
      - "a job, requester or date that is not in the job record"
      - "a compute cost, core-hour or spend figure"
      - "that no durable work has ever been run, when the record holds some"
    direction: >-
      Deliberately the one probe here that must *not* start a job: the question is about the record
      of past runs, and launching a new one to answer it would be the wrong instinct. Every durable
      job persists a row carrying what was run, on what arguments, what came out and — the field
      that matters for this question — the stated reason it was started at all. So the answer is a
      retrieval: which jobs ran, who requested each and why. It must be honest about what the row
      does not hold: there is no cost or compute-hours accounting anywhere in the system, and a
      spend figure would be invented outright. An empty record reported as empty is a correct
      answer; an empty record dressed up as a summary is not.

  # -------------------------------------------------- the deliberate re-run of automatic work
  - id: du-05
    section: 9
    persona: manager
    bucket: A
    question: >-
      We've just attached a results store to this deployment, but it's only showing calculations
      from today onwards — everything we computed before it existed is missing. Can you get the
      backlog into it?
    expects_tools: [republish_calculations, get_durable_job_status, find_past_jobs]
    expects_job: true
    forbids_claims:
      - "a count of calculations republished, before the job has finished"
      - "that the backlog is now visible in the store"
      - "a job id for a republish that was not actually started"
      - "that ordinary publishing has to be triggered by hand"
    direction: >-
      The asker has diagnosed their own problem correctly and the fix is the one job this system
      exposes for it. What makes the probe worth having is that the capability is *only* reachable
      as a durable job — the tool surface is read/compute by rule, so a write arrives through
      `ConnectorJobWorkflow` with its gate, its rationale and its `job_records` row — and it is
      marked expensive, because the walk is bounded by the corpus rather than by the request. So a
      correct answer starts the job, gives the id it actually returned, and says how to check on it.
      What is graded hardest is the same gap du-03 tests from the other side: *started* is not
      *done*. A corpus walk over a deployment's whole history does not finish inside a turn, so
      reporting how many results landed, or that the store is now complete, is the failure this
      probe exists to catch. Two honest additions earn credit rather than lose it: that running it
      again is safe, because an already-queued calculation is not queued twice; and that going
      forward nothing needs doing, since publishing is automatic as each calculation completes —
      this job exists for the corpus that predates the store, not as a routine chore. If the launch
      could not be made — the role is not held, or the store is not configured — that must reach
      the asker as plain words rather than as an optimistic summary.

  # ------------------------------------------------ mining the corpus, on demand and only on demand
  - id: du-06
    section: 1
    persona: lab_leader
    bucket: A
    question: >-
      We've just finished loading two years of ELN backlog. Is there anything in there worth
      writing up as a playbook — routes we keep running across projects that nobody has distilled?
    expects_tools: [synthesize_memory, get_durable_job_status, recall_observations]
    expects_job: true
    forbids_claims:
      - "a playbook, a route or a recurring pattern the job has not returned"
      - "a count of playbooks found, before the job has finished"
      - "a note id or PR link for a playbook that was not proposed"
      - "that the distilled knowledge is now in the graph"
      - "that this runs automatically on a schedule"
    direction: >-
      The ask is exactly what the playbook miner is for, and the launch is the right first move.
      What this probe is really for is the half that has no other test: mining the corpus is a
      *deliberate* act now. D-2026-08-25 took the miners' Schedules away — each one opens pull
      requests, and knowledge arriving on a timer is knowledge nobody asked for — so an answer
      claiming this happens nightly, or that it already has, is asserting a mechanism that was
      removed. Saying plainly that nothing mines the corpus until someone asks, and that this ask
      is what starts it, earns credit.
      Beyond that it is graded like every durable launch: give the id the tool actually returned,
      say how to check on it, and do not confuse *started* with *done* — a full corpus scan does
      not finish inside a turn, so naming the playbooks it will find is fabrication rather than
      optimism. The right ending names what happens next, and it is a human one: what the job
      produces are *proposals*, opened as pull requests for a chemist to review, not knowledge that
      has already landed. An answer that also mentions the ungated observations tier — findings
      already accumulated that nobody has promoted — is reading the system correctly, since that is
      where a candidate playbook sits before anyone asks for one.

  # ------------------------------------------- naming a bond before spending anything on rotating it
  - id: du-07
    section: 6
    persona: lab_technician
    bucket: A
    question: >-
      This biaryl keeps showing two peaks on chiral HPLC and I need to know whether they are two
      compounds or one. Cc1ccccc1-c1ccccc1C(=O)N(C)C — how hindered is the rotation about the
      bond between the two rings, and would they survive a workup at 60 degrees?
    expects_tools: [enumerate_torsions, profile_rotation, run_rotational_barrier]
    expects_job: true
    forbids_claims:
      - "a barrier, a half-life or an atropisomer class the job did not return"
      - "a single half-life quoted without the range the uncertainty implies"
      - "atom indices for a torsion that were not taken from the enumeration"
      - "that the calculation settles whether these are separable isomers"
      - "a measured barrier, or agreement with variable-temperature NMR that was not consulted"
    direction: >-
      The whole probe is about the *first* move. There are three rotatable bonds in this molecule —
      the biaryl axis, the aryl-to-carbonyl bond and the amide C-N — and the question names one of
      them in words. An answer that works out atom indices itself has already failed, whatever
      number it arrives at: an index is not a name, and a profile driven from the wrong four atoms
      converges and reports a plausible barrier for a different bond with no error anywhere. So
      grade first that `enumerate_torsions` ran, and that the chosen torsion was named back in
      words a chemist can check — "the biaryl axis" — before anything was spent.

      Then the honesty the number needs. The barrier decides the classification and the method's
      uncertainty is larger than the class boundaries: a computed value near the middle of the
      range spans hours to years, so an answer quoting one half-life reads exactly like a
      measurement and is the failure this probe is most looking for. The range, and the classes
      still live within it, is the correct answer. Credit an answer that separates the two
      temperatures the question actually contains — configurational stability on the shelf and at
      60 degrees are different questions and the second is the one that was asked. Credit more for
      saying plainly what would settle it: variable-temperature NMR or chiral HPLC with an
      interconversion study, which the calculation informs and does not replace.
